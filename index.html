, {"k": "y26", "s": 210, "t": "单选", "q": "创建表时,不允许某列为空可以使用()命令？", "o": ["not null", "no null", "not blank", "no blank"], "a": "A", "n": "【答案正确】SQL 建表时对列加 not null 约束即不允许该列为空，如 name varchar(20) not null。no null、not blank、no blank 都不是 SQL 关键字。", "d": 0}, {"k": "y26", "s": 211, "t": "单选", "q": "下列描述正确的是()？", "o": ["一个数据库只能包含一个数据表", "一个数据库可以包含多个数据表", "一个数据库只能包含两个数据表", "一个数据表可以包含多个数据库"], "a": "B", "n": "【答案正确】一个数据库（库）可以包含多个数据表，库是表的容器。A、C 错在人为限定数量，D 把包含关系说反了（表包含于库，不可能一个表包含多个库）。", "d": 0}, {"k": "y26", "s": 212, "t": "单选", "q": "以下属于动态防火墙的是", "o": ["firewall", "iptables", "kysec", "selinux"], "a": "A", "n": "【答案正确】firewalld 是动态防火墙：规则改动即时生效、支持区域/服务概念，无需像 iptables 那样清空整表重建。iptables 是静态规则管理工具，kysec 是麒麟安全模块，selinux 是强制访问控制机制，后两者不是防火墙。", "d": 0}, {"k": "y26", "s": 213, "t": "单选", "q": "在银河麒麟高级服务器操作系统中firewall默认区域是", "o": ["block", "drop", "public", "work"], "a": "C", "n": "【答案正确】firewalld（麒麟V10 同样）默认区域为 public。可用 firewall-cmd --get-default-zone 验证；block/drop 是丢弃/拒绝类区域，work 是工作区域，都不是默认值。", "d": 0}, {"k": "y26", "s": 214, "t": "单选", "q": "firewall防火墙默认丢弃所有接收包的区域是", "o": ["block", "drop", "public", "work"], "a": "B", "n": "【答案正确】drop 区域丢弃所有入站包且不做任何回应（静默丢弃）；block 区域虽然也拒绝，但会用 ICMP 拒绝报文回应；public/work 是普通业务区域。", "d": 0}, {"k": "y26", "s": 215, "t": "单选", "q": "DHCP服务器回应应答消息给主机的端口是", "o": ["25", "23", "68", "110"], "a": "C", "n": "【答案正确】DHCP 基于 UDP，服务器从 67 端口发起应答，发往客户端的 68 端口，故\"回应给主机的端口\"是 68。25 是 SMTP、23 是 telnet、110 是 POP3。", "d": 0}, {"k": "y26", "s": 216, "t": "单选", "q": "DHCP客户端使用的协议是", "o": ["UDP", "TCP", "ICMP", "HTTP"], "a": "A", "n": "【答案正确】DHCP（含 BOOTP）基于 UDP 工作，客户端用 68 端口、服务器用 67 端口，无需面向连接的 TCP。ICMP、HTTP 与 DHCP 协议无关。", "d": 0}, {"k": "y26", "s": 217, "t": "单选", "q": "在zone文件中serial的含义是", "o": ["序列号", "刷新时间", "重试时间", "过期时间"], "a": "A", "n": "【答案正确】SOA 记录中 serial 是区文件序列号，主服务器每次修改后递增，从服务器据此判断是否需要同步。refresh（刷新）、retry（重试）、expire（过期）是另外三个时间字段。", "d": 0}, {"k": "y26", "s": 218, "t": "单选", "q": "在zone文件中retry定义的是", "o": ["序列号", "刷新时间", "重试时间", "过期时间"], "a": "C", "n": "【答案正确】SOA 记录中 retry 定义从服务器同步（刷新）失败后间隔多久重试。serial 是序列号，refresh 是刷新时间，expire 是过期时间。", "d": 0}, {"k": "y26", "s": 219, "t": "单选", "q": "日志服务最低的安全级别是", "o": ["debug", "alert", "crit", "err"], "a": "A", "n": "【答案正确】syslog 八个级别中 debug 最低（调试信息），其余从低到高为 info/notice/warning/err/crit/alert/emerg。选项中的 alert/crit/err 都比 debug 严重。", "d": 0}, {"k": "y26", "s": 220, "t": "单选", "q": "主机向DHCP服务器哪个端口发出IP请求", "o": ["20", "67", "110", "445"], "a": "B", "n": "【答案正确】DHCP 客户端向服务器的 UDP 67 端口发出请求（discover/offer/request/ack 交互）。20 是 FTP 数据端口、110 是 POP3、445 是 SMB。", "d": 0}, {"k": "y26", "s": 221, "t": "单选", "q": "dns服务使用的端口是", "o": ["52", "53", "54", "55"], "a": "B", "n": "【答案正确】DNS 服务使用 TCP/UDP 53 端口（常规查询走 UDP 53，区域传送和大报文走 TCP 53）。52/54/55 均不是 DNS 端口。", "d": 0}, {"k": "y26", "s": 222, "t": "单选", "q": "dns域名解析的查询方式有几种", "o": ["2", "3", "4", "5"], "a": "A", "n": "【答案正确】DNS 查询方式按教材口径分为 2 种：递归查询（由服务器代劳最终给出结果）和迭代查询（服务器只返回下一步应查询的地址）。反向查询（PTR）属于按记录类型划分的功能，不计入此分类。", "d": 0}, {"k": "y26", "s": 223, "t": "单选", "q": "下列属于顶级域的是", "o": ["sina", "mil", "baidu", "ibm"], "a": "B", "n": "【答案正确】mil 是顶级域（美军方专用通用顶级域，与 com/net/org/gov/int 同类）。sina、baidu、ibm 只是注册的二级域名（机构名），本身不是顶级域。", "d": 0}, {"k": "y26", "s": 224, "t": "单选", "q": "银河麒麟高级服务器操作系统中开启kysec的命令是", "o": ["setstatus -f enable", "security-switch --set default", "getstatus -f enable", "security-switch --get default"], "a": "B", "n": "【答案正确】麒麟 V10 中通过 security-switch --set default 将系统切换到 default 安全模式以开启 kysec 安全框架（可用 security-switch --get 查询当前模式）。A 项 setstatus -f enable 不是标准开启用法，C 的 getstatus 是误写（查询类命令也不带 enable），D 的 --get 仅是查询不改变状态。", "d": 0}, {"k": "y26", "s": 225, "t": "单选", "q": "银河麒麟高级服务器中的日志管理程序是", "o": ["syslog", "logrotate", "lastlog", "rsyslog"], "a": "D", "n": "【答案正确】麒麟 V10（RHEL/openEuler 系）系统的日志管理程序是 rsyslog（/etc/rsyslog.conf）。syslog 是传统旧实现，logrotate 负责日志轮转而非记录，lastlog 查看用户最后登录信息。【发行版差异】注意本库另有约定：系统日志位置按 /var/log/syslog 口径作答，虽然麒麟 V10 实际由 rsyslog 写 /var/log/messages。", "d": 0}, {"k": "y26", "s": 226, "t": "单选", "q": "系统日志信息等级中最严重的等级是", "o": ["emerg", "alert", "crit", "err"], "a": "A", "n": "【答案正确】syslog 级别中最严重的是 emerg（emergency，系统不可用），其后依次为 alert、crit、err、warning、notice、info、debug。", "d": 0}, {"k": "y26", "s": 227, "t": "单选", "q": "系统日志文件中mail.err表示正确的是", "o": ["mail程序中比err日志等级更严重的日志", "mail程序中比err日志等级更严重的日志，包含err级别的日志", "只记录mail程序中err级别日志", "记录mail程序中除err日志级别之外的日志"], "a": "B", "n": "【答案正确】rsyslog 选择器中 mail.err 的点号语义是\"该级别及更高级别\"，即记录 mail 设施中 err 及比 err 更严重（crit/alert/emerg）的日志，包含 err 本身。A 错在不含 err，C/D 分别错在\"只有 err\"和\"不含 err 的其他级别\"，均不符合点号语义。", "d": 0}, {"k": "y26", "s": 228, "t": "单选", "q": "DNS的主配置文件名称为", "o": ["named.conf", "name.conf", "dhcpd.conf", "rsyslog.conf"], "a": "A", "n": "【答案正确】DNS（BIND）主配置文件为 named.conf（麒麟/RHEL 下位于 /etc/named.conf）。name.conf 是错误名称，dhcpd.conf 是 DHCP 服务配置，rsyslog.conf 是日志服务配置。", "d": 0}, {"k": "y26", "s": 229, "t": "单选", "q": "在dns服务器类型中master表示", "o": ["辅助服务器", "缓存服务器", "转发服务器", "主服务器"], "a": "D", "n": "【答案正确】zone 声明中 type master 表示主（权威）服务器，持有区域数据的原始副本。辅助（从）服务器是 slave/secondary，缓存/根提示用 hint，转发用 forward（forwarders）。", "d": 0}, {"k": "y26", "s": 230, "t": "单选", "q": "银河麒麟高级服务器操作系统默认的防火墙是( )", "o": ["iptables", "netfilter", "firewall", "kysec"], "a": "C", "n": "【答案正确】麒麟 V10 默认启用的防火墙是 firewall（即 firewalld 动态防火墙）。iptables 是其底层规则工具，netfilter 是内核包过滤框架，kysec 是麒麟安全模块而非防火墙。", "d": 0}, {"k": "y26", "s": 231, "t": "单选", "q": "firewall防火墙的守护进程是", "o": ["firewalld", "iptables", "iptablesd", "firewall-cmd"], "a": "A", "n": "【答案正确】firewalld 防火墙的守护进程是 firewalld（systemctl status firewalld 可验证）。firewall-cmd 是命令行管理客户端而非守护进程，iptables 是规则工具，iptablesd 不存在。", "d": 0}, {"k": "y26", "s": 232, "t": "单选", "q": "银河麒麟操作系统中安全框架是", "o": ["kysec", "selinux", "DAC", "MAC"], "a": "A", "n": "【答案正确】银河麒麟操作系统自研的安全框架是 kysec（含三态机制/执行控制、文件完整性保护等）。selinux 是其他发行版采用的 MAC 实现，DAC/MAC 是访问控制模型概念而非麒麟的安全框架名。", "d": 0}, {"k": "y26", "s": 233, "t": "单选", "q": "以下DHCP无法分配的信息是", "o": ["MAC地址", "IP地址", "掩码", "DNS"], "a": "A", "n": "【答案正确】DHCP 分配的是 IP 地址、子网掩码、网关、DNS、租期等网络参数；MAC 地址是网卡出厂固定的硬件地址，客户端在请求中携带（可用于做地址绑定），服务器不会也无法\"分配\"MAC。", "d": 0}, {"k": "y26", "s": 234, "t": "单选", "q": "命令终端使用什么命令可以从dhcp服务器自主获得IP地址", "o": ["dhclient", "ipconfig", "ifconfig", "ipadd"], "a": "A", "n": "【答案正确】Linux 终端用 dhclient（如 dhclient eth0）主动向 DHCP 服务器请求获取 IP。ipconfig 是 Windows 命令，ifconfig 只查看/配置接口地址，ipadd 不是有效命令。", "d": 0}, {"k": "y26", "s": 235, "t": "单选", "q": "DHCP服务器的租约文件存放的位置是", "o": ["/var/lib/dhcpd", "/etc/dhcpd", "/var/lib/dhclient", "/var/log/dhcpd"], "a": "A", "n": "【答案正确】RHEL 系（含麒麟 V10）DHCP 服务器租约文件位于 /var/lib/dhcpd/dhcpd.leases，即目录 /var/lib/dhcpd。/etc/dhcp 或 /etc/dhcpd 存放配置文件 dhcpd.conf，/var/lib/dhclient 是客户端租约，/var/log 存日志。", "d": 0}, {"k": "y26", "s": 236, "t": "单选", "q": "在zone文件中反向解析用哪个字符来表示", "o": ["PTR", "A", "MX", "CNAME"], "a": "A", "n": "【答案正确】区域文件中 PTR（pointer）记录用于反向解析（IP→域名），存放于 in-addr.arpa 反向区域。A 记录做正向 IPv4 解析，MX 指定邮件交换，CNAME 定义别名。", "d": 0}, {"k": "y26", "s": 237, "t": "判断", "q": "MySQL是银河麒麟操作系统中唯一可用的数据库管理系统。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】该说法错误：麒麟支持多种数据库，如 MySQL/MariaDB、PostgreSQL 以及国产数据库达梦、人大金仓、openGauss 等，MySQL 并非唯一可用的数据库管理系统。判断题为 A=正确/B=错误，参考答案 B 正确。", "d": 0}, {"k": "y26", "s": 238, "t": "判断", "q": "将前一个命令的标准输出作为后一个命令的标准输入，称之为管道。（   ）", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】管道 | 的定义就是把前一个命令的标准输出（stdout）接到后一个命令的标准输入（stdin），如 ls | grep conf。题干表述准确。", "d": 0}, {"k": "y26", "s": 239, "t": "判断", "q": "grub的系统选择菜单里面可以有多个操作系统选项。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】grub/grub2 的引导菜单可以是多个条目：多块磁盘上的多个操作系统、同一系统的多个内核版本并存时，都会在菜单中列出供用户选择，/etc/grub.d/ 与 grub 配置支持多条目。", "d": 0}, {"k": "y26", "s": 240, "t": "判断", "q": "开源系统下有很多freeware,这里的free只是免费的意思", "o": ["正确", "错误"], "a": "B", "n": "【答案存疑】【概念争议】平台答案为\"错误\"。出题意图是考查开源语境中 free 的含义：free software 的 free 取\"自由\"（free speech）之义，不仅仅是\"免费\"（free beer），按此教学口径\"只是免费的意思\"判为错误可接受。但严格说，题干用的是 freeware（免费软件）一词，freeware 本来就是指免费发放、源码不开放类软件，说它的 free 是\"免费\"并无大错——题干把 freeware 与 free software 两个概念混为一谈，属于题目自身措辞缺陷。练习时掌握 free 在开源语境下\"自由优先、兼顾免费\"的双重含义即可。", "d": 1}, {"k": "y26", "s": 241, "t": "判断", "q": "在进行网络配置时，netstat命令用于测试网络中主机之间是否连通。（  ）", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】netstat 用于查看本机的网络连接、端口监听和路由表状态（如 netstat -antp、-r），并不发起主机间的连通性测试；测连通用 ping/traceroute。题干张冠李戴，判“错误”正确。", "d": 0}, {"k": "y26", "s": 242, "t": "判断", "q": "麒麟操作系统安装时，在分区的时候如果选择清空整个硬盘，则磁盘上原有分区会消失。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】安装器选择“清空整个硬盘”会重建磁盘分区表、删除原有全部分区（数据随之清除），且不可逆。装机前应先备份目标盘数据。", "d": 0}, {"k": "y26", "s": 243, "t": "判断", "q": "终止一个前台进程可以用命令CTRL+C。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Ctrl+C 向前台进程组发送 SIGINT（2 号信号），默认处置动作为终止进程；它只作用于前台作业，后台进程需用 kill 发信号。", "d": 0}, {"k": "y26", "s": 244, "t": "判断", "q": "已知/etc/crontab文件内容如下\n10 9 */10 * * root command\n表示每月的1、11、21、31日的6点30分执行command。这种说法是否正确？", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】crontab 五字段依次为“分 时 日 月 周”。10 9 */10 * * 表示每月 1、11、21、31 日的 9 点 10 分（分=10、时=9）执行 command，并非“6 点 30 分”，时间错位，说法错误。另注意：*/10 的含义是“从 1 号起每隔 10 天”，原解析称“日期能被 10 整除”表述不妥（1、11、21 均不能被 10 整除）。", "d": 0}, {"k": "y26", "s": 245, "t": "判断", "q": "麒麟V10版本系统访问https://serverip:9090进入cockpit，可以在网页上执行日志查看、存储管理、网络管理、用户管理等针对银河麒麟服务器系统管理的一些常见操作。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】麒麟 V10 预装 Cockpit 网页管理台，浏览器访问 https://服务器IP:9090（服务未启动时先 systemctl enable --now cockpit.socket）即可图形化完成日志查看、存储、网络、用户管理等管理操作。", "d": 0}, {"k": "y26", "s": 246, "t": "判断", "q": "麒麟V10版本系统/dev/shm目录挂载的是临时文件系统，数据存储于内存中，断电消失。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】/dev/shm 挂载的是 tmpfs（基于内存的临时文件系统），数据不落盘，重启或断电即消失；默认容量约为物理内存的一半，常用于进程间临时共享数据。", "d": 0}, {"k": "y26", "s": 247, "t": "判断", "q": "因为/boot分区中存放着内核文件、虚拟文件系统、启动引导程序等在系统启动过程中用到的重要文件，所以一般建议将/boot单独作为一个分区管理，但这并不是必须的。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】/boot 存放内核 vmlinuz、initramfs、grub2 引导文件，单独分区可避免根分区被占满或误操作波及启动；但内核与引导文件也可直接放在根分区下，单独分 /boot 是建议而非强制要求。", "d": 0}, {"k": "y26", "s": 248, "t": "判断", "q": "银河麒麟V10服务器系统安装过程中，可以提前设置好用户及网络地址。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】麒麟 V10 安装器（Anaconda 类界面）在安装流程中提供“网络和主机名”与“创建用户”等步骤，可提前设置 IP 地址、网关、DNS 及用户口令，无需装完再改。", "d": 0}, {"k": "y26", "s": 249, "t": "判断", "q": "当原始文件被删除后，软链接文件也将失效，从这一点上来说与 Windows 系统中的“快捷方式”具有一样的性质.", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】软链接（ln -s）内容只是目标文件的路径引用，原文件被删除或改名后即成为失效的“死链”，与 Windows“快捷方式”性质一致；对比：硬链接直接指向 inode，删源不受影响。", "d": 0}, {"k": "y26", "s": 250, "t": "判断", "q": "LVM逻辑卷缩容可以在线操作，不必提前卸载磁盘。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】LVM/文件系统不支持在线缩小：缩容必须先卸载，且要先缩文件系统（resize2fs）再缩逻辑卷（lvreduce），xfs 文件系统甚至只能扩不能缩。可在线进行的是扩容（lvextend），题干说法错误。", "d": 0}, {"k": "y26", "s": 251, "t": "判断", "q": "根据不同业务系统运行的服务器操作系统环境需求，安装程序默认提供了几种【基本环境】安装选择，安装程序默认选项是【带UKUI GUI 的服务器】。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】麒麟 V10 安装器“软件选择”页提供最小安装、带 UKUI GUI 的服务器等多种“基本环境”选项，默认选中“带UKUI GUI 的服务器”（与 RHEL 安装界面默认 Server with GUI 的做法一致）。", "d": 0}, {"k": "y26", "s": 252, "t": "判断", "q": "计算机启动时，操作系统的所有模块都必须常驻内存，这种说法正确吗？()", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】操作系统采用模块化与按需加载机制：仅内核核心部分（调度器、内存管理等）常驻内存，驱动和许多功能模块按需装入或动态装卸，“所有模块都必须常驻内存”说法错误。", "d": 0}, {"k": "y26", "s": 253, "t": "判断", "q": "RAID5 技术是把硬盘设备的数据奇偶校验信息分散保存到阵列中的所有硬盘设备中，至少需要三块硬盘才能生效。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】RAID5 将数据条带化并把奇偶校验信息分散保存到阵列中所有硬盘（而非专用校验盘），任一盘损坏可凭校验数据恢复；磁盘利用率为 n-1，最少需要 3 块硬盘才能生效。", "d": 0}, {"k": "y26", "s": 254, "t": "判断", "q": "netfilter是linux核心层的一个数据包处理模块", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】netfilter 是 Linux 内核网络层的数据包过滤/处理框架，通过 PREROUTING、FORWARD、POSTROUTING 等钩子点在内核态拦截处理报文；iptables、firewalld 只是工作在其上的用户态配置工具。", "d": 0}, {"k": "y26", "s": 255, "t": "判断", "q": "logrotate是基于cron来运行的", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】【发行版差异】logrotate 本身不是常驻服务，靠定时调度周期性执行：传统方式由 cron（/etc/cron.daily/logrotate）触发；在 RHEL8/麒麟 V10 这类系统上也可由 systemd 的 logrotate.timer 定时调用。考试口径“基于 cron 运行”成立。", "d": 0}, {"k": "y26", "s": 256, "t": "判断", "q": "NFS文件服务采用的22端口", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】NFS 服务端口是 2049（NFSv4 直接使用该端口，v2/v3 另需 rpcbind 的 111 端口注册映射）；22 是 SSH 端口，题干说法错误。", "d": 0}, {"k": "y26", "s": 257, "t": "判断", "q": "vmstat系统命令可以针对所有或者单个进程进行监控", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】vmstat 输出的是整个系统的进程、内存、swap、IO、CPU 等汇总统计（可按间隔采样），不支持针对单个进程；单进程监控应使用 pidstat -p、top -p 或查看 /proc/\u003cpid>。", "d": 0}, {"k": "y26", "s": 258, "t": "判断", "q": "iSCSI可以设置磁盘共享和文件共享", "o": ["正确", "错误"], "a": "A", "n": "【答案存疑】平台答案为“正确”，但技术上站不住：iSCSI 是块级（磁盘）存储协议，只把块设备/LUN 导出给客户端（即磁盘共享），不提供文件级共享；文件共享应由 NFS/Samba 实现。本库第 323 题（“iSCSI 共享的是文件夹”判错误）、第 67 题（iSCSI 属 SAN 块存储）均按此口径，库内自相矛盾。按技术口径本题应为“错误”，练习时务必记住 iSCSI 只做磁盘共享，正式比赛如以官方答案为准需注意此题风险。", "d": 1}, {"k": "y26", "s": 259, "t": "判断", "q": "dhcp的日志信息默认记录在messages文件中", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】【发行版差异】dhcpd 的日志走 syslog 机制，RHEL/openEuler 系（含麒麟 V10）rsyslog 默认写入 /var/log/messages，故说法正确。按本库约定，系统日志位置统一按 /var/log/syslog 口径判定，但本题明确问 messages，与麒麟 V10 的实际情况一致，两者不冲突。", "d": 0}, {"k": "y26", "s": 260, "t": "判断", "q": "在银河麒麟操作系统中，使用vsftpd可以建立FTP服务。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】vsftpd 是麒麟 V10 软件源自带的 FTP 服务端软件，安装后由 systemd 启动 vsftpd 服务（默认 21 控制端口）即可提供 FTP 服务。", "d": 0}, {"k": "y26", "s": 261, "t": "判断", "q": "FTP服务可以配置成只允许特定的用户访问。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】vsftpd 可通过 userlist_file + userlist_deny（白/黑名单）、PAM 认证限制等把访问限定到特定用户，还能用 chroot 限制用户只能在主目录内活动。", "d": 0}, {"k": "y26", "s": 262, "t": "判断", "q": "NFS只支持命令行操作，没有图形界面。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】NFS 并非只有命令行一种操作方式：图形文件管理器可直接输入 nfs://服务器/目录 浏览访问，也有图形化和网页化（如 Cockpit/存储工具）的管理手段；“只支持命令行、没有图形界面”说法过于绝对，错误。", "d": 0}, {"k": "y26", "s": 263, "t": "判断", "q": "[a-z]表示括号中的任何一个字符。（  ）", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】[a-z] 是正则字符集（字符区间），匹配 a 到 z 范围内的任意一个字符（一次只代表一个字符），grep、ls 花括号/方括号通配中均是此含义。", "d": 0}, {"k": "y26", "s": 264, "t": "判断", "q": "麒麟操作系统的安装过程中，可以实现对磁盘进行分区。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】麒麟 V10 安装器在“安装位置/系统分区”步骤支持自动分区和手动自定义分区，可自行规划 /boot、/、swap 等分区大小。", "d": 0}, {"k": "y26", "s": 265, "t": "判断", "q": "麒麟操作系统的文件系统是树形结构的文件系统", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Linux/麒麟的文件系统以单一根目录 / 为起点，所有文件和目录都在同一棵树上，是典型的树形层次结构（不同于 Windows 的多盘符并列）。", "d": 0}, {"k": "y26", "s": 266, "t": "判断", "q": "树形目录结构的第一级称为目录树的根。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】树形目录结构的最顶层即根目录 /（root），目录树的第一级就是根，之下逐级展开为各级子目录。", "d": 0}, {"k": "y26", "s": 267, "t": "判断", "q": "麒麟操作系统下，不同的帐户可以使用相同的密码。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】系统只按账户各自校验口令，并不限制不同账户使用相同口令（密码策略如 pwquality 也不做跨账户比对）；仅为安全习惯上不建议。", "d": 0}, {"k": "y26", "s": 268, "t": "判断", "q": "at和cron配置文件，allow比deny的优先级更高。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】cron/at 的访问控制规则：若存在 allow 文件（cron.allow/at.allow），则仅名单内用户允许使用、deny 文件被忽略；不存在 allow 时才检查 deny。因此 allow 优先级高于 deny，说法正确。", "d": 0}, {"k": "y26", "s": 269, "t": "判断", "q": "执行renice 10 6668表示将pid为6668的进程的静态优先级调整为10。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】【术语提示】renice 10 6668 将 PID 6668 进程的 nice 值改为 10（nice 取值 -20～19，普通用户只能调大）。nice 是影响调度动态优先级的静态设定值，题目称“静态优先级”不够严谨；平台判“正确”可接受，练习时注意术语差别。", "d": 0}, {"k": "y26", "s": 270, "t": "判断", "q": "系统启动前，grub会将虚拟文件系统加载到内存，内核启动时，会在访问真正的根文件系统之前，先访问内存中的虚拟文件系统。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】GRUB 引导阶段把内核 vmlinuz 与 initramfs（虚拟文件系统）加载进内存；内核启动后先解包 initramfs 作为早期根环境、加载存储驱动，找到设备后再挂载并切换到真正的根文件系统。", "d": 0}, {"k": "y26", "s": 271, "t": "判断", "q": "RAID1技术是把两块以上的任意数量硬盘设备进行绑定，在写入数据时，是将数据同时写入到多块硬盘设备上（可以将其视为数据的镜像或备份）。当其中某一块硬盘发生故障后，一般会立即自动以热交换的方式来恢复数据的正常使用。", "o": ["正确", "错误"], "a": "B", "n": "【答案存疑】【概念争议】题干句子基本是教材对 RAID1 的经典描述（两块以上硬盘互为镜像/备份、故障后经热交换恢复），按教材口径应判“正确”；但按严格技术口径确有瑕疵：RAID1 镜像组通常成对构建，“任意数量”表述不严谨，“立即自动以热交换方式恢复”也不准确——热插拔换盘是人工操作，换盘之后的 rebuild 才自动进行。平台判“错误”有一定依据，练习以平台口径为准并理解上述差异。", "d": 1}, {"k": "y26", "s": 272, "t": "判断", "q": "银河麒麟V10服务器系统除了支持光盘安装以外，还可以选择ISO文件、网络或USB安装。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】麒麟 V10 服务器系统支持光盘/DVD、USB 启动盘、ISO 文件（虚拟光驱/带外虚拟介质挂载）以及 PXE/HTTP 网络安装等多种安装途径。", "d": 0}, {"k": "y26", "s": 273, "t": "判断", "q": "软链接仅仅包含所链接文件的路径名，因此能链接目录文件，也可以跨文件系统进行链接。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】软链接记录的只是目标的路径名字符串（拥有独立 inode），因此可以指向目录、跨文件系统/跨分区链接；硬链接则既不能指向目录、也不能跨文件系统。", "d": 0}, {"k": "y26", "s": 274, "t": "判断", "q": "LVM 可以允许用户对磁盘资源进行动态调整。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】LVM 通过物理卷—卷组—逻辑卷三层抽象屏蔽底层磁盘布局，可在线扩展逻辑卷（lvextend）、向卷组动态加入/移出物理卷，实现磁盘存储资源的动态调整。", "d": 0}, {"k": "y26", "s": 275, "t": "判断", "q": "银河麒麟操作系统安装过程中，SWAP分区是必须存在的。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】swap 是推荐配置而非强制项：安装时可以删除或不创建 swap 分区，也可事后用 swap 文件或 zram 补足，故“SWAP 分区必须存在”说法错误。", "d": 0}, {"k": "y26", "s": 276, "t": "判断", "q": "kysec-set命令可以为文件或者文件夹设置kysec标记", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】麒麟 KYSEC 机制中为文件/目录设置安全标记的命令是 kysec_set（下划线写法，配套 kysec_get 等查看），不存在连字符写法的 kysec-set 命令，故说法错误。", "d": 0}, {"k": "y26", "s": 277, "t": "判断", "q": "https采用明文传输", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】HTTPS 是 HTTP over TLS，传输内容与握手过程均经 SSL/TLS 加密，并非明文；明文传输的是 HTTP。", "d": 0}, {"k": "y26", "s": 278, "t": "判断", "q": "DHCP服务使用的端口是69", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】DHCP 使用 UDP 67（服务器端）和 68（客户端）端口；69 是 TFTP 的端口，两者常在 PXE 装机环境中共同出现但服务不同。", "d": 0}, {"k": "y26", "s": 279, "t": "判断", "q": "网络链路聚合虽然能解决网络大并发，但是无法实现网卡硬件容错。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】链路聚合（bonding/team）既能把多条链路带宽叠加应对大并发流量，又能实现冗余容错——单块网卡或链路故障时流量自动切换到其余成员网卡，题干“无法实现网卡硬件容错”说法错误。", "d": 0}, {"k": "y26", "s": 280, "t": "判断", "q": "Iptables防火墙是静态防火墙", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】iptables 为“静态防火墙”：规则需整表写入内核 netfilter，增删规则缺乏状态化按需加载机制；对比之下 firewalld 引入区域、运行时/永久配置分离，属“动态防火墙”。", "d": 0}, {"k": "y26", "s": 281, "t": "判断", "q": "使用FTP协议时，客户端和服务器之间的数据传输可以通过匿名登录进行。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】FTP 支持匿名访问：服务端开启匿名登录（anonymous/ftp，口令任意或邮箱）后，客户端无需注册账户即可登录并传输文件。", "d": 0}, {"k": "y26", "s": 282, "t": "判断", "q": "在银河麒麟操作系统中，可以使用任何标准的SQL数据库客户端来访问MySQL数据库。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】MySQL 采用标准 SQL，配合相应驱动/连接器（JDBC、ODBC 等），标准 SQL 客户端工具（mysql 命令行、Navicat、DBeaver 等）在麒麟系统下都可连接访问 MySQL 数据库。", "d": 0}, {"k": "y26", "s": 283, "t": "判断", "q": "NFS服务完全不支持Windows操作系统。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Windows 并非完全不能访问 NFS：安装/启用 NFS 客户端组件（如 Windows 的 Services for NFS / 客户端功能）后即可挂载 NFS 共享；“完全不支持”说法错误。", "d": 0}, {"k": "y26", "s": 284, "t": "判断", "q": "使用FTP协议传输文件比使用HTTP协议更安全。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】传统 FTP 的账号口令与数据均明文传输，安全性并不比 HTTP 高；需要安全传输应使用 SFTP（基于 SSH）、FTPS 或 HTTPS。", "d": 0}, {"k": "y26", "s": 285, "t": "判断", "q": "ping命令可以用来初步诊断目标主机是否存活。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】ping 基于 ICMP 回显请求/应答，可初步判断目标主机是否存活、网络是否可达及时延情况；注意：目标禁 ping 时会不响应，此时 ping 不通不完全等于主机宕机。", "d": 0}, {"k": "y26", "s": 286, "t": "判断", "q": "在麒麟操作系统下/etc/passwd文件记录了所有用户的登录口令", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】/etc/passwd 只记录账户基本信息（用户名、UID/GID、家目录、shell），口令字段为 x 占位符；加密后的口令存放在仅 root 可读的 /etc/shadow 中，故题干说法错误。", "d": 0}, {"k": "y26", "s": 287, "t": "判断", "q": "麒麟操作系统使用快捷键Ctrl+Alt+E唤出终端。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】麒麟 UKUI 桌面唤出终端的默认快捷键是 Ctrl+Alt+T，Ctrl+Alt+E 不是默认的终端快捷键，题干说法错误。", "d": 0}, {"k": "y26", "s": 288, "t": "判断", "q": "麒麟操作系统下普通用户可以通过passwd命令修改root用户的密码", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】普通用户执行 passwd root 会因权限不足失败（修改他人口令需 root 权限；passwd 不带参数只能改自己的口令），故题干说法错误。", "d": 0}, {"k": "y26", "s": 289, "t": "判断", "q": "crontab -e创建的任务在/var/spool/cron/username文件中，授权用户均可创建。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】crontab -e 编辑的用户级定时任务保存在 /var/spool/cron/\u003c用户名>（麒麟V10/RHEL系路径，Debian系为 /var/spool/cron/crontabs/）。能否使用 crontab 由 cron.allow/cron.deny 控制，被授权的用户都能创建自己的任务文件，root 的任务文件也存于同一目录。说法成立。", "d": 0}, {"k": "y26", "s": 290, "t": "判断", "q": "执行ps aux|grep sshd|grep -v \"grep\"|awk '{print $2}'|head -1得到sshd进程pid为1310，执行kill -1 1310重载配置文件后，已建立的ssh活动连接会中断。这种说法是否正确？", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】向 sshd 主进程发 SIGHUP（kill -1）的作用是重载配置（sshd 会重新执行自身再读取配置文件），这正是 systemctl reload sshd 的实现方式。已建立的会话由各自 fork 出来的 sshd 会话子进程维护，不受主进程重载影响，不会中断。命题说“活动连接会中断”不成立，判“错误”正确。", "d": 0}, {"k": "y26", "s": 291, "t": "判断", "q": "lvm精简卷可以实现存储资源的过度调配。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】LVM 精简供给（thin provisioning，lvcreate -T 创建 thin pool/精简卷）允许所有精简卷声明的容量总和超过 thin pool 实际物理容量，按实际写入量动态分配，即存储资源的过度调配；代价是要监控使用率防止池被写满。说法正确。", "d": 0}, {"k": "y26", "s": 292, "t": "判断", "q": "已知执行ps aux命令回显的RSS包含共享库的内存，所以所有进程的RSS总和可能会高于总物理内存大小，这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】ps aux 的 RSS（常驻内存）包含进程映射的共享库（如 libc）、共享内存段等，同一份共享内存被映射它的每个进程各自计入一次 RSS，因此所有进程 RSS 求和存在重复计算，完全可能大于总物理内存。free 按系统口径去重则不会。说法正确。", "d": 0}, {"k": "y26", "s": 293, "t": "判断", "q": "at定时任务，指定一个时间执行任务，只能执行一次，创建at任务方式有两种，从文件输入和从控制台输入。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】at 安排的任务在指定时间只执行一次（区别于 cron 的周期执行）。创建方式两种：交互式从控制台输入（at 时间 后逐行敲命令，Ctrl+D 结束），以及从文件输入（at -f 文件名 时间 或 管道/重定向送入）。说法正确。", "d": 0}, {"k": "y26", "s": 294, "t": "判断", "q": "如果您将要安装的机器还有其他操作系统或数据分区需要保留，请您千万注意提前做好数据备份。这时需要选择手动分区，请选择【自定义】磁盘分区。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】需要保留原有系统或其他数据分区时属于手动分区场景：自动分区方案可能清除/占用整块磁盘且不可逆，必须先备份再选“自定义（手动）”分区，只对指定分区操作。说法符合安装规范。", "d": 0}, {"k": "y26", "s": 295, "t": "判断", "q": "由于技术的局限性，我们不能跨分区对目录文件进行软链接。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】软链接保存的是目标的路径字符串，不与目标共用 inode、不指向数据块，因此可以跨分区/跨文件系统，也可以对目录建立；受“不能跨文件系统、不能链接目录”限制的是硬链接。命题“不能跨分区对目录做软链接”不成立，判“错误”正确。", "d": 0}, {"k": "y26", "s": 296, "t": "判断", "q": "RAID技术可以允许用户对磁盘资源进行动态调整。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】“允许用户对硬盘/磁盘资源进行动态调整”是 LVM 的特性（逻辑卷可在线扩容、灵活调整），RAID 的定位是提供冗余和读写性能，条带/镜像布局固定后容量调整并不灵活（扩容需同步/重组）。命题把 LVM 的功能安到 RAID 上，判“错误”正确。", "d": 0}, {"k": "y26", "s": 297, "t": "判断", "q": "RAID 0 技术把多块物理硬盘设备（至少两块）通过硬件或软件的方式串联在一起，组成一个大的卷组，并将数据随机写入到各个物理硬盘中。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】RAID 0（至少两块盘）是把数据切成条带块按顺序交替写入各盘（顺序条带化），并行 I/O 提升速度，但无冗余；不是“随机写入”。命题的错误点在“随机写入”一词，判“错误”正确。", "d": 0}, {"k": "y26", "s": 298, "t": "判断", "q": "bootloader作为BIOS与OS之间的桥梁，在BIOS完成引导的部分工作并退出后，由bootloader担负起启动内核的重任。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】BIOS/UEFI 完成加电自检并按启动顺序移交控制权后，bootloader（开机引导程序，如 GRUB2）作为固件与操作系统之间的桥梁，负责定位、加载内核与 initramfs 并启动内核。说法正确。", "d": 0}, {"k": "y26", "s": 299, "t": "判断", "q": "银河麒麟高级服务器操作系统中开启或者关闭kysec功能需要重启计算机才能生效", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】麒麟 kysec 安全机制的开关涉及内核安全模块的加载与初始化，切换状态后需重启计算机才能完整生效，不能即开即用。与官方手册口径一致，说法正确。", "d": 0}, {"k": "y26", "s": 300, "t": "判断", "q": "https默认使用的端口是443", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】HTTPS 即运行在 TLS 之上的 HTTP，IANA 默认端口 TCP 443（HTTP 为 80）。说法正确。", "d": 0}, {"k": "y26", "s": 301, "t": "判断", "q": "DHCP的配置文件存放在/etc目录", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】麒麟V10/RHEL 系的 ISC DHCP 服务端配置文件为 /etc/dhcp/dhcpd.conf，位于 /etc 目录下。判“正确”成立。", "d": 0}, {"k": "y26", "s": 302, "t": "判断", "q": "DHCP配置文件中，option routers字段是用来声明DNS", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】dhcpd.conf 中 option routers 声明下发给客户端的默认网关（路由器地址）；声明 DNS 服务器的是 option domain-name-servers。命题说它是声明 DNS，不成立，判“错误”正确。", "d": 0}, {"k": "y26", "s": 303, "t": "判断", "q": "netfilter负载过滤数据包", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】netfilter 是 Linux 内核中的数据包过滤/处理框架（在各协议栈钩子点工作），iptables、firewalld 只是在用户态管理规则的工具，实际的包过滤由内核 netfilter 执行。题干“负责过滤数据包”（题面“负载”为“负责”笔误）说法正确。", "d": 0}, {"k": "y26", "s": 304, "t": "判断", "q": "kysec-set命令可以为文件或目录设置kysec标记", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】麒麟 kysec 设置安全标记的命令是 kysec_set（下划线，如 kysec_set -n exetype -v SHARED /路径），查询配对命令为 kysec_get；“kysec-set”这种连字符写法的命令不存在。命题错误，判“错误”正确。", "d": 0}, {"k": "y26", "s": 305, "t": "判断", "q": "NFS文件服务器采用的22端口", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】NFS 服务端监听 2049 端口（NFSv4 直接使用 2049，v3 还依赖 rpcbind 的 111 端口）；22 是 SSH 的端口。命题错误，判“错误”正确。", "d": 0}, {"k": "y26", "s": 306, "t": "判断", "q": "FTP协议无法提供加密的数据传输功能，这意味着所有传输的数据都可能被截获。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】FTP 协议本身不提供加密，控制连接的用户名/口令与数据均明文传输，可被网络嗅探工具直接截获；需要加密应改用 FTPS（FTP+TLS）或 SFTP/SCP。说法正确。", "d": 0}, {"k": "y26", "s": 307, "t": "判断", "q": "在银河麒麟操作系统中，NFS可以实现不同系统间的文件系统挂载。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】NFS 就是用于不同机器间共享文件系统的协议，客户端把服务端导出的目录挂载到本地使用；麒麟V10 支持，与 Windows 之外的主流类 Unix 系统间均可互挂。说法正确。", "d": 0}, {"k": "y26", "s": 308, "t": "判断", "q": "NFS服务在银河麒麟操作系统中默认是开启的。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】麒麟V10 默认不启用 NFS 服务：需安装 nfs-utils 并 systemctl enable --now nfs-server（同时依赖 rpcbind）才会开启。命题“默认开启”不成立，判“错误”正确。", "d": 0}, {"k": "y26", "s": 309, "t": "判断", "q": "麒麟操作系统不支持网络协议。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】麒麟操作系统基于 Linux 内核，完整实现 TCP/IP 等各类网络协议栈，网络功能健全。命题“不支持网络协议”显然错误，判“错误”正确。", "d": 0}, {"k": "y26", "s": 310, "t": "判断", "q": "银河麒麟服务器操作系统下普通用户不能通过passwd命令修改自己的密码", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】普通用户可直接运行 passwd，验证本人当前口令后修改自己的密码（passwd 程序以特权身份代为改写 /etc/shadow 中属于该用户的字段）；只有修改他人密码或强制策略时才需要 root。命题“普通用户不能改”不成立，判“错误”正确。", "d": 0}, {"k": "y26", "s": 311, "t": "判断", "q": "在切断计算机电源之前一定要关闭 麒麟操作系统，绝不能不执行关机进程就切断电源，这样做会导致未存盘数据的丢失或者系统损坏。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】应执行 shutdown/poweroff 等正常关机流程，让系统回写缓存、同步并卸载文件系统后再断电；直接切断电源会丢失未落盘数据，甚至因元数据不完整而损坏文件系统。说法正确。", "d": 0}, {"k": "y26", "s": 312, "t": "判断", "q": "当root用户口令丢失后将没有办法重新设置root的口令", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】root 口令丢失并非无解：重启在 GRUB2 菜单编辑内核参数（如加 rd.break 或 init=/bin/bash），进入单用户/救援环境后用 passwd 重设，再 touch /.autorelabel（SELinux 场景）并重启即可。麒麟V10 为 GRUB2 引导，方法同理。命题“没有办法重新设置”不成立，判“错误”正确。", "d": 0}, {"k": "y26", "s": 313, "t": "判断", "q": "已知/etc/crontab文件内容如下\n10,20 9-21 * * * root command\n表示每天9-21点的第10和20分钟执行command。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】/etc/crontab 五个字段依次为 分 时 日 月 周。10,20 表示第 10 和 20 分钟，9-21 表示 9 点到 21 点区间（含 9、21），即每天 9:10、9:20、…、21:10、21:20 各执行一次。命题描述与语法一致，判“正确”。", "d": 0}, {"k": "y26", "s": 314, "t": "判断", "q": "/etc/crontab是vim直接编辑文件内容，只有root可编辑。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】/etc/crontab 是系统级 crontab（含运行用户字段），不像用户任务那样用 crontab -e 编辑，而是直接用 vim 修改；文件属主与组均为 root、权限 0644，普通用户无写权限，可编辑者仅 root。判“正确”成立。", "d": 0}, {"k": "y26", "s": 315, "t": "判断", "q": "RAID条带化技术就是一种自动的将I/O的负载均衡到多个物理磁盘上的技术，条带化技术就是将一块连续的数据分成很多小部分并把他们分别存储到不同磁盘上去。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】条带化（striping）把连续数据切成等大小的条带块分散存储到多块物理盘上，读写可并行进行，相当于把 I/O 负载均衡到各盘。命题描述符合定义，判“正确”。", "d": 0}, {"k": "y26", "s": 316, "t": "判断", "q": "麒麟V10版本系统使用的启动引导程序，是存放在/boot/grub目录下的stage1 stage1_5和stage2文件。这种说法是否正确？", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】stage1、stage1_5、stage2 是 GRUB Legacy（GRUB 1）的三段式引导文件；麒麟V10 采用 GRUB2，由 boot.img/core.img 与 /boot/grub2/（或 EFI 分区下）grub.cfg 等构成，不再有 stage 文件系列。命题错误，判“错误”正确。", "d": 0}, {"k": "y26", "s": 317, "t": "判断", "q": "根据不同业务系统运行的服务器操作系统环境需求，安装程序默认提供了几种【基本环境】安装选择，安装程序默认选项是【基础设施服务器】。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】麒麟V10 安装程序（Anaconda 系）的【软件选择】默认基本环境不是“基础设施服务器”（与 RHEL 系“Server with GUI”对应，通常默认为“带UKUI GUI的服务器”，个别镜像/版本也可能默认“最小安装”，但均非基础设施服务器）。命题错误，判“错误”正确。", "d": 0}, {"k": "y26", "s": 318, "t": "判断", "q": "银河麒麟V10服务器系统安装界面，Kdump是一个内核崩溃转储机制。在系统崩溃时，kdump将捕获系统信息， 有助于诊断系统崩溃原因。注意：kdump需要预留一部分内存，并且可以被系统分配给用户使用。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】kdump 确为内核崩溃转储机制，崩溃时用备用内核捕获转储信息；但其 pre-reserved 的 crashkernel 预留内存在启动时被保留，专供崩溃捕获使用，正常运行期间不参与系统内存分配，用户无法使用。“可以被系统分配给用户使用”的说法错误，判“错误”正确。", "d": 0}, {"k": "y26", "s": 319, "t": "判断", "q": "一般我们用的RAID 10 技术是 RAID 1+RAID 0 技术的一个“组合体”。RAID 10 技术需要至少 4 块硬盘来组建，其中先分别两两制作成 RAID 1 磁盘阵列，以保证数据的安全性；然后再对两个 RAID 1 磁盘阵列实施 RAID 0 技术，进一步提高硬盘设备的读写速度。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】RAID 10 即先做镜像再条带：至少 4 块盘两两组成 RAID 1 镜像对保证数据安全，再对两组镜像实施 RAID 0 提升读写速度。描述符合标准定义，判“正确”。", "d": 0}, {"k": "y26", "s": 320, "t": "判断", "q": "如果我们想每一小时重启sshd服务，如下循环语句是否正确：0 */2 * * * systemctl restart sshd", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】“0 */2 * * *”分钟为 0、小时为 */2，含义是每 2 小时的整点执行一次；“每一小时”应写成 “0 * * * *”（或 0 */1 * * *）。题干周期描述与语句不符，判“错误”正确。", "d": 0}, {"k": "y26", "s": 321, "t": "判断", "q": "我们通常使用RAID10，而不是RAID01，是因为RAID10的容错率更高。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】RAID 10（先镜像后条带）某一镜像组坏一块盘后阵列仍正常，且允许不同镜像组各坏一块；RAID 01（先条带后镜像）任一条带组坏盘后整个阵列即处于降级状态，再坏任意一块盘就整体失效。RAID 10 容错率更高，故通常选用，判“正确”。", "d": 0}, {"k": "y26", "s": 322, "t": "判断", "q": "firewall防火墙是静态防火墙", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】firewalld 是动态防火墙：以 zone/service 组织规则，支持运行时动态增改且不断开已有连接；通常被视为“静态”的是 iptables（规则变更需整体重载）。命题称其为静态防火墙不成立，判“错误”正确。", "d": 0}, {"k": "y26", "s": 323, "t": "判断", "q": "iscsi存储共享的是文件夹", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】iSCSI 在 TCP/IP 网络上承载 SCSI 指令，共享的是块设备（磁盘/卷/LUN），客户端将其当作本地磁盘来分区格式化；共享文件夹/目录属于文件级共享，由 NFS、Samba 等承担。判“错误”正确。", "d": 0}, {"k": "y26", "s": 324, "t": "判断", "q": "ssh是加密传输数据的", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】SSH 会对会话进行加密（密钥协商后建立对称加密通道），认证信息和传输数据均以密文形式传输，可防窃听与篡改。判“正确”。", "d": 0}, {"k": "y26", "s": 325, "t": "判断", "q": "DHCP配置文件的名称为dhcpd.conf", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】麒麟V10/RHEL 系 DHCP 服务端配置文件名为 dhcpd.conf（完整路径 /etc/dhcp/dhcpd.conf）。判“正确”。", "d": 0}, {"k": "y26", "s": 326, "t": "判断", "q": "在dhcp使用range字段声明地址池", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】dhcpd.conf 中在 subnet 声明内用 range 指令声明可动态分配的地址池，如 range 192.168.10.100 192.168.10.200;。判“正确”。", "d": 0}, {"k": "y26", "s": 327, "t": "判断", "q": "dhclient -r 网卡名词   该命令执行后，可让网卡从dhcp服务器获取IP地址", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】dhclient -r 网卡 的作用是向服务器释放（release）当前租约并停止使用该地址，并非获取 IP；重新获取地址可直接执行 dhclient 网卡名。题干描述的功能与 -r 相反，判“错误”正确。", "d": 0}, {"k": "y26", "s": 328, "t": "判断", "q": "银河麒麟高级服务器操作系统中开启kysec功能可直接生效", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】与第299题同口径：麒麟 kysec 的开启/关闭改变内核安全模块的加载状态，需重启计算机后才生效，不能“直接生效”。命题错误，判“错误”正确。", "d": 0}, {"k": "y26", "s": 329, "t": "判断", "q": "https默认使用的端口是53", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】HTTPS 默认端口是 TCP 443；53 是 DNS 的端口。判“错误”正确。", "d": 0}, {"k": "y26", "s": 330, "t": "判断", "q": "NFS代表网络文件系统，是Linux中用于在不同机器间共享文件的一种协议。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】NFS 即 Network File System（网络文件系统），是 Linux/类 Unix 系统间在网络上共享文件（目录挂载方式）的主流协议。判“正确”。", "d": 0}, {"k": "y26", "s": 331, "t": "判断", "q": "FTP服务默认运行在21号TCP端口上。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】FTP 的控制连接默认使用 TCP 21 端口（主动模式数据连接用 20，被动模式协商高位端口），“默认运行在21号TCP端口”正确。", "d": 0}, {"k": "y26", "s": 332, "t": "判断", "q": "在银河麒麟操作系统中，只有root用户才能配置NFS服务。", "o": ["正确", "错误"], "a": "B", "n": "【答案存疑】命题“只有root用户才能配置NFS服务”是绝对化表述。配置 NFS（编辑 /etc/exports、exportfs 导出、启停服务）本质上需要超级用户权限，普通用户无权直接操作——按“服务配置属 root 职责”的教学口径判“A（正确）”也说得通；但被 sudo 授权的普通用户提升权限后同样能完成配置，故“只有root”又不完全成立，平台答案“B（错误）”可以接受。另需提示：本库第314题对“只有root可编辑/etc/crontab”判“正确”，与本题对同类绝对化表述判“错误”的口径并不一致，前后口径需统一。平台答案B尚可接受，故标存疑而非错误。", "d": 1}, {"k": "y25linux", "s": 1, "t": "单选", "q": "当登录Linux时，一个具有唯一进程ID号的shell将被调用，这个ID是什么()", "o": ["NID", "PID", "UID", "CID"], "a": "B", "n": "【答案正确】登录后调用的shell本身是一个进程，进程的唯一标识就是PID（进程ID）；UID是用户标识，NID、CID并非Linux标准术语。shell被调用时拥有唯一PID，选B无误。", "d": 0}, {"k": "y25linux", "s": 2, "t": "单选", "q": "下面哪个系统目录中包含Linux使用的外部设备（ ）", "o": ["/bin", "/dev", "/boot", "/home"], "a": "B", "n": "【答案正确】外部设备在Linux中以设备文件形式存放于/dev（如/dev/sda、/dev/tty0）；/bin存放常用命令，/boot存放引导内核文件，/home是普通用户主目录，均不含设备文件。", "d": 0}, {"k": "y25linux", "s": 3, "t": "单选", "q": "BIND支持建立3类域名服务器,其中（ ）能够从主域名服务器各备份域名数据库信息,并能分担一台服务器大量域名查询造成的负载过高的现象", "o": ["影子域名服务器", "主域名服务器", "缓存域名服务器", "辅助域名服务器"], "a": "D", "n": "【答案正确】BIND按教材分主、辅助、缓存三类服务器；题干“各备份”应为“备份”（排版杂质）。辅助域名服务器启动时向主服务器执行区域传送复制域名数据库，既提供数据冗余又能分担查询负载；主服务器是区域数据源，缓存服务器不含权威区域数据，“影子域名服务器”非教材标准分类。", "d": 0}, {"k": "y25linux", "s": 4, "t": "单选", "q": "在创建Linux分区时，一定要创建（）两个分区", "o": ["FAT/NTFS", "FAT/SWAP", "NTFS/SWAP", "SWAP/根分区"], "a": "D", "n": "【答案正确】按教材传统口径安装Linux至少要建根分区（挂载/）和SWAP交换分区；FAT/NTFS是Windows文件系统。【版本差异】现代发行版中swap可用交换文件替代、并非严格必须，但按题库口径D正确。", "d": 0}, {"k": "y25linux", "s": 5, "t": "判断", "q": "()ext2文件系统具有日志功能", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】ext2不具备日志功能，异常断电后需fsck全盘检查；带日志的文件系统自ext3开始（ext4同样有日志），故“ext2具有日志功能”错误，判断为B正确。", "d": 0}, {"k": "y25linux", "s": 6, "t": "单选", "q": "DNS的（ ）区域包含DNS命令空间所有的资源记录", "o": ["主区域", "辅助区域", "存根区域", "缓存区域"], "a": "A", "n": "【答案正确】主区域维护区域内资源记录的主副本，包含本区域全部资源记录；辅助区域只是主副本的只读拷贝，存根区域仅存SOA、NS和胶水A记录，缓存区域保存的是非权威缓存记录。Windows DNS教材口径选A。", "d": 0}, {"k": "y25linux", "s": 7, "t": "单选", "q": "Pure-ftpd不可以控制ftp账户在以下哪些功能（ ）", "o": ["文件配额", "磁盘配额", "用户权限", "IP访问列表"], "a": "C", "n": "【答案正确】Pure-FTPd可按账户设置文件个数配额与容量配额（pure-pw的-n/-N）以及每用户IP允许/拒绝列表（-r/-R）；对“用户权限”（属操作系统文件权限范畴）pure-ftpd不提供按账户控制，故不可控制的是C。", "d": 0}, {"k": "y25linux", "s": 8, "t": "单选", "q": "用vi打开一个文件，如何用字母”new”来代替字母”old”()", "o": ["：r/old/new", "：s/old/new", "：1，$s/old/new/g", "：s/old/new/g"], "a": "C", "n": "【答案正确】“：1，$s/old/new/g”对第1行到最后一行（即全文）执行替换，g表示行内所有匹配均替换；：s/old/new（含/g）只作用于当前行，：r用于在光标处读入文件。现代vi中常写作“:%s/old/new/g”，效果相同。", "d": 0}, {"k": "y25linux", "s": 9, "t": "判断", "q": "()Linux中的超级用户为root，登陆时不需要口令", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】root登录同样必须输入口令，且系统默认禁止空口令账户登录；“登陆时不需要口令”说法错误，判断为B正确。", "d": 0}, {"k": "y25linux", "s": 10, "t": "单选", "q": "删除文件命令为（ ）。", "o": ["mkdir", "rmdir", "mv", "rm"], "a": "D", "n": "【答案正确】rm删除文件（-r可删目录）；rmdir只能删除空目录，mkdir创建目录，mv是移动/重命名，均非删除文件的命令。", "d": 0}, {"k": "y25linux", "s": 11, "t": "单选", "q": "在Linux操作系统中,（）配置文件用于存放本机主机名及经常访问IP地址的主机名,在对IP进行域名解析时,可以设定为先访问该文件,再访问DNS,最后访问NIS", "o": ["/etc/hosts", "/etc/resolv.conf", "/etc/inted.Conf", "/etc/host.conf"], "a": "D", "n": "【答案存疑】【题目缺陷】题干把两个文件的职能揉合在一起：/etc/hosts用于存放本机主机名及主机名-IP对应关系，且解析时默认最先查它；而“可设定为先访问该文件、再访问DNS、最后访问NIS”的解析顺序职能属/etc/host.conf（order hosts,bind,nis），该文件本身并不存放主机名。按字面“存放主机名”应选A（/etc/hosts），参考答案D对应的是后半句“设定解析顺序”；此题疑由原双空题（一空考hosts、一空考host.conf）合并成单空所致，两种理解均可辩护，故判存疑。", "d": 1}, {"k": "y25linux", "s": 12, "t": "单选", "q": "对文件进行归档的命令为（ ）", "o": ["dd", "cpio", "gzip", "tar"], "a": "D", "n": "【答案正确】tar是Linux标准打包归档命令，可把多个文件/目录归档并配合gzip/bzip2压缩；gzip只能压缩单个文件，dd按块复制。cpio虽然也有归档功能（通常配合find使用），但单选题按教材主推答案取tar。", "d": 0}, {"k": "y25linux", "s": 13, "t": "单选", "q": "在shell中变量的赋值有四种方法，其中，采用name=12的方法称()", "o": ["直接赋值", "使用read命令", "使用命令行参数", "使用命令的输出"], "a": "A", "n": "【答案正确】shell变量赋值常见的四种方式为：直接赋值（name=12）、用read命令读入、由命令行位置参数赋值、以命令替换（`命令`或$(命令)）的输出赋值；name=12这种等号直接写法即直接赋值。", "d": 0}, {"k": "y25linux", "s": 14, "t": "多选", "q": "在vi编辑器的（）中，不可以设置显示当前文件内容的行号。", "o": ["命令模式", "末行模式", "输入模式"], "a": "AC", "n": "【已修正答案】平台原答案 AB 有误（平台答案系 AI 生成、仅供参考），已按核验改为 AC。设置显示行号用:set number（:set nu），它是末行模式命令——末行模式恰恰是唯一可以设置显示行号的模式；“不可以设置显示行号”的是命令模式与输入模式。参考答案AB把能进行设置的末行模式列入“不可以”、又漏掉同样不可设置的输入模式，自相矛盾。多选集合应为A+C。（若题干本意为“可以设置”，则应单选B末行模式，任何口径下AB都不成立，附【题目缺陷】提示题干否定词存排版风险。）", "d": 2}, {"k": "y25linux", "s": 15, "t": "判断", "q": "()Linux进程一旦执行了一个不能够立即完成的系统调用(例如请求读取文件的一部分),Linux将把这个进程转入停止状态", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】进程执行不能立即完成的系统调用（如请求读取磁盘上的文件数据）时，会转入睡眠/等待（阻塞）状态让出CPU，等待资源就绪后被唤醒；“停止状态（TASK_STOPPED）”指被SIGSTOP类信号暂停或被调试跟踪的状态，与阻塞不同。题述张冠李戴，判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 16, "t": "单选", "q": "PHP和MySQL的联合使用解决了()", "o": ["在Proxy上处理数据库的访问问题", "在WWW服务器上处理黑客的非法访问问题", "在WWW服务器上处理数据库的访问问题", "在Sendmail邮件系统上处理数据库的访问问题"], "a": "C", "n": "【答案正确】PHP作为WWW（Web）服务器端脚本语言，与MySQL数据库配合，解决的是在WWW服务器上实现数据库访问/动态网页的问题；与代理服务器、防黑客访问、Sendmail邮件系统无关。", "d": 0}, {"k": "y25linux", "s": 17, "t": "单选", "q": "通过修改哪个文件可以在创建用户的时候改变用户主目录的路径（ ）。", "o": ["/etc/default/passwd", "/etc/default/useradd", "/etc/profile", "/etc/fstab"], "a": "B", "n": "【答案正确】/etc/default/useradd保存useradd的默认值（HOME=/home、SHELL=/bin/bash等），修改其中HOME路径即可改变新建用户主目录所在的父路径；/etc/profile是登录shell环境脚本，/etc/fstab是文件系统挂载表，/etc/default/passwd与口令策略相关，均不决定家目录路径。", "d": 0}, {"k": "y25linux", "s": 18, "t": "单选", "q": "SSH服务主要有3部分组成，即（ ）。", "o": ["传输层协议用户认证协议连接协议", "传输层协议连接协议UDP协议", "传输层协议隧道协议SSH协议", "用户认证协议TCP/IP协议Telnet协议"], "a": "A", "n": "【答案正确】SSH协议体系由三部分组成：传输层协议（SSH-TRANS，提供加密、完整性、压缩）、用户认证协议（SSH-USERAUTH）、连接协议（SSH-CONN，在一条加密链路上复用多条逻辑信道）；其余选项拼凑的UDP、TCP/IP、Telnet等都不是SSH的组成部分。", "d": 0}, {"k": "y25linux", "s": 19, "t": "判断", "q": "（ ）/proc目录实际上是一个虚拟文件系统，它主要用于从内存中读取处理信息", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】/proc是内核提供的虚拟（伪）文件系统，不占磁盘空间，内容实时存于内存，内核状态与各进程信息经其暴露（如/proc/cpuinfo、/proc/[pid]/status），题述正确。", "d": 0}, {"k": "y25linux", "s": 20, "t": "单选", "q": "CentOS7系统采用了systemd作为初始化进程，如何查看某个服务的运行状态？（）", "o": ["systemctl status 服务名", "systemctl 服务名", "system status 服务名", "以上都不对"], "a": "A", "n": "【答案正确】CentOS 7由systemd管理服务，查看服务状态用systemctl status 服务名；“systemctl 服务名”缺少子命令不能执行，“system status”不是有效命令。", "d": 0}, {"k": "y25linux", "s": 21, "t": "单选", "q": "在DNS配置文件中，用于表示某主机别名的是：（ ）", "o": ["NS", "CNAME", "NAME", "CN"], "a": "B", "n": "【答案正确】CNAME记录给出某主机的别名并指向其规范主机名（最终由A记录解析出IP）；NS记录指明区域的权威服务器，NAME、CN不是DNS资源记录类型。", "d": 0}, {"k": "y25linux", "s": 22, "t": "单选", "q": "关闭磁盘配额服务的操作是（ ）。", "o": ["quotaoff–a", "quotaoff", "quotadiskoff", "quota–off"], "a": "A", "n": "【答案正确】【选项文本有误】准确写法是quotaoff -a（题面“–a”与命令粘连为排版丢空格），-a表示对/etc/mtab中所有已启用配额的文件系统关闭配额；quotaoff不带参数则无操作对象，quota–off、quotadiskoff均为错误拼写。选A正确。", "d": 0}, {"k": "y25linux", "s": 23, "t": "单选", "q": "用\"useraddjerry\"命令添加一个用户，这个用户的主目录是什么?（ ）", "o": ["/etc/jerry", "/var/jerry", "/home/jerry", "/bin/jerry"], "a": "C", "n": "【答案正确】useradd不指定-d选项时，按默认HOME=/home为用户建立与账户同名的家目录/home/jerry；/etc是配置文件目录，/var存放可变数据，/bin存放命令，不是家目录位置。", "d": 0}, {"k": "y25linux", "s": 24, "t": "单选", "q": "下列不是Linux系统进程类型的是()", "o": ["交互进程", "批处理进程", "守护进程", "就绪进程"], "a": "D", "n": "【答案正确】按作用Linux进程分为交互进程、批处理进程、守护进程等类型；“就绪”是进程调度生命周期中的状态（就绪态），不是进程类型，故选D。", "d": 0}, {"k": "y25linux", "s": 25, "t": "单选", "q": "在vi编辑器里，哪个命令能将光标移到第200行（ ）。", "o": ["200g", "：200", "g200", "G200"], "a": "B", "n": "【答案正确】末行命令“：200”把光标定位到第200行；另一标准用法是先数字后大写G（200G），选项D“G200”次序颠倒（G前无数时跳到末行），200g、g200均不是有效的跳行命令。", "d": 0}, {"k": "y25linux", "s": 26, "t": "判断", "q": "（ ）使用su命令将记录下以root身份执行了哪些命令", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】su只切换执行身份，不记录之后以root身份执行的命令；要逐条审计所执行命令应使用sudo（其日志记入/var/log/secure或auth.log）。题述把审计功能安在su上，判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 27, "t": "多选", "q": "在LINUX中，组成电子邮件系统的程序通常包括（    ）角色。", "o": ["MUA", "MTA", "MDA", "MSA"], "a": "ABC", "n": "【答案正确】经典邮件系统由MUA（用户代理）、MTA（传输代理）、MDA（投递代理）三个角色构成，A、B、C齐全无遗漏；MSA（邮件提交代理，587端口提交邮件用）是后期RFC补充的角色，不属于教材“通常包括”的三角色，故D不选。", "d": 0}, {"k": "y25linux", "s": 28, "t": "判断", "q": "（ ）一个域名的每个组成部分不能超过63个字符,完整的域名全长不能超过256个字符", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】域名每个标号（组成部分）不超过63个字符正确；完整域名（FQDN）按RFC 1035线格式不超过255字节，教材普遍表述为“不超过255个字符”，题中“256”与标准口径不符，因此整句判断为错误，选B成立。", "d": 0}, {"k": "y25linux", "s": 29, "t": "单选", "q": "Linux核心的许可证是什么?（）", "o": ["NDA", "GDP", "GPL", "GNU"], "a": "C", "n": "【答案正确】Linux内核按GNU GPL（通用公共许可证，v2）发布；GNU是自由软件工程名称，NDA、GDP与许可证无关。", "d": 0}, {"k": "y25linux", "s": 30, "t": "单选", "q": "个文件的权限是-rw-rw-r--，这个文件所有者的权限是什么()", "o": ["read-only", "read-write", "write", "write-read"], "a": "B", "n": "【答案正确】-rw-rw-r--的首三段是属主权限rw-，即read-write；属组同为rw-，其他用户为r--只读。选B。", "d": 0}, {"k": "y25linux", "s": 31, "t": "判断", "q": "()Linux安装时自动创建了根用户", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Linux安装过程中即要求设置root密码，根用户（root）随系统安装自动创建，题述正确。", "d": 0}, {"k": "y25linux", "s": 32, "t": "单选", "q": "以下哪种Shell类型在Linux环境下不能使用()", "o": ["bShell", "KShel", "RShell", "Bash"], "a": "C", "n": "【答案正确】【术语提示】选项拼写不规范：bShell、KShel应为bsh、ksh。bash（Bash）、bsh、ksh都是Linux下可用的Shell（需安装对应软件包），“RShell”并不是Linux Shell的名称，故不能使用的是C。", "d": 0}, {"k": "y25linux", "s": 33, "t": "单选", "q": "比较重要的系统配置资料，一般来说大部分位于( )目录下", "o": ["/etc", "/boot", "/home", "/usr"], "a": "A", "n": "【答案正确】重要系统配置文件基本集中于/etc（用户账户、服务、网络配置等）；/boot存放引导文件，/home是用户数据，/usr是应用程序与资源。", "d": 0}, {"k": "y25linux", "s": 34, "t": "单选", "q": "将用户tom变为SMB用户的方法是（ ）。", "o": ["smbpasswd–atom", "smbaddtom", "smbpasswd–ausertom", "smbuser–atom"], "a": "A", "n": "【答案正确】【选项文本有误】准确命令为smbpasswd -a tom（题面“–atom”为空格丢失排版），-a选项将系统用户tom加入Samba账户库并设置Samba密码；smbaddtom、smbuser–atom不是有效命令，“smbpasswd -a usertom”用户名写错。选A。", "d": 0}, {"k": "y25linux", "s": 35, "t": "单选", "q": "以下命令中哪一条不能创建一个新的文件( )", "o": ["touch", "mv -i", "vim", "Ln"], "a": "B", "n": "【答案正确】mv的功能是移动或重命名已有文件（-i仅在覆盖目标前询问），不会产生新文件；touch可直接建立空文件，vim保存时创建新文件，ln会产生新的链接（文件）。选B。", "d": 0}, {"k": "y25linux", "s": 36, "t": "单选", "q": "在Linux系统中,每个进程都有4GB的虚拟地址空间,其中内核空间占用（ ）", "o": ["0~2GB-1", "0~3GB-1", "3Gb~4GB-1", "2GB~4GB-1"], "a": "C", "n": "【答案正确】32位x86 Linux为每个进程提供4GB虚拟地址空间，其中0~3GB-1为用户空间，3GB~4GB-1为内核空间（内核占顶端1GB）；选项C“3Gb~4GB-1”即此区间（Gb为大小写排版笔误）。", "d": 0}, {"k": "y25linux", "s": 37, "t": "单选", "q": "qmail是()", "o": ["收取邮件的协议", "邮件服务器的一种", "发送邮件的协议", "邮件队列"], "a": "B", "n": "【答案正确】qmail是与Sendmail、Postfix并称的邮件传送代理（MTA），即邮件服务器软件，以安全、模块化著称；收发邮件协议是POP3/SMTP，“邮件队列”只是服务器内部的概念。选B。", "d": 0}, {"k": "y25linux", "s": 38, "t": "判断", "q": "()因为root用户具有很高的权限,所以可以在任何地点以任何形式登录系统", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】出于安全考虑root远程/本地登录受诸多限制：如老系统用/etc/securetty限定root可登录的终端，SSH用PermitRootLogin控制等，root并非“任何地点任何形式”都能登录，判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 39, "t": "判断", "q": "在Linux中，Pop3服务器是主流的电子邮件服务器软件", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】POP3是客户端收信使用的协议（邮局协议第3版），不是“电子邮件服务器软件”；实现POP3服务的程序才称为POP3服务器，主流邮件服务器（MTA）软件是Sendmail、qmail、Postfix等。判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 40, "t": "单选", "q": "在vi编辑器中的命令模式下，键入什么可在光标当前所在行下添加一新行（ ）", "o": ["\u003ca>", "\u003co>", "\u003cI>", "a"], "a": "B", "n": "【答案正确】命令模式下按小写o在光标当前行下方新开一行并进入输入模式；大写O在上方开新行，a在光标后追加，I在行首插入。选B。", "d": 0}, {"k": "y25linux", "s": 41, "t": "判断", "q": "()Linux的内核版本和发行版本号是一样的", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】内核版本（如2.6.x）由内核团队编号，发行版本（如RHEL/CentOS各版本号）由发行商另行命名，是两套体系，并不一样，判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 42, "t": "单选", "q": "Linux系统常用的引导加载器有()", "o": ["GRUB", "WRITE", "LOADLIN", "NTLOADER"], "a": "A", "n": "【答案正确】Linux常用的引导加载器是GRUB（RHEL5时代为GRUB Legacy，新版为GRUB2）；WRITE、NTLOADER与Linux引导无关。LOADLIN虽是历史上从DOS引导Linux的工具，但本题单选按主流答GRUB。", "d": 0}, {"k": "y25linux", "s": 43, "t": "单选", "q": "在windows与Linux双启动的系统中，如果要让LILO先期管理引导，则LILO应该放在（ ）", "o": ["MBR", "/", "root分区的首扇区", "/LILO"], "a": "A", "n": "【答案正确】Windows与Linux双系统要让LILO先期接管引导，应把LILO装入MBR，BIOS加载MBR后由LILO给出选择菜单；装入root分区首扇区只能作为被其他引导器链式加载的二级引导器，起不到先期管理作用，“/LILO”目录不存在。", "d": 0}, {"k": "y25linux", "s": 44, "t": "多选", "q": "在Linux中，具有相当丰富使用的联机帮助功能。用户通常可通过下面哪几种方式来获取操作命令的使用方法或参数选项内容。（ ）", "o": ["man命令", "whatis命令", "info命令", "--help 命令"], "a": "ABCD", "n": "【答案正确】man提供联机手册，info为超文本格式手册，whatis从whatis数据库给出命令的单行摘要，命令加--help输出简要用法与参数，四者都是常用的获取命令帮助的方式，ABCD全选成立。", "d": 0}, {"k": "y25linux", "s": 45, "t": "单选", "q": "在linux中,关于DNS服务器,叙述正确的是（ ）", "o": ["DNS服务器配置不需要配置客户端", "建立某个分区的DNS服务器时只需要建立一个主DNS服务器", "主DNS服务器需要启动named进程,而辅DNS服务器不需要", "DNS服务器的root.cache文件包含了根名字服务器的有关信息"], "a": "D", "n": "【答案正确】D正确：named的root.cache（根提示/缓存文件）记载了根名称服务器的信息。A错：DNS服务器要正常解析必须配置客户端（resolv.conf指定DNS地址）；B错：建立区域并非“只需要”一个主DNS服务器，还可建立辅助/缓存服务器，表述绝对；C错：辅助DNS服务器同样要运行named进程才能提供解析。", "d": 0}, {"k": "y25linux", "s": 46, "t": "单选", "q": "管线(pipeline)|指的是()", "o": ["将一个程序的输出作为某一个程序的输入", "资料流", "I/Obuffer", "memorybuffer"], "a": "A", "n": "【答案正确】管道“|”把前一命令的标准输出接到后一命令的标准输入，即“将一个程序的输出作为另一个程序的输入”（题面“某一个”应为“另一个”）；资料流、I/O缓冲、内存缓冲都不是管道的定义。选A。", "d": 0}, {"k": "y25linux", "s": 47, "t": "单选", "q": "Linux启动的第一个进程init启动的第一个脚本程序是()", "o": ["/etc/rc.d/init.d", "/etc/rc.d/rc.sysinit", "/etc/rc.d/rc5.d", "/etc/rc.d/rc3.d"], "a": "B", "n": "【答案正确】Sys V init（RHEL5/6口径）流程中，init读取inittab后第一个执行的脚本是/etc/rc.d/rc.sysinit，完成系统初始化后再按运行级执行rc脚本；/etc/rc.d/init.d是服务脚本存放目录，rc3.d、rc5.d是运行级链接目录。【版本差异】CentOS 7起由systemd取代init，此流程为老教材口径。", "d": 0}, {"k": "y25linux", "s": 48, "t": "单选", "q": "Linux文件系统的目录结构是一棵倒挂的树,文件都按其作用分门别类的放在相关的目录中现有一个外部设备文件,应该将其放在（ ）目录中", "o": ["/bin", "/etc", "/dev", "/lib"], "a": "C", "n": "【答案正确】外部设备文件按惯例统一存放于/dev；/bin是常用命令，/etc是配置文件，/lib是共享库。选C。", "d": 0}, {"k": "y25linux", "s": 49, "t": "判断", "q": "()Linux系统中的root可以充当任何文件或进程的属主,还可以执行一些特殊操作", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】root拥有全部特权（如CAP_CHOWN），可对任何文件执行chown变更属主、可向任何进程发送信号，还可执行挂载、关机等特殊操作，题述正确。", "d": 0}, {"k": "y25linux", "s": 50, "t": "判断", "q": "team接口最多支持8块网卡进行聚合。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Linux 网卡的 team（网络组）驱动对参与聚合的端口数量并没有\"最多8块\"的硬性上限，端口数只受系统资源限制（实际配置常用2块做主备或负载均衡）。“上限8块”的说法不成立，判\"错误\"正确。易混淆点是部分厂商交换机的链路聚合（如 Eth-Trunk 默认最多8条成员链路），与 Linux team 无关。", "d": 0}, {"k": "y25linux", "s": 51, "t": "单选", "q": "用来分离目录名和文件名的字符是什么？（ ）", "o": ["slash(/)", "period(.)", "dash(-)", "asterisk(*)"], "a": "A", "n": "【答案正确】Unix/Linux 采用单根树形目录结构，路径中目录与文件用正斜杠 /（slash）分隔，如 /etc/passwd，/ 同时也是根目录符号。period(.) 用于表示当前目录/隐藏文件前缀，dash(-) 是命令选项前缀，asterisk(*) 是通配符。Windows/DOS 才用反斜杠 \\ 作分隔符。", "d": 0}, {"k": "y25linux", "s": 52, "t": "单选", "q": "Linux文件名的长度不得超过个字符()", "o": ["64", "128", "255", "512"], "a": "C", "n": "【答案正确】Linux 原生文件系统（ext2/ext3/ext4 等）规定单个文件名（路径的一个分量）最长 255 字节，即教材所称\"不超过255个字符\"；整个路径另受 PATH_MAX（4096）限制。64/128 明显偏小，512 超出内核限制。【题目缺陷】题干\"不得超过个字符\"漏掉了数字 255，系排版丢失，按意图选 C 无误。", "d": 0}, {"k": "y25linux", "s": 53, "t": "单选", "q": "如果在Linux系统中,某一子目录中存在某些文件,该子目录使用rm命令（ ）", "o": ["能够删除", "不可能删除", "删除该子目录中的所有文件和子目录后可以删除", "不能确定"], "a": "C", "n": "【答案正确】目录非空时不能直接删除（rmdir 只能删空目录、rm 需 -r 递归），教材口径是\"先删除该子目录中所有文件和子目录，之后该目录即可被删除\"。A 忽视了目录内容，B“不可能删除”过于绝对，D 无依据。严格说清空后用 rm 仍需 -r/-d 参数，用 rmdir 才是标准做法，但按出题意图 C 正确。", "d": 0}, {"k": "y25linux", "s": 54, "t": "单选", "q": "怎样显示当前目录（ ）。", "o": ["PWD", "CD", "WHO", "LS"], "a": "A", "n": "【答案正确】显示当前工作目录的命令是 pwd（print working directory）。CD 用于切换目录，WHO 显示登录用户，LS 只列目录内容。【术语提示】Linux 命令区分大小写，实际命令为小写 pwd，选项按排版写成大写 PWD（大写 PWD 通常指保存该路径的环境变量），按出题意图选 A。", "d": 0}, {"k": "y25linux", "s": 55, "t": "判断", "q": "()Linux没有扩展分区", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】传统 MBR 分区方案下 Linux 同样使用主分区、扩展分区和逻辑分区结构：一块磁盘最多4个主分区（或3主+1扩展），扩展分区内可再划分逻辑分区（如 sda5、sda6）。\"Linux没有扩展分区\"与事实不符，判\"错误\"正确。【版本差异】GPT 分区方案下不再有扩展分区/逻辑分区概念，但本题按 MBR 老教材口径判定。", "d": 0}, {"k": "y25linux", "s": 56, "t": "单选", "q": "可用于锁定账户的命令是（ ）。", "o": ["useradd", "userdel", "usermod", "adduser"], "a": "C", "n": "【答案正确】usermod -L / -U 可锁定/解锁用户口令（在 /etc/shadow 口令字段前加 !），passwd -l/-u 亦有同样功能。干扰项中 userdel 是删除用户，useradd/adduser 是创建用户，都不能锁定现有账户，故选 C。", "d": 0}, {"k": "y25linux", "s": 57, "t": "单选", "q": "linux安装程序提供的两个引导装载程序是（ ）。", "o": ["GROUP和LLTO", "DIR和COID", "GRUB和LILO", "以上都不是"], "a": "C", "n": "【答案正确】Red Hat Linux（RHL9/RHEL4 及更早）安装程序提供 GRUB 和 LILO 两个引导装载程序，GRUB 为默认。GROUP/LLTO、DIR/COID 均为杜撰词。【版本差异】RHEL5 起安装器不再提供 LILO，RHEL7+ 改用 GRUB2，本题按老教材口径判 C 正确。", "d": 0}, {"k": "y25linux", "s": 58, "t": "单选", "q": "在/var/log目录下保存的lastlog日志文件保存的系统信息不包括( )", "o": ["用户的最后一次登录信息", "用户最后一次登录的时间", "用户最后一次登录的地点", "用户最后一次登录的出错程序"], "a": "D", "n": "【答案正确】/var/log/lastlog 按用户逐一记录最后一次登录的时间、登录终端（tty/pts）和来源主机（即\"地点\"），可用 lastlog 命令查看；登录失败信息记在 /var/log/btmp、/var/log/secure 等文件，lastlog 并不记录\"出错程序\"，\"不包括\"应选 D。", "d": 0}, {"k": "y25linux", "s": 59, "t": "多选", "q": "SSL会话的主要步骤有（    ）。", "o": ["客户端向服务器索要并验证证书", "双方协商生成“会话密钥”", "双方采用“会话密钥”进行加密通信", "必须使用签证机构提供证书"], "a": "ABC", "n": "【答案正确】SSL 会话建立的主要步骤即：客户端向服务器索要并验证证书 → 双方协商生成会话密钥（握手）→ 之后采用会话密钥进行对称加密通信，A/B/C 完整且互斥。D 不选：SSL 并非必须使用 CA 签发的证书（允许自签名证书），且\"使用xCA 证书\"是前提条件而非会话步骤。✅集合恰为 {A,B,C}，无多选漏选。", "d": 0}, {"k": "y25linux", "s": 60, "t": "判断", "q": "()进程的拥有者和root具有把进程的nice值降低的能力,但是除root外,却不能把进程的niCe值升高", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】实际规则是：进程拥有者只能调大自己进程的 nice 值（降低优先级），不能调小 nice 值（提高优先级），只有 root 能任意调高调低并可修改他人进程。题干\"拥有者和 root 都能降低 nice 值、非 root 不能升高 nice 值\"两处均与事实相反，判\"错误\"正确。", "d": 0}, {"k": "y25linux", "s": 61, "t": "单选", "q": "假如你得到一个运行命令被拒绝的信息,你可以用哪个命令去修改它的权限使之可以正常运行（）。", "o": ["path", "chmod", "chgrp", "chown"], "a": "B", "n": "【答案正确】命令无法运行最常见的原因是缺少可执行权限，用 chmod 修改权限位（如 chmod +x file）即可。chown/chgrp 只改变文件的属主/属组，不改变权限位；path 也不是有效命令（搜索路径由环境变量 PATH 控制）。故选 B。", "d": 0}, {"k": "y25linux", "s": 62, "t": "单选", "q": "进程有三种状态:()", "o": ["准备态执行态和退出态", "精确态模糊态和随机态", "运行态就绪态和等待态", "手工态自动态和自由态"], "a": "C", "n": "【答案正确】经典进程三态模型为：运行态（占用CPU执行）、就绪态（万事俱备等待调度）、等待态/阻塞态（因等待I/O或事件而暂停）；三态间可经调度、事件发生/等待等完成转换。准备态/退出态、精确态/模糊态、手工态等均非标准术语，故选 C。", "d": 0}, {"k": "y25linux", "s": 63, "t": "判断", "q": "在当前目录下解压归档文件keys.tar.gz，我们可以使用命令#tar -xvf  keys.tar.gz", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】GNU tar（RHEL/CentOS 各版本随附，自 tar 1.15 起支持）在解包时会按文件内容自动识别压缩格式（gzip/bzip2/xz 等），因此 tar -xvf keys.tar.gz 可直接解压 .tar.gz 文件。传统写法 tar -zxvf 的 -z 只是显式指定 gzip，并非必需，本题判\"正确\"无误。", "d": 0}, {"k": "y25linux", "s": 64, "t": "单选", "q": "Linux通过支持多种不同的文件系统Linux缺省的文件系统是()", "o": ["VFAT", "ISO9660", "Ext系列", "NTFS"], "a": "C", "n": "【答案正确】Linux 支持多种文件系统，其缺省（原生）文件系统是 Ext 系列（ext2/ext3/ext4，教材口径）。VFAT 是兼容 Windows FAT 的支持格式，ISO9660 用于光盘，NTFS 属 Windows。【版本差异】RHEL/CentOS 7 起根文件系统缺省改为 XFS；本题选项中无 XFS，按老教材口径 Ext 系列正确。", "d": 0}, {"k": "y25linux", "s": 65, "t": "单选", "q": "邮件转发代理也称邮件转发服务器,它可以使用SMTP协议,也可以使用协议（ ）", "o": ["FTP", "TCP", "UUCP", "POP"], "a": "C", "n": "【答案正确】教材口径：邮件转发代理（MTA/邮件转发服务器）负责服务器之间的邮件转发，除 SMTP 外还可经 UUCP 协议传输（sendmail 历史上长期支持 UUCP 邮件交换）。FTP 是文件传输协议，POP 是用户从服务器收信的协议（MUA 侧），TCP 只是传输层协议，都不承担服务器间转发，故选 C。", "d": 0}, {"k": "y25linux", "s": 66, "t": "判断", "q": "（ ）Linux内核是压缩后安装的，所以在内核加载入内存中后的第一步任务是自行解压", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】vmlinuz 是压缩后的内核映像（zImage/bzImage，gzip 压缩），引导程序将其装入内存后，内核自带的解压程序（stub）最先执行自解压，随后才进行硬件初始化和根文件系统挂载。判\"正确\"符合教材口径，也与实际启动流程一致。", "d": 0}, {"k": "y25linux", "s": 67, "t": "单选", "q": "ps命令显示结果中STAT的S代表（ ）。", "o": ["运行", "休眠", "终止", "挂起"], "a": "B", "n": "【答案正确】ps 输出 STAT 列中 S 表示可中断睡眠（休眠，等待某事件完成）；R 为运行或可运行，T 为停止/被跟踪，D 为不可中断睡眠，Z 为僵尸（终止待回收）。选项\"终止\"对应 Z、\"挂起\"对应 T，均不是 S，故选 B。", "d": 0}, {"k": "y25linux", "s": 68, "t": "单选", "q": "Linux的根分区系统类型是（）", "o": ["FAT16", "FAT32", "ext4", "NTFS"], "a": "C", "n": "【答案正确】RHEL5/6 时代根分区使用 Linux 原生文件系统 ext4（RHEL5 为 ext3）；FAT16/FAT32/NTFS 是 Windows 系文件系统，不作 Linux 根分区。选项中仅 C 可行。【版本差异】RHEL/CentOS 7 起根分区缺省为 XFS，但就本选项集而言 ext4 是正确答案。", "d": 0}, {"k": "y25linux", "s": 69, "t": "单选", "q": "在shell中如果不输入$HOME,则可以使用( )来引用主目录", "o": ["~", "&", "@", "*"], "a": "A", "n": "【答案正确】shell 中波浪号 ~ 会被展开为当前用户家目录（等同于 $HOME，如 cd ~、ls ~/.bashrc）。& 是后台运行符，* 是文件名通配符，@ 在 shell 中无此含义，故选 A。", "d": 0}, {"k": "y25linux", "s": 70, "t": "单选", "q": "在终端下输入mount-a命令的作用是：（ ）。", "o": ["强制进行磁盘检查", "显示当前挂载的所有磁盘分区的信息", "挂载/etc/fstab文件中的除noauto以外的所有磁盘分区", "以只读方式重新挂载/etc/fstab文件中的所有分区"], "a": "C", "n": "【答案正确】mount -a 依据 /etc/fstab 挂载其中所有未带 noauto 选项且尚未挂载的文件系统（开机脚本亦用它完成挂载）。不带参数的 mount 才是显示当前挂载信息；\"强制磁盘检查\"是 fsck，\"以只读方式重新挂载\"是 mount -o remount,ro，故选 C。", "d": 0}, {"k": "y25linux", "s": 71, "t": "单选", "q": "下面哪条命令可以显示用户默认设置（ ）。", "o": ["useradd-u", "showdefaults", "showuserdefaults", "useraad-D"], "a": "D", "n": "【答案正确】出题意图答案为 useradd -D：不带参数列出/显示创建用户时的默认设置（家目录基址、默认 shell、默认组、过期时间等，useradd -D -s ... 可改默认值），故选 D。【题目缺陷/选项文本有误】D 选项\"useraad-D\"是\"useradd -D\"的排版错误；A 的 useradd -u 用于指定 UID 而非显示默认值，B/C（showdefaults、showuserdefaults）不是任何系统命令。", "d": 0}, {"k": "y25linux", "s": 72, "t": "判断", "q": "()Linux系统通过对硬件的限制,使用户进程不能直接访问任何物理部件", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Linux 依靠 CPU 特权级（用户态/内核态）与 MMU 等硬件保护机制限制普通进程：用户进程运行于用户态，不能直接访问内存和物理设备，必须经系统调用陷入内核代为操作。题干“通过对硬件的限制”即指这种软硬件结合的保护，判\"正确\"符合教材口径。", "d": 0}, {"k": "y25linux", "s": 73, "t": "判断", "q": "Pod是Kubernetes的最小调度和部署单元。它是一个包含一个或多个容器的逻辑主机，这些容器共享网络和存储资源，并且在同一主机上共享生命周期。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Kubernetes 中 Pod 是最小的调度和部署单元，一个 Pod 封装一个或多个容器（及存储卷），容器间共享同一网络命名空间（相同 IP 与端口空间）和卷存储，并在同一节点上共存亡（生命周期一致）。题干描述准确，判\"正确\"。", "d": 0}, {"k": "y25linux", "s": 74, "t": "单选", "q": "可以完成主机名与IP地址的正向解析和反向解析任务的命令是：（）", "o": ["nslookup", "arp", "ifconfig", "dnslook"], "a": "A", "n": "【答案正确】nslookup 既能用域名查 IP（正向解析），也能用 IP 查域名（反向解析，如查询 PTR 记录），dig/host 同理。arp 负责解析 IP-MAC 地址映射，ifconfig 用于网卡配置，dnslook 是杜撰词，故选 A。", "d": 0}, {"k": "y25linux", "s": 75, "t": "单选", "q": "Linux通过相关守护程序来记载错误和调试消息,其中针对内核活动的日志由()记载", "o": ["syslog", "klogd", "kerlogd", "systemlogd"], "a": "B", "n": "【答案正确】内核日志守护进程 klogd 读取内核环形缓冲区（printk 输出）中的内核消息并转交 syslogd 记录；syslogd 负责用户空间程序日志。kerlogd、systemlogd 均为杜撰词，kerneld 是内核模块自动加载守护进程，亦非日志进程，故选 B。", "d": 0}, {"k": "y25linux", "s": 76, "t": "多选", "q": "RedHat Linux自带两个引导装载软件是", "o": ["LILO", "GRUB", "Load", "Bootinit"], "a": "AB", "n": "【答案正确】Red Hat Linux 9 及更早版本安装时自带 GRUB（默认）与 LILO 两种引导装载程序，AB 完整；Load、Bootinit 不是引导程序。✅集合恰为 {A,B}。【版本差异】RHEL5 起不再提供 LILO，仅保留 GRUB（RHEL7+ 为 GRUB2），本题按老教材口径判定。", "d": 0}, {"k": "y25linux", "s": 77, "t": "判断", "q": "（ ）磁盘定额的hard限制只有在设置了缓冲期限时才会运行", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】磁盘配额中 hard（硬）限制是绝对上限，达到后立即拒绝再写入，与缓冲期无关；需要设置缓冲期（宽限期 grace period）的是 soft（软）限制——超过 soft 且在宽限期内仍可写入，宽限期一过即被禁止。题干把宽限期与 hard 限制绑定，说法错误，判\"错误\"正确。", "d": 0}, {"k": "y25linux", "s": 78, "t": "单选", "q": "某文件的组外成员的权限为只读;所有者有全部权限;组内的权限为读与写,则该文件的权限为（ ）", "o": ["467", "674", "476", "764"], "a": "D", "n": "【答案正确】三位数字权限依次为 属主/属组/其他人：所有者全部权限 rwx=7，组内读写 rw-=6，组外只读 r--=4，合为 764。467/674/476 均是把三个分量错位排列的结果，故选 D。", "d": 0}, {"k": "y25linux", "s": 79, "t": "单选", "q": "将前一个命令的标准输出作为后一个命令的标准输入,称之为（ ）", "o": ["管道", "引用", "代入", "引导"], "a": "A", "n": "【答案正确】用竖线 | 把前一个命令的标准输出接到后一个命令的标准输入的机制称为管道，如 ps aux | grep sshd。引用一般指变量替换（$var）、代入/引导不是该机制的术语，故选 A。", "d": 0}, {"k": "y25linux", "s": 80, "t": "单选", "q": "下面哪个值代表多用户启动（ ）。", "o": ["1", "0", "3", "5"], "a": "C", "n": "【答案正确】init 运行级中 3 为完整多用户模式（文本界面无图形），是教材所谓\"多用户启动\"的标准值；0 为停机、1 为单用户维护模式、5 为带 X 图形界面的多用户模式。按题意选 3 正确。", "d": 0}, {"k": "y25linux", "s": 81, "t": "单选", "q": "Sendmail是一种()", "o": ["MTA(邮件传输代理)", "MDA(邮件分发代理)", "MMA邮件人工代理)", "MUA(邮件用户代理)"], "a": "A", "n": "【答案正确】Sendmail 是经典的 MTA（邮件传输代理），负责邮件在服务器间的路由发送及接收转投；MUA 是用户端收发信软件（如 Outlook/Foxmail），MDA 负责最终投递到邮箱（如 procmail），MMA\"邮件人工代理\"为杜撰项，故选 A。", "d": 0}, {"k": "y25linux", "s": 82, "t": "多选", "q": "如果现在要新增一个用户叫china，则该用什么命令（ ）。", "o": ["adduser china", "useradd china", "mkdir china", "vi china"], "a": "AB", "n": "【答案正确】在 RHEL/CentOS 中 adduser 是 useradd 的符号链接，两者均可新增用户，AB 完整；mkdir 创建目录、vi 编辑文件，均不能创建用户。✅集合恰为 {A,B}。【版本差异】Debian/Ubuntu 系的 adduser 是独立 Perl 脚本，同样用于新建用户，结论不变。", "d": 0}, {"k": "y25linux", "s": 83, "t": "单选", "q": "与进程管理有关的命令是（ ）", "o": ["fdisk", "kill", "cat", "move"], "a": "B", "n": "【答案正确】kill 用于向进程发送信号（默认 SIGTERM，常用于结束进程），是进程管理命令；fdisk 用于磁盘分区，cat 用于查看文件内容，move 不是有效命令（移动/改名命令为 mv），故选 B。", "d": 0}, {"k": "y25linux", "s": 84, "t": "单选", "q": "基于域名的虚拟主机所不具有的优点是（ ）", "o": ["不需要更多的IP地址", "复杂简单", "无须特殊的软硬件支持", "多数现代的浏览器支持这种虚拟主机的实现方法"], "a": "C", "n": "【答案正确】教材列举的基于域名虚拟主机优点为：不需要更多的IP地址（多个域名共用同一IP）、配置简单、多数现代浏览器（支持 HTTP/1.1 Host 头）都支持该方法，A/B/D 均属优点；而它必须依赖 DNS 域名解析并要求浏览器发送 Host 头，因此\"无须特殊的软硬件支持\"不属于其优点，选 C。【选项文本有误】B\"复杂简单\"应为\"配置简单\"（排版丢字）。", "d": 0}, {"k": "y25linux", "s": 85, "t": "判断", "q": "（ ）/proc逻辑文件系统主要负责系统文件的管理,与硬件有关", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】/proc 是由内核动态生成的虚拟文件系统，直接反映进程与内核的运行状态（也含 /proc/cpuinfo、/proc/meminfo 等部分硬件信息），内容不占磁盘、关机即消失，并不负责\"系统文件的管理\"（磁盘文件由常规文件系统管理）。题干表述错误，判\"错误\"正确。", "d": 0}, {"k": "y25linux", "s": 86, "t": "单选", "q": "在Shell程序中,转义字符是()", "o": ["$", "%", "#", "\\"], "a": "D", "n": "【答案正确】shell 中转义字符是反斜杠 \\，用于取消其后单个字符的特殊含义（如 \\$、\\*、\\\\）。$ 用于变量替换，# 是注释起始符，% 主要用于 job 控制与参数扩展，均不是转义字符，故选 D。", "d": 0}, {"k": "y25linux", "s": 87, "t": "单选", "q": "下面对Linux命令的描述哪个是正确的（ ）。", "o": ["不是大小写敏感的", "都是大写的", "大小写敏感", "都是小写"], "a": "C", "n": "【答案正确】Linux 命令与文件名均区分大小写（大小写敏感），如 LS 与 ls 不是同一个命令，File.txt 与 file.txt 是两个不同文件。\"不是大小写敏感\"\"都是大写\"\"都是小写\"均与事实相反，故选 C。", "d": 0}, {"k": "y25linux", "s": 88, "t": "判断", "q": "能改变用户工作目录到根目录的命令是 cd .", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】cd . 表示进入当前目录，工作目录并不改变；切换到根目录应使用 cd /（回到自己家目录用 cd 或 cd ~）。题干说法错误，判\"错误\"正确。", "d": 0}, {"k": "y25linux", "s": 89, "t": "单选", "q": "在RedHatLinux9中,一般用（ ）命令来查看网络接口的状态。", "o": ["ping", "ipconfig", "winipcfg", "netstat-i"], "a": "D", "n": "【答案正确】按选项判定：ipconfig、winipcfg 是 Windows 命令（Linux 下应为 ifconfig），ping 只测试连通性；netstat -i 在 Linux 下显示内核网络接口表（接口名、MTU、收发包数与错误统计等），可查看网络接口状态，故选 D。【题目缺陷】\"netstat-i\"系\"netstat -i\"空格丢失的排版瑕疵。", "d": 0}, {"k": "y25linux", "s": 90, "t": "判断", "q": "（ ）在Linux中，一个网卡可以绑定多个Ip地址", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】一块网卡可以绑定多个IP：传统方法用 IP 别名（ifconfig eth0:0 192.168.1.10 up、ifcfg-eth0:0 配置文件），现代用 ip addr add 地址 dev eth0；同一网卡多站点/多网段服务均依赖该能力。判\"正确\"无误。", "d": 0}, {"k": "y25linux", "s": 91, "t": "单选", "q": "EtterCap工具主要是基于（ ）机制在局域网中进行数据监听", "o": ["端口扫描", "ARP欺骗", "IP地址伪装", "ICMP泛洪"], "a": "B", "n": "【答案正确】EtterCap 是局域网综合嗅探/中间人攻击工具，其主要机制是 ARP 欺骗：伪造 ARP 应答把受害者与网关的通信流量引到攻击者网卡，从而截获同一网段数据。端口扫描（nmap 之类）、IP 地址伪装、ICMP 泛洪都不是其监听机制，故选 B。", "d": 0}, {"k": "y25linux", "s": 92, "t": "单选", "q": "通常在Linux下结束一个进程的命令是（ ）", "o": ["ps", "top", "nice", "kill"], "a": "D", "n": "【答案正确】结束进程使用 kill 向其发送信号（默认 SIGTERM，kill -9 发 SIGKILL 强制终止）；ps 仅查看进程，top 动态监控系统进程，nice 用于以指定优先级启动进程，均不负责结束进程，故选 D。", "d": 0}, {"k": "y25linux", "s": 93, "t": "多选", "q": "能够作为Linux根分区的分区类型是（    ）", "o": ["ext3", "ext2", "ntfs", "reiserfs"], "a": "ABD", "n": "【答案正确】根分区须是内核与安装程序支持的 Linux 本地文件系统：ext3、ext2 以及 reiserfs（RHL9/RHEL 时代安装器均提供）都可作根分区，ABD 完整；NTFS 属 Windows 文件系统，当年 Linux 内核仅有不完善的只读支持、不能作根分区，C 不选。✅集合恰为 {A,B,D}，无多选漏选。", "d": 0}, {"k": "y25linux", "s": 94, "t": "单选", "q": "通过shell执行一个命令，必须先敲入一个（ ）。", "o": ["参数", "命令", "操作符", "终端ID号"], "a": "B", "n": "【答案正确】shell 是命令解释器，用户通过 shell 执行操作必须先敲入命令（可执行程序名），其后才可跟参数、操作符（如管道、重定向）；参数/操作符/终端ID号都不能单独成为一条执行的起点，故选 B。", "d": 0}, {"k": "y25linux", "s": 95, "t": "单选", "q": "设超级用户root当前所在目录为:/usr/local,键入cd命令后,用户当前所在目录为（ ）", "o": ["/home", "/root", "/home/root", "/usr/local"], "a": "B", "n": "【答案正确】cd 不带参数等价于 cd ~，回到当前用户家目录；root 用户的家目录是 /root（普通用户为 /home/用户名）。故从 /usr/local 键入 cd 后位于 /root；/home/root 不符惯例，留在 /usr/local 则忽略了 cd 的默认行为，/home 是普通用户家目录基址，故选 B。", "d": 0}, {"k": "y25linux", "s": 96, "t": "判断", "q": "()进程可以作为一种软件资源长期保存", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】进程是程序的一次动态执行过程，具有“诞生—运行—消亡”的生命周期，随执行结束而消失，不能作为软件资源长期保存；能长期保存在外存中的是程序（静态的指令和数据集合）。题干混淆了进程与程序，判\"错误\"正确。", "d": 0}, {"k": "y25linux", "s": 97, "t": "单选", "q": "下列提法中，不属于ifconfig命令作用范围的是（ ）", "o": ["配置本地回环地址", "配置网卡的ip地址", "激活网络适配器", "加载网卡到内核"], "a": "D", "n": "【答案正确】ifconfig 的作用范围包括：配置本地回环地址 lo、配置网卡的 IP/掩码、用 up/down 激活或停用网络适配器；把网卡驱动加载进内核由内核模块机制完成（modprobe/insmod 装载驱动），不属于 ifconfig 的功能。故\"不属于\"应选 D。", "d": 0}, {"k": "y25linux", "s": 98, "t": "单选", "q": "用\"rm-i\"，系统会提示什么来让你确认()", "o": ["命令行的每个选项", "是否真的删除", "是否有写的权限", "文件的位置"], "a": "B", "n": "【答案正确】rm -i 是交互式删除，删除每个文件前逐一询问确认（提示“remove xxx?”），即问\"是否真的删除\"，回答 y 才执行删除；它不会确认命令选项、写权限或文件位置，故选 B。", "d": 0}, {"k": "y25linux", "s": 99, "t": "多选", "q": "Linux可以说是站在巨人肩膀上摘取的果实,“巨人”包括()", "o": ["UNIX", "GNU", "POSIX", "Internet"], "a": "ABCD", "n": "【答案正确】Linux 的诞生确实站在四个\"巨人\"肩上：设计思想与系统调用借鉴 UNIX（A），基础工具链 gcc/bash/make 来自 GNU 计划（B），遵循 POSIX 可移植操作系统接口标准保证跨平台兼容（C），Internet 提供了全球协作开发与分发代码的平台（D）。四项均为促成 Linux 的关键因素，ABCD 齐全，无多选漏选。", "d": 0}, {"k": "y25linux", "s": 100, "t": "判断", "q": "RedHat LINUX 安装时自动创建了根用户。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】RHEL 系的安装程序（anaconda）在安装过程中必定创建 root（根）用户，用户只需在\"设置根口令\"一步为其设定密码，root 账户本身由安装器自动建立，故\"安装时自动创建了根用户\"成立。", "d": 0}, {"k": "y25linux", "s": 101, "t": "单选", "q": "下列文件中，包含了主机名到IP地址的映射关系的文件是：（）", "o": ["/etc/HOSTNAME", "/etc/hosts", "/etc/resolv.conf", "/etc/networks"], "a": "B", "n": "【答案正确】/etc/hosts 是本地静态主机名映射表，记录\"IP地址 主机名 [别名]\"的对应关系；/etc/resolv.conf 只是 DNS 解析器配置（指定名称服务器与搜索域），/etc/HOSTNAME、/etc/networks 均非主机名到 IP 的映射文件，故选 B。", "d": 0}, {"k": "y25linux", "s": 102, "t": "判断", "q": "（ ）通常情况下，linux向进程传送的信号，将告诉系统内核按特殊的处理方法去处理额外的事件", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】信号是内核发送给\"进程\"的软件中断通知（对中断机制的软件模拟），收到信号的进程按已注册的方式（默认动作、捕获、忽略）自行处理事件，处理主体是进程而非\"系统内核\"；题干把处理主体说成内核，颠倒了信号机制的责任方，故判断为错误（选 B）。", "d": 0}, {"k": "y25linux", "s": 103, "t": "单选", "q": "Linux系统中,程序运行有若干优先级,最高的优先级是()", "o": ["18", "19", "-20", "-21"], "a": "C", "n": "【答案正确】Linux 的 nice 值取值范围为 -20～19，数值越小优先级越高，-20 是最高优先级（仅 root 可设置负值）；18、19 属较低优先级，-21 已超出 nice 取值范围不存在，故选 C。", "d": 0}, {"k": "y25linux", "s": 104, "t": "单选", "q": "在vi编辑器中的命令模式下,删除当前光标处的字符使用命令（ ）", "o": ["\u003cx>", "\u003cd>;\u003cw>", "\u003cD>", "\u003cd>;\u003cd>"], "a": "A", "n": "【答案正确】vi 命令模式下 x 删除光标所在处的一个字符；dw 删除一个单词、D（大写）删除光标至行尾、dd 删除整行，均不符合\"删除当前光标处的字符\"，故选 A。", "d": 0}, {"k": "y25linux", "s": 105, "t": "单选", "q": "在Linux系统中,输入（ ）命令会从/home/user1的当前目录中进入/etc目录下", "o": ["cdetc", "cd./etc", "cd/etc", "cd"], "a": "C", "n": "【答案正确】【题目缺陷】按出题意图 C 为 \"cd /etc\"（题面排版缺空格写成 cd/etc）。绝对路径方式与当前目录无关，从 /home/user1 可直接进入 /etc；cd ./etc 进入的是 /home/user1/etc（相对路径），cd 单独使用只返回家目录，均达不到目的，故 C 正确。", "d": 0}, {"k": "y25linux", "s": 106, "t": "单选", "q": "显示网络接口状态信息的命令是（ ）。", "o": ["netstat–i", "netstat–nr", "netstat–r", "netstat–n"], "a": "A", "n": "【答案正确】【题目缺陷】选项排版受限应为 \"netstat -i\" 等（连字符被导出为 –）。netstat -i 显示内核接口表即各网络接口的状态信息；-r 显示路由表，-nr 以数字形式显示路由表，-n 只是以数字格式显示地址与端口，故选 A。", "d": 0}, {"k": "y25linux", "s": 107, "t": "单选", "q": "下列哪个选项不是/etc/fstab文件中的字段()", "o": ["fs_spec", "fs_dump", "fs_type", "fs_out"], "a": "D", "n": "【答案正确】/etc/fstab 的六个字段为 fs_spec（设备）、fs_file（挂载点）、fs_vfstype（文件系统类型）、fs_mntops、fs_dump、fs_pass，其中没有 fs_out。fs_type 是对类型字段 fs_vfstype 的近似写法仍属 fstab 字段，fs_out 则完全不存在，故不属于 fstab 字段的是 D。", "d": 0}, {"k": "y25linux", "s": 108, "t": "单选", "q": "什么是CGI()", "o": ["一种后端动态程序", "一种ASP程序", "一种PHP程序", "一种后端程序接口"], "a": "D", "n": "【答案正确】CGI（Common Gateway Interface，通用网关接口）是 Web 服务器与后端应用程序之间的一套标准接口规范，本身不是某个具体程序；ASP、PHP 是可经 CGI 网关调用的具体动态程序技术，A 也把接口误说成程序，故\"一种后端程序接口\"最准确，选 D。", "d": 0}, {"k": "y25linux", "s": 109, "t": "判断", "q": "（ ）在shell命令行方式下,一行只能写一个指令,每次只能使用一个命令", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Shell 中一行可以写多条命令，用分号 ;、逻辑与 &&、逻辑或 ||、管道 | 等连接即可顺序或组合执行（如 ls; pwd），并非一行只能写一个指令，题述说法错误，选 B 正确。", "d": 0}, {"k": "y25linux", "s": 110, "t": "多选", "q": "openssl有众多子命令，主要分为（      ）三类。", "o": ["标准命令", "消息摘要命令", "加密命令", "生成用户密码命令"], "a": "ABC", "n": "【答案正确】openssl 子命令按功能分三类：标准命令（req、genrsa、s_client 等，A）、消息摘要命令（dgst、md5 等，B）、加密/编码命令（enc 及各对称加密算法，C）；\"生成用户密码命令\"不是 openssl 的分类（passwd 是系统命令且 openssl 不按此归类），ABC 恰为正确集合，无多选漏选。", "d": 0}, {"k": "y25linux", "s": 111, "t": "判断", "q": "完全删除/tmp下所有文件采用的命令是rm -rf /tmp", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】rm -rf /tmp 会连同 /tmp 目录本身一并删除，而 /tmp 目录必须保留（系统运行依赖），完全删除其下所有文件的正确写法是 rm -rf /tmp/*（递归删除目录内全部内容、保留目录本身），故题述命令的说法错误，判断为 B 正确。", "d": 0}, {"k": "y25linux", "s": 112, "t": "单选", "q": "在Linux中，进程优先级的相关参数有多个，与实时进程优先级相关的参数是()", "o": ["policy", "counter", "priority", "rt_priority"], "a": "D", "n": "【答案正确】老内核（2.4 时代 task_struct）与调度相关的参数有 policy（调度策略）、priority（静态优先级）、counter（剩余时间片）、rt_priority（实时进程优先级），其中实时进程的优先级正是由 rt_priority 决定，故选 D。【术语提示】此为老教材内核口径。", "d": 0}, {"k": "y25linux", "s": 113, "t": "单选", "q": "下面哪个syslog.conf代表httpd进程()", "o": ["httpd", "proc", "smtp", "daemon"], "a": "D", "n": "【答案正确】syslog.conf 中使用的是 syslog 预定义的 facility（kern、user、mail、daemon、auth、cron、local0-7 等），httpd 没有专属 facility，其日志默认归入 daemon（守护进程）设施；\"httpd\"\"proc\" 不能作 facility，smtp 只是邮件协议名，故选 D。", "d": 0}, {"k": "y25linux", "s": 114, "t": "判断", "q": "()Linux系统引导后，内核运行init程序，这个程序在处理任何其他规定的运行等级之后，再运行/ec/rc.d/rc.sysinit脚本", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】RHEL 系 SysV 启动流程中，内核加载 init 后先执行 /etc/rc.d/rc.sysinit 完成系统初始化（挂载文件系统、设置主机名、激活交换分区等），之后才按 /etc/inittab 进入各运行级别执行 rc\u003c级别>.d 脚本；题干把顺序说反（先处理运行等级再运行 rc.sysinit），且 \"/ec\" 应为 \"/etc\"，故判断为错误，选 B。", "d": 0}, {"k": "y25linux", "s": 115, "t": "单选", "q": "不需要编译内核的情况是()", "o": ["删除系统不用的设备驱动程序时", "升级内核时", "添加新硬件时", "将网卡激活"], "a": "D", "n": "【答案正确】删除不用的设备驱动、升级内核、添加新硬件都可能需要重新编译内核或配置内核模块；而将网卡激活只是用 ifconfig/ifup 启用已加载驱动支持的网络设备，属运行时操作，不涉及内核编译，故选 D。", "d": 0}, {"k": "y25linux", "s": 116, "t": "单选", "q": "下面哪个文件代表系统初始化信息（ ）。", "o": ["/etc/inittab", "/etc/init", "/etc/proc", "/etc/initproc"], "a": "A", "n": "【答案正确】/etc/inittab 是 init 的配置文件，定义默认运行级别及各运行级别要执行的脚本，是 RHEL5/6（SysV init 口径）的系统初始化信息文件；【版本差异】RHEL7 起改用 systemd，inittab 已废弃，本题按老教材口径成立。/etc/init、/etc/proc、/etc/initproc 均非初始化配置文件，故选 A。", "d": 0}, {"k": "y25linux", "s": 117, "t": "多选", "q": "Linux操作系统结构组成包括()", "o": ["Linux内核", "Linux Shell", "Linux文件系统", "Linux应用程序"], "a": "ABCD", "n": "【答案正确】Linux 操作系统由四部分组成：内核（管理硬件与系统资源）、Shell（命令解释与用户接口）、文件系统（组织与存取数据）、应用程序（各类工具软件），ABCD 齐全无多选漏选。", "d": 0}, {"k": "y25linux", "s": 118, "t": "单选", "q": "下面哪个选项用来添加用户定义用户登录的shell()", "o": ["-s", "-u", "-l", "-sh"], "a": "A", "n": "【答案正确】useradd 的 -s 选项用于指定新用户的登录 shell（如 useradd -s /sbin/nologin user1）；-u 指定 UID，-l、-sh 均不是 useradd 定义登录 shell 的合法选项，故选 A。", "d": 0}, {"k": "y25linux", "s": 119, "t": "单选", "q": "系统管理常用的二进制文件,一般放置在( )目录下", "o": ["sbin", "root", "usr/bin", "/boot"], "a": "A", "n": "【答案正确】/sbin（及 /usr/sbin）存放系统管理员使用的管理类二进制命令（fdisk、ifconfig、shutdown 等）；/bin、/usr/bin 是普通用户常用命令，/root 是 root 的家目录，/boot 存放内核与引导文件，故选 A。", "d": 0}, {"k": "y25linux", "s": 120, "t": "单选", "q": "在vi编辑器里，命令\"dd\"用来删除当前的（ ）。", "o": ["行", "变量", "字", "字符"], "a": "A", "n": "【答案正确】vi 命令模式中 dd 删除光标所在的整行（数字+dd 删除多行，如 3dd 删三行）；x 删单个字符、dw 删单词，故\"dd 用来删除当前的行\"选 A 正确。", "d": 0}, {"k": "y25linux", "s": 121, "t": "单选", "q": "在RedHatLinux9中,系统默认的（）用户对整个系统拥有完全的控制权", "o": ["root", "guest", "administrator", "supervistor."], "a": "A", "n": "【答案正确】RedHat Linux 默认的超级管理员是 root（UID=0），对整个系统拥有完全控制权；guest 是受限访客账户，administrator、supervisor 是 Windows 等其他系统的称谓而非 Linux 默认用户，故选 A。", "d": 0}, {"k": "y25linux", "s": 122, "t": "判断", "q": "（ ）在Linux操作系统中,设备都是通过特殊的命令来访问", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Linux 中所有设备都表现为 /dev 目录下的设备文件（块设备/字符设备文件），应用程序通过读写这些\"特殊文件\"访问设备，设备访问的是文件接口而非\"特殊的命令\"，题述说法错误，选 B 正确。", "d": 0}, {"k": "y25linux", "s": 123, "t": "判断", "q": "在当前目录下,可以用touch指令刷新文件的时间标签", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】touch 的功能就是更新文件的访问时间和修改时间（时间标签）为当前时间，文件不存在时才创建空文件；对当前目录已有文件执行 touch 即可刷新其时间标签，故说法正确。", "d": 0}, {"k": "y25linux", "s": 124, "t": "单选", "q": "下面那个命令允许对文件重命名（ ）。", "o": ["rn", "rname", "replace", "mv"], "a": "D", "n": "【答案正确】mv 既可移动文件又可在移动目标处改名（mv 旧文件名 新文件名），是标准的重命名命令；rn、rname、replace 都不是 Linux 中的重命名命令，故选 D。", "d": 0}, {"k": "y25linux", "s": 125, "t": "判断", "q": "()Linux系统使用nice值表示任务的优先级别，拥有负的nice值的任务优先级别较高", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Linux 用 nice 值表示进程的优先级别，取值 -20～19，nice 值越小（负值）优先级越高、越少让出 CPU，题述\"拥有负的 nice 值的任务优先级别较高\"成立。", "d": 0}, {"k": "y25linux", "s": 126, "t": "单选", "q": "指定Samba服务器是否接受加密密码的配置选项是（ ）", "o": ["serverstring", "passwdlevel", "security", "encryptpasswords"], "a": "D", "n": "【答案正确】【题目缺陷】选项排版缺空格，应为 \"encrypt passwords\"。smb.conf 中 encrypt passwords = yes/no 决定 Samba 是否使用（接受）加密密码与客户端协商认证；server string 仅是服务器描述信息，passwd level 用于旧式明文口令的大小写尝试，security 指定安全验证模式（share/user/domain 等），故选 D。", "d": 0}, {"k": "y25linux", "s": 127, "t": "单选", "q": "通过修改文件()可以设定开机时候自动挂载的文件系统", "o": ["/etc/mtab", "/etc/fastboot", "/etc/fstab", "/etc/inetD.conf"], "a": "C", "n": "【答案正确】/etc/fstab 记录设备—挂载点—文件系统类型—挂载选项的对应关系，开机时由系统按其内容自动挂载；/etc/mtab 只记录当前实际已挂载的文件系统，/etc/fastboot、/etc/inetd.conf 与开机挂载无关，故选 C。", "d": 0}, {"k": "y25linux", "s": 128, "t": "多选", "q": "下面关于linux描述正确的是（ ）。", "o": ["1代表是可执行权限", "linux可运行级别有6个", "apache server 是目前用的最多的web server", "linux是自由软件"], "a": "ACD", "n": "【答案正确】数字权限中 1 即执行位 x（r=4、w=2、x=1），A 正确；Apache 曾长期是市场份额第一的 Web 服务器，老教材口径下 C 成立（【版本差异】近年 Netcraft 统计 nginx 已居首，按教材判正确）；Linux 是自由软件，D 正确；B 错误——Linux 运行级别为 0～6 共 7 个而非 6 个。故 ACD 恰为正确集合。", "d": 0}, {"k": "y25linux", "s": 129, "t": "单选", "q": "Linux文件系统中查找文件目录可以使用的命令有（ ）", "o": ["where", "grep", "whereis", "whois"], "a": "C", "n": "【答案正确】四个命令中只有 whereis 用于在文件系统标准目录中定位命令的二进制、源码与手册页；grep 按内容匹配文件行而非查找文件目录，where 不是 Linux 标准命令（csh 内建），whois 查询域名注册信息，故单选 C。", "d": 0}, {"k": "y25linux", "s": 130, "t": "单选", "q": "下面哪条命令可以显示交换内存（ ）。", "o": ["showmem", "freemem", "swap", "free"], "a": "D", "n": "【答案正确】free 输出物理内存与交换分区（Swap）的总量、已用和空闲情况；showmem、freemem 不是标准命令，swapon/swapoff 只用于启停交换分区而不显示信息，故选 D。", "d": 0}, {"k": "y25linux", "s": 131, "t": "单选", "q": "在Linux中有关于hosts文件的解释错误的是()", "o": ["hosts文件中包含IP地址和主机名称的映射", "hosts文件中包含主机名的别名", "hosts是Linux系统中一个负责IP地址与域名快速解析的文件", "hosts文件中无IP地址"], "a": "D", "n": "【答案正确】/etc/hosts 记录 IP 地址与主机名（含别名）的映射，负责本地 IP 与域名的快速解析，A/B/C 表述均正确；D \"hosts 文件中无 IP 地址\"与该文件的本质相悖，属错误解释。题目问\"解释错误的是\"，故选 D 正确。", "d": 0}, {"k": "y25linux", "s": 132, "t": "单选", "q": "Linux单用户模式主要用于（ ）", "o": ["进行系统维护", "重建操作系统", "安装硬件", "编译程序"], "a": "A", "n": "【答案正确】单用户模式下系统只允许 root 单用户登录、不启动网络和多数服务，主要用于系统维护（修复文件系统、重置 root 密码等）；重建操作系统、安装硬件、编译程序均非其用途，故选 A。", "d": 0}, {"k": "y25linux", "s": 133, "t": "多选", "q": "以下属于多用户的网络操作系统的是？", "o": ["Kylin", "ubuntu", "windows", "centos", "dos"], "a": "ABCD", "n": "【答案正确】麒麟（Kylin）、Ubuntu、CentOS 均为多用户多任务网络操作系统，Windows NT 系列同样支持多用户网络应用，ABCD 正确；而 DOS 是单用户单任务操作系统，不属于多用户网络操作系统，E 必须排除。✅集合 ABCD 恰为正确集合。", "d": 0}, {"k": "y25linux", "s": 134, "t": "判断", "q": "（ ）对于SMP(对称多处理机)的CPU性能监视来说,我们可以用vmstat命令得到每个CPU的工作负荷情况", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】vmstat 输出的是整个系统的汇总统计（进程、内存、交换、IO、CPU 均为全局平均值），不能按 SMP 的每个 CPU 分别显示负荷；查看每 CPU 负荷需用 mpstat -P ALL 等工具，故题述说法错误，选 B 正确。", "d": 0}, {"k": "y25linux", "s": 135, "t": "判断", "q": "集群中的每个Pod都有自己唯一的集群范围的IP地址。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Kubernetes 的网络模型规定：集群中每个 Pod 都被分配一个集群范围唯一、各节点可直接互通的 IP 地址（Pod 迁移后 IP 会变化，但任一时刻唯一），故该说法正确。", "d": 0}, {"k": "y25linux", "s": 136, "t": "单选", "q": "命令可以从文本文件的每一行中截取指定内容的数据（ ）", "o": ["cp", "dd", "fmt", "cut"], "a": "D", "n": "【答案正确】cut 按 -c（字符位置）或 -d/-f（分隔符+字段）从文本的每一行截取指定内容；cp 是复制文件，dd 按块复制转换，fmt 做段落排版，均不具备按行截取字段的功能，故选 D。", "d": 0}, {"k": "y25linux", "s": 137, "t": "单选", "q": "（ ）是字符设备", "o": ["hdc", "fd0", "hda1", "打印机"], "a": "D", "n": "【答案正确】打印机对应 /dev/lp0 等字符设备（按字节流顺序存取）；hdc（IDE 磁盘）、fd0（软盘）、hda1（磁盘分区）均属按块随机存取的块设备，故字符设备只有打印机，选 D。", "d": 0}, {"k": "y25linux", "s": 138, "t": "单选", "q": "在vi编辑环境下,使用Esc键可以", "o": ["退出编辑模式", "关闭编辑窗口", "转换模式", "切换窗口"], "a": "C", "n": "【答案正确】vi 有命令模式、插入（编辑）模式、末行模式三种工作模式，Esc 键的作用是从编辑（插入）模式转换回命令模式，本题标准表述即\"转换模式\"，选 C。A\"退出编辑模式\"与 C 实为同一效果的不同措辞，单选按教材规范表述以 C 为准（A 措辞易误解为退出 vi 编辑器）。", "d": 0}, {"k": "y25linux", "s": 139, "t": "单选", "q": "IO端口的分配在（ ）文件中", "o": ["/proc/ioports", "/dev/IOstat", "/dev/ports", "/etc/IOstat"], "a": "A", "n": "【答案正确】/proc 是内核虚拟文件系统，/proc/ioports 记录系统中已分配的 I/O 端口地址范围；/dev/IOstat、/dev/ports、/etc/IOstat 均为杜撰路径不存在，故选 A。", "d": 0}, {"k": "y25linux", "s": 140, "t": "判断", "q": "（ ）Linux是运行于多种平台(PC工作站等)之上源代码不公开遵循GPL精神遵守POSIX标准的与Unix兼容的操作系统", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Linux 可运行于多种平台、遵循 GPL、遵守 POSIX 标准、与 Unix 兼容，但其源代码是公开的（开放源代码是 Linux 的本质属性），题干\"源代码不公开\"与事实相悖，整句判断错误，选 B 正确。", "d": 0}, {"k": "y25linux", "s": 141, "t": "单选", "q": "Sendmail程序属于邮件处理流程中的()部分", "o": ["MUA", "MTA", "MIME", "MX"], "a": "B", "n": "【答案正确】Sendmail 是老牌邮件传输代理（Mail Transfer Agent），负责邮件的路由与服务器间传送，属 MTA；MUA 是用户端收发信件程序（mail、Outlook），MIME 是邮件多媒体内容格式标准，MX 是 DNS 邮件交换记录，故选 B。", "d": 0}, {"k": "y25linux", "s": 142, "t": "单选", "q": "关于进程调度命令，以下（）是不正确的at--定期执行程序的调度命令", "o": ["当日晚11点执行clear命令，使用at命令：at23：00todayclear", "每年1月1日早上6点执行date命令，使用at命令：at6amJan1date", "每日晚11点执行date命令，crontab文件中应为：023***date", "每小时执行一次clear命令，crontab文件中应为：0*/1***clear"], "a": "B", "n": "【答案正确】at 是一次性定时执行工具，无法实现\"每年1月1日早上6点\"这种周期性任务，该需求必须用 crontab（如 0 6 1 1 * date），故 B 说法不正确、正是应选项。【题目缺陷】选项因排版丢失空格，A 实为 at 23:00 today 后接 clear，C 实为 crontab 项 0 23 * * * date（每日 23:00），D 实为 0 */1 * * * clear（每小时执行），三者用法均正确，唯 B 错。", "d": 0}, {"k": "y25linux", "s": 143, "t": "单选", "q": "提供了主机名与IP地址间映射的文件是（）。", "o": ["/etc/hosts", "/etc/network", "/etc/sysconfig/network", "/etc/host"], "a": "A", "n": "【答案正确】/etc/hosts 提供主机名到 IP 地址的静态映射；/etc/host 不是标准文件，/etc/network 不存在，/etc/sysconfig/network 只保存主机名、网关等全局网络参数而不含映射关系，故选 A。", "d": 0}, {"k": "y25linux", "s": 144, "t": "多选", "q": "Linux系统中的设备的类型包括：（ ）", "o": ["块设备", "字符设备", "流设备", "缓冲设备"], "a": "AB", "n": "【答案正确】Linux 按数据存取方式将设备分为块设备（磁盘类，按块随机存取，A）和字符设备（终端、打印机类，按字节流顺序存取，B）两大类型；\"流设备\"是 System V STREAMS 机制、\"缓冲设备\"不是设备类型划分，CD 不选。AB 恰为正确集合。", "d": 0}, {"k": "y25linux", "s": 145, "t": "判断", "q": "()在设置文件许可值时,我们发现一个文件的许可值为2755,这说明该文件设置了set-UID位", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】四段权限的首位是特殊位：4=setuid、2=setgid、1=sticky。2755 的首位 2 表示设置了 set-GID 位（set-UID 位应为 4755），故\"设置了 set-UID 位\"的判断错误，选 B 正确。", "d": 0}, {"k": "y25linux", "s": 146, "t": "单选", "q": "FTP服务器的主配置文件（ ）。", "o": ["/etc/vsftpd/vsftpd.conf", "/etc/vsftpd/conf", "/etc/ftp/ftpd.conf", "/etc/ftp.conf"], "a": "A", "n": "【答案正确】RHEL/CentOS 上 vsftpd 的主配置文件为 /etc/vsftpd/vsftpd.conf；/etc/vsftpd/conf、/etc/ftp/ftpd.conf、/etc/ftp.conf 均非其配置文件路径，故选 A。", "d": 0}, {"k": "y25linux", "s": 147, "t": "单选", "q": "普通用户zhangsan希望使用sudo命令以lisi用户身份执行程序，需要提供（ ）用户的密码", "o": ["root", "zhangsan", "lisi", "system"], "a": "B", "n": "【答案正确】sudo 默认要求输入的是\"发起命令的当前用户\"自己的密码，即 zhangsan 的密码（仅当 sudoers 配置 rootpw/targetpw 等参数时才改为验证 root 或目标用户密码），并非 lisi 或 root 的密码，故选 B。", "d": 0}, {"k": "y25linux", "s": 148, "t": "判断", "q": "Ansible是基于Python开发的自动化运维软件工具，基于SSH远程管理服务实现以并行的方式对主机进行批量管理；", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Ansible 由 Michael DeHaan 用 Python 开发，通过 SSH（早期连接层用 paramiko，现默认 OpenSSH）连接受管主机，依靠 fork 并发进程实现并行批量管理，Playbook/Ad-hoc 均面向成批主机。题干三点都对，故判\"正确\"。", "d": 0}, {"k": "y25linux", "s": 149, "t": "单选", "q": "Linux系统中新创建一个用户，默认的用户目录在（ ）", "o": ["/home/*", "/", "/var/home", "/usr/*"], "a": "A", "n": "【答案正确】RHEL/CentOS 用 useradd 新建用户时，默认在 /home 下创建与用户名同名的主目录（/etc/login.defs 中 HOME=/home）。/var/home 仅个别发行版（如 Silverblue）使用，/usr/* 是系统目录树，/ 根目录不是新用户默认家目录位置。", "d": 0}, {"k": "y25linux", "s": 150, "t": "单选", "q": "在RHEL5系统中，squid.conf文件中的()配置行将允许通过代理下载的文件大小限制为最多8MB，超过该限制的文件用户将无法访问", "o": ["maximum_object_size8092KB", "reply_body_max_size8192000allowall", "cache_mem8MB", "cache_dirufs/var/spool/squid816256"], "a": "B", "n": "【答案正确】reply_body_max_size 限制客户端经代理可下载的 HTTP 响应体最大字节数，超过即拒绝下载，正合题意\"超过限制用户将无法访问\"（排版应为 reply_body_max_size 8192000 allow all）。maximum_object_size 8092KB 只决定超过该大小的对象是否缓存、不影响能否访问；cache_mem 是内存缓存空间；cache_dir 是磁盘缓存目录配置，均非下载限速/限量指令。数值口径：教材把 8MB 写作 8192000（8192×1000），严格字节口径 8MiB=8388608，squid 也支持\"8 MB\"写法。", "d": 0}, {"k": "y25linux", "s": 151, "t": "判断", "q": "（ ）shell中可使用alias命令定义别名", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】alias 是 bash 等 shell 的内建命令，用于定义命令别名，如 alias ll='ls -l'，取消用 unalias，写入 ~/.bashrc 可持久生效。题目说法正确。", "d": 0}, {"k": "y25linux", "s": 152, "t": "多选", "q": "Kubernetes的service类型有", "o": ["ClusterIP", "LoadBalancer", "NodePort", "ExternalName"], "a": "ABCD", "n": "【答案正确】Kubernetes Service 官方类型正是这四种：ClusterIP（默认，集群内虚拟 IP）、NodePort（每个节点开静态端口）、LoadBalancer（对接云负载均衡器）、ExternalName（返回 DNS CNAME 指向外部服务）。A 项 ClusterIP 是最常用的默认类型，四项全选无误。", "d": 0}, {"k": "y25linux", "s": 153, "t": "单选", "q": "Links分为硬链接和", "o": ["软链接", "系统链接", "文件链接", "符号链接"], "a": "D", "n": "【答案存疑】【概念争议】链接分为硬链接和符号链接（symbolic link），而\"软链接\"正是符号链接的中文别名，选项 A（软链接）与 D（符号链接）是同一概念的不同译名，两个选项都正确，导致题目出现同义干扰项，无法判定唯一答案。参考答案 D 沿用英文原文 hard link / symbolic link 的对举译法，可以辩护，但按大陆多数教材（硬链接/软链接）口径 A 同样成立，属题目缺陷。", "d": 1}, {"k": "y25linux", "s": 154, "t": "单选", "q": "在DNS中定义了不同类型的记录，但常用的不到10种，IPv6又增加了几种试问下列哪条记录属于IPv6的（）", "o": ["SOA", "NS", "A", "AAAA"], "a": "D", "n": "【答案正确】AAAA 记录是 IPv6 专用地址记录（128 位 IPv6 地址写成四组十六进制，故为四个 A）；A 记录对应 IPv4 地址，SOA（授权起始）和 NS（名称服务器）记录与 IP 协议版本无关且在 IPv4 时代即存在。", "d": 0}, {"k": "y25linux", "s": 155, "t": "单选", "q": "当字符串用单引号括起来时，SHELL将()", "o": ["解释引号内的特殊字符", "执行引号中的命令", "不解释引号内的特殊字符", "结束进程"], "a": "C", "n": "【答案正确】单引号是强引用，其内所有字符按字面处理，shell 不做变量替换、命令替换和通配符展开，即\"不解释引号内的特殊字符\"。双引号（弱引用）才解释 $、` 等特殊字符；\"执行引号中的命令\"需用 $() 或反引号；与结束进程无关。", "d": 0}, {"k": "y25linux", "s": 156, "t": "单选", "q": "Linux系统通过命令给其他用户发消息（ ）", "o": ["less", "mesgy", "write", "echoto"], "a": "C", "n": "【答案正确】write 用户名 [终端号] 是经典的终端通信命令，可向同一系统上其他在线用户实时发消息（mesg y 只是开放/关闭本终端接收他人消息的权限，不是发送命令）；less 是分页查看工具，不存在 echoto 命令（echo 只回显，不能定向给用户）。", "d": 0}, {"k": "y25linux", "s": 157, "t": "单选", "q": "在下列分区中,Linux默认的分区是()", "o": ["FAT32", "EXT3", "FAT", "NTFS"], "a": "B", "n": "【答案正确】【版本差异】本题按老教材（RHEL5 时代）口径：Linux 默认文件系统为 ext3。版本演进为 RHEL6 默认 ext4、RHEL7 起默认 xfs，但本题选项中 FAT/FAT32/NTFS 均是 Windows 文件系统，\"Linux 默认分区（文件系统）\"只能是 EXT3，判 B。", "d": 0}, {"k": "y25linux", "s": 158, "t": "判断", "q": "()在/etc/fstab中的文件系统可以在系统启动的时候自动加载", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】/etc/fstab 中记录的文件系统在开机阶段由 mount -a 依此挂载，实现自动加载，除非该行加了 noauto 挂载选项。这是 fstab 文件的基本用途，说法正确。", "d": 0}, {"k": "y25linux", "s": 159, "t": "判断", "q": "ansible是基于 paramiko 开发的,并且基于模块化工作，本身没有批量部署的能力。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】该说法的后半句错误：Ansible 恰恰是面向批量（并行）自动化部署与配置管理的工具，借助 Inventory 成批管理主机、以 Playbook 批量下发模块化任务。前半句\"基于 paramiko 开发\"符合早期版本口径（现默认 OpenSSH 连接），但整体表述因\"本身没有批量部署的能力\"不成立，故判\"错误\"。", "d": 0}, {"k": "y25linux", "s": 160, "t": "单选", "q": "虚拟主机服务就是指将一台机器虚拟成多台WEB服务器Apache设置虚拟主机服务可以采用基于IP地址的虚拟主机和（）", "o": ["基于MAC地址的虚拟主机", "基于HTTP的虚拟主机", "基于域名的虚拟主机", "基于代理服务的虚拟主机"], "a": "C", "n": "【答案正确】Apache 虚拟主机的经典分类为基于 IP 地址和基于域名两类：基于域名的虚拟主机在同一 IP 上依靠请求的 Host 头区分不同站点（NameVirtualHost/*:80）。其余选项——基于 MAC 地址、基于 HTTP、基于代理服务的虚拟主机均不是 Apache 的虚拟主机实现方式。", "d": 0}, {"k": "y25linux", "s": 161, "t": "单选", "q": "/etc/hosts.conf文件中（ ）参数项指定主机名字查找顺序", "o": ["order", "multi", "sorlit", "dns"], "a": "A", "n": "【答案正确】order 参数指定主机名解析（查找）顺序，如 order hosts,bind 表示先查 /etc/hosts 再查 DNS；multi 定义 hosts 中一个 IP 是否可对应多个主机名。术语提示：该文件规范名为 /etc/host.conf（题干写成 hosts.conf 属小瑕疵），现代发行版该功能由 /etc/nsswitch.conf 控制；\"sorlit\"为拼写错乱的无意义干扰项。", "d": 0}, {"k": "y25linux", "s": 162, "t": "多选", "q": "LINUX系统中的随机数有两种方式：/dev/random 和 /dev/urandom,他们都是control熵池中取数，熵池中随机数的来源是（    ）。", "o": ["利用软件生成的随机数", "硬盘中IO中断的时间间隔", "键盘中IO中断的时间间隔", "其他设备产生随机数"], "a": "BC", "n": "【答案正确】内核熵池依靠硬件事件到达时刻的不可预测抖动收集熵，磁盘 I/O 中断与键盘中断的时间间隔是经典熵源，故 B、C 均入选。A 错在\"软件生成的随机数\"属伪随机数、本身需要熵池提供种子而非熵来源；D 表述也不准确——设备贡献的是事件发生的时刻信息，并非设备直接\"产生随机数\"。", "d": 0}, {"k": "y25linux", "s": 163, "t": "判断", "q": "()有两个文件A和B，A有内容，现在执行catA>>B，则B文件内容全部删除", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】>> 是追加重定向，cat A >> B 把 A 的内容追加到 B 的末尾，B 原内容完整保留，不会\"全部删除\"，故命题错误。对比：若写 cat A > B，则 B 先被清空再写入 A 的内容（覆盖），那是覆盖而非本题话术；无论哪种都不存在\"B 内容全部删除且不写入\"的情形。", "d": 0}, {"k": "y25linux", "s": 164, "t": "单选", "q": "远程桌面服务中，服务器与客户端通信的端口是（ ）。", "o": ["5900+编号", "6100+编号", "6300+编号", "5700+编号"], "a": "A", "n": "【答案正确】Linux 的 VNC 远程桌面监听端口规则为 5900+显示编号，如 :1 对应 5901、:2 对应 5902。其余 6100/6300/5700+编号都不是 VNC 的约定（X11 端口是 6000+n，与本题口径不同）。", "d": 0}, {"k": "y25linux", "s": 165, "t": "单选", "q": "Linux最多可以同时接受（ ）个终端登陆", "o": ["3", "6", "8", "12"], "a": "B", "n": "【答案正确】老教材经典口径：Linux 默认提供 tty1~tty6 共 6 个虚拟控制台，故最多同时接受 6 个终端登录（tty7 一般留给 X 图形会话，Alt+F1~F6 切换）。版本差异：现代系统可用登录/伪终端数量可通过配置调整，但本题按经典口径判 6。", "d": 0}, {"k": "y25linux", "s": 166, "t": "单选", "q": "WWW服务器是在Internet上使用最为广泛，它采用的是结构（ ）", "o": ["服务器/工作站", "B/S", "集中式", "分布式"], "a": "B", "n": "【答案正确】WWW 是 Internet 上应用最广的服务，采用 B/S（Browser/Server，浏览器/服务器）结构：客户端只需浏览器，通过 HTTP 与 Web 服务器交互，无需安装专用客户端软件。\"服务器/工作站\"\"集中式\"均不是其标准结构称谓。", "d": 0}, {"k": "y25linux", "s": 167, "t": "单选", "q": "RPM设计目的不包括（）", "o": ["方便的升级功能", "强大的查询功能", "系统校验", "优化Linux系统"], "a": "D", "n": "【答案正确】RPM 的设计目的包括：便捷的安装/升级功能、强大的查询功能（rpm -q/-qi/-ql 等）、系统校验（rpm -V 验证文件是否被改动）以及易卸载、便于源码打包等；\"优化 Linux 系统\"属于系统性能调优范畴，不是 RPM 的设计目标，故选 D。", "d": 0}, {"k": "y25linux", "s": 168, "t": "多选", "q": "Rocky Linux 9.2 正式发布，带来了哪些改变（）", "o": ["桌面版新增 Cinnamon 版本 (号称替代 GNOME 3)。", "运维关注的几个点: Nginx 1.22、PostgreSQL 15、Python 3.11、Grafana 9.0.9 软件可用。", "Podman 功能增强，包括: 系统角色、事件审计等。", "CNI 网络堆栈已被弃用。"], "a": "ABCD", "n": "【答案正确】按 Rocky Linux 9.2（对应 RHEL 9.2 基座）发布信息逐项核：桌面镜像新增 Cinnamon 版本；应用流提供 Nginx 1.22、PostgreSQL 15、Python 3.11、Grafana 9.0.9；Podman 功能增强包含系统角色（System Role）与事件审计；同时声明弃用 CNI 网络堆栈、转向 Netavark（自 RHEL9 以来 Netavark 为默认后端）。四条均属实，四选全对。", "d": 0}, {"k": "y25linux", "s": 169, "t": "单选", "q": "“lilo”程序是指()", "o": ["查看开机的程序", "一种安装核心加载,开机管理的程序", "关机程序", "网络除错程序"], "a": "B", "n": "【答案正确】LILO（Linux Loader）是早期的引导装载程序，安装后驻留引导扇区，负责装入（加载）Linux 内核并移交控制权、支持多系统引导，即\"安装核心加载、开机管理的程序\"。版本差异：LILO 现已基本被 GRUB/GRUB2 取代，但按老口径本题正确。", "d": 0}, {"k": "y25linux", "s": 170, "t": "单选", "q": "通常Linux支持的网卡类型不包括:（ ）", "o": ["令牌网卡", "以太网卡", "PCMCIA", "PS/2"], "a": "D", "n": "【答案正确】PS/2 是键盘、鼠标接口，不是网卡类型；历史上 Linux 支持的网卡包括以太网卡、令牌环（Token Ring）网卡以及笔记本 PCMCIA 接口网卡等。故\"不包括\"选 D。", "d": 0}, {"k": "y25linux", "s": 171, "t": "判断", "q": "（ ）在进行网络配置时,netstat命令用于测试网络中主机之间是否连通", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】netstat 用于查看网络连接状态、路由表、接口统计等信息，不能测试主机间连通性；测试连通性用 ping（或 traceroute 定位路径）。命题把 netstat 说成连通性测试工具，说法错误，故选\"错误\"。", "d": 0}, {"k": "y25linux", "s": 172, "t": "单选", "q": "当我们与某远程网络连接不上时，就需要跟踪路由查看，以便了解在网络的什么位置出现了问题，满足该目的的命令是（ ）", "o": ["ping", "ifconfig", "traceroute", "netstat"], "a": "C", "n": "【答案正确】traceroute 发送 TTL 逐次递增的探测包，逐跳返回途经路由器地址，用于排查链路哪一跳出问题；ping 只能确认是否可达，ifconfig 管理网络接口，netstat 查看连接与路由统计，都不满足\"跟踪路由\"的目的。", "d": 0}, {"k": "y25linux", "s": 173, "t": "单选", "q": "iptables过滤器表包含3个默认链,找出选项中不包含的那个链()", "o": ["FORWARD", "INPUT", "OUTPUT", "PREROUTING"], "a": "D", "n": "【答案正确】iptables 的 filter 表内置三条链：INPUT（入本机）、OUTPUT（本机出）、FORWARD（转发）；PREROUTING/POSTROUTING 属于 nat、mangle 表。故 filter 表不包含的链是 PREROUTING，选 D。", "d": 0}, {"k": "y25linux", "s": 174, "t": "判断", "q": "Docker 是一个用于开发，交付和运行应用程序的开放平台。Docker 使您能够将应用程序与基础架构分开，从而可以快速交付软件。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】该句是 Docker 官方定义原文：Docker 是用于开发、交付和运行应用程序的开放平台，通过容器把应用与基础架构解耦，从而实现软件的快速交付、测试和部署，说法正确。", "d": 0}, {"k": "y25linux", "s": 175, "t": "单选", "q": "vi中哪条命令是不保存强制退出（ ）(第五章)。", "o": ["：wq", "：wq!", "：q!", "：quit"], "a": "C", "n": "【答案正确】:q! 不保存修改并强制退出，符合题意。:wq 与 :wq! 都会写盘保存（后者强制覆盖只读/权限受限文件），:quit 是 :q 的长写法、改动过缓冲区时会被拒绝退出，并非\"不保存强制退出\"。", "d": 0}, {"k": "y25linux", "s": 176, "t": "判断", "q": "（ ）pop3使用的tcp端口为100", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】POP3 使用 TCP 110 端口（加密版 POP3S 为 995），不是 100，故\"pop3 使用的 tcp 端口为 100\"命题错误，选\"错误\"。常见易混端口：SMTP 25、HTTP 80、FTP 20/21。", "d": 0}, {"k": "y25linux", "s": 177, "t": "单选", "q": "下列说法错误的是()", "o": ["apache可以实现模块动态加载", "apache的核心模块是不可以卸载的", "实现用户主页的模块mod_userdir.so", "apache核心配置文件是www.conf"], "a": "D", "n": "【答案正确】Apache 核心配置文件是 /etc/httpd/conf/httpd.conf（Debian 系为 apache2.conf），不存在 www.conf，D 说法错误，正是本题要选的\"错误\"说法。A DSO 机制确实支持模块动态加载（LoadModule）；B 编译进 httpd 二进制的核心模块不可卸载；C mod_userdir.so 提供基于 UserDir 的用户个人主页功能，三条均正确。", "d": 0}, {"k": "y25linux", "s": 178, "t": "单选", "q": "如果想配置一台匿名ftp服务器，应修改文件（ ）", "o": ["/etc/gateway", "/etc/ftpservers", "/etc/ftpusers", "/etc/inetd.conf"], "a": "C", "n": "【答案正确】按老口径（inetd/wu-ftpd 时代）：/etc/ftpusers 控制 FTP 登录账户的许可/禁用，配置匿名 FTP 服务时要围绕 ftp 匿名账户维护该文件，是四个选项中唯一与 FTP 账户控制相关的文件；/etc/gateway 与网关/路由配置有关，/etc/ftpservers 并非通用文件，/etc/inetd.conf 只负责超级守护进程的服务开关、与\"匿名\"语义无关。版本差异：现代 vsftpd 改在 /etc/vsftpd/ 下配置（user_list、ftpusers 经 PAM 继续生效）。", "d": 0}, {"k": "y25linux", "s
