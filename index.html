], "a": "ABC", "n": "PermitRootLogin no 禁止 root 直登、改用公钥认证可抵御口令爆破、配合复杂密码策略增强口令安全，三项均为常见 SSH 加固手段；SSH 调试模式（sshd -d）用于排障、会增加信息暴露面，无益于安全，D 不选。ABC 正确。", "d": 0}, {"k": "y25sec", "s": 206, "t": "多选", "q": "在SSH连接出现问题时，以下哪些是常见的故障排除方法？", "o": ["检查网络连接是否正常", "检查SSH服务是否启动", "检查SSH配置文件是否正确", "重启计算机"], "a": "ABC", "n": "SSH 排障的规范路径：先查网络连通性和 22 端口可达性，再查 sshd 服务状态（systemctl status sshd），再核对 /etc/ssh/sshd_config 配置语法；直接重启计算机不是常规故障排除方法。ABC 正确。", "d": 0}, {"k": "y25sec", "s": 207, "t": "单选", "q": "在Linux系统中，下列哪个命令可以用于将本地目录与远程目录同步？", "o": ["rsync", "scp", "ftp", "wget"], "a": "A", "n": "【答案正确】与本分片第 195 题完全重复：rsync 基于增量算法做目录镜像，可经 ssh 在本地与远程之间同步；scp 只能整份复制，ftp 无同步语义，wget 只能下载，故选 A。", "d": 0}, {"k": "y25sec", "s": 208, "t": "单选", "q": "下列哪个选项是配置SSH服务的默认端口号？", "o": ["【-a】", "【-r】", "【-l】", "【-p】"], "a": "A", "n": "【答案存疑】【题目缺陷】题干问\"配置 SSH 服务的默认端口号\"（正确答案应为 22），但四个选项却是 rsync 的参数 -a/-r/-l/-p，题干与选项完全串题、无法作答；参考答案 A（-a）实为 rsync 归档参数，与端口号毫无关系。疑为将 rsync 参数题的选项错配到 SSH 端口题上，应恢复端口选项（20/22/23/80，答案为 22）。", "d": 1}, {"k": "y25sec", "s": 209, "t": "单选", "q": "使用SSH客户端进行远程登录时，正确的命令是什么？", "o": ["【--delete】", "【--include 】", "【--exclude 】", "【--verbose】"], "a": "C", "n": "【答案存疑】【题目缺陷】题干是\"使用 SSH 客户端进行远程登录的正确命令\"（应为 ssh user@host），但选项 --delete/--include/--exclude/--verbose 全是 rsync 的参数，与 SSH 登录命令无关；参考答案 C（--exclude）实为 rsync 排除参数，与题干不符，属题干与选项串题/错位，建议修正选项。", "d": 1}, {"k": "y25sec", "s": 210, "t": "多选", "q": "SSH服务的优点包括哪些？", "o": ["远程备份", "文件同步", "数据压缩", "文件加密"], "a": "AB", "n": "【题目缺陷】题干写“SSH服务的优点”，但四个选项（远程备份/文件同步/数据压缩/文件加密）全是 rsync 的功能，与本分片第 198 题的题干重复，属复制错位。按 rsync 出题意图：A 远程备份、B 文件同步 ✅成立，C 压缩仅传输期临时存在，D 加密由 ssh 隧道而非 rsync 本身提供。", "d": 1}, {"k": "y25sec", "s": 211, "t": "多选", "q": "在配置SSH服务时，以下哪些配置选项可以提高安全性？", "o": ["【-a】", "【-r】", "【-l】", "【-p】"], "a": "AD", "n": "【题目缺陷】题干问“配置 SSH 服务提高安全性”，选项却是 rsync 参数（-a 归档、-r 递归、-l 保留链接、-p 保留权限），与本分片第 199 题重复，选项张冠李戴。按 rsync 意图“保持权限和属性不变”对应 -a 与 -p，AD 在该口径下成立；对 SSH 配置题本身则无从谈起。", "d": 1}, {"k": "y25sec", "s": 212, "t": "多选", "q": "在SSH连接出现问题时，以下哪些是常见的故障排除方法？", "o": ["【--exclude 】", "【--include 】", "【--delete】", "【--verbose】"], "a": "AC", "n": "【题目缺陷】题干为 SSH 故障排除，选项却是 rsync 的排除/输出参数（--exclude 等），与本分片第 200 题重复。且“排除指定文件或目录”技术上只有 --exclude 成立，--delete 是同步删除接收端多余文件而非排除，AC 沿袭了第 200 题的错误，严格应为 A。", "d": 1}, {"k": "y25sec", "s": 213, "t": "单选", "q": "在配置CA服务器时，以下哪个步骤是生成根证书的关键步骤？", "o": ["配置服务器的安全性和性能优化", "生成根证书和私钥", "签署子证书", "创建证书签署请求（CSR）"], "a": "B", "n": "【答案正确】自建 CA 的关键步骤是先生成 CA 私钥（如 openssl genrsa -out ca.key），再用其自签名生成根证书，二者构成签发所有下级证书的信任源，故选 B。A 属于服务器运维优化而非证书生成；C 签署子证书是根证书建立之后的工作；D 创建 CSR 是证书申请方为请求签署而做的步骤，不属于根 CA 自身建立环节。", "d": 0}, {"k": "y25sec", "s": 214, "t": "单选", "q": "在OpenSSL工具中，创建私钥的命令是？", "o": ["openssl ca", "openssl genrsa", "openssl req", "openssl crl"], "a": "B", "n": "【答案正确】`openssl genrsa -out ca.key 2048` 用于生成 RSA 私钥文件，是创建私钥的经典命令（新版 OpenSSL 亦可用 genpkey，本题语境下 genrsa 即标准答案），选 B。openssl req 生成 CSR 或自签名证书，openssl ca 执行 CA 签发，openssl crl 处理吊销列表，三者均不生成私钥。", "d": 0}, {"k": "y25sec", "s": 215, "t": "单选", "q": "以下哪个选项描述了CA服务器的作用？", "o": ["生成和签署证书", "加密通信", "配置服务器的安全性", "进行网络安全扫描"], "a": "A", "n": "【答案正确】CA 是 PKI 的信任锚，其职责是验证申请者身份、用自己的私钥生成并签署数字证书、维护证书吊销列表，故 A\"生成和签署证书\"正确。B\"加密通信\"是证书部署后由 SSL/TLS 会话实现的效果，并非 CA 本身的职能；C、D 与 CA 的定义无关。", "d": 0}, {"k": "y25sec", "s": 216, "t": "多选", "q": "OpenSSL的主要作用是？", "o": ["为应用程序提供传输层安全性（TLS）和安全套接字层（SSL）服务", "用于生成自签名和代码签名证书", "生成根证书和私钥", "进行网络安全扫描"], "a": "ABC", "n": "OpenSSL 是 SSL/TLS 加密库与工具集，可为应用提供 TLS/SSL 安全传输服务（A）；其子命令可生成私钥与自签名证书、代码签名证书、根 CA 证书（B、C）；网络安全扫描是 nmap 等渗透测试工具的职能，与 OpenSSL 无关，D 不选。ABC 正确。", "d": 0}, {"k": "y25sec", "s": 217, "t": "多选", "q": "以下哪些选项是在使用OpenSSL工具生成证书签署请求（CSR）时需要提供的信息？", "o": ["通用名称（Common Name）", "国家/地区名称（Country/Region Name）", "组织名称（Organization Name）", "电子邮件地址（Email Address）"], "a": "ABCD", "n": "openssl req 交互式生成 CSR 时会依次询问国家、省、城市、组织、部门、通用名称（CN，即网站域名）、邮箱等字段，ABCD 均为其中需提供的字段（部分允许留空但都属询问项）。ABCD 正确。", "d": 0}, {"k": "y25sec", "s": 218, "t": "单选", "q": "在使用openssl生成自签名证书时，以下哪个命令可以生成私钥文件？", "o": ["openssl genrsa", "openssl req", "openssl x509", "openssl ca"], "a": "A", "n": "【答案正确】生成自签名证书的流程是先 `openssl genrsa -out server.key 2048` 生成私钥文件，再由 req/x509 完成证书，故生成私钥的命令是 openssl genrsa，选 A。req 用于生成 CSR（配合 -x509 才自签证书），x509 用于证书签发/格式转换，ca 用于 CA 签发，均不生成原始私钥。", "d": 0}, {"k": "y25sec", "s": 219, "t": "单选", "q": "在使用openssl生成自签名证书时，以下哪个命令可以生成证书签名请求文件？", "o": ["openssl genrsa", "openssl req", "openssl x509", "openssl ca"], "a": "B", "n": "【答案正确】`openssl req -new -key server.key -out server.csr` 生成证书签名请求（CSR），req 即 request 之意，选 B。genrsa 生成的是私钥而非 CSR；x509 用于签发或转换证书；ca 是 CA 端的签发命令，三者都不能产生 CSR 文件。", "d": 0}, {"k": "y25sec", "s": 220, "t": "单选", "q": "吊销证书使用的是哪个命令？", "o": ["openssl ca -gencrl", "openssl ca -in", "openssl ca -revoke", "openssl ca -in"], "a": "C", "n": "【答案正确】吊销证书执行 `openssl ca -revoke server.crt`，将证书记入吊销数据库，之后用 -gencrl 生成 CRL 对外发布，故选 C。A 的 -gencrl 是生成吊销列表而非执行吊销动作；B/D 的 `openssl ca -in` 用于指定待签的 CSR 完成签发，与吊销无关。注：选项 B 与 D 文本完全重复，属排版缺陷，但不影响正确答案判定。", "d": 0}, {"k": "y25sec", "s": 221, "t": "多选", "q": "在使用openssl生成自签名证书时，以下哪些命令可以生成私钥文件和证书签名请求文件？", "o": ["openssl genrsa", "openssl req", "openssl x509", "openssl ca"], "a": "AB", "n": "openssl genrsa 生成 RSA 私钥，openssl req -new 生成证书签名请求（req -x509 还可直接自签证书），两者配合即可产出“私钥+CSR”，AB 正确；openssl x509 用于签发/转换/查看证书、openssl ca 用于模拟 CA 签发，都不负责生成私钥和 CSR 这对文件。", "d": 0}, {"k": "y25sec", "s": 222, "t": "多选", "q": "以下关于对称加密和非对称加密的说法，哪些是正确的？", "o": ["对称加密使用相同的密钥进行加密和解密", "非对称加密使用相同的密钥进行加密和解密", "对称加密速度比非对称加密更快", "非对称加密适用于密钥交换和数据加密"], "a": "ACD", "n": "A 对：对称加密加解密使用同一密钥；C 对：对称算法（如 AES）运算量远小于非对称（如 RSA），速度更快，故实际场景用非对称协商对称会话密钥；D 对：非对称加密正是为密钥交换和数据（小量）加密设计的。B 错：非对称使用公钥/私钥对，加解密密钥不同。ACD 正确。", "d": 0}, {"k": "y25sec", "s": 223, "t": "多选", "q": "以下关于数字证书的说法，哪些是正确的？", "o": ["数字证书用于验证网站的身份", "数字证书包含了网站的私钥", "数字证书由CA（证书颁发机构）签发", "数字证书可以防止中间人攻击"], "a": "ACD", "n": "数字证书将网站公钥与其身份绑定、由 CA 签发，配合 HTTPS 用于验证网站身份，A、C 正确；依赖受信 CA 的信任链校验，可有效防止中间人伪造站点攻击，D 正确；B 错：证书内含的是公钥，私钥保存在服务器且绝不放入证书。ACD 正确。", "d": 0}, {"k": "y25sec", "s": 224, "t": "单选", "q": "DNS服务器的作用是什么？", "o": ["提供互联网连接", "管理域名解析", "进行数据加密", "构建网站防火墙"], "a": "B", "n": "【答案正确】DNS 服务器负责域名与 IP 地址之间的解析（正向/反向查询、区域管理与授权），故\"管理域名解析\"正确，选 B。\"提供互联网连接\"是运营商接入层的职能，\"进行数据加密\"属于加密协议，\"构建网站防火墙\"属于安全设备，均与 DNS 的定位无关。", "d": 0}, {"k": "y25sec", "s": 225, "t": "单选", "q": "以下哪个是最常用的DNS服务器软件？", "o": ["Apache", "MySQL", "BIND", "Nginx"], "a": "C", "n": "【答案正确】BIND（Berkeley Internet Name Domain，服务进程为 named）是最常用、事实标准的 DNS 服务器软件，CentOS/RHEL 7 中由 bind 软件包提供，也是本系列 DNS 配置题的对象，选 C。Apache 和 Nginx 是 Web 服务器，MySQL 是数据库，均不能提供 DNS 服务。", "d": 0}, {"k": "y25sec", "s": 226, "t": "单选", "q": "以下哪个命令可以测试DNS解析是否正常？", "o": ["ping", "ssh", "dig", "curl"], "a": "C", "n": "【答案正确】dig（Domain Information Groper）向指定 DNS 服务器发起查询并完整显示应答（如 `dig @192.168.10.10 www.example.com A`），是直接验证 DNS 解析是否正常的标准工具，选 C。ping 只有在域名先解析成功后才可能连通，无法定位解析环节；ssh、curl 都依赖解析结果，均不是 DNS 诊断工具（nslookup、host 亦可用但不在选项中）。", "d": 0}, {"k": "y25sec", "s": 227, "t": "单选", "q": "DNS服务器的端口号是？", "o": ["53", "80", "443", "22"], "a": "A", "n": "【答案正确】DNS 监听 TCP/UDP 53 端口：常规查询走 UDP 53，区域传送和大响应使用 TCP 53，故选 A。80/443 分别是 HTTP/HTTPS 端口，22 是 SSH 端口。", "d": 0}, {"k": "y25sec", "s": 228, "t": "多选", "q": "以下哪些是DNS记录类型？", "o": ["A记录", "CNAME记录", "MX记录", "TXT记录"], "a": "ABCD", "n": "A 记录（域名到 IPv4 地址）、CNAME 记录（别名指向）、MX 记录（邮件交换服务器）、TXT 记录（文本，如 SPF 验证）都是标准的 DNS 资源记录类型，ABCD 全对。", "d": 0}, {"k": "y25sec", "s": 229, "t": "多选", "q": "以下哪些是DNS服务器的层次结构？", "o": ["根域名服务器", "顶级域名服务器", "邮件服务器", "区域域名服务器"], "a": "AB", "n": "【概念争议】DNS 服务器层次通常为：根域名服务器 → 顶级域名服务器 → 权威（权限）域名服务器；邮件服务器是收发邮件的主机，不属于 DNS 服务器层次，排除正确。但“区域域名服务器”并非标准术语，若理解为某区域（zone）的权威服务器，则它同样属于层次结构，答案应为 ABD、存在漏选；按题库仅取规范层级名称（根、顶级）的口径 AB 可辩。", "d": 1}, {"k": "y25sec", "s": 230, "t": "多选", "q": "以下哪些是DNS解析的过程？", "o": ["客户端发送查询请求到本地DNS服务器", "本地DNS服务器查询自己的缓存", "本地DNS服务器向根域名服务器发送递归查询请求", "根域名服务器直接返回查询结果给客户端"], "a": "AB", "n": "【已修正答案】平台原答案 ABC 有误（平台答案系 AI 生成、仅供参考），已按核验改为 AB。A、B 正确：客户端向本地 DNS 服务器发起查询、本地服务器先查自身缓存。C 错在术语：按标准解析模型，本地 DNS 服务器向根域名服务器发起的是迭代查询（根只返回顶级域服务器指引而非代为查完），递归查询只发生在客户端与本地 DNS 之间，中国主流教材（如谢希仁《计算机网络》）亦如此界定；D 错：根服务器不会直接把最终结果返回给客户端。严格答案为 AB。", "d": 2}, {"k": "y25sec", "s": 231, "t": "单选", "q": "DNSSEC的作用是什么？", "o": ["加密DNS流量", "防止DNS劫持", "提高DNS解析速度", "限制域名的访问权限"], "a": "B", "n": "【答案正确】DNSSEC 通过对区域数据做数字签名（RRSIG/DNSKEY/DS 信任链验证）实现数据来源认证与完整性校验，使解析结果被篡改或伪造（DNS 劫持、缓存投毒）时能被检测，故\"防止DNS劫持\"是其核心作用，选 B。A 错在 DNSSEC 只签名不加密，加密 DNS 流量须用 DoT/DoH；C、D 与 DNSSEC 无关。", "d": 0}, {"k": "y25sec", "s": 232, "t": "单选", "q": "在Linux系统上配置DNSSEC时，使用的常用软件是什么？", "o": ["BIND", "Apache", "Nginx", "Tomcat"], "a": "A", "n": "【答案正确】BIND 原生支持 DNSSEC：可用 dnssec-signzone 签名区域、auto-dnssec 维护签名、dnssec-validation 开启验证，是 Linux 上配置 DNSSEC 的常用软件，选 A。Apache、Nginx、Tomcat 分别是 Web/应用服务器，不具备 DNS 功能。", "d": 0}, {"k": "y25sec", "s": 233, "t": "单选", "q": "DNSSEC使用哪种类型的密钥进行数字签名？", "o": ["公钥", "对称密钥", "私钥", "密码"], "a": "C", "n": "【答案正确】DNSSEC 采用非对称密钥体系：区域签名密钥（ZSK/KSK）以私钥对 RRset 生成 RRSIG 数字签名，解析方用 DNSKEY 中对应的公钥验证，故\"用于数字签名\"的是私钥，选 C。对称密钥与密码不用于 DNSSEC 签名；公钥只用于验证环节而非签名环节。", "d": 0}, {"k": "y25sec", "s": 234, "t": "单选", "q": "DNSSEC的数字签名是使用哪种算法生成的？", "o": ["AES", "RSA", "MD5", "SHA"], "a": "B", "n": "【答案正确】DNSSEC 的签名算法族以 RSA/SHA-256（算法号 8）、RSA/SHA-1 等为主，选项中唯一成立的非对称算法是 RSA，选 B。严格说完整算法是 RSA+SHA 组合，SHA 单独只是哈希成分；AES 是对称加密算法、MD5 已不安全且不属于 DNSSEC 签名算法，均不对。", "d": 0}, {"k": "y25sec", "s": 235, "t": "多选", "q": "DNSSEC可以提供哪些安全保障？", "o": ["防止DNS劫持", "防止数据篡改", "加密DNS流量", "隐藏域名的存在"], "a": "AB", "n": "DNSSEC 通过对区域数据做数字签名，提供数据来源验证与完整性保护，可防 DNS 劫持/缓存投毒与记录篡改，AB 正确；它不加密 DNS 流量（加密是 DoT/DoH 的职责），也不隐藏域名存在（NSEC 甚至可被区间遍历），C、D 排除。", "d": 0}, {"k": "y25sec", "s": 236, "t": "多选", "q": "DNSSEC的部署需要涉及哪些关键步骤？", "o": ["生成密钥对", "签名域名", "提高DNS解析速度", "安装防火墙"], "a": "AB", "n": "DNSSEC 部署的核心步骤是生成 KSK/ZSK 密钥对并对区域数据签名，之后向上级提交 DS 记录建立信任链；“提高 DNS 解析速度”与部署无关（签名验证反而略增开销），“安装防火墙”是通用安全措施而非 DNSSEC 步骤。AB 正确。", "d": 0}, {"k": "y25sec", "s": 237, "t": "多选", "q": "DNSSEC部署过程中的哪些问题可能导致配置失败？", "o": ["密钥生成错误", "域名注册失败", "DNS服务器故障", "客户端配置错误"], "a": "AC", "n": "密钥生成错误会导致签名或信任链校验失败、DNS 服务器故障会使签名区域无法发布与解析，二者都会直接造成部署失败，AC 成立；域名注册失败属于部署前的前提条件问题，客户端配置错误属解析端验证环节而非服务端部署过程中的配置失败，B、D 不选。", "d": 0}, {"k": "y25sec", "s": 238, "t": "单选", "q": "辅助DNS服务器的作用是什么？", "o": ["为整个网络提供权威DNS服务", "在主服务器故障时提供备份DNS服务", "解析来自外部网络的DNS查询", "处理网络的动态DNS更新"], "a": "B", "n": "【答案正确】辅助（secondary/从）DNS 服务器通过区域传送从主服务器复制区域数据，在主服务器故障时继续提供解析，实现冗余备份并分担查询负载，故选 B。A 描述的更贴合主服务器的定位（辅助服务器虽也具权威性，但其设置目的在备份分流）；C、D 分别对应缓存/转发与动态更新特性，不是设置辅助服务器的主要作用。", "d": 0}, {"k": "y25sec", "s": 239, "t": "单选", "q": "在Linux服务器上配置辅助DNS服务器，常用的软件是什么？", "o": ["BIND", "Apache", "Nginx", "MySQL"], "a": "A", "n": "【答案正确】主/辅助 DNS 一般都用 BIND 搭建：从服务器在 named.conf 中以 type slave; masters { 主服务器IP; }; 声明，从主服务器同步区域文件，选 A。Apache、Nginx 是 Web 服务器，MySQL 是数据库，均与 DNS 服务无关。", "d": 0}, {"k": "y25sec", "s": 240, "t": "单选", "q": "辅助DNS服务器的配置文件一般是什么格式？", "o": ["XML", "JSON", "YAML", "text"], "a": "D", "n": "【答案正确】BIND 的主配置文件 named.conf 与区域数据文件均为纯文本格式（可用编辑器直接修改，区域文件也可由区域传送自动生成文本），选 D。XML、JSON、YAML 都不是 BIND 配置/区域文件所使用的格式。", "d": 0}, {"k": "y25sec", "s": 241, "t": "多选", "q": "在Linux系统中，以下哪些配置文件与辅助DNS服务器相关？", "o": ["/etc/named.conf", "/etc/dhcpd.conf", "/etc/resolv.conf", "/etc/hosts"], "a": "AC", "n": "辅助（从/slave）DNS 由 BIND 提供，区域类型 type slave（secondary）及主服务器地址配置在 /etc/named.conf；/etc/resolv.conf 是解析器配置，多个 nameserver 语句中第二个及以后即客户端视角的辅助/备用 DNS；/etc/dhcpd.conf 属 DHCP 配置、/etc/hosts 是本地静态解析文件，均与 DNS 服务器配置无关。AC 正确。", "d": 0}, {"k": "y25sec", "s": 242, "t": "多选", "q": "辅助DNS服务器可以通过以下哪些方式获取域名解析规则？", "o": ["从主DNS服务器同步", "从本地配置文件读取", "通过动态DNS更新获取", "通过网关获取"], "a": "ABC", "n": "A 正确：从服务器通过 AXFR/IXFR 与主服务器做区域传送，是其定义性机制；B 可成立：BIND 会把传送来的区域写入本地备份文件，重启后可从本地文件加载，且整个 named.conf 配置在本地；C 可成立：启用动态更新（DDNS）时更新经主服务器传播后从服务器随之获取；“通过网关获取”并无此机制，D 排除。ABC 成立。", "d": 0}, {"k": "y25sec", "s": 243, "t": "单选", "q": "DHCP服务器的作用是什么？", "o": ["自动分配IP地址给客户端", "提供路由器和DNS服务器的信息", "管理客户端的网络连接", "手动配置客户端的IP地址"], "a": "A", "n": "【答案正确】DHCP 通过 Discover/Offer/Request/Ack 四步交互为客户端自动分配 IP 地址并下发掩码、网关、DNS 等网络参数，故选 A。B 只是 DHCP option 传递的附带内容之一；\"管理客户端网络连接\"（C）并非其职能；D 手动配置 IP 恰是 DHCP 用来自动化的对立面。", "d": 0}, {"k": "y25sec", "s": 244, "t": "单选", "q": "在配置静态IP时，需要修改哪个文件？", "o": ["/etc/dhcp/dhcpconf", "/etc/sysconfig/network-scripts/ifcfg-ens33", "/etc/resolv.conf", "/etc/hosts"], "a": "B", "n": "【答案正确】CentOS/RHEL 7 配置静态 IP 须编辑网卡配置文件 /etc/sysconfig/network-scripts/ifcfg-ens33（设 BOOTPROTO=static、IPADDR、NETMASK/PREFIX、GATEWAY、DNS1 后重启网络服务），选 B。选项 A 的\"/etc/dhcp/dhcpconf\"系笔误，准确写法为 /etc/dhcp/dhcpd.conf（DHCP 服务端配置文件）；resolv.conf 用于 DNS 且由网络服务维护，hosts 用于本地主机名映射，均非配置静态 IP 之处。", "d": 0}, {"k": "y25sec", "s": 245, "t": "单选", "q": "DHCP服务器的配置文件是什么？", "o": ["/etc/resolv.conf", "/etc/hosts", "/etc/dhcp/dhcpconf", "/etc/sysconfig/network-scripts/ifcfg-ens33"], "a": "C", "n": "【答案正确】DHCP 服务器（ISC dhcpd）的配置文件是 /etc/dhcp/dhcpd.conf，题中选项 C 写作\"/etc/dhcp/dhcpconf\"属拼写错误（少写 d，正确名称为 dhcpd.conf），按出题意图选 C。resolv.conf、hosts 与 DHCP 服务配置无关；ifcfg-ens33 是客户端网卡配置文件；配置模板可参考 /usr/share/doc/dhcp*/dhcpd.conf.example。", "d": 0}, {"k": "y25sec", "s": 246, "t": "多选", "q": "DHCP服务器的功能包括哪些？", "o": ["自动分配IP地址", "提供默认网关和DNS服务器的信息", "分配主机名和域名", "管理网络流量和带宽"], "a": "ABC", "n": "DHCP 可自动分配 IP 并管理租约，通过 option 3/6/15/12 可下发默认网关、DNS 服务器、域名和主机名，ABC 成立；“管理网络流量和带宽”属路由/QoS 职能，与 DHCP 无关，D 排除。", "d": 0}, {"k": "y25sec", "s": 247, "t": "多选", "q": "在配置DHCP服务器时，以下哪些信息是必需的？", "o": ["IP地址池范围", "子网掩码", "网关地址", "DNS服务器地址"], "a": "ABCD", "n": "dhcpd.conf 中 subnet 声明必须有子网与子网掩码，range 定义地址池，option routers 与 option domain-name-servers 分别指定网关和 DNS——完整可用的 DHCP 服务四者都应配置（严格说后两者属可选 option，但实际部署为必需），ABCD 符合出题口径。", "d": 0}, {"k": "y25sec", "s": 248, "t": "多选", "q": "DHCP服务器的工作原理是什么？", "o": ["客户端向服务器请求IP地址", "服务器向客户端发送IP地址租约", "客户端确认IP地址租约并更新网络配置", "服务器定期与客户端续约IP地址"], "a": "ABCD", "n": "四项对应 DHCP 的 DORA 流程：客户端广播 Discover 请求地址（A）、服务器 Offer/ACK 发放租约（B）、客户端 Request 确认并应用网络配置（C）、租约过半时定期续约（D）。严格说续约由客户端主动发起、服务器负责应答，D 的表述按“双方续约环节”的简化理解成立，ABCD 正确。", "d": 0}, {"k": "y25sec", "s": 249, "t": "单选", "q": "DHCP服务器的安全性主要面临哪些攻击类型？", "o": ["未经授权的DHCP服务器提供虚假信息", "未经授权的客户端获取资源访问权限", "来自恶意DHCP客户端的资源耗尽攻击", "所有上述选项"], "a": "D", "n": "【答案正确】DHCP 面临的典型威胁包含三类：私接的 rogue DHCP 服务器向客户端发放伪造网关/DNS（中间人攻击）、未经授权的客户端（私接设备、仿冒 MAC）占用地址并获取资源访问权、恶意客户端发送大量伪造 Discover 请求耗尽地址池的资源耗尽攻击，三者均成立，故\"所有上述选项\"D 正确。相应防御手段为 DHCP Snooping、端口安全、租约监控等。", "d": 0}, {"k": "y25sec", "s": 250, "t": "单选", "q": "MAC地址在网络中的作用是什么？", "o": ["提供设备的永久地址", "用于验证客户端身份", "用于跟踪已知设备并实现访问控制", "所有上述选项"], "a": "D", "n": "【答案正确】在 DHCP 安全管理语境下三项用途均成立：MAC 地址是厂商出厂固化、相对永久的硬件地址（A）；用于 host 声明中 MAC-IP 绑定从而识别确认客户端（B）；配合 DHCP Snooping/端口安全跟踪已知设备并做接入控制（C），故\"所有上述选项\"D 合理。需提示：MAC 可被软件伪造，基于 MAC 的\"验证身份\"只是弱认证，并非密码学意义上的强鉴别。", "d": 0}, {"k": "y25sec", "s": 251, "t": "单选", "q": "如何配置DHCP服务器进行MAC地址和IP地址的绑定？", "o": ["打开dhcp配置文件，添加host配置项", "在系统中安装并配置ISC DHCP Server软件", "使用静态IP地址来实现MAC地址绑定", "重新启动DHCP服务"], "a": "A", "n": "【答案正确】在 /etc/dhcp/dhcpd.conf 中添加 host 声明（host 名 { hardware ethernet MAC地址; fixed-address IP; }）即可实现 MAC 与 IP 的绑定（地址保留），这是服务器端的标准做法，选 A。B 只是部署 DHCP 软件这一前提；C 是在客户端手工设静态 IP，并未在服务器上建立绑定；D 重启服务仅是配置生效的操作。", "d": 0}, {"k": "y25sec", "s": 252, "t": "多选", "q": "MAC地址过滤的作用是什么？", "o": ["防止未经授权的设备接入网络", "提供设备的永久地址", "实现IP地址分配", "跟踪已知设备并实现访问控制"], "a": "AD", "n": "MAC 地址过滤基于网卡硬件地址建立允许/拒绝列表，可阻止未授权设备接入（A）并对已知设备进行跟踪与访问控制（D）。“提供设备的永久地址”是 MAC 地址自身的属性而非过滤功能的作用，“实现 IP 地址分配”是 DHCP 的职能，B、C 排除。AD 正确。", "d": 0}, {"k": "y25sec", "s": 253, "t": "多选", "q": "进行DHCP服务的MAC地址绑定有哪些注意事项？", "o": ["需要在DHCP配置文件中添加host配置项", "配置静态IP地址来实现MAC地址绑定", "确保配置的MAC地址和IP地址是正确的", "重新启动DHCP服务", "确保网络中的其他设备不会使用已绑定的IP地址"], "a": "ACDE", "n": "MAC 绑定需在 /etc/dhcp/dhcpd.conf 中添加 host 声明（hardware ethernet + fixed-address），A 正确；须核对 MAC/IP 填写无误（C）、修改后重启 dhcpd 生效（D）、并保证该 IP 未被其他设备占用以免冲突（E）；B 是在客户端手工配置静态 IP，与“通过 DHCP 服务端绑定给指定 MAC 下放固定地址”的机制不符，排除。ACDE 正确。", "d": 0}, {"k": "y25sec", "s": 254, "t": "多选", "q": "DHCP安全性中的攻击类型包括以下哪些？", "o": ["未经授权的DHCP服务器提供虚假信息", "未经授权的客户端获取资源的访问权限", "来自恶意DNS服务器的资源耗尽攻击", "未经授权的DHCP客户端向服务器发送虚假请求"], "a": "AB", "n": "【概念争议】DHCP 攻击的两大类——未授权（仿冒）DHCP 服务器提供虚假信息导致中间人（A）与未授权客户端非法获取网络访问（B），按此口径 AB 成立。但 D“未授权客户端向服务器发送虚假请求”恰是 DHCP 耗尽（饿死）攻击的典型手法——伪造海量 DISCOVER 耗尽地址池，技术上亦属 DHCP 攻击类型，疑漏选，完整答案或应为 ABD；C 描述的是恶意 DNS 服务器侧攻击，与 DHCP 无关，排除正确。建议核对题源是否应选 ABD。", "d": 1}, {"k": "y25sec", "s": 255, "t": "单选", "q": "在DHCP故障转移配置中，failover peer的作用是：", "o": ["标识主服务器和备用服务器", "设置DHCP服务器的IP地址", "控制租约的最长时间", "配置负载均衡的参数"], "a": "A", "n": "【答案正确】ISC DHCP 的 failover peer 语句定义一对互为故障转移伙伴的服务器（内含 peer 的 address、port 及 mclt 等参数），用于标识并建立主/备服务器之间的租约同步关系，故 A 正确。B 对应 peer 段内的 address 属性而非 failover peer 的作用；C 对应 mclt、max-lease-time 类参数；D 对应负载均衡 split 参数，均不是其定位。", "d": 0}, {"k": "y25sec", "s": 256, "t": "单选", "q": "在主DHCP服务器的配置中，primary关键字表示：", "o": ["该服务器是主服务器", "该服务器是备用服务器", "该服务器是故障转移的主节点", "该服务器是故障转移的辅助节点"], "a": "A", "n": "【答案正确】在 failover peer 声明中，primary 关键字声明本机是该故障转移对的主（primary）节点，故 A\"该服务器是主服务器\"最贴切。C\"故障转移的主节点\"与 A 语义几乎相同，属干扰项措辞重叠，按最直接释义取 A；B、D 与 primary 含义相反。", "d": 0}, {"k": "y25sec", "s": 257, "t": "单选", "q": "在辅助DHCP服务器的配置中，secondary关键字表示：", "o": ["该服务器是主服务器", "该服务器是备用服务器", "该服务器是故障转移的主节点", "该服务器是故障转移的辅助节点"], "a": "D", "n": "【答案正确】secondary 关键字在 failover peer 段中声明本机为该故障转移对的辅助（从）节点，与 primary 相对，故 D 正确。B\"备用服务器\"只是宽泛说法，D 才是该关键字在故障转移场景中的准确角色定义；A、C 与 secondary 含义相反。", "d": 0}, {"k": "y25sec", "s": 258, "t": "单选", "q": "在DHCP故障转移配置中，mclt表示：", "o": ["最大响应延迟时间", "最大未应答更新次数", "最大负载均衡时间间隔", "最大客户端租约到期时间"], "a": "D", "n": "【答案正确】【术语提示】MCLT（Maximum Client Lead Time）是 DHCP 故障转移协议参数：活动方在未与伙伴事务确认的情况下给客户端续租时，租约到期时间最多只能领先伙伴已确认到期时间 MCLT。四个选项中只有 D\"最大客户端租约到期时间\"与之最接近（响应延迟、未应答更新次数、负载均衡间隔均无对应关键字），按出题意图选 D 成立；其标准中文译名应为\"最大客户端提前/领先时间\"。", "d": 0}, {"k": "y25sec", "s": 259, "t": "多选", "q": "DHCP故障转移中，以下哪些步骤是确保主服务器和备用服务器之间网络连通性和防火墙设置的正确配置？", "o": ["确保主服务器和备用服务器连接到同一个局域网或子网。", "配置主服务器和备用服务器的网络接口，设置正确的IP地址、子网掩码和默认网关。", "开放主服务器和备用服务器的防火墙，允许DHCP协议相关的端口通过。", "配置路由器或交换机，确保主服务器和备用服务器之间的互通。"], "a": "ABCD", "n": "四项均为保障主/备服务器连通与防火墙放行的合理步骤：同网段或保证路由可达、接口 IP/掩码/网关配置正确、放行 DHCP 及故障转移相关端口（ISC dhcpd 故障转移默认走 TCP 647）、交换/路由路径互通。严格而言故障转移伙伴只需该通道可达、不必同网段，但作为连通性保障步骤的表述可接受，ABCD 全选成立。", "d": 0}, {"k": "y25sec", "s": 260, "t": "多选", "q": "在DHCP故障转移配置中，以下哪些参数是用于控制故障转移过程的通信和同步机制？", "o": ["max-response-delay", "max-unacked-updates", "load balance max seconds", "mclt"], "a": "ABCD", "n": "【已修正答案】平台原答案 ABC 有误（平台答案系 AI 生成、仅供参考），已按核验改为 ABCD。ISC dhcpd 故障转移参数中，max-response-delay 限制等待对端响应的最大时长、max-unacked-updates 限制未确认租约更新的数量（通信控制），load balance max seconds 控制负载均衡等待时限，均为控制故障转移通信与同步的参数；而 mclt（最大客户端主导时间）更是主备之间租约延长与故障切换同步的核心参数，由主服务器在 failover peer 块中声明。答案漏选 mclt，四项皆属之，应为 ABCD。", "d": 2}, {"k": "y25sec", "s": 261, "t": "多选", "q": "在DHCP故障转移配置中，以下哪些关键字用于标识主服务器和备用服务器？", "o": ["primary", "secondary", "peer address", "address"], "a": "AB", "n": "failover peer 块中以 primary/secondary 关键字声明本机是主服务器还是备用服务器；address 与 peer address 仅指定本端及对端用于故障转移通信的 IP 地址，不起标识主备角色的作用。AB 正确。", "d": 0}, {"k": "y25sec", "s": 262, "t": "单选", "q": "在CentOS Linux 7上安装Apache服务的命令是？", "o": ["yum install apache", "yum -y install apache", "apt-get install apache", "apt-get -y install apache"], "a": "B", "n": "【答案正确】【术语提示】CentOS 7 属 RHEL 系，Apache 的软件包名实际是 httpd，真实命令为 yum -y install httpd；本题四个选项包名均写作 apache（Debian 系命名思路），按出题意图考查 yum 而非 apt-get、加 -y 免交互确认，故 B 是唯一符合 CentOS 与出题意图的选项。A 只缺 -y（会交互询问），C/D 是 Debian/Ubuntu 的包管理器，不适用于 CentOS。", "d": 0}, {"k": "y25sec", "s": 263, "t": "单选", "q": "Apache HTTP Server的配置文件名为？", "o": ["httpconf", "apache.conf", "server.conf", "http.conf"], "a": "A", "n": "【答案正确】【选项文本有误】RHEL/CentOS 中 Apache 主配置文件为 /etc/httpd/conf/httpd.conf，选项 A 的 httpconf 应为 httpd.conf 的笔误；apache.conf（Debian 系叫 apache2.conf）、server.conf、http.conf 均不是 CentOS 7 Apache 的配置文件名。按出题意图选 A，准确写法是 httpd.conf。", "d": 0}, {"k": "y25sec", "s": 264, "t": "单选", "q": "如何设置Apache服务开机自启？", "o": ["systemctl start httpd", "systemctl stop httpd", "systemctl restart httpd", "systemctl enable httpd"], "a": "D", "n": "【答案正确】systemctl enable httpd 会在对应运行级别目标下创建服务启动链接，把 httpd 登记为开机自启；start/stop/restart 只影响当前会话中服务的启动、停止与重启，均不改变开机自启状态，故 D 正确，A/B/C 干扰。", "d": 0}, {"k": "y25sec", "s": 265, "t": "多选", "q": "Apache HTTP Server的特点有哪些？", "o": ["简单易用", "高性能稳定", "跨平台支持", "支持多线程模型"], "a": "BC", "n": "【概念争议】“高性能稳定”（Apache 以稳定性著称）与“跨平台支持”（Linux/Unix/Windows 均可运行）确为其特点，BC 成立。但 D“支持多线程模型”技术上同样成立：Apache 2.0 起提供 worker MPM、2.4 默认 event MPM 均为多线程模型（CentOS 7 的 httpd 2.4 默认即 event），仅按老教材 prefork“每请求一进程”的口径才会排除 D；A“简单易用”较主观。答案 BC 疑漏 D，按现代口径应为 BCD。", "d": 1}, {"k": "y25sec", "s": 266, "t": "多选", "q": "在Linux系统中，以下哪些命令可以重新启动Apache HTTP Server？", "o": ["systemctl restart httpd", "service httpd restart", "systemctl enable httpd", "apache restart"], "a": "AB", "n": "RHEL/CentOS 7 下 systemctl restart httpd 是标准重启命令；service httpd restart 是 SysV 兼容写法，实际转发到 systemd，同样可重启 Apache；systemctl enable httpd 仅设置开机自启并非重启；“apache restart”不是有效命令。AB 正确。", "d": 0}, {"k": "y25sec", "s": 267, "t": "单选", "q": "默认情况下，如果Apache无法找到所请求的URL并且网站缺少索引文件，它会显示整个目录列表。为了关闭目录列表，应该在配置文件中的哪个部分添加选项？", "o": ["\u003cDirectory />", "\u003cDirectory /var/www/html/>", "\u003cVirtualHost>", "\u003cLocation />"], "a": "B", "n": "【答案正确】关闭目录列表的常规加固做法是在网站根目录容器中设置 Options -Indexes，通常就写在指向站点根的 \u003cDirectory \"/var/www/html\"> 段内（规范写法路径末尾不带斜杠）；\u003cDirectory /> 作用于整个文件系统过于宽泛，\u003cLocation />、\u003cVirtualHost> 不是放置该选项的常规位置，B 符合实践。", "d": 0}, {"k": "y25sec", "s": 268, "t": "单选", "q": "为了禁用不需要的模块，需要在哪个配置文件中注释掉不需要的模块？", "o": ["/etc/httpd/conf.d/ssl.conf", "/etc/httpd/conf.modules.d/00-base.conf", "/etc/httpd/conf/httpconf", "/etc/httpd/conf.d/php.conf"], "a": "B", "n": "【答案正确】RHEL/CentOS 7 的 httpd 2.4 将模块加载语句集中在 /etc/httpd/conf.modules.d/*.conf，其中 00-base.conf 加载大量基础模块，禁用模块即注释其中对应的 LoadModule 行；选项 C 的 httpconf 应为 httpd.conf 笔误（主配置文件不逐个加载模块），ssl.conf/php.conf 只涉及各自功能参数，B 正确。", "d": 0}, {"k": "y25sec", "s": 269, "t": "单选", "q": "为了防止XSS攻击，应该在响应标头中添加哪个选项？", "o": ["X-XSS-Protection “1; mode=block”", "X-Content-Type-Options “nosniff”", "X-Frame-Options “SAMEORIGIN”", "X-Content-Security-Policy “default-src 'self’”"], "a": "A", "n": "【答案正确】X-XSS-Protection \"1; mode=block\" 用于开启浏览器内置 XSS 过滤器并在检测到反射型 XSS 时阻止渲染，是直接针对 XSS 的响应头（Apache 写法：Header set X-XSS-Protection \"1; mode=block\"）；B 防 MIME 嗅探、C 防点击劫持，均非防 XSS；D 的标准头名是 Content-Security-Policy（X-Content-Security-Policy 是早已废弃的旧前缀写法）。现代浏览器已弃用 X-XSS-Protection、推荐 CSP，但按本题考点 A 为预期答案。", "d": 0}, {"k": "y25sec", "s": 270, "t": "多选", "q": "默认情况下，Apache Web服务器会在响应标头中包含它的名称和版本号。为了隐藏这些信息，应该在配置文件中添加哪些选项？", "o": ["ServerTokens Prod", "ServerSignature Off", "ServerName Hidden", "ServerInfo Off"], "a": "AB", "n": "ServerTokens Prod 使响应头 Server 字段仅显示“Apache”而不含版本与 OS 信息；ServerSignature Off 关闭错误页、目录列表页脚中的版本信息，两者配合即可隐藏名称与版本，AB 正确；ServerName 用于设定服务器标识主机名，“ServerName Hidden”无隐藏版本之效，“ServerInfo Off”不是 Apache 指令，C、D 排除。", "d": 0}, {"k": "y25sec", "s": 271, "t": "多选", "q": "哪些选项可以用于禁用SSI和CGI执行？", "o": ["Options -ExecCGI", "Options +ExecCGI", "Options -Includes", "Options +Includes"], "a": "AC", "n": "Options 指令中前缀“-”表示禁用、“+”表示启用：-ExecCGI 禁用 CGI 脚本执行、-Includes 禁用 SSI（服务器端包含），AC 正确；Options +ExecCGI、+Includes 是启用执行，与“禁用”目的相反，B、D 排除。", "d": 0}, {"k": "y25sec", "s": 272, "t": "多选", "q": "Apache HTTP服务器的默认配置可能会导致以下哪些问题？", "o": ["暴露服务器的名称和版本信息", "显示网站目录列表", "加载不必要的模块", "启用符号链接"], "a": "ABC", "n": "【概念争议】A（默认 ServerTokens Full 暴露版本/OS）、B（Indexes 选项可能暴露目录列表）、C（默认加载大量非必需模块）确为默认配置带来的问题。但 D“启用符号链接”——默认配置中的 Options Indexes FollowSymLinks 同样默认开启，允许通过符号链接访问 DocumentRoot 之外的文件，历来是加固清单项（建议改用 SymLinksIfOwnerMatch 或禁用），疑漏选，完整答案或应为 ABCD；按题源将符号链接视为正常功能而非“问题”的口径，ABC 可辩。", "d": 1}, {"k": "y25sec", "s": 273, "t": "单选", "q": "什么是HTTPS协议的作用？", "o": ["加速网页加载速度", "提供安全的加密通信", "实现网站的动态交互功能", "提供跨域请求的支持"], "a": "B", "n": "【答案正确】HTTPS 是 HTTP over TLS/SSL，在 HTTP 之上叠加传输加密、完整性校验与身份认证，作用即提供安全的加密通信；加速加载靠 HTTP/2/缓存（且非其本义）、动态交互由 CGI/PHP/JS 等实现、跨域由 CORS 实现，均与 HTTPS 无关，B 正确。", "d": 0}, {"k": "y25sec", "s": 274, "t": "单选", "q": "以下哪个命令用于安装mod_ssl模块？", "o": ["apt-get install mod_ssl", "yum install mod_ssl", "sudo install mod_ssl", "pip install mod_ssl"], "a": "B", "n": "【答案正确】CentOS/RHEL 用 yum install mod_ssl 安装为 Apache 提供 SSL/TLS 能力的 mod_ssl 软件包（随附 /etc/httpd/conf.d/ssl.conf 与 mod_ssl.so）；apt-get 是 Debian/Ubuntu 的包管理器，sudo install、pip install 都不是安装系统软件包的途径，B 正确。", "d": 0}, {"k": "y25sec", "s": 275, "t": "单选", "q": "在Apache配置文件中，用于指定SSL证书位置的指令是什么？", "o": ["SSLCertificateFile", "SSLCertificateKeyFile", "SSLCertificateChainFile", "SSLCACertificateFile"], "a": "A", "n": "【答案正确】SSLCertificateFile 指定服务器证书（含公钥）文件路径，即证书位置；SSLCertificateKeyFile 指定私钥文件，SSLCertificateChainFile 指定中间证书链（2.4 已由 SSLCertificateFile 合并替代），SSLCACertificateFile 用于验证客户端证书的受信 CA 列表，故 A 正确。", "d": 0}, {"k": "y25sec", "s": 276, "t": "多选", "q": "以下哪些步骤是配置Linux服务器以提供HTTPS安全连接的必要步骤？", "o": ["安装mod_ssl模块", "生成SSL密钥和证书", "配置Web服务器以启用HTTPS连接", "更新防火墙规则允许HTTPS连接 E. 安装OpenSSL工具"], "a": "ABCD", "n": "部署 HTTPS 的必要步骤：安装 mod_ssl 模块（A）、生成 SSL 密钥与证书（B）、在 Web 服务器配置 SSLEngine/SSLCertificateFile 启用 HTTPS（C）、放行防火墙 443 端口（D），ABCD 正确；“安装 OpenSSL 工具”通常系统预装且 mod_ssl 已包含所需依赖，不单列为必要步骤，E 未选合理。【选项文本有误】D 选项文本中混入了“E. 安装OpenSSL工具”，实际 D 选项应为“更新防火墙规则允许HTTPS连接”。", "d": 0}, {"k": "y25sec", "s": 277, "t": "多选", "q": "自签名SSL证书适用于哪些场景？", "o": ["公共服务的生产环境", "测试环境或个人使用的非关键服务", "需要在Web浏览器中验证服务器身份", "需要加密服务器和客户端之间的通信"], "a": "BD", "n": "自签名证书无受信 CA 背书，浏览器会告警，不适合公共服务生产环境（A 排除），也无法让浏览器可信地验证服务器身份（C 排除）；适合测试环境或个人非关键服务（B），且其建立的 TLS 会话加密能力与正规证书相同，可用于加密两端通信（D）。BD 正确。", "d": 0}, {"k": "y25sec", "s": 278, "t": "多选", "q": "SSL和TLS的作用是什么？", "o": ["将流量包装在加密包装器中", "防止外部各方拦截消息", "帮助用户验证连接的站点身份", "提供安全的加密连接"], "a": "ABCD", "n": "SSL/TLS 将应用流量封装进加密通道（A），提供机密性防窃听与完整性保护，使外部各方无法截获篡改消息（B）；借助证书链验证站点身份（C），最终向用户提供安全的加密连接（D）。ABCD 全部成立。", "d": 0}, {"k": "y25sec", "s": 279, "t": "单选", "q": "在CentOS上安装Nginx需要安装哪个额外的软件包？", "o": ["Apache", "MySQL", "Enterprise Linux (EPEL)", "PHP"], "a": "C", "n": "【答案正确】【术语提示】CentOS 7 官方基础源不含 nginx，需先安装 EPEL 扩展源再安装 nginx；EPEL 全称 Extra Packages for Enterprise Linux，选项写成 Enterprise Linux (EPEL) 表述不完整但意图明确。Apache、MySQL、PHP 与获取 nginx 毫无关系，C 正确。", "d": 0}, {"k": "y25base", "s": 1, "t": "判断", "q": "（ ）32位计算机是指该计算机能同时处理的二进制信息的位数是32位。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】“32位计算机”的32位指机器字长，即CPU一次能同时（并行）处理的二进制数据位数为32位，这是字长的标准定义。原判断成立，选A正确。", "d": 0}, {"k": "y25base", "s": 2, "t": "多选", "q": "关于Windows系统下的中文输入，描述正确的有(  )", "o": ["按[Ctrl+Space]组合键，不可进行中英文输入的切换", "按[Ctrl+Shift]组合键，可进行中文输入的切换", "只用鼠标而不用键盘，也可输入汉字", "只用键盘而不用鼠标，则不能输入汉字"], "a": "BC", "n": "【答案正确】Ctrl+Space是中英文输入切换键，故A“不可进行切换”说法错误，不选；Ctrl+Shift在各输入法之间循环切换，B正确；借助软键盘、手写等纯鼠标操作也能输入汉字，C正确；只用键盘当然能输入汉字，D错误。故选BC。", "d": 0}, {"k": "y25base", "s": 3, "t": "单选", "q": "（  ）能将高级语言源程序转换成目标程序", "o": ["解释程序", "编辑程序", "编译程序", "调试程序"], "a": "C", "n": "【答案正确】编译程序把整个高级语言源程序翻译成目标程序；解释程序对源程序逐句翻译并立即执行、不生成目标程序；编辑程序只负责文本/源代码编辑，调试程序用于排错。故选C。", "d": 0}, {"k": "y25base", "s": 4, "t": "单选", "q": "计算机网络的拓扑结构主要取决于它的（ ）。", "o": ["资源子网", "FDDI网", "通信子网", "城域网"], "a": "C", "n": "【答案正确】网络拓扑指通信子网中结点与通信链路的几何排列形式，故拓扑结构主要取决于通信子网；资源子网负责数据处理，与拓扑无直接关系，FDDI网、城域网是具体网络类型而非决定因素。故选C。", "d": 0}, {"k": "y25base", "s": 5, "t": "判断", "q": "（  ）每个汉字的字模码都用两个字节存储", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】原判断确实错误：字模码（点阵字形码）的大小取决于点阵规格，如16×16点阵需32字节、24×24点阵需72字节；两个字节存放的是汉字内码（国标码）。故答案“错误”（B）正确。", "d": 0}, {"k": "y25base", "s": 6, "t": "多选", "q": "下列关于数字图像技术和计算机图形学的描述，正确的是(  )", "o": ["黑白图像（又称灰度图像）的每个取样点只有一个亮度值", "计算机图形学主要研究使用计算机描述景物并生产其图像的原理、方法、和技术", "利用扫描仪输入计算机的机械零件图属于计算机图形", "数字图像中，GIF文件格式采用了无损压缩"], "a": "ABD", "n": "【答案正确】黑白（灰度）图像每个取样点只有1个亮度分量，A对；计算机图形学研究用计算机描述景物并生成其图像的原理、方法与技术，B对；扫描仪输入得到的是点阵图像（取样所得）而非计算机图形，C错；GIF采用LZW无损压缩，D对。故选ABD。（B中“生产”为“生成”的笔误，不影响判题。）", "d": 0}, {"k": "y25base", "s": 7, "t": "单选", "q": "用浮点数表示任意一个数据时，可通过改变浮点数的(  )部分的大小，能使小数位置产生移动", "o": ["基数", "阶码", "尾数", "有效数字"], "a": "B", "n": "【答案正确】浮点数 N=尾数×基数^阶码，阶码决定小数点的实际位置，改变阶码可使小数点浮动；改动尾数只影响有效位数（精度）。故选B（阶码）。", "d": 0}, {"k": "y25base", "s": 8, "t": "单选", "q": "在以太（Ethernet）局域网中，每个结点把要传输的数据封装成“数据帧”。这样来自多个节点的不同的数据帧就可以时分多路复用的方式共享传输介质，这些被传输的“数据帧”能正确的被目的（ ）主机所接受，其中一个重要原因是因为“数据帧”的帧头部封装了目的主机的", "o": ["IP地址", "MAC地址", "计算机名", "域名地址"], "a": "B", "n": "【答案正确】以太网工作在数据链路层，数据帧的寻址依靠帧头中封装的目的主机MAC地址（48位物理地址）；IP地址封装在网络层分组头部，计算机名、域名是应用层标识。故选B。", "d": 0}, {"k": "y25base", "s": 9, "t": "判断", "q": "（ ）Windows操作系统中剪贴板是ROM中一块临时存放交换信息的区域。", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】剪贴板是内存（RAM）中开辟的一块临时存放交换信息的区域，断电后内容丢失；ROM是只读存储器，不可能用作剪贴板。原判断错误，选B正确。", "d": 0}, {"k": "y25base", "s": 10, "t": "判断", "q": "（  ）五笔字型输入法不是中文Windows操作系统预装的输入法", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】中文Windows预装的输入法有全拼、双拼、智能ABC、微软拼音、郑码、内码等，五笔字型是第三方输入法，须另行安装。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 11, "t": "多选", "q": "与其他事物相似，软件有它的发生、发展和消亡的过程。软件的生命周期大体可以包括（  ）", "o": ["定义期", "开发期", "使用期", "维护期"], "a": "ABD", "n": "【答案正确】按教材三时期划分，软件生命周期包括定义期（问题定义、可行性研究、需求分析）、开发期（设计、编码、测试）和维护期（运行维护），“使用”包含在运行维护之中，不是单独的时期名称。故选ABD。", "d": 0}, {"k": "y25base", "s": 12, "t": "单选", "q": "用8位补码表示整数-126的机器码，算术右移一位后的结果是（ ）", "o": ["1.0000001E7", "1000001.0", "1.1000001E7", "1.100001E7"], "a": "C", "n": "【答案正确】实算：126=01111110，取反加1得-126的8位补码10000010；算术右移保持符号位并向高位补1，得11000001（即-63=-126÷2取整）。选项C的“1.1000001E7”是表格导出把11000001转成科学计数法的痕迹，其位串恰为11000001；而B的1000001是逻辑右移（高位补0）的结果。故选C。", "d": 0}, {"k": "y25base", "s": 13, "t": "单选", "q": "多媒体计算机系统中要表示、传输和处理大量的声音、图像甚至影像视频信息，其数据量之大是非常惊人的。因此，必须研究高效的（ ）技术。①流媒体 ②数据压缩编码 ③数据压缩解码 ④图像融合", "o": ["①和④", "②和③", "②和④", "③和④"], "a": "B", "n": "【答案正确】声音、图像、视频数据量巨大，必须依靠高效的数据压缩编码技术存储/传输，并以相应的数据压缩解码技术还原，故②③；流媒体只是一种传输服务方式，图像融合与解决数据量问题无关。故选B。", "d": 0}, {"k": "y25base", "s": 14, "t": "判断", "q": "（  ）IE浏览器在支持FTP的功能方面，只能进入匿名式的FTP，无法上传", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】IE可在地址栏用ftp://访问FTP站点，通过“文件→登录”输入用户名和口令即可进入非匿名FTP，对有写权限的目录还能拖放上传文件，“只能匿名、无法上传”的说法不成立。原判断错误，选B正确。", "d": 0}, {"k": "y25base", "s": 15, "t": "多选", "q": "在电子邮件的发送和接收过程中，需要用到的协议有（ ）。", "o": ["POP3", "ISP", "FTP", "SMTP"], "a": "AD", "n": "【答案正确】发信时用SMTP（简单邮件传输协议）把邮件推送到服务器，收信时用POP3（邮局协议）从服务器取信，故选AD；ISP是因特网服务提供者而非协议，FTP是文件传输协议。", "d": 0}, {"k": "y25base", "s": 16, "t": "单选", "q": "利用Windows提供的剪贴板，可选择下列（  ）操作，即可完成文本、图形和文件等对象的复制", "o": ["“CTRL+C”和“CTRL+V”", "“编辑”菜单的“剪切”和“粘贴”", "“CTRL+X”和“CTRL+V”", "“CTRL+S”和“CTRL+V”"], "a": "A", "n": "【答案正确】Ctrl+C（复制）加Ctrl+V（粘贴）可实现复制；Ctrl+X与“编辑→剪切”都是移动（剪切）而非复制；Ctrl+S是保存操作。故选A。", "d": 0}, {"k": "y25base", "s": 17, "t": "单选", "q": "下列汉字编码标准中，不支持繁体汉字的是(  )", "o": ["GB2312-80", "GBK", "BIG 5", "GB18030"], "a": "A", "n": "【答案正确】GB2312-80只收录6763个简体汉字及常用符号，不含繁体字形；GBK、GB18030向下兼容GB2312并收录繁体字，BIG5本身就是通行于港台的繁体编码。故选A。", "d": 0}, {"k": "y25base", "s": 18, "t": "判断", "q": "（  ）数据库系统的全局概念结构模式独立于具体的计算机和DBMS", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】数据库设计中的全局概念结构（E-R概念模式）面向用户和现实世界，独立于具体机器与具体DBMS，之后再向特定DBMS的数据模型转换。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 19, "t": "多选", "q": "下列叙述中，正确的有（  ）", "o": ["-127的原码为11111111,反码为10000001,补码为10000000", "-127的原码为11111111，反码为10000000，补码为10000001", "-127的原码为11111111，反码为00000000，补码为00000001", "127的原码、反码和补码皆为01111111"], "a": "BD", "n": "【答案正确】实算：-127为负数，原码=符号位1+1111111即11111111；负数反码为原码除符号位外逐位取反得10000000；补码=反码+1得10000001，故B对、A把反码与补码颠倒、C反码为全0显然错。+127为正数，原码、反码、补码相同，均01111111，D对。故选BD。", "d": 0}, {"k": "y25base", "s": 20, "t": "判断", "q": "（  ）数据库是指按一定的数据模型组织，长期存放在内存上的一组可共享的相关数据集合", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】数据库是按一定数据模型组织、长期存放在计算机“外存”（如硬盘）上、可供多用户共享的相关数据集合，不是存放在内存。原判断错误，选B正确。", "d": 0}, {"k": "y25base", "s": 21, "t": "单选", "q": "下列关于“1KB”准确的含义是(  )", "o": ["1000个二进制位", "1000个字节", "1024个字节", "1024个二进制"], "a": "C", "n": "【答案正确】按传统二进制口径，1KB=2^10=1024字节；选项A/C混淆了位与字节——1024个二进制位只是128字节。故“准确的含义”应选C（1024个字节）。", "d": 0}, {"k": "y25base", "s": 22, "t": "单选", "q": "（ ）使计算机从一种需要用键盘、鼠标对其进行操作的设备，变成了人处于计算机创造的环境中，通过感官、语言、手势等比较“自然”的方式进行“交互、对话”的系统和环境。", "o": ["虚拟现实技术", "计算机动画", "计算机图形学", "数字图象技术"], "a": "A", "n": "【答案正确】虚拟现实技术用计算机生成三维虚拟环境，使人“沉浸”其中，通过感官、语言、手势等自然方式与环境交互对话，与题干描述吻合；动画、图形学、图像技术不具备这种沉浸式人机交互特征。故选A。", "d": 0}, {"k": "y25base", "s": 23, "t": "判断", "q": "（  ）快捷方式是一种特殊类型的文件，每个快捷方式都有自己的独立的文件名", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Windows快捷方式（.lnk）是一种特殊类型的文件，只存放指向目标对象的链接信息，每个快捷方式都有自己独立的文件名（可重命名），删除快捷方式不影响原对象。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 24, "t": "单选", "q": "关于键盘上的Caps Lock 键，下列叙述中正确的是(  )", "o": ["它与Alt + Del键组合可以实现计算机热启动", "当Caps Lock灯亮时，按主键盘的数字键可直接输入其上部的特殊字符", "当Caps Lock 灯亮时，按字母键可直接输入大写字母", "当Caps Lock 灯亮时，按字母键可直接输入小写字母"], "a": "C", "n": "【答案正确】Caps Lock灯亮（大写锁定）时按字母键直接输入大写字母，C对；热启动组合键是Ctrl+Alt+Del而非Alt+Del，A错；数字键上排特殊字符靠Shift+数字键输入，与Caps Lock灯无关，B错；D与事实相反。故选C。", "d": 0}, {"k": "y25base", "s": 25, "t": "单选", "q": "在某声音的数字化过程中，使用44．1KHz的取样频率、16位量化位数，则采集四声道的此声音一分钟需要的存储空间约为(  )", "o": ["165.375MB", "21.168MB", "20.672MB", "10.584MB"], "a": "B", "n": "【已修正答案】平台原答案 C 有误（平台答案系 AI 生成、仅供参考），已按核验改为 B。实算：44100次/秒×16位×4声道×60秒=169344000位=21168000字节，按1MB=10^6字节即21.168MB（选项B），按1MB=1024²字节约20.19MB（无此选项）。参考答案C的“20.672MB”实为21168000÷1024=20672KB，把KB误标成了MB；D是按双声道计算的值。故按四声道一分钟的正确数据量应选B（21.168MB）。", "d": 2}, {"k": "y25base", "s": 26, "t": "判断", "q": "（  ）在24×24点阵的汉字字库中，存储每个汉字字形码所需的字节是70B", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】实算：24×24点阵每行24点=3字节，共24行×3B=72字节/字。原判断称“70B”不对，判“错误”（B）正确。", "d": 0}, {"k": "y25base", "s": 27, "t": "单选", "q": "衡量一台计算机优劣的主要技术指标通常是指(  )", "o": ["所配备的系统软件的优劣", "CPU的主频、运算速度，字长和存储容量等", "显示器的分辨率、打印机的配置", "软、硬盘容量的大小"], "a": "B", "n": "【答案正确】衡量计算机优劣的主要技术指标是字长、CPU主频与运算速度、存储容量等硬件指标；软件配置、外设（显示器、打印机）与磁盘容量只能作为参考因素。故选B。", "d": 0}, {"k": "y25base", "s": 28, "t": "单选", "q": "重新启动计算机，除了加电启动外，还可以用(  )组合键", "o": ["Ctrl + Break", "Ctrl + Alt + Break", "Ctrl + Enter", "Ctrl + Alt + Del"], "a": "D", "n": "【答案正确】不重新加电的“热启动”通过Ctrl+Alt+Del组合键实现；Ctrl+Break是中断，Ctrl+Enter、Ctrl+Alt+Break无重启功能。故选D。", "d": 0}, {"k": "y25base", "s": 29, "t": "判断", "q": "（ ）防火墙是一种维护网络安全的软件或硬件设备，位于它维护的子网（内网）和它所连接的网络（外网）之间，能防止来自外网的攻击。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】防火墙是设置在被保护内网与外网之间的一组软件或硬件（系统），按安全策略控制进出信息流，可阻挡来自外网的非法访问与攻击，定义准确。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 30, "t": "判断", "q": "（  ）在多媒体计算机系统中，对声音信号模数转换的顺序是采样、编码、量化", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】声音模数转换（数字化）的正确顺序是：采样（时间离散）→量化（幅度离散）→编码（用二进制代码表示）；题干把量化与编码顺序颠倒。原判断错误，选B正确。", "d": 0}, {"k": "y25base", "s": 31, "t": "单选", "q": "PC机的标准输入设备是（ ），缺少该设备计算机就无法正常工作。", "o": ["键盘", "鼠标", "扫描仪", "数字化仪"], "a": "A", "n": "【答案正确】键盘是PC的标准（必备）输入设备，系统启动与基本操作都依赖它，缺少它计算机难以正常工作；鼠标、扫描仪、数字化仪均为可选外设。故选A。", "d": 0}, {"k": "y25base", "s": 32, "t": "单选", "q": "计算机软件操作系统的作用是(  )", "o": ["管理系统资源，控制程序的执行", "实现软硬件功能的转换", "把源程序翻译成目标程序", "便于进行数据处理"], "a": "A", "n": "【答案正确】操作系统是系统软件的核心，负责管理系统软硬件资源（处理机、存储器、设备、文件）并控制程序的执行；把源程序翻译成目标程序是编译程序的任务。故选A。", "d": 0}, {"k": "y25base", "s": 33, "t": "判断", "q": "（  ）一副具有真彩色（24位）、分辨率为1024×768的数字图像，在没有进行任何数字压缩之前，他的数据量大约是2.25MB", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】实算：1024×768=786432像素，24位真彩即每像素3字节，数据量=786432×3B=2359296字节=2.25MB（2359296÷1024²=2.25），与题述一致。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 34, "t": "单选", "q": "在Windows中，将当前活动窗口复制到剪贴板，可以用( )来实现。", "o": ["PrtSc键", "Alt+PrtSc组合键", "Ctrl+C组合键", "Ctrl+V组合键"], "a": "B", "n": "【答案正确】Alt+PrtSc将当前活动窗口图像复制到剪贴板；单独按PrtSc复制的是整个屏幕，Ctrl+C/Ctrl+V与屏幕拷贝无关。故选B。", "d": 0}, {"k": "y25base", "s": 35, "t": "单选", "q": "下列软件中，(  )是专门的网页制作软件", "o": ["FrontPage 2000", "Visual BASIC 6.0", "Excel 2000", "PowerPoint2000"], "a": "A", "n": "【答案正确】FrontPage 2000是专门的网页制作与站点管理软件；Visual Basic是编程语言，Excel是电子表格，PowerPoint是演示文稿软件。故选A。", "d": 0}, {"k": "y25base", "s": 36, "t": "判断", "q": "（  ）视图是数据库系统中提供的一种以用户模式观察数据库中数据的重要机制，可以由基本表或其他视图导出。它同基本表一样，同样作为一个实际存储数据的表", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】视图是由基本表（或其他视图）导出的“虚表”，数据库只存放其定义而不存放数据，查询时才从基本表动态生成；“同样作为一个实际存储数据的表”说法错误。原判断错误，选B正确。", "d": 0}, {"k": "y25base", "s": 37, "t": "判断", "q": "（  ）CPU运行时的系统时钟及各种与其同步的时钟均是由CPU内部控制器提供的", "o": ["正确", "错误"], "a": "B", "n": "【答案错误判断成立】CPU的系统时钟（主频基准脉冲）由主板上的晶体振荡器/时钟发生器电路提供，CPU内部控制器只对基准时钟分频或倍频使用，并不产生系统时钟。原判断错误，选B正确。", "d": 0}, {"k": "y25base", "s": 38, "t": "单选", "q": "在Windows中，对文件和文件夹的管理是通过( )来实现的。", "o": ["对话框", "剪贴板", "资源管理器或我的电脑", "控制面板"], "a": "C", "n": "【答案正确】Windows对文件和文件夹的管理通过“资源管理器”或“我的电脑”实现；对话框用于人机交互，剪贴板用于信息交换，控制面板用于系统环境设置。故选C。", "d": 0}, {"k": "y25base", "s": 39, "t": "单选", "q": "集线器是构建以太网的核心设备，以下关于集线器的叙述中错误的是（ ）。", "o": ["一个以太网中只能使用一台集线器", "集线器使以太网的构建和维护非常方便", "集线器能放大信号，起着中继器的作用", "集线器的英文名词是Hub"], "a": "A", "n": "【答案正确】集线器（Hub）工作在物理层，相当于多端口中继器，可放大再生信号、便于构建和维护以太网，且允许多台级联使用，故“一个以太网中只能使用一台集线器”说法错误，符合题意。故选A。", "d": 0}, {"k": "y25base", "s": 40, "t": "判断", "q": "（  ）在关系数据模式中，若属性A是关系R的主键，则A不能接受空值或重值，这是由关系数据模型的实体完整性规则保证的", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】实体完整性规则要求主键（主属性）取值唯一且非空，故属性A不能取空值也不能取重复值；涉及外键取值的才是参照完整性。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 41, "t": "单选", "q": "在“我的电脑”窗口中，如果需要选定多个非连续排列的文件，应按组合键（ ）。", "o": ["Ctrl+单击选定的文件对象", "Alt+单击要选定的文件对象", "Shift+单击要选定的文件对象", "Ctrl+双击要选定的文件对象"], "a": "A", "n": "【答案正确】“我的电脑”/资源管理器中选定多个不连续对象应按住Ctrl逐个单击；Shift+单击用于选定首尾连续区域，Alt+单击、Ctrl+双击无选定功能。故选A。", "d": 0}, {"k": "y25base", "s": 42, "t": "单选", "q": "（ ）可以确保含有程序和数据的存储介质在使用过程中不感染病毒。", "o": ["对软盘写保护", "对硬盘使用杀病毒软件", "对软盘使用杀病毒软件", "对计算机加防病毒卡"], "a": "A", "n": "【答案正确】软盘写保护后只能读不能写，病毒无法写入，使用中不会感染病毒；杀毒软件只能检测和清除已感染的病毒，防病毒卡也不能绝对保证介质在使用中不被感染。故选A。", "d": 0}, {"k": "y25base", "s": 43, "t": "判断", "q": "（ ）现代通信系统常常在信号的发送端用调制解调器对发送的信号进行调制。调制只是改变了信息的表达方式，并没有改变信息的内容。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】调制是把要发送的信号加载到载波上以改变其表达（传输）形式，只改变信息的载体与表示方式，信息内容不变，解调端可恢复原始信息。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 44, "t": "单选", "q": "在Windows中，下列关于“任务栏”的叙述，错误的是(  )", "o": ["可以将任务栏设置为自动隐藏", "可以移动任务栏", "通过任务栏上的按钮，可以实现窗口之间的切换", "在任务栏上，只显示当前活动窗口名"], "a": "D", "n": "【答案正确】任务栏显示所有已打开窗口（程序）的按钮，单击按钮即可切换窗口，“只显示当前活动窗口名”说法错误，符合题意；任务栏可设置为自动隐藏、可拖动至屏幕四边。故选D。", "d": 0}, {"k": "y25base", "s": 45, "t": "单选", "q": "在计算机的软件分类中，应用软件和系统软件的相互关系是(  )", "o": ["前者以后者为基础", "后者以前者为基础", "每一类都不以另一方为基础", "每一类都以另一方为基础"], "a": "A", "n": "【答案正确】系统软件（含操作系统）处于底层，为应用软件提供运行环境和支撑服务，应用软件以系统软件为基础；两类软件不是互为基础关系。故选A。", "d": 0}, {"k": "y25base", "s": 46, "t": "判断", "q": "（  ）集成电路按用途可以分为通用集成电路与专用集成电路，存储器芯片属于通用集成电路", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】按教材口径，集成电路按用途分为通用与专用两类：CPU、存储器等标准化大批量芯片属通用集成电路，为特定用途定制的芯片属专用集成电路。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 47, "t": "判断", "q": "（ ）无线键盘和无线鼠标采用的是无线接口，通过无线电波将信息传送给计算机，需要专用的接收器。", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】无线键盘、鼠标采用无线接口，通过无线电波把信息传送给与主机相连的专用接收器（再转交计算机），描述符合实际。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 48, "t": "单选", "q": "在Windows中，若“菜单”选项后带有符号“◥”，则表示该选项(  )", "o": ["处于有效状态", "执行时有对话框", "有下级子菜单", "不能执行"], "a": "C", "n": "【答案正确】菜单项右侧带“◥”（▼/▶）表示该菜单项还有下级子菜单；执行时弹出对话框的菜单项用“…”标注；当前不能执行的菜单项呈灰色（暗淡）显示。故选C。", "d": 0}, {"k": "y25base", "s": 49, "t": "单选", "q": "已知用户登录名为huaj，用户所在的主机名为sohu.com，则（ ）是正确的电子邮件地址。", "o": ["@huaj.sohu.com", "sohu.com@huaj", "@sohu.com.huaj", "huaj@sohu.com"], "a": "D", "n": "【答案正确】电子邮件地址格式为“用户名@邮件服务器域名”，本地登录名huaj位于@左侧、主机域名sohu.com位于@右侧，即huaj@sohu.com；其余选项的@位置或前后顺序均不符合格式。故选D。", "d": 0}, {"k": "y25base", "s": 50, "t": "判断", "q": "（  ）数据传送率是衡量硬盘性能的一项指标。硬盘内部传输速率大于外部传输速率", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】硬盘外部（接口）传输率一般高于内部（盘片/磁头读写）传输率，内部传输率才是数据传输的瓶颈，“内部传输速率大于外部传输速率”说法错误。原判断错误，选B正确。", "d": 0}, {"k": "y25base", "s": 51, "t": "单选", "q": "逻辑与运算：11001010∧00001001的运算结果是(  )", "o": ["00001000", "00001001", "11000001", "11001011"], "a": "A", "n": "【答案正确】按位与运算：11001010∧00001001，仅第5位双方同为1得1，其余各位至少一方为0，结果为00001000，与选项A一致。A、B选项分别是把结果错取为另一操作数或常见误算。故选A。", "d": 0}, {"k": "y25base", "s": 52, "t": "单选", "q": "目前在计算机中使用的图像文件有许多不同的格式，下列(  )不是图像文件格式", "o": ["TIF", "JPEG", "GIF", "PDF"], "a": "D", "n": "【答案正确】TIF、JPEG、GIF都是常用的图像文件格式；PDF是便携式电子文档（出版）格式，不是图像文件格式。故选D。", "d": 0}, {"k": "y25base", "s": 53, "t": "判断", "q": "（  ）Windows操作系统采用并发多任务方式支持系统中的多个任务的执行，但任何时刻只有一个任务正被CPU执行", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Windows采用并发多任务方式，宏观上多个任务同时推进，微观上（当年单CPU环境）任何时刻CPU只能执行其中一个任务，其余处于等待，由时间片轮转实现并发。原判断正确，选A。（多核CPU出现后微观上可多任务并行，但按题目年代口径成立。）", "d": 0}, {"k": "y25base", "s": 54, "t": "判断", "q": "（  ）简单的说，数据结构是程序设计中由若干数据元素按照一定方式构成的复合数据以及作用于其上的函数或运算", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】该表述符合数据结构的常见定义（类Sahni定义）：数据结构是由若干数据元素按一定方式（逻辑关系）组织构成的复合数据，以及定义在其上的函数或运算（操作集）。原判断正确，选A。", "d": 0}, {"k": "y25base", "s": 55, "t": "单选", "q": "在某进制的运算中4*5=14，则根据这一运算规则，5*7=（ ）。", "o": ["3A", "35.0", "29.0", "23.0"], "a": "D", "n": "【答案正确】设进制为b，则4×5=20（十进制），而“14”表示1×b+4，由b+4=20得b=16，即十六进制；按此规则5×7=35（十进制）=2×16+3=23（十六进制）。选项D“23.0”的“.0”是表格导出痕迹，即“23”。故选D。", "d": 0}, {"k": "y25base", "s": 56, "t": "单选", "q": "在Windows的“资源管理器”窗口中，用鼠标选定连续文件的操作是（ ）。", "o": ["单击第一个文件，然后单击最后一个文件", "双击第一个文件，然后双击最后一个文件", "单击第一个文件，然后按住Shift键，再单击最后一个文件", "单击第一个文件，然后按住Ctrl键，再单击最后一个文件"], "a": "C", "n": "【答案正确】选定连续文件的标准操作是单击第一个文件后按住Shift键再单击最后一个文件，首尾之间的文件全部自动选中。A未按Shift时第二次单击只改选最后一个文件；B双击会打开文件而非选定；D按住Ctrl键单击是选定多个不连续文件的操作，均不符合题意。", "d": 0}, {"k": "y25base", "s": 57, "t": "判断", "q": "（  ）任何一台能正常访问Internet的计算机，一定有一个唯一的静态IP地址", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】能正常访问Internet的计算机确实要有IP地址（否则无法通信），但地址可以通过DHCP动态分配，不一定是静态IP，动态地址同样可以正常上网（如拨号和局域网自动获取地址的用户）。题干把静态绝对化，故判错。", "d": 0}, {"k": "y25base", "s": 58, "t": "单选", " 格），则该文件名为（ ）。", "o": ["ABC（所有的空格均被截去）", "A B C（前后的空格均被截去）", "A B C（末尾的空格被截去）", "A B C （开头的空格被截去）"], "a": "C", "n": "【已修正答案】平台原答案 D 有误（平台答案系 AI 生成、仅供参考），已按核验改为 C。Windows文件系统允许文件名开头和中间保留空格，但会自动截去文件名末尾的空格（也不允许以句点结尾），故实际文件名是保留开头与中间空格、仅去掉末尾空格的名字，对应选项C。参考答案D仅截去开头空格与实际行为相反，末尾空格不可能保留；即便按部分教材前后空格均被忽略的口径也应选B，D无论如何不成立。", "d": 2}, {"k": "y25base", "s": 66, "t": "多选", "q": "在Windows操作系统“资源管理器”中，能进行的操作有( )。", "o": ["在窗口中显示所有文件的属性", "一次打开多个文件", "一次复制或移动多个不连续的文件", "一次删除多个不连续的文件", "不按任何键，直接拖动鼠标在不同磁盘之间移动文件"], "a": "BCD", "n": "【答案正确】B选中多个文件后回车可一次打开；C、D按住Ctrl选不连续文件后可整体复制、移动或删除，均正确。A在当时资源管理器窗口的详细资料视图中没有属性列，须选中文件经属性命令查看，无法直接显示所有文件属性；E错误，因为不同磁盘之间直接拖动默认执行复制，要移动必须按住Shift键。", "d": 0}, {"k": "y25base", "s": 67, "t": "单选", "q": "计算机在执行U盘上的程序时，首先把U盘上的程序和数据读入到(  ),然后才能被计算机运行", "o": ["硬盘", "软盘", "内存", "缓存"], "a": "C", "n": "【答案正确】程序指令必须由CPU从内存（主存）中取出才能执行，U盘、硬盘、软盘都是外存储器，程序须先调入内存。缓存只是CPU与内存之间的高速缓冲，不作为程序运行的主存储场所。", "d": 0}, {"k": "y25base", "s": 68, "t": "单选", "q": "二进制数01011010扩大成2倍是（ ）。", "o": ["1.01101E7", "1.01011E7", "1.00111E7", "1.001101E7"], "a": "A", "n": "【答案正确】01011010₂=90，扩大2倍即左移一位得10110100₂=180。二进制规格化后1.01101₂×2⁷即10110100（128+32+16+4=180），记作1.01101E7，故A正确。B为10101100=172、C为10011100=156、D含8个小数位长度不符，均非180。", "d": 0}, {"k": "y25base", "s": 69, "t": "单选", "q": "某处理器具有32GB的寻址能力，则该处理器的地址线有（ ）。", "o": ["36根", "35根", "32根", "24根"], "a": "B", "n": "【答案正确】32GB=32×2³⁰B=2³⁵B，n根地址线编址2ⁿ个存储单元，故需35根地址线，选B。32根只能寻址4GB（2³²B），36根对应64GB，24根仅16MB。", "d": 0}, {"k": "y25base", "s": 70, "t": "多选", "q": "下列关于机器语言程序与高级语言程序的说法中，错误的是(  )", "o": ["机器语言程序比高级语言程序执行速度慢", "机器语言程序比高级语言程序可移植性强", "机器语言程序比高级语言程序可读性差", "有了高级语言，机器语言就无存在的必要了"], "a": "ABD", "n": "【答案正确】题问错误的说法。A错：机器语言程序由硬件直接执行，速度反而最快；B错：机器语言依赖具体机型，可移植性最差；D错：高级语言须经翻译成机器语言才能执行，机器语言和汇编仍是底层开发不可少的基础。C机器语言可读性差是正确陈述，不属于应选的错误项。", "d": 0}, {"k": "y25base", "s": 71, "t": "单选", "q": "微型计算机系统的CPU、存储器和外部设备之间采用总线连接。总线通常由（）三部分组成。", "o": ["地址总线、数据总线和系统总线", "系统总线、数据总线和控制总线", "地址总线、数据总线和控制总线", "地址总线、系统总线和控制总线"], "a": "C", "n": "【答案正确】系统总线按传送信息的类型分为数据总线、地址总线和控制总线三部分，分别传送数据、内存/外设地     const un = xs.filter(q => !(qid(q) in S.answered));

  const pct = s.total ? Math.round(100*s.done/s.total) : 0;
  document.getElementById('gBar').style.width = pct+'%';
  document.getElementById('gpText').textContent = s.done+'/'+s.total;
  document.getElementById('quick10').onclick = () => {
    GZ.quick = 10; st.mode='random'; st.idx=0; st.sel=new Set(); st.graded=null;
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m==='random'));
    rebuild(); window.scrollTo({top:0});
  };
  document.getElementById('toGrid').onclick = () => { renderGrid(); openSheet('sheetGrid'); };
  document.getElementById('toStats').onclick = () => { renderStatsSheet(); openSheet('sheetStats'); };
}
function render(){
  renderStats();
  refreshCounts();
  const card = document.getElementById('card');
  const q = cur();
  if(!q){
    const msg = st.mode==='wrong' ? ['🎉','错题本是空的，太棒了！']
              : st.mode==='star'  ? ['⭐','还没有收藏的题目，刷题时点题目旁的 ☆ 收藏。']
              : ['🔍','没有匹配的题目。'];
    card.innerHTML = `<div class="empty-big"><span class="em">${msg[0]}</span>${msg[1]}</div>`;
    document.getElementById('prevBtn').disabled = true;
    document.getElementById('nextBtn').disabled = true;
    return;
  }
  const aid = qid(q), shown = S.reveal;
  const picked = [...st.sel];
  const graded = st.graded;
  const isLast = st.idx >= st.list.length-1;
  let h = `<div class="meta"><span class="chin bank">${bankName(q.k)}</span>
    <span class="chin gray">第 ${q.s} 题</span><span class="chin gray">${TYPE_NAME[q.t]}</span>
    ${q.d===2?'<span class="chin fixed">已修正 · 平台原答案有误</span>':q.d===1?'<span class="chin warn">存疑题 · 看解析</span>':''}
    <button class="star ${S.starred[aid]?'on':''}" id="starNow">${S.starred[aid]?'★':'☆'}</button></div>
    <div class="stem">${esc(q.q)}</div><div class="opts">`;
  const ansSet = new Set(q.a.split(''));
  q.o.forEach((t,i)=>{
    const L = LT[i];
    let cls = 'opt';
    if(!graded && !shown && picked.includes(L)) cls += ' sel';
    if(graded || shown){
      if(ansSet.has(L)) cls += ' ok';
      else if(picked.includes(L)) cls += ' bad';
    }
    h += `<div class="${cls}" data-l="${L}"><span class="letter">${L}.</span><span>${esc(t)}</span></div>`;
  });
  h += '</div>';
  if(q.t==='多选' && !graded && !shown && picked.length)
    h += `<div class="multi-note">已选 ${picked.join('、')}（<button class="btn primary" id="submitBtn">提交答案</button>）</div>`;
  if(graded){
    const right = graded === 'ok';
    h += `<div class="verdict ${right?'ok':'bad'}">${right?'✅ 回答正确':'❌ 回答错误'}　正确答案：${q.a.split('').join('、')}</div>`;
    h += `<div class="why">📝 ${esc(q.n)||'（本题暂无解析）'}</div>`;
    const allDone = st.list.length && st.list.every(x => qid(x) in S.answered);
    const label = (isLast || allDone) ? '🏁 交卷 · 看本组成绩' : '下一题 →';
    h += `<button class="btn primary bigcta" id="ctaNext">${label}</button>`;
  } else if(shown){
    h += `<div class="why">📖 答案：${q.a.split('').join('、')}　📝 ${esc(q.n)||'（本题暂无解析）'}</div>`;
  } else if(q.t==='多选'){
    h += `<div class="multi-note">多选题：点选后提交</div>`;
  }
  card.innerHTML = h;
  card.classList.toggle('locked', !!graded || shown);
  const noList = st.list.length===0;
  document.getElementById('prevBtn').disabled = noList || st.idx<=0;
  document.getElementById('nextBtn').disabled = noList || isLast;
  document.getElementById('jumpNo').value = q.s;
  document.getElementById('starNow').onclick = toggleStar;
  const cta = document.getElementById('ctaNext');
  if(cta) cta.onclick = () => { if(cta.textContent.includes('交卷')) finishGroup(); else step(1); };
  const sb = document.getElementById('submitBtn');
  if(sb) sb.onclick = gradeMulti;
  if(graded==='ok' && !isLast && document.getElementById('autoNext').checked){
    setTimeout(()=>{ if(st.graded==='ok') step(1); }, 700);
  }
  if(!graded && !shown){
    card.querySelectorAll('.opt').forEach(el => el.onclick = ()=>{
      const L = el.dataset.l;
      if(q.t==='多选'){ toggleSel(L); render(); } else { gradeSingle(L); }
    });
  } else {
    card.querySelectorAll('.opt').forEach(el => el.onclick = null);
  }
}
function toggleSel(L){ if(st.sel.has(L)) st.sel.delete(L); else st.sel.add(L); }
function gradeSingle(L){ const q = cur(); if(!q) return; st.sel = new Set([L]); finishGrade(); }
function gradeMulti(){ const q = cur(); if(!q || !st.sel.size) return; finishGrade(); }
function finishGrade(){
  const q = cur(); if(!q) return;
  const picked = [...st.sel].sort().join('');
  const right = picked === q.a.split('').sort().join('');
  st.graded = right ? 'ok' : 'bad';
  S.answered[qid(q)] = right ? 1 : 0;
  const rec = {d: today(), t: q.t, ok: right?1:0};
  S.log.push(rec); if(S.log.length>20000) S.log.splice(0, S.log.length-20000);
  GZ.log.push({id: qid(q), ok: rec.ok});
  if(!right){ try{ navigator.vibrate && navigator.vibrate(70); }catch(e){} }
  save(); render();
  // 本组全部答完 → 自动弹出成绩单
  if(st.list.length && st.list.every(x => qid(x) in S.answered) && st.mode!=='seq' && (GZ.quick || (S.size||0)>0)){
    setTimeout(()=>{ if(st.list.length && st.list.every(x => qid(x) in S.answered)) finishGroup(); }, 900);
  }
}
function step(d){
  const ni = st.idx + d;
  if(ni<0 || ni>=st.list.length) return;
  st.idx = ni; st.sel = new Set(); st.graded = null;
  S.pos = S.pos || {}; S.pos[scopeKey()+'|'+st.mode] = st.idx; save();
  window.scrollTo({top:0});
  render();
}
function jumpTo(no){
  const i = st.list.findIndex(q=>q.s===no);
  if(i>=0) jumpIdx(i);
}
function jumpIdx(i){
  if(i<0 || i>=st.list.length) return;
  st.idx = i; st.sel = new Set(); st.graded = null;
  S.pos = S.pos || {}; S.pos[scopeKey()+'|'+st.mode] = st.idx; save();
  window.scrollTo({top:0}); render();
}
function toggleStar(){
  const q = cur(); if(!q) return;
  const id = qid(q);
  if(S.starred[id]) delete S.starred[id]; else S.starred[id]=1;
  save(); render();
}
function refreshCounts(){
  const nw = wrongIds().length, ns = starIds().length;
  document.getElementById('nWrong').textContent = nw; document.getElementById('nWrong').classList.toggle('zero', !nw);
  document.getElementById('hWrongN').textContent = nw;
  document.getElementById('nStar').textContent = ns; document.getElementById('nStar').classList.toggle('zero', !ns);
  document.getElementById('hStarN').textContent = ns;
  document.getElementById('wHeadN').textContent = nw;
  document.getElementById('sHeadN').textContent = ns;
}
/* ===== 抽屉 ===== */
const openSheet  = id => document.getElementById(id).classList.add('open');
const closeSheet = id => document.getElementById(id).classList.remove('open');
function renderBook(kind){
  const ids = kind==='wrong' ? wrongIds() : starIds();
  const el = document.getElementById(kind==='wrong' ? 'wList' : 'sList');
  const emptyTxt = kind==='wrong' ? '错题本是空的，太棒了！' : '还没有收藏的题目，刷题时点题目旁的 ☆ 收藏。';
  if(!ids.length){ el.innerHTML = `<div class="empty-big"><span class="em">${kind==='wrong'?'🎉':'⭐'}</span>${emptyTxt}</div>`; return; }
  const byBank = {};
  ids.forEach(id => { const q = QMAP[id]; if(q){ (byBank[q.k] = byBank[q.k] || []).push(q); } });
  el.innerHTML = BANKS.filter(b=>byBank[b.k]).map(b =>
    `<div class="pgroup">${b.n}（${byBank[b.k].length}）</div>` +
    byBank[b.k].map(q => `
      <div class="item" data-jump="${qid(q)}" data-kind="${kind}">
        <div class="info"><div class="meta">第 ${q.s} 题 · ${TYPE_NAME[q.t]} · 答案 ${q.a}${q.d===2?' · 已修正':q.d===1?' · 存疑':''}</div>
          <div class="t">${esc(q.q)}</div></div>
        <span class="go">›</span>
        <button class="iwbtn" data-rm="${qid(q)}" data-kind="${kind}">${kind==='wrong'?'移出':'✕'}</button>
      </div>`).join('')
  ).join('');
}
function stripJump(id, mode){
  const q = QMAP[id]; if(!q) return;
  GZ.quick = null;
  st.bank = q.k; st.type = q.t; st.mode = mode; st.search = '';
  document.getElementById('bankSel').value = st.bank;
  document.getElementById('typeSel').value = st.type;
  document.getElementById('search').value = '';
  document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  st.sel = new Set(); st.graded = null; st.idx = 0;
  rebuild(false);
  const i = st.list.findIndex(x => qid(x) === id);
  if(i>=0){ st.idx = i; S.pos = S.pos || {}; S.pos[scopeKey()+'|'+st.mode] = st.idx; save(); }
  window.scrollTo({top:0}); render();
}
function renderStatsSheet(){
  // 分库卡片
  const per = BANKS.filter(b=>b.k!=='all').map(b => {
    const qs = RAW.filter(q=>q.k===b.k);
    const done = qs.filter(q => qid(q) in S.answered);
    const ok = done.filter(q => S.answered[qid(q)]===1).length;
    return {n:b.n, total:qs.length, done:done.length, ok, acc: done.length?Math.round(100*ok/done.length):null};
  });
  const ALL = per.reduce((a,x)=>({done:a.done+x.done, ok:a.ok+x.ok}), {done:0,ok:0});
  const all = {n:'全部题库', total:RAW.length, done:ALL.done, ok:ALL.ok, acc: ALL.done?Math.round(100*ALL.ok/ALL.done):null};
  const card = x => `
    <div class="statcard">
      <div class="nm">${x.n}<span>${x.done}/${x.total} 题 · 正确率 ${x.acc===null?'—':x.acc+'%'}</span></div>
      <div class="srow"><span class="lbl">已刷</span><div class="sbar done"><i style="width:${x.total?Math.round(100*x.done/x.total):0}%"></i></div></div>
      <div class="srow"><span class="lbl">正确</span><div class="sbar acc"><i style="width:${x.acc===null?0:x.acc}%"></i></div></div>
    </div>`;
  document.getElementById('statsBody').innerHTML = card(all) + per.map(card).join('');
  // 近 7 天练习量
  const days = []; for(let i=6;i>=0;i--) days.push(dstr(new Date(Date.now()-i*864e5)));
  const cnt = days.map(d => S.log.filter(r=>r.d===d).length);
  document.getElementById('c7Total').textContent = '近7天共 ' + cnt.reduce((a,b)=>a+b,0) + ' 题';
  const max = Math.max(...cnt, 1);
  document.getElementById('chart7').innerHTML = days.map((d,i) => {
    const lbl = i===6?'今天' : i===5?'昨天' : d.slice(5).replace('-','/');
    return `<div class="bcol"><span class="bv">${cnt[i]||''}</span><div class="bb" style="height:${Math.max( cnt[i]/max*100, cnt[i]?4:2 )}%;${cnt[i]?'':'opacity:.3'}"></div><span class="bl">${lbl}</span></div>`;
  }).join('');
  // 分题型正确率
  document.getElementById('typeAcc').innerHTML = ['单选','多选','判断'].map(t => {
    const recs = S.log.filter(r=>r.t===t);
    const ok = recs.filter(r=>r.ok===1).length;
    const acc = recs.length? Math.round(100*ok/recs.length)+ '%' : '—';
    return `<div class="srow"><span class="lbl">${t}</span><div class="sbar acc"><i style="width:${recs.length?Math.round(100*ok/recs.length):0}%"></i></div><span class="acc-t">${ok}/${recs.length} · ${acc}</span></div>`;
  }).join('');
}
function renderGrid(){
  const el = document.getElementById('gridWrap');
  document.getElementById('gCnt').textContent = st.list.length;
  if(!st.list.length){ el.innerHTML = '<div class="empty-big">当前范围没有题目</div>'; return; }
  el.innerHTML = '<div class="gridcells">' + st.list.map((q,i)=>{
    const a = S.answered[qid(q)];
    let c = 'gcell';
    if(a===1) c+=' ok'; else if(a===0) c+=' bad';
    if(i===st.idx) c+=' cur';
    const sm = S.starred[qid(q)] ? '<span class="stmark">★</span>' : '';
    return `<button class="${c}" data-i="${i}">${q.s}${sm}</button>`;
  }).join('') + '</div>' +
  `<div class="glegend"><span><i style="background:var(--green)"></i>答对</span><span><i style="background:var(--red)"></i>答错</span><span><i style="background:var(--card);border:1px solid var(--line)"></i>未刷</span><span><i style="border:2px solid var(--blue)"></i>当前</span><span>★ 已收藏</span></div>`;
  el.querySelectorAll('[data-i]').forEach(b => b.onclick = ()=>{
    closeSheet('sheetGrid'); jumpIdx(+b.dataset.i);
  });
}
function finishGroup(){
  const n = GZ.log.length, ok = GZ.log.filter(x=>x.ok===1).length;
  document.getElementById('dTag').textContent = n + ' 题';
  document.getElementById('dSub').textContent = '这组 ' + n + ' 题刷完了，再接再厉！';
  document.getElementById('dRate').textContent = n ? Math.round(100*ok/n)+'%' : '—';
  document.getElementById('dDone').textContent = n;
  document.getElementById('dOk').textContent = ok;
  document.getElementById('dBad').textContent = n-ok;
  openSheet('sheetDone');
}
function applyDark(){
  document.body.classList.toggle('dark', !!S.dark);
  const m = document.querySelector('meta[name=theme-color]');
  if(m) m.setAttribute('content', S.dark ? '#10141d' : '#2f6fd6');
}
/* ===== 事件 ===== */
document.getElementById('modeSeg').addEventListener('click', e => {
  if(e.target.dataset.m){ GZ.quick = null; setMode(e.target.dataset.m); }
});
document.getElementById('bankSel').onchange = e => { GZ.quick=null; st.bank=e.target.value; st.idx=0; st.sel=new Set(); st.graded=null; rebuild(); };
document.getElementById('typeSel').onchange = e => { GZ.quick=null; st.type=e.target.value; st.idx=0; st.sel=new Set(); st.graded=null; rebuild(); };
document.getElementById('search').oninput = e => { GZ.quick=null; st.search=e.target.value; st.idx=0; st.sel=new Set(); st.graded=null; rebuild(); };
document.getElementById('autoNext').onchange = e => { S.autoNext=e.target.checked; save(); };
document.getElementById('revealChk').onchange = e => { S.reveal=e.target.checked; save(); st.sel=new Set(); st.graded=null; render(); };
document.getElementById('darkChk').onchange = e => { S.dark=e.target.checked; save(); applyDark(); };
document.getElementById('sizeChips').addEventListener('click', e => {
  const b = e.target.closest('button[data-s]'); if(!b) return;
  S.size = parseInt(b.dataset.s); GZ.quick = null; save();
  document.querySelectorAll('#sizeChips button').forEach(x => x.classList.toggle('on', x === b));
  rebuild();
});
document.getElementById('resetBtn').onclick = () => {
  if(!confirm('确定清空全部答题记录和收藏吗？')) return;
  S.answered={}; S.starred={}; S.pos={}; S.log=[]; save();
  st.idx=0; st.sel=new Set(); st.graded=null; rebuild();
};
document.getElementById('prevBtn').onclick = () => step(-1);
document.getElementById('nextBtn').onclick = () => step(1);
document.getElementById('jumpBtn').onclick = () => { const v=parseInt(document.getElementById('jumpNo').value); if(v) jumpTo(v); };
document.getElementById('jumpNo').onkeydown = e => { if(e.key==='Enter') jumpTo(parseInt(e.target.value)); };
document.getElementById('stats').addEventListener('click', e => {
  if(e.target.id==='clearKw'){ st.search=''; document.getElementById('search').value=''; rebuild(); }
});
document.getElementById('hWrong').onclick = () => { renderBook('wrong'); openSheet('sheetWrong'); };
document.getElementById('hStar').onclick  = () => { renderBook('star'); openSheet('sheetStar'); };
document.getElementById('hSet').onclick   = () => openSheet('sheetSet');
document.querySelectorAll('#tabbar .tab-item').forEach(t => t.onclick = () => {
  const tab = t.dataset.tab;
  if(tab==='quiz'){ window.scrollTo({top:0}); render(); }
  if(tab==='wrong'){ renderBook('wrong'); openSheet('sheetWrong'); }
  if(tab==='star'){ renderBook('star'); openSheet('sheetStar'); }
  if(tab==='set'){ openSheet('sheetSet'); }
});
document.getElementById('wClose').onclick = () => closeSheet('sheetWrong');
document.getElementById('sClose').onclick = () => closeSheet('sheetStar');
document.getElementById('setClose').onclick = () => closeSheet('sheetSet');
document.getElementById('tClose').onclick = () => closeSheet('sheetStats');
document.getElementById('dClose').onclick = () => closeSheet('sheetDone');
document.getElementById('gClose').onclick = () => closeSheet('sheetGrid');
['sheetWrong','sheetStar','sheetSet','sheetStats','sheetDone','sheetGrid'].forEach(id => {
  document.getElementById(id).addEventListener('click', e => { if(e.target.id===id) closeSheet(id); });
});
document.getElementById('wRetry').onclick = () => {
  GZ.quick=null; st.bank='all'; st.type='all'; st.search=''; setMode('wrong');
  document.getElementById('bankSel').value='all'; document.getElementById('typeSel').value='all';
  document.getElementById('search').value=''; closeSheet('sheetWrong'); window.scrollTo({top:0});
};
document.getElementById('wClear').onclick = () => {
  if(!confirm('清空全部错题记录吗？这些题会回到“未刷”状态。')) return;
  wrongIds().forEach(id => delete S.answered[id]); save(); renderBook('wrong'); render();
};
document.getElementById('sRetry').onclick = () => {
  GZ.quick=null; st.bank='all'; st.type='all'; st.search=''; setMode('star');
  document.getElementById('bankSel').value='all'; document.getElementById('typeSel').value='all';
  document.getElementById('search').value=''; closeSheet('sheetStar'); window.scrollTo({top:0});
};
document.getElementById('sClear').onclick = () => {
  if(!confirm('清空全部收藏吗？')) return;
  starIds().forEach(id => delete S.starred[id]); save(); renderBook('star'); render();
};
document.getElementById('wList').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if(rm){ delete S.answered[rm.dataset.rm]; save(); renderBook('wrong'); render(); return; }
  const it = e.target.closest('[data-jump]');
  if(it){ closeSheet('sheetWrong'); stripJump(it.dataset.jump, 'wrong'); }
});
document.getElementById('sList').addEventListener('click', e => {
  const rm = e.target.closest('[data-rm]');
  if(rm){ delete S.starred[rm.dataset.rm]; save(); renderBook('star'); render(); return; }
  const it = e.target.closest('[data-jump]');
  if(it){ closeSheet('sheetStar'); stripJump(it.dataset.jump, 'star'); }
});
document.getElementById('dAgain').onclick = () => { closeSheet('sheetDone'); rebuild(); window.scrollTo({top:0}); };
document.getElementById('dGrid').onclick = () => { renderGrid(); openSheet('sheetGrid'); };
document.getElementById('dWrong').onclick = () => { closeSheet('sheetDone'); renderBook('wrong'); openSheet('sheetWrong'); };
document.getElementById('dHome').onclick = () => { closeSheet('sheetDone'); GZ.quick=null; setMode('random'); window.scrollTo({top:0}); };
document.addEventListener('keydown', e => {
  if(e.key==='Escape'){ ['sheetWrong','sheetStar','sheetSet','sheetStats','sheetDone','sheetGrid'].forEach(closeSheet); return; }
  if(['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
  if(document.querySelector('.mask.open')) return;
  if(e.key==='ArrowLeft') step(-1);
  else if(e.key==='ArrowRight') step(1);
  else if(e.key==='Enter' && st.graded) step(1);
  else if(/^[1-6]$/.test(e.key)){
    const q = cur(); if(!q || st.graded || S.reveal) return;
    const i = parseInt(e.key)-1;
    if(!q.o[i]) return;
    if(q.t==='多选'){ toggleSel(LT[i]); render(); } else gradeSingle(LT[i]);
  }
});
/* 初始化 */
document.getElementById('autoNext').checked = !!S.autoNext;
document.getElementById('revealChk').checked = !!S.reveal;
document.getElementById('darkChk').checked = !!S.dark;
document.querySelectorAll('#sizeChips button').forEach(b => b.classList.toggle('on', parseInt(b.dataset.s) === (S.size||0)));
applyDark();
buildBankSel();
document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === st.mode));
rebuild();
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  try{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }catch(e){}
}
</script>
</body>
</html>
