": 179, "t": "多选", "q": "在Linux命令行的通用格式中，其组成部分有哪些（ ）。", "o": ["命令字", "选项", "返回值", "参数"], "a": "ABD", "n": "【答案正确】Linux 命令行通用格式为：命令字 [选项] [参数/操作对象]，如 ls -l /etc：命令字指明做什么，选项控制执行方式（-a、--all 等），参数指明作用对象。\"返回值\"是命令执行后的退出状态（$?），不属于命令行本身的组成部分，故 ABD、不选 C。", "d": 0}, {"k": "y25linux", "s": 180, "t": "单选", "q": "Linux的NFS服务支持多种方式的身份验证方法,但不包含（ ）", "o": ["AUTH_DATABASE", "AUTH_NONE", "AUTH_SYS", "RPCSEC_GSS"], "a": "A", "n": "【答案正确】NFS 基于 RPC 的认证方式有 AUTH_NONE（空认证）、AUTH_SYS/AUTH_UNIX（按 UID/GID 的传统认证）和 RPCSEC_GSS（Kerberos 强认证），不存在 AUTH_DATABASE 这一类型，故\"不包含\"选 A。", "d": 0}, {"k": "y25linux", "s": 181, "t": "单选", "q": "Linux文件权限一共10位长度,分成四段,第三段表示的内容是()", "o": ["文件类型", "文件所有者的权限", "文件所有者所在组的权限", "其他用户的权限"], "a": "C", "n": "【答案正确】10 位权限按 1+3+3+3 分四段：第 1 段文件类型（d/-/l 等），第 2 段属主权限，第 3 段属组（文件所有者所在组）权限，第 4 段其他用户权限；如 -rwxr-x--- 的第三段 r-x 即组权限，选 C。", "d": 0}, {"k": "y25linux", "s": 182, "t": "判断", "q": "（ ）ping命令用于测试网络的连通性,ping命令通过ICMP协议(internet控制信息协议)来实现", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】ping 通过 ICMP 协议发送 Echo Request 并等待 Echo Reply，测试两主机间连通性与往返时延，是网络排障的第一步，说法完全正确。", "d": 0}, {"k": "y25linux", "s": 183, "t": "单选", "q": "在vi中下列哪些命令可以用来在光标前插入文本?（ ）", "o": ["p[text]", "a[text]", "i[text]", "o[text]"], "a": "C", "n": "【答案正确】i 在光标前进入插入模式（insert）；a 在光标后插入（append），o 在当前行下方新开一行插入，p 是把寄存器内容粘贴到光标后，都不是\"光标前插入\"。故选 i，即 C。", "d": 0}, {"k": "y25linux", "s": 184, "t": "单选", "q": "删除文件命令为:（ ）", "o": ["mkdir", "rmdir", "mv", "rm"], "a": "D", "n": "【答案正确】rm 删除文件（-r 递归删目录，-f 强制）；rmdir 只能删除空目录，mkdir 创建目录，mv 是移动/重命名。故删除文件的命令是 rm，选 D。", "d": 0}, {"k": "y25linux", "s": 185, "t": "判断", "q": "笛卡尔积对两个关系 R和 S进行乘操作，产生的关系中元组个数为两个关系中元组个数之积。（ ）", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】关系代数中笛卡尔积 R×S 的结果关系：属性数为 R、S 属性数之和，元组数为两关系元组数的乘积（|R|=m、|S|=n 时结果为 m×n 个元组），命题正确。注意与自然连接等区分，笛卡尔积不做条件匹配、直接两两组合。", "d": 0}, {"k": "y25linux", "s": 186, "t": "多选", "q": "Linux系统中的设备的类型包括（）", "o": ["字符设备", "块设备", "流设备", "缓冲设备"], "a": "AB", "n": "【答案正确】Linux 把设备分为字符设备（按字节流顺序访问、无缓冲，如终端、串口）和块设备（按块访问、可随机寻址、经页缓存，如磁盘），故 AB 入选。\"流设备\"是 System V STREAMS 机制术语、\"缓冲设备\"不是 Linux 的设备分类，均不选；网络设备虽算第三类接口，但选项中并无网络设备。", "d": 0}, {"k": "y25linux", "s": 187, "t": "单选", "q": "如果LILO被安装在MBR,使用命令即可卸载LILO（ ）", "o": ["lilo–u", "lilo–c", "lilo–v", "lilo-V"], "a": "A", "n": "【答案正确】lilo -u 会把安装 LILO 时备份的原引导扇区写回 MBR，从而卸载 LILO 恢复原引导程序；-v 是显示详细执行过程，-c 是 compact 选项（合并读取请求），-V 显示版本信息，均与卸载无关。", "d": 0}, {"k": "y25linux", "s": 188, "t": "判断", "q": "()使用init6和shutdown都可以关机", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】init 6 是切换到运行级 6，含义是\"重启\"而不是关机，关机对应 init 0（或 halt/poweroff）；shutdown 支持 -h now 关机、-r 重启。因此\"init6 和 shutdown 都可以关机\"不成立，判\"错误\"。", "d": 0}, {"k": "y25linux", "s": 189, "t": "单选", "q": "iptables可以设置NAT,它通过设置nat表中的PREROUTING规则链来允许（ ）", "o": ["网络数据包分片", "SNAT", "DNAT", "反向代理"], "a": "C", "n": "【已修正答案】平台原答案 B 有误（平台答案系 AI 生成、仅供参考），已按核验改为 C。nat 表的 PREROUTING 链在数据包到达本机、进行路由决策之前修改数据包目的地址，实现的是 DNAT（如把公网 IP:端口映射到内网服务器、发布内网服务）；iptables 中 DNAT 只允许在 PREROUTING/OUTPUT 链设置。SNAT（改源地址、内网共享上网）必须在 POSTROUTING 链设置，PAYLOAD 时机在出接口处。参考答案 B 与题干\"PREROUTING\"矛盾，应为 C；若原题链名本意是 POSTROUTING，则 B 才成立，疑为题干笔误（同类经典题即有两版本）。", "d": 2}, {"k": "y25linux", "s": 190, "t": "单选", "q": "我们将逻辑分区建立在（）分区上", "o": ["从分区", "扩展分区", "主分区", "第二分区"], "a": "B", "n": "【答案正确】MBR 磁盘最多 4 个主分区（或 3 主+1 扩展），逻辑分区不能直接建立在裸盘上，只能建立在扩展分区内部（从 5 号开始编号，如 sda5），故选 B\"扩展分区\"。其他选项\"从分区\"\"第二分区\"无此概念。", "d": 0}, {"k": "y25linux", "s": 191, "t": "单选", "q": "quota中inode是限制用户的()", "o": ["块", "目录", "字节", "文件"], "a": "D", "n": "【答案正确】磁盘配额（quota）对用户有两大限制维度：blocks 限制可用磁盘空间（KB 数），inode 限制可用文件（及目录项）个数——Linux 中每个文件占用一个 inode，所以 inode 限的是\"文件\"数量，选 D；\"字节\"对应 blocks 限制，目录不是配额计数单位。", "d": 0}, {"k": "y25linux", "s": 192, "t": "单选", "q": "下列关于Linux说法中,不正确的是（）", "o": ["Linux操作系统具有虚拟内存的能力", "Linux操作系统不是UNIX系统的变种,因此Linux上程序不适合UNIX平台上运行", "Linux操作系统不限制应用程序可用内存的大小", "Linux操作系统支持多用户,在同一时间可以有多个用户使用主机"], "a": "B", "n": "【答案正确】B 的结论错误：Linux 虽是\"类 UNIX\"而非 UNIX 变种，但它遵循 POSIX 标准，Linux 上的程序大多可移植到 UNIX 平台运行，因此\"不适合 UNIX 平台上运行\"是本题要选的不正确说法。A、D 是 Linux 的基本特性；C\"不限制应用程序可用内存大小\"在本题库口径中视为正确陈述（仅受物理内存与交换空间总量约束）。", "d": 0}, {"k": "y25linux", "s": 193, "t": "单选", "q": "在vi中存盘退出的命令是（ ）。", "o": [":q", ":q!", ":wq", ":exit"], "a": "C", "n": "【答案正确】:wq 保存并退出（等价 :x、ZZ），是标准的\"存盘退出\"命令；:q 仅在未修改时退出，:q! 不保存强制退出。术语提示：vim 中 :exit（:exi）与 :x 等价、也是存盘退出，属等价命令干扰项，教材标准答案取 :wq，判 C。", "d": 0}, {"k": "y25linux", "s": 194, "t": "单选", "q": "/etc/passwd文件用来存储( )信息?", "o": ["系统中所有用户的加密过的密码", "用户帐户信息和帐户的参数", "用户和组的加密后的密码", "所有用户和服务器的密码"], "a": "B", "n": "【答案正确】/etc/passwd 存储用户账户信息及账户参数：用户名、UID、GID、家目录、登录 shell 等（密码字段以 x 占位）。真正加密后的口令哈希存放于 /etc/shadow，组及其口令在 /etc/group，故 B 正确。", "d": 0}, {"k": "y25linux", "s": 195, "t": "判断", "q": "()硬连接既能建立对文件链接,也能对不同文件系统进行链接", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】硬链接是目录项对 inode 的直接引用，inode 号只在同一文件系统内有效，因此硬链接不能跨文件系统建立，也不能对目录创建硬链接；跨文件系统的链接只能用符号（软）链接。命题\"也能对不同文件系统进行链接\"错误，判\"错误\"。", "d": 0}, {"k": "y25linux", "s": 196, "t": "多选", "q": "下列属于DDL(数据定义语言)的命令是（    ）。", "o": ["CREATE", "ALTER", "DROP", "INSERT"], "a": "ABC", "n": "【答案正确】DDL（数据定义语言）负责定义/修改数据库对象：CREATE 创建库、表、索引等，ALTER 修改对象结构，DROP 删除对象，故 ABC 入选。INSERT 是 DML（数据操纵语言），操纵表中数据而非定义对象，不选。", "d": 0}, {"k": "y25linux", "s": 197, "t": "判断", "q": "新建JAVA环境变量，通常需要新建JAVA_HOME系统变量", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】部署 Java 应用通常需先设置 JAVA_HOME 指向 JDK 安装目录，再将其 bin 目录加入 PATH，是标准配置项。严格说 Linux 下应称“环境变量”（写入 /etc/profile 或 ~/.bash_profile），“系统变量”是 Windows 术语，但按出题意图判对。", "d": 0}, {"k": "y25linux", "s": 198, "t": "单选", "q": "NFS是系统()", "o": ["文件", "磁盘", "网络文件", "操作"], "a": "C", "n": "【答案正确】NFS 即 Network File System（网络文件系统），由 Sun 开发，允许主机通过网络挂载并共享远程目录，如同本地文件系统。选项 A“文件”、B“磁盘”、D“操作”仅是截取名词片段，均不完整。", "d": 0}, {"k": "y25linux", "s": 199, "t": "单选", "q": "在Linux系统中下列哪个文件不属于普通文件()", "o": ["文本文件", "数据文件", "可执行程序", "链接文件"], "a": "D", "n": "【答案正确】普通文件（ls 显示类型为 -）涵盖文本文件、数据文件和可执行程序；链接文件是独立的文件类型（符号链接显示为 l），不属于普通文件，故选 D。", "d": 0}, {"k": "y25linux", "s": 200, "t": "判断", "q": "（ ）进行字符串查找，使用grep命令", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】grep（global regular expression print）按给定字符串或正则在文本/输入流中查找并输出匹配行，是标准字符串查找命令；区别于 find（按文件属性找文件）和 awk（按字段处理）。", "d": 0}, {"k": "y25linux", "s": 201, "t": "单选", "q": "init是Linux系统的第一个进程,该进程是根据()文件来创建子进程的", "o": ["/etc", "/etc/inittab", "/etc/modules.conf", "/etc/lilo.conf"], "a": "B", "n": "【答案正确】【版本差异】SysV init 时代（RHEL5/6、老教材口径）init 作为 1 号进程读取 /etc/inittab 决定运行级并据此创建子进程，B 正确；systemd 时代（RHEL7+）init 即 systemd，不再读取 /etc/inittab，但按教材惯例本题仍判对。其余选项：/etc 是目录，modules.conf 是内核模块配置，lilo.conf 是引导装载程序配置。", "d": 0}, {"k": "y25linux", "s": 202, "t": "单选", "q": "文件的基本权限分为()", "o": ["rwx-", "rw-", "rwx", "rwxu"], "a": "C", "n": "【答案正确】文件基本权限就是读 r、写 w、执行 x 三种，对应选项 C“rwx”。A“rwx-”把“无该权限”也当成一种权限类别，B“rw-”漏掉执行权限，D“rwxu”多出无意义字符。", "d": 0}, {"k": "y25linux", "s": 203, "t": "多选", "q": "k8s的优点有（）", "o": ["可以管理大量跨主机的容器", "快速部署和扩展应用", "无缝对接新的应用功能", "节省资源，优化硬件资源的使用"], "a": "ABCD", "n": "【答案正确】ABCD 均为 Kubernetes 教材标准优点：A 可编排管理大量跨主机容器；B 应用可快速部署与弹性伸缩（自动扩缩容）；C 新应用功能可无缝对接（滚动升级/灰度发布）；D 容器共享宿主内核、按需调度，节省并优化硬件资源。应全选。", "d": 0}, {"k": "y25linux", "s": 204, "t": "单选", "q": "除非特别指定，cp假定要拷贝的文件在下面哪个目录下？（ ）", "o": ["用户目录", "home目录", "root目录", "当前目录"], "a": "D", "n": "【答案正确】cp 未用路径指明来源文件时，默认在当前工作目录查找源文件；用户目录、home 目录、root 目录都与 cp 的默认行为无关。这是经典考题。", "d": 0}, {"k": "y25linux", "s": 205, "t": "单选", "q": "iptables可以设置NAT,它通过设置nat表中的POSTROUTING来允许（ ）", "o": ["网络数据包分片", "SNAT", "DNAT", "反向代理"], "a": "B", "n": "【已修正答案】平台原答案 C 有误（平台答案系 AI 生成、仅供参考），已按核验改为 B。NAT 表中 POSTROUTING 链在路由判定之后、数据包离开本机时处理，只能做源地址转换，即 SNAT（MASQUERADE 也挂在此链）；DNAT 必须放在 PREROUTING 链，先改目的地址再查路由表，改动才对路由生效。题干明确说 POSTROUTING，对应应是 SNAT，参考答案 C（DNAT）弄错了链。", "d": 2}, {"k": "y25linux", "s": 206, "t": "单选", "q": "下列哪一个指令可以用来显示档案的内容()", "o": ["cat", "dir", "rm", "pwd"], "a": "A", "n": "【答案正确】cat 连接文件并输出到标准显示，是显示档案内容的标准命令。dir 是 DOS/Windows 习惯的列目录命令，rm 删除文件，pwd 显示当前路径，都不能显示文件内容。", "d": 0}, {"k": "y25linux", "s": 207, "t": "单选", "q": "显示当前路径的命令是（ ）。", "o": ["pwd", "cd", "ls", "ln"], "a": "A", "n": "【答案正确】pwd（print working directory）显示当前工作目录的绝对路径；cd 仅切换目录，ls 列出目录内容，ln 创建链接。", "d": 0}, {"k": "y25linux", "s": 208, "t": "判断", "q": "（ ）在使用ls命令时,用八进制形式显示非打印字符应使用参数-P", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】用八进制形式显示非打印字符应使用参数 -b（--escape），如制表符显示为 \\t 形式的八进制转义；ls 并无 -P 这个参数（-p 只给目录名加 /）。题干说 -P，故判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 209, "t": "判断", "q": "Nagios可作为负载均衡器", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Nagios 是开源的主机/服务状态监控与告警系统，只监测和报警，不转发业务流量；负载均衡由 LVS、Haproxy、nginx 等实现，故说法错误。", "d": 0}, {"k": "y25linux", "s": 210, "t": "单选", "q": "在Shell脚本中,用来读取文件内各个域的内容并将其赋值给Shell变量的命令是（ ）。", "o": ["fold", "join", "tr", "read"], "a": "D", "n": "【答案正确】read 是 Shell 内建命令，从标准输入读入一行并按分隔符把各域内容赋给 Shell 变量（常配合 while read 逐行读取文件）；fold 是按列宽折行，join 用于按字段连接两个文件，tr 做字符转换，都无读取赋值功能。", "d": 0}, {"k": "y25linux", "s": 211, "t": "判断", "q": "（ ）Iptables不能阻止ICMP包", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】iptables 完全可以控制 ICMP 包，例如 iptables -A INPUT -p icmp --icmp-type echo-request -j DROP 可拒绝 ping。“不能阻止 ICMP 包”的说法错误，判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 212, "t": "单选", "q": "哪个符号加在命令后面可以在后台执行程序（ ）。", "o": ["@", "&", "#", "*"], "a": "B", "n": "【答案正确】命令后加 & 表示放入后台执行，Shell 立即返回并显示任务号与进程号；@ 与 #、* 分别不是/是注释符与通配符，均无后台运行含义。", "d": 0}, {"k": "y25linux", "s": 213, "t": "单选", "q": "在i节点表中的磁盘地址表中，若一个文件的长度是从磁盘地址表的第1块到第11块，则该文件共占有块号（ ）", "o": ["256", "266", "11", "256×10"], "a": "B", "n": "【答案正确】老教材 i 节点磁盘地址表中前 10 项为直接块指针，文件长度用到“第 1 块到第 11 块”即 10 个直接块加第 11 项（一次间接块）；按 1KB 盘块、每地址 4 字节计，一个间接块可容纳 256 个块号，故文件共占 10+256=266 块。A(256) 只计了间接块，C(11) 是地址表项数，D(256×10) 无依据。", "d": 0}, {"k": "y25linux", "s": 214, "t": "多选", "q": "下列属于DML(数据操纵语言)的命令是（    ）。", "o": ["INSERT", "DELETE", "UPDATE", "SELECT"], "a": "ABCD", "n": "【答案正确】教材惯例 SQL 分三类：DDL 数据定义（CREATE/ALTER/DROP）、DML 数据操纵（INSERT/DELETE/UPDATE/SELECT，操作表中数据）、DCL 数据控制（GRANT/REVOKE），四条命令均属 DML，应全选 ABCD。（严格分类中 SELECT 有时单列为 DQL，但国内教材口径包含于 DML。）", "d": 0}, {"k": "y25linux", "s": 215, "t": "单选", "q": "常见的安装Linux的五种方法为:光盘硬盘FTPHTTP及（ ）", "o": ["ghost", "克隆", "email", "NFS"], "a": "D", "n": "【答案正确】老教材总结的 Linux 五种安装方式为光盘、硬盘、FTP、HTTP 及 NFS 网络安装；ghost/克隆是磁盘镜像复制工具（且 Linux 安装不外发 mail），email 不可能作为安装源。", "d": 0}, {"k": "y25linux", "s": 216, "t": "单选", "q": "Linux文件类型常见的有：普通文件目录字符设备文件块设备文件（ ）等", "o": ["符号链接文件", "可执行文件", "临时文件", "系统文件"], "a": "A", "n": "【答案正确】Linux 常见文件类型：普通文件、目录、字符设备文件、块设备文件、符号链接文件（另有套接字和管道，共七类，ls 中依次为 -、d、c、b、l、s、p）。可执行文件本质是普通文件，“临时文件”“系统文件”不是文件类型概念，故选 A。", "d": 0}, {"k": "y25linux", "s": 217, "t": "单选", "q": "网络管理员对WWW服务器进行访问控制存取和运行等控制,这些控制可在文件中体现（ ）", "o": ["httpd.conf", "lilo.conf", "inetd.conf", "resolv.conf"], "a": "A", "n": "【答案正确】WWW 服务（Apache）的访问控制、存取授权和运行参数等均集中在主配置文件 httpd.conf（RHEL5/6 位于 /etc/httpd/conf/httpd.conf）。lilo.conf 是引导程序配置，inetd.conf 是超级守护进程配置，resolv.conf 只配置 DNS 客户端解析。", "d": 0}, {"k": "y25linux", "s": 218, "t": "单选", "q": "Linux中，不同性质的文件用不同的颜色来区分，红色的文件代表()", "o": ["可执行文件", "只读文件", "压缩文件", "普通文件"], "a": "C", "n": "【答案正确】ls 彩色显示惯例：红色为压缩/归档文件（如 .tar、.gz、.zip），绿色为可执行文件，蓝色为目录，浅蓝色为符号链接，白色为普通文件，故红色代表压缩文件。", "d": 0}, {"k": "y25linux", "s": 219, "t": "判断", "q": "（ ）对于vi编辑器的工作模式有两种:命令模式和插入模式", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】按教材惯例 vi 有三种工作模式：命令模式（普通模式）、插入模式和末行（底行）模式；题干只说两种，漏了末行模式，判“错误”正确。（国外部分资料称两种基本模式，但国内教材与考试口径为三种。）", "d": 0}, {"k": "y25linux", "s": 220, "t": "多选", "q": "以下哪些是ansible 的特点（）", "o": ["部署简单，只需在主控端部署Ansible环境，被控端无需做任何操作", "配置简单、功能强大、扩展性强", "通过Playbooks来定制强大的配置、状态管理", "轻量级，无需在客户端安装agent，更新时，只需在操作机上进行一次更新即可"], "a": "ABCD", "n": "【答案正确】ABCD 均为 Ansible 标准特点：A 简单部署，仅主控端安装、被控端无 agent（基于 SSH）；B 配置简单、模块丰富、扩展性强；C 通过 Playbook 定制配置与状态管理；D 轻量级，升级只需更新操作机。应全选。", "d": 0}, {"k": "y25linux", "s": 221, "t": "判断", "q": "（ ）名称服务器要么是递归的，要么是非递归的", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】递归与否是名称服务器的二选一属性（《DNS 与 BIND》教材原文口径）：递归服务器代替解析器完成全部查询直到得出最终答案；非递归（迭代）服务器只返回它已知的最佳信息或授权线索，如根服务器即是非递归的。", "d": 0}, {"k": "y25linux", "s": 222, "t": "单选", "q": "在日常管理中，通常CPU会影响系统性能的情况是：（ ）", "o": ["CPU已满负荷地运转", "CPU的运行效率为30%", "CPU的运行效率为50%", "CPU的运行效率为80%"], "a": "A", "n": "【答案正确】影响系统性能的是资源瓶颈状态，CPU 已满负荷运转即为瓶颈；运行效率 30%~80% 均留有余量，属正常负载，不构成性能问题。这是经典考题。", "d": 0}, {"k": "y25linux", "s": 223, "t": "单选", "q": "在Linux中,下列哪个不是主流的电子邮件服务器软件（ ）", "o": ["Sendmail服务器", "Postfix服务器", "Qmail服务器", "Pop3服务器"], "a": "D", "n": "【答案正确】Sendmail、Postfix、Qmail 是三个主流 MTA（邮件传输代理）服务器软件；POP3 只是接收邮件的应用层协议（邮局协议），所谓“Pop3 服务器”对应的是收信服务，不是主流邮件服务器软件，故选 D。", "d": 0}, {"k": "y25linux", "s": 224, "t": "单选", "q": "哪个命令可以将普通用户转换成超级用户（ ）。", "o": ["super", "passwd", "tar", "Su"], "a": "D", "n": "【答案正确】su（switch user，不带用户名默认切换为 root）可让普通用户输入 root 口令后成为超级用户；passwd 只改口令，tar 打包归档，super 非标准命令。【术语提示】命令规范写法为小写 su。", "d": 0}, {"k": "y25linux", "s": 225, "t": "单选", "q": "不是邮件系统的组成部分()", "o": ["用户代理", "代理服务器", "传输代理", "投递代理"], "a": "B", "n": "【答案正确】邮件系统由用户代理 UA（撰写/收取信件）、传输代理 MTA（如 sendmail/postfix，负责服务器间转发）和投递代理 MDA（把邮件放入用户邮箱）组成；“代理服务器”（HTTP 代理等）不属于邮件系统组成部分，故选 B。", "d": 0}, {"k": "y25linux", "s": 226, "t": "判断", "q": "（ ）Sendmail邮件系统使用的两个主要协议是:SMTP和POP，前者用来发送邮件，后者用来接收邮件", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】SMTP（简单邮件传输协议）用于发送和中转邮件，POP（POP3，邮局协议）用于用户从服务器端收取邮件，是 sendmail 时代教材的标准表述。（现代邮件系统收信也可用 IMAP，但本题按教材口径判对。）", "d": 0}, {"k": "y25linux", "s": 227, "t": "单选", "q": "Iptables通过向（ ）表添加规则,来对系统的网络数据包进行过滤操作", "o": ["filter", "nat", "mangle", "post"], "a": "A", "n": "【答案正确】对网络数据包按规则进行过滤的是 filter 表（包含 INPUT/FORWARD/OUTPUT 链）；nat 表用于地址转换，mangle 表用于修改报文字段，“post”不是 iptables 的表。故选 A。", "d": 0}, {"k": "y25linux", "s": 228, "t": "单选", "q": "若要将鼠标从VM中释放出来，可按()键来实现", "o": ["Ctrl+Alt", "Ctrl+Alt+Del", "Ctrl+Alt+Enter", "Ctrl+Enter"], "a": "A", "n": "【答案正确】VMware 中默认按 Ctrl+Alt 把鼠标、键盘焦点从虚拟机释放回宿主机（Ctrl+Alt+Enter 是切换全屏）。【版本差异】不同虚拟化软件快捷键不同（如 VirtualBox 用右 Ctrl），但本题按出题意图（VMware）判对。", "d": 0}, {"k": "y25linux", "s": 229, "t": "单选", "q": "Linux文件权限一共10位长度，分成四段，第三段表示的内容是()", "o": ["文件类型", "文件所有者的权限", "文件所有者所在组的权限", "其他用户的权限"], "a": "C", "n": "【答案正确】10 位权限分四段：第 1 段（1 位）为文件类型，第 2 段（3 位）为所有者权限，第 3 段（3 位）为所有者所在组权限，第 4 段（3 位）为其他用户权限，如 rwxr-x---，故第三段是组权限，选 C。", "d": 0}, {"k": "y25linux", "s": 230, "t": "多选", "q": "在Linux中，Fork后子进程保留了父进程的什么？", "o": ["环境变量", "父进程的文件锁", "当前工作目录", "进程号"], "a": "AC", "n": "【答案正确】fork 复制父进程的地址空间，子进程继承环境变量副本（A 对），当前工作目录、根目录及打开的文件描述符也一并继承（C 对）。但文件锁不被子进程继承（归父进程），子进程必然获得新分配的进程号，B、D 不选。答案 AC 恰好正确。", "d": 0}, {"k": "y25linux", "s": 231, "t": "判断", "q": "（ ）邮件系统由三部分组成:用户代理(ua)传输代理(ta)和投递代理(da)其中传输代理功能是将邮件放入用户的邮箱", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】邮件系统确实由用户代理(UA)、传输代理(TA/MTA)和投递代理(MDA/DL)三部分组成，但传输代理的职能是在服务器之间传输与路由邮件；把邮件放入用户邮箱的是投递代理。题干张冠李戴，判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 232, "t": "单选", "q": "要配置NFS服务器，在服务器端主要配置文件（ ）", "o": ["/etc/rc.d/rc.inet1", "/etc/rc.d/rc.M", "/etc/exports", "/etc/rc.d/rc.S"], "a": "C", "n": "【答案正确】NFS 服务器端主要配置文件是 /etc/exports，其中定义共享目录、客户端及权限，修改后需 exportfs -r 使其生效；其余三项（rc.inet1、rc.M、rc.S）均为 Slackware 系统启动脚本，与 NFS 配置无关。", "d": 0}, {"k": "y25linux", "s": 233, "t": "单选", "q": "下列格式化某分区命令正确的是（ ）", "o": ["mkfs-text2/dev/hdb6", "format/dev/hdb2", "format-text3/dev/had", "makefile-text2/dev/hdb4"], "a": "A", "n": "【答案正确】【题目缺陷】A 项本意为 mkfs -t ext2 /dev/hdb6（空格丢失且把 ext2 排成 text2），是四个选项中唯一正确的 Linux 格式化分区命令写法；format 是 DOS/Windows 命令，C 项“had”应为 hda，makefile 项纯属杜撰。按出题意图 A 正确。", "d": 0}, {"k": "y25linux", "s": 234, "t": "判断", "q": "（ ）DNS的从服务器通过“区传送”操作从主服务器获取它的数据", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】DNS 从服务器（辅服务器）通过区传送（zone transfer，AXFR/IXFR，基于 TCP/53）从主服务器获取并同步区域数据，这是主从架构的标准数据来源方式，说法正确。", "d": 0}, {"k": "y25linux", "s": 235, "t": "单选", "q": "网络管理具备以下几大功能：配置管理（）、性能管理安全管理和计费管理等", "o": ["故障管理", "日常备份管理", "升级管理", "发送邮件"], "a": "A", "n": "【答案正确】OSI 定义的网络管理五大功能域为 FCAPS：故障管理(Fault)、配置管理(Configuration)、计费管理(Accounting)、性能管理(Performance)和安全管理(Security)，题中缺的一格是故障管理，选 A；日常备份、升级管理、发送邮件均不属五大功能。", "d": 0}, {"k": "y25linux", "s": 236, "t": "单选", "q": "文件权限读写执行的三种标志符号依次是()", "o": ["rwx", "xrw", "rdx", "srw"], "a": "A", "n": "【答案正确】读、写、执行三种权限的标志符号依次为 r(read)、w(write)、x(execute)，顺序固定为 rwx；B“xrw”顺序错，C“rdx”中 d 不是权限字符，D“srw”中 s 是 setuid 位而非基本权限。", "d": 0}, {"k": "y25linux", "s": 237, "t": "判断", "q": "()防火墙主要是用来防病毒的", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】防火墙（如 iptables）依据规则在网络层/传输层乃至应用层过滤和控制进出流量，防病毒是杀毒软件/防病毒网关的职能，二者功能不同，故该说法错误。", "d": 0}, {"k": "y25linux", "s": 238, "t": "多选", "q": "关于vim编辑器中将全文中所有str1替换为str2，下列正确的有（   ）", "o": ["：%s/str1/str2/g", ":s/str1/str2/g", ":%s#str1#str2#", ":%s#str1/#str2/#"], "a": "AC", "n": "【答案存疑】A“:%s/str1/str2/g”明确正确（% 范围全文 + g 每行全部替换）；B“:s/str1/str2/g”缺少 %，只作用于当前行，错；C“:%s#str1#str2#”考察用 # 替代 / 作分隔符，但缺 g 标志，严格说只替换每行第一个匹配，不能完成“替换所有”；D 实际把“str1/”替换成“str2/”，语义与题不符。严格的技术正确集只有 A；若 C 项原题带 g（:%s#str1#str2#g）则 AC 正确。按出题意图（考全文范围与分隔符替换）倾向 AC，但严格判定需补 g，故标存疑。", "d": 1}, {"k": "y25linux", "s": 239, "t": "单选", "q": "要改变文件的拥有者，使用命令（ ）", "o": ["chgrp", "chown", "chsh", "chmod"], "a": "B", "n": "【答案正确】chown（change owner）改变文件拥有者，可同时改组（chown user:group file）；chgrp 只改变所属组，chsh 改变登录 Shell，chmod 改变访问权限。区别清楚，选 B。", "d": 0}, {"k": "y25linux", "s": 240, "t": "单选", "q": "Linux至少定义了7个“运行级”,其中运行级（ ）代表单用户模式", "o": ["0", "1", "2", "6"], "a": "B", "n": "【答案正确】SysV 运行级共定义 0~6 七个：0 停机、1 单用户（维护）模式、2 不带 NFS 的多用户、3 完整多用户字符模式、5 图形模式、6 重启；代表单用户模式的是运行级 1，选 B。", "d": 0}, {"k": "y25linux", "s": 241, "t": "单选", "q": "下面哪段定义了添加一个tar文件的信息（ ）。", "o": ["usetheappendcommand", "usetheaddcommand", "usethetarcommandwiththe-aswitch", "usethetarcommandwiththe-rswitch"], "a": "D", "n": "【答案正确】【题目缺陷】选项为英文且空格丢失，D 本意为 use the tar command with the -r switch。向 tar 归档中添加文件应使用 tar -r（--append）；A/B 中的 append、add 不是独立命令，C 的 -a（--auto-compress）是根据后缀自动选压缩程序的选项，均可排除。按出题意图 D 正确。", "d": 0}, {"k": "y25linux", "s": 242, "t": "单选", "q": "使用traceroute跟踪IP包时,当某个网关把TTL减少到0时,它就丢弃这个包并把一则ICMP（）消息返回给源主机", "o": ["timeexceeded", "TimestampReply", "Timestamp", "EchoReply"], "a": "A", "n": "【答案正确】网关将 TTL 减到 0 时丢弃报文，并向源主机回送 ICMP 超时（Time Exceeded，类型 11）消息；traceroute 正是利用该消息逐跳发现路由。Timestamp/TimestampReply 是时间戳报文，EchoReply 是 ping 回应报文，均不符。题干排版应为 time exceeded。", "d": 0}, {"k": "y25linux", "s": 243, "t": "单选", "q": "下列哪一指令无法用来传输档案（ ）", "o": ["ftp", "wget", "lynx", "file"], "a": "D", "n": "【答案正确】ftp 是文件传输协议客户端，wget 支持 HTTP/FTP 下载文件，lynx 是文本浏览器也能下载档案，三者均可传输/获取文件；file 只用于探测文件类型，无法用于传输，故选 D。", "d": 0}, {"k": "y25linux", "s": 244, "t": "判断", "q": "（ ）Shell是一个命令解释器", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Shell（bash、sh 等）是命令解释器：接收并解释用户输入的命令，调用相应程序、桥接用户与内核，同时也解释执行 Shell 脚本，说法正确。", "d": 0}, {"k": "y25linux", "s": 245, "t": "判断", "q": "（ ）对于Linux的DNS服务器，主服务器从服务器和仅缓存服务器的差异在于两个特征:数据的来源和服务器对该域是否权威", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】《DNS 与 BIND》教材原文口径：主服务器、从服务器和仅缓存服务器可从两方面特征区分——数据来源（区域文件/区传送/仅缓存）以及服务器对该域是否具有权威；仅缓存服务器对任何域都非权威。说法正确。", "d": 0}, {"k": "y25linux", "s": 246, "t": "单选", "q": "用下面哪个命令可以不用退出vi编辑器来切换文件（ ）。", "o": ["：eforeditcommand", "mA.command", "exportcommand", "setcommand"], "a": "A", "n": "【答案正确】【题目缺陷】【选项文本有误】vi中用“:e 文件名”（edit命令）可不必退出编辑器直接打开另一文件实现切换，A项“：eforeditcommand”系排版错乱，本意即“:e（edit命令）”。其余选项对应map/export/set类命令（mA.command疑为map command），均不能在不退出的情况下切换文件，仅A含:e，为唯一合意图答案。", "d": 0}, {"k": "y25linux", "s": 247, "t": "单选", "q": "当一个目录作为一个挂载点被使用后,该目录上的原文件( )", "o": ["被永久删除", "被隐藏,待挂载设备卸载后恢复", "被放入回收站", "被隐藏,待计算机重新启动后恢复"], "a": "B", "n": "【答案正确】目录作为挂载点挂上新文件系统后，原内容只是被遮盖而暂时不可见，数据并未删除；卸载（umount）该设备后原文件立即恢复可见，与回收站、重新启动均无关，故选B。", "d": 0}, {"k": "y25linux", "s": 248, "t": "多选", "q": "想对一个文件进行读操作，可以这样操作（     ）。", "o": ["如果是属主，赋予r权限", "如果是属组，赋予r权限", "如果是其他用户赋予其他用户r", "也可设置facl访问权限"], "a": "ABCD", "n": "【答案正确】让用户能读文件有四条授权途径：属主位r、该用户所在属组位r、其他用户位r，以及用setfacl为特定用户/组授予r的ACL，四条均成立，ABCD全部入选，无多选漏选。", "d": 0}, {"k": "y25linux", "s": 249, "t": "判断", "q": "()用户标识码UID和组标识码GID的编号从501开始，若创建用户帐号或组群时未指定标识码，则系统会自动指定从编号501开始且尚未使用的号码", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】判“错误”成立：RHEL5/6教材口径普通用户UID、GID默认从500开始（/etc/login.defs的UID_MIN=500），RHEL7及以后改为从1000开始，均不是501（501是macOS首个普通用户的编号，非Linux惯例），故“从501开始”的说法错误。", "d": 0}, {"k": "y25linux", "s": 250, "t": "单选", "q": "当运行在多用户模式下时，用Ctrl+ALT+F*可以切换多少虚拟用户终端（ ）。", "o": ["3.0", "6.0", "1.0", "12"], "a": "B", "n": "【答案正确】RHEL多用户（文本）模式下Ctrl+Alt+F1～F6共提供6个虚拟控制台（F7通常为图形环境），选对应“6”的B；选项“6.0”“3.0”的小数尾巴是表格导出痕迹，实为整数6。", "d": 0}, {"k": "y25linux", "s": 251, "t": "单选", "q": "如果你想列出当前目录以及子目录下所有扩展名为\".txt\"的文件，那么您可以使用的命令是（ ）。", "o": ["ls*.txt", "find-name\".txt\"", "ls-d.txt", "find.\"txt\""], "a": "B", "n": "【已修正答案】平台原答案 A 有误（平台答案系 AI 生成、仅供参考），已按核验改为 B。【选项文本有误】题干要求列出“当前目录以及子目录下”所有.txt文件，只有递归查找的find能满足，B项本意为‘find . -name *.txt’（排版丢失了空格和通配符星号）。A的ls *.txt只能按通配符列出当前目录下的.txt文件，无法进入子目录；C为ls -d .txt只列出目录项本身；D为find . .txt缺少-name测试条件，三者均不符合题意。", "d": 2}, {"k": "y25linux", "s": 252, "t": "单选", "q": "在linux中与用户有关的文件为（ ）。", "o": ["/etc/passwd和/etc/shadow", "/etc/passwd和/etc/grpoup", "/etc/passwd和/etc/gshadow", "/etc/shadow和/etc/group"], "a": "A", "n": "【答案正确】与用户账号直接相关的文件是/etc/passwd（账号基本信息）和/etc/shadow（加密口令）；/etc/group与/etc/gshadow是组相关文件（B项grpoup还拼错），故选A。", "d": 0}, {"k": "y25linux", "s": 253, "t": "单选", "q": "系统中有用户user1和user2，同属于users组在user1用户目录下有一文件file1，它拥有644的权限，如果user2用户想修改user1用户目录下的file1文件，应拥有权限( )", "o": ["744", "664", "646", "746"], "a": "B", "n": "【答案正确】user2与user1同属users组，对file1起作用的是属组权限。644即rw-r--r--，属组仅r；user2要修改须给属组加w，即664（rw-rw-r--）。744、746、646只增强属主或其他用户位，属组仍为r--，user2均无法写入。", "d": 0}, {"k": "y25linux", "s": 254, "t": "多选", "q": "以下哪几种是vi的工作模式（）", "o": ["命令模式", "删除模式", "编辑模式", "末行模式"], "a": "ACD", "n": "【答案正确】vi的三种工作模式为命令模式、编辑（插入）模式、末行（ex）模式，ACD正确；不存在“删除模式”，删除是命令模式下的指令（如dd、x），故B不选。", "d": 0}, {"k": "y25linux", "s": 255, "t": "单选", "q": "权限741为rwxr----x，那么权限652是?()", "o": ["rwxr-x-w-", "r-xrwx-wx", "r-xrwx-w-", "rw-r-x-w-"], "a": "D", "n": "【答案正确】652逐位换算：6=rw-、5=r-x、2=-w-，合为rw-r-x-w-，即D；A为752、B为573、C为572，均与652不符。", "d": 0}, {"k": "y25linux", "s": 256, "t": "单选", "q": "下面描叙错误的是()", "o": ["x代表是可执行权限", "linux可运行级别有6个", "apacheserver是目前用的最多的webserver", "linux是自由软件"], "a": "B", "n": "【答案正确】Linux运行级别编号为0～6共7个（0关机、1单用户、6重启等），“有6个”正是错误描述，选B；x为可执行权限位、Apache为当年使用最广的Web服务器、Linux内核遵循GPL属自由软件均为正确表述，不作选。", "d": 0}, {"k": "y25linux", "s": 257, "t": "判断", "q": "（ ）从Vi中的输入模式返回到命令模式按“:”键", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】从输入（插入）模式返回命令模式必须按Esc键；“:”键是在命令模式下进入末行模式的按键，题述说法相反，判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 258, "t": "单选", "q": "下面哪个配置文件用来定义syslog的后台进程()", "o": ["system.conf", "syslog.conf", "syslogd", "slog.conf"], "a": "B", "n": "【答案正确】syslogd守护进程按/etc/syslog.conf定义的规则记录日志，选B；syslogd是进程本身而非配置文件，system.conf、slog.conf均不对应。【版本差异】RHEL6起改用rsyslog，配置文件为/etc/rsyslog.conf，本题按老教材syslog.conf口径判对。", "d": 0}, {"k": "y25linux", "s": 259, "t": "判断", "q": "（ ）电子邮件系统使用邮件交换记录NX来更有效地路由邮件", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】DNS中负责邮件路由的是MX（邮件交换）记录，用来指出处理该域邮件的服务器及优先级；不存在“NX记录”（NX只出现在应答状态码NXDOMAIN中），题述说法错误，判“错误”成立。【术语提示】若原意是MX则该句本身成立，但按题面“NX”作答与参考答案一致。", "d": 0}, {"k": "y25linux", "s": 260, "t": "单选", "q": "在Linux系统上常用的软件包格式有两种:RPM和()", "o": ["deb", "exe", "msi", "apk"], "a": "A", "n": "【答案正确】Linux常用软件包格式为RPM（RedHat系：RHEL/CentOS/Fedora）和DEB（Debian系：Debian/Ubuntu）两种，选A；exe、msi是Windows格式，apk是Android安装包。", "d": 0}, {"k": "y25linux", "s": 261, "t": "判断", "q": "（ ）A记录是DNS数据库的核心，在RFC1035中作了规定", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】A记录实现主机名到IPv4地址的映射，是DNS区域数据库中最基本、最主要的记录类型（教材称“核心”），其定义确实出自RFC 1035，判“正确”成立。", "d": 0}, {"k": "y25linux", "s": 262, "t": "单选", "q": "以下哪个vi命令可以在当前位置插入/etc/passwd文本文件（ ）。", "o": [":r/etc/passwd", ":I/etc/passwd", ":w/etc/passwd", ":s/etc/passwd"], "a": "A", "n": "【答案正确】末行命令“:r /etc/passwd”把指定文件内容读入并插入到当前光标所在行之后，正是“在当前位置插入文件”；:w是写出保存，:s是替换命令，:I并非插入文件的命令，故选A。", "d": 0}, {"k": "y25linux", "s": 263, "t": "单选", "q": "当使用mount进行设备或者文件系统挂载的时候，需要用到的设备名称位于（ ）目录", "o": ["/home", "/bin", "/etc", "/dev"], "a": "D", "n": "【答案正确】Linux“一切皆文件”，设备文件统一存放在/dev目录（如/dev/sda、/dev/cdrom），mount挂载时引用的设备名来自/dev；/bin存放命令、/etc存放配置、/home是用户主目录，选D。", "d": 0}, {"k": "y25linux", "s": 264, "t": "多选", "q": "对于linux系统的EXT3文件系统，下面关于i节点描述正确的是：（ ）。", "o": ["i节点和文件是一一对应的", "i节点能描述文件占用的块数", "i节点描述了文件大小和指向数据块的指针", "通过i节点实现文件的逻辑结构和物理结构的转换"], "a": "BCD", "n": "【答案正确】inode中记录文件类型/权限、文件大小、占用块数及指向数据块（含直接/间接块）的指针，是连接文件逻辑结构与物理存储结构的桥梁，B、C、D均正确。A不选：硬链接可使多个文件名（目录项）共享同一inode，空闲inode也不对应任何文件，“i节点和文件一一对应”的表述不成立。", "d": 0}, {"k": "y25linux", "s": 265, "t": "单选", "q": "linux临时目录一般存在下面那个文件夹中（ ）。", "o": ["/tmp", "/proc", "/data", "/dev"], "a": "A", "n": "【答案正确】/tmp是系统临时文件目录，所有用户可写（带粘滞位），系统会定期或重启后清理；/proc是内核与进程信息的虚拟文件系统，/dev是设备文件目录，/data并非标准目录，选A。", "d": 0}, {"k": "y25linux", "s": 266, "t": "单选", "q": "如果要列出一个目录下的所有文件需要使用命令行（ ）", "o": ["ls–l", "ls", "ls–a(所有)", "ls–d"], "a": "C", "n": "【答案正确】要列出目录下“所有文件”必须包含以.开头的隐藏文件，用ls -a；缺省ls不显示隐藏文件，ls -l是带属性的长格式（同样不含隐藏文件），ls -d只列目录本身，选C。选项中的长划“–”应为半角“-”，属排版瑕疵。", "d": 0}, {"k": "y25linux", "s": 267, "t": "判断", "q": "()Linux操作系统不能像windows那样使用桌面系统", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Linux可以安装并运行GNOME、KDE等桌面环境（RHEL/CentOS安装时即可选择图形界面），完全能够像Windows一样使用桌面系统，题述说法与事实不符，判“错误”正确。", "d": 0}, {"k": "y25linux", "s": 268, "t": "单选", "q": "安装Linux所要的两个最根本的分区分别是以()和()为挂载标志的", "o": ["/和boot", "/和swap", "root和boot", "/和root"], "a": "B", "n": "【答案正确】按教材惯例，Linux安装至少需要两个根本分区：根分区的挂载点/和交换分区swap，选B；“root”只是目录名而非挂载标志，/boot虽常用但属可选分区，“/和root”的写法也不成立。", "d": 0}, {"k": "y25linux", "s": 269, "t": "单选", "q": "iptables中（ ）链匹配目的IP是本机的数据包", "o": ["FORWARD", "INPUT", "OUTPUT", "PREROUTING"], "a": "B", "n": "【答案正确】iptables的INPUT链处理目的IP为本机的数据包；FORWARD链处理经本机转发的包，OUTPUT链处理本机发出的包，PREROUTING是路由前转换链（nat/mangle表），不是本机入包的最终过滤点，选B。", "d": 0}, {"k": "y25linux", "s": 270, "t": "判断", "q": "（）PTR(指针)记录执行从IP地址到主机名的反向映射", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】PTR（指针）记录位于in-addr.arpa反向区域中，将IP地址映射回主机名，实现从IP到主机名的反向查询，判“正确”成立。", "d": 0}, {"k": "y25linux", "s": 271, "t": "多选", "q": "linux中ls命令的作用有（　　）", "o": ["-a可显示当前目录内的所有文件", "与dir命令类似", "-A与-a功能相同，但显示的文件更多", "-d当遇到目录时列出目录本身而非目录内的文件"], "a": "ABD", "n": "【答案正确】A、B、D均正确：ls -a显示包含隐藏文件在内的所有文件；ls的功能与DOS的dir类似；ls -d遇目录时只列出目录本身。C不选：-A（almost-all）只比-a少显示“.”和“..”两项，显示的文件更少而非“更多”，该描述错误。", "d": 0}, {"k": "y25linux", "s": 272, "t": "单选", "q": "为保证在启动服务器时自动启动DHCP进程,应对文件进行编辑（ ）", "o": ["/etc/rc.d/rc.inet2", "/etc/rc.d/rc.inet1", "/etc/dhcpd.conf", "/etc/rc.d/rc.S"], "a": "A", "n": "【已修正答案】平台原答案 B 有误（平台答案系 AI 生成、仅供参考），已按核验改为 A。【版本差异】本题为老教材（Slackware风格rc启动脚本）口径：/etc/rc.d/rc.inet1只负责网卡接口与路由配置，网络服务守护进程统一由/etc/rc.d/rc.inet2启动；要开机自动启动DHCP进程，应编辑rc.inet2在其中加入“/usr/sbin/dhcpd”一行。/etc/dhcpd.conf只是DHCP服务配置文件（不能决定是否自启），rc.S是最基础的单用户系统初始化脚本，均不符。", "d": 2}, {"k": "y25linux", "s": 273, "t": "判断", "q": "()Exim属于MTA软件", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Exim是与sendmail、postfix、qmail并列的MTA（邮件传输代理），负责邮件服务器之间的接收、路由与投递，判“正确”成立。", "d": 0}, {"k": "y25linux", "s": 274, "t": "单选", "q": "在Linux系统中,以（）方式访问设备", "o": ["命令", "文件", "程序", "数据"], "a": "B", "n": "【答案正确】Linux“一切皆文件”，设备以字符/块设备文件形式（位于/dev）呈现，系统以“文件”方式统一访问设备，选B；命令、程序、数据都不是内核访问设备的抽象方式。", "d": 0}, {"k": "y25linux", "s": 275, "t": "单选", "q": "ls-a命令的作用是?（）", "o": ["显示所有配置文件", "显示所有文件,包含以.开头的文件", "显示以.开头的文件", "以a开头的文件"], "a": "B", "n": "【答案正确】ls -a（all）列出目录下所有文件，包括以.开头的隐藏文件，选B；C说“显示以.开头的文件”意味着只列隐藏文件，不准确；A、D均为凑数干扰项。", "d": 0}, {"k": "y25linux", "s": 276, "t": "单选", "q": "按（）键能中止当前运行的命令", "o": ["Ctrl-D", "Ctrl-C", "Ctrl-B", "Ctrl-F"], "a": "B", "n": "【答案正确】Ctrl-C向前台进程发送SIGINT信号，中止当前运行的命令；Ctrl-D表示EOF（结束输入/注销），Ctrl-B与Ctrl-F在shell行编辑中是向后/向前移动光标，均不能中止命令，选B。", "d": 0}, {"k": "y25linux", "s": 277, "t": "单选", "q": "默认Apache的日志文件包括（ ）和访问日志两种", "o": ["系统日志", "错误日志", "访问日志", "启动日志"], "a": "B", "n": "【答案正确】Apache默认日志共两类：访问日志access_log和错误日志error_log，题干空处应填“错误日志”，选B；系统日志由syslog管理，Apache并无“系统日志”“启动日志”这一分类。", "d": 0}, {"k": "y25linux", "s": 278, "t": "单选", "q": "在局域网络内的某台主机用ping命令测试网络连接时发现网络内部的主机都可以连同，而不能与公网连通，问题可能是（ ）", "o": ["主机IP设置有误", "没有设置连接局域网的网关", "局域网的网关或主机的网关设置有误", "局域网DNS服务器设置有误"], "a": "C", "n": "【答案正确】内网主机间均可ping通，说明本机IP与接口配置正常，不能访问公网的常见原因是默认网关问题：主机网关设置有误或局域网出口网关有误，选C；若主机IP设置有误则内网也不通，若仅DNS设置有误则用IP地址仍能ping通公网主机，均与题设不符。", "d": 0}, {"k": "y25linux", "s": 279, "t": "判断", "q": "()Samba不能使Linux系统的机器与执行Windows系统的计算机进行文件与打印现共享", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Samba基于SMB/CIFS协议，正是实现Linux/Unix与Windows主机之间文件和打印共享的服务，题述“不能……共享”与事实相反，判“错误”成立。", "d": 0}, {"k": "y25linux", "s": 280, "t": "多选", "q": "HTTPD的特性MPM（多路处理模块）包括（）模型。", "o": ["prefork", "worker", "event", "DSO"], "a": "ABC", "n": "【答案正确】Apache的MPM多路处理模块包括prefork（多进程模型）、worker（进程+线程）、event（事件驱动，2.4起为默认），选ABC；DSO（Dynamic Shared Object）是模块动态加载机制，不是MPM模型，D不选。", "d": 0}, {"k": "y25linux", "s": 281, "t": "判断", "q": "（ ）在DNS系统中，全名是以一个点来结束的，例如“boulder.edu.”没有最后的那个点则表示一个相对地址", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】DNS绝对域名（FQDN）以代表根的“.”结尾，如“boulder.edu.”；省略末尾点时系统按相对域名处理，需按search列表逐级补全，判“正确”成立。", "d": 0}, {"k": "y25linux", "s": 282, "t": "单选", "q": "按下（ ）键能终止当前运行的命令。", "o": ["Ctrl-C", "Ctrl-F", "Ctrl-B", "Ctrl-D"], "a": "A", "n": "【答案正确】Ctrl-C发送SIGINT终止当前前台命令，选A；Ctrl-D为EOF，Ctrl-B、Ctrl-F不是终止键（在readline中为光标前后移动）。与276题为同一知识点的换序重复题，答案一致。", "d": 0}, {"k": "y25linux", "s": 283, "t": "单选", "q": "在vi中用于删除一行记录的方法是()", "o": ["dd", "dw", ":s", "del"], "a": "A", "n": "【答案正确】vi命令模式下dd删除光标当前行（加数字如3dd删多行）；dw删除一个单词，:s是替换命令，del不是vi命令，选A。", "d": 0}, {"k": "y25linux", "s": 284, "t": "判断", "q": "（ ）NTFS格式分区不能够作为Linux根分区", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Linux根分区必须使用能作根文件系统引导的本地文件系统（ext2/ext3/ext4等），老内核对NTFS仅提供只读支持且无法挂为根分区，判“正确”成立。", "d": 0}, {"k": "y25linux", "s": 285, "t": "单选", "q": "在vi中（ ）命令可将当前行复制到剪贴板", "o": ["cc", "dd", "yy", "pp"], "a": "C", "n": "【答案正确】yy（yank）把当前行复制到缓冲区，配合p粘贴；cc是清空当前行并进入插入模式（修改），dd是删除行，pp不是复制命令（p才是粘贴），选C。", "d": 0}, {"k": "y25linux", "s": 286, "t": "单选", "q": "Linux负责执行防火墙规则的服务守护进程是（ ）", "o": ["Iptables", "network", "security", "xinetd"], "a": "A", "n": "【答案正确】按教材口径iptables服务负责装载并执行防火墙规则，四个选项中仅A与防火墙规则相关：network管理网络连接，xinetd是超级守护进程，security并非服务。严格说包过滤在内核netfilter中执行，iptables是规则管理工具，但作为单选A是唯一合理答案。", "d": 0}, {"k": "y25linux", "s": 287, "t": "多选", "q": "下列属于linux内核锁的是（ ）。", "o": ["Semaphore", "Spinlock", "seqlock", "Message"], "a": "ABC", "n": "【答案正确】Linux内核的锁/同步机制包括信号量Semaphore（睡眠锁）、自旋锁Spinlock（忙等锁）、顺序锁seqlock（另有mutex、rwlock、RCU等），选ABC；Message（消息队列）属进程间通信手段而非锁，D不选。", "d": 0}, {"k": "y25linux", "s": 288, "t": "单选", "q": "创建一个用户帐号不需要在/etc/passwd中定义哪些信息（ ）。", "o": ["loginname", "passwordage", "defaultgroup", "userid"], "a": "B", "n": "【答案正确】/etc/passwd每行七字段：登录名（loginname）、口令占位符、用户ID（userid）、默认组GID（defaultgroup）、注释、主目录、登录Shell，其中不含口令时效（passwordage）；口令时效与加密口令存于/etc/shadow，故“不需要”定义的是B。", "d": 0}, {"k": "y25linux", "s": 289, "t": "单选", "q": "Linux系统各组成部分中哪一项是基础()", "o": ["内核", "XWindow", "Shell", "Gnome"], "a": "A", "n": "【答案正确】内核是Linux系统最基础的部分，负责进程调度、内存、设备和文件系统管理；X Window、Shell、GNOME都是构建在内核之上的组件，选A。", "d": 0}, {"k": "y25linux", "s": 290, "t": "单选", "q": "如果用户想对某一命令详细的了解,可用（ ）。", "o": ["ls", "help", "man", "dir"], "a": "C", "n": "【答案正确】man查阅命令的详细联机手册；help仅给出shell内建命令的简要帮助，ls、dir是列目录命令，均非查看命令详情的工具，选C。", "d": 0}, {"k": "y25linux", "s": 291, "t": "判断", "q": "（ ）ftp的传输模式只有二进制数据传输模式", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】FTP支持二进制（binary/image）和ASCII（文本）两种传输模式，文本模式会转换换行符，题述“只有二进制数据传输模式”错误，判“错误”成立。", "d": 0}, {"k": "y25linux", "s": 292, "t": "判断", "q": "（ ）由于Linux系统过于庞大，所以不能采用网络安装方式来安装系统", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Linux完全支持NFS、FTP、HTTP/PXE以及kickstart等网络安装方式，安装方式与系统大小无关，题述“过于庞大不能网络安装”错误，判“错误”成立。", "d": 0}, {"k": "y25linux", "s": 293, "t": "单选", "q": "在Linux系统中,用来存放系统所需要的配置文件和子目录的目录是（）", "o": ["/dev", "/etc", "/lib", "/home"], "a": "B", "n": "【答案正确】/etc集中存放系统所需的配置文件和子目录；/dev是设备文件目录、/lib存放共享库与内核模块、/home是普通用户主目录，选B。", "d": 0}, {"k": "y25linux", "s": 294, "t": "判断", "q": "（ ）Linux交换分区用于保存访问过的网页文件", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】交换分区（swap）用于物理内存不足时暂存换出的内存页，保存访问过的网页文件的是浏览器/磁盘缓存，与swap无关，题述说法错误，判“错误”成立。", "d": 0}, {"k": "y25linux", "s": 295, "t": "单选", "q": "syslog的严重性级别一般有emergalertcriterrnoticeinfodebug及()", "o": ["stop", "down", "priority", "warning"], "a": "D", "n": "【答案正确】syslog 的严重性级别共 8 级，从低到高为 debug、info、notice、warning、err、crit、alert、emerg，题干已列出 7 个，缺的正是 warning（D）。干扰项 stop、down、priority 均不是 syslog 级别（panic 只是 emerg 的旧别名，也不在这几个选项里）。", "d": 0}, {"k": "y25linux", "s": 296, "t": "单选", "q": "Samba服务器的进程由（ ）两部分组成", "o": ["named和sendmail", "smbd和nmbd", "bootp和dhcpd", "httpd和squid"], "a": "B", "n": "【答案正确】Samba 服务由两个守护进程组成：smbd 提供文件和打印共享（TCP 139/445），nmbd 提供 NetBIOS 名称解析与浏览（UDP 137）。named 是 BIND 域名服务、sendmail 是邮件服务、bootp/dhcpd 是地址分配、httpd/squid 是 Web 与代理服务，均与 Samba 无关。", "d": 0}, {"k": "y25linux", "s": 297, "t": "多选", "q": "我们手边有一个很小的数据文件data，我们希望在终端上上观察该文件的内容，我们可以通过（ ）。", "o": ["cat data", "vi data", "man data", "less data"], "a": "ABD", "n": "【答案正确】观察小文件内容的手段：cat data 直接输出（A 可）、vi data 打开编辑器显示内容（B 可）、less data 分页阅读（D 可）；man data 显示的是系统中名为 data 的手册页而不是文件内容（C 不选）。✅ 集合 ABD 恰好等于技术上正确的集合，无多选漏选。", "d": 0}, {"k": "y25linux", "s": 298, "t": "单选", "q": "下列哪一项不属于Linux进程状态()", "o": ["不可中断的睡眠状态", "可中断的睡眠状态", "阻塞状态", "可执行状态"], "a": "C", "n": "【答案正确】Linux 进程状态（老教材/proc 口径）为：可执行（运行）态、可中断的睡眠态、不可中断的睡眠态、停止态、僵死态；\"阻塞状态\"是操作系统通用模型（如 Windows/理论教科书）中的术语，不属于 Linux 进程状态列举，且其中睡眠态即相当于阻塞。A、B、D 均为真实状态，C 为应选项。", "d": 0}, {"k": "y25linux", "s": 299, "t": "单选", "q": "在vi编辑器里,命令”dd”用来删除当前?（）", "o": ["字", "字符", "变量", "行"], "a": "D", "n": "【答案正确】vi 中 dd 删除光标所在整行（可加数字如 3dd 删 3 行）；删除字/字符用 x、D、dw 等，\"字、字符、变量\"均不是 dd 的作用对象。", "d": 0}, {"k": "y25linux", "s": 300, "t": "单选", "q": "xorg.conf文件中包含哪些信息?（ ）", "o": ["以下所有内容", "显卡设置", "鼠标设置", "显示器设置"], "a": "A", "n": "【答案正确】xorg.conf 包含 ServerLayout、Files、Module、InputDevice（鼠标、键盘）、Device（显卡）、Monitor（显示器）、Screen 等配置节，显卡、鼠标、显示器设置都在其中，故选\"以下所有内容\"（A）。", "d": 0}, {"k": "y25linux", "s": 301, "t": "单选", "q": "下列哪些不是Iptables中的表()", "o": ["Control", "Nat", "Mangle", "Filter"], "a": "A", "n": "【答案正确】iptables 内置的表为 filter（过滤）、nat（地址转换）、mangle（改写包），新内核还增加了 raw、security 表，但没有 Control 表。A 不属于 iptables 的表，为正确选项。", "d": 0}, {"k": "y25linux", "s": 302, "t": "判断", "q": "（ ）/var/log/lastlog文件用来记录进入系统的用户信息,包括登录的时间,登录是否成功等信息", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】/var/log/lastlog 只记录每个用户最近一次登录的时间、终端等信息（用 lastlog 命令查看）；\"登录是否成功\"并不记录于此——失败的登录尝试记录在 /var/log/btmp（lastb 查看），完整的登录/注销流水记录在 /var/log/wtmp（last 查看）。命题把多种日志功能混在 lastlog 上，判断为错误成立。", "d": 0}, {"k": "y25linux", "s": 303, "t": "多选", "q": "http-2.2程序环境中主程序文件包括（）。", "o": ["/usr/sbin/httpd", "/usr/sbin/httpd.event", "/usr/sbin/httpd.worker", "/sbin/nologin"], "a": "ABC", "n": "【答案正确】RHEL5/6 的 httpd-2.2 软件包按 MPM 提供三个主程序：/usr/sbin/httpd（默认 prefork）、/usr/sbin/httpd.worker、/usr/sbin/httpd.event；/sbin/nologin 只是禁止登录用户的 shell，不是 httpd 程序文件。ABC 恰为正确集合。【版本差异】RHEL7 起升级到 httpd 2.4，只有一个 /usr/sbin/httpd，MPM 改为模块切换，此题按其考核年代口径判。", "d": 0}, {"k": "y25linux", "s": 304, "t": "判断", "q": "（ ）Linux能自动地通过/etc/hostname和/etc/hosts文件来配置网络", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】/etc/hosts 只是本地名称解析表，/etc/hostname 只设置主机名；Linux 的网络参数（IP、掩码、网关）由网络接口配置文件（ifcfg-eth0 等）经启动脚本读取并配置，不会\"自动通过这两个文件来配置网络\"，命题错误，答案 B 正确。", "d": 0}, {"k": "y25linux", "s": 305, "t": "单选", "q": "Linux中负责本地名称解析的文件是()", "o": ["/etc/hosts", "/etc/host.allow", "/etc/host.deny", "/etc/host.key"], "a": "A", "n": "【答案正确】/etc/hosts 实现主机名到 IP 的静态本地解析，查询顺序上先于 DNS（nsswitch.conf 决定）。干扰项 /etc/hosts.allow、/etc/hosts.deny 是 TCP Wrappers 的访问控制文件而非解析（选项还丢了下划线），/etc/host.key 不存在。【术语提示】B/C 准确写法为 hosts.allow、hosts.deny。", "d": 0}, {"k": "y25linux", "s": 306, "t": "单选", "q": "哪条命令从当前系统切换到启动级别1（ ）。", "o": ["inittA.1", "init1", "level1", "rlevel1"], "a": "B", "n": "【答案正确】切换运行级别用 init 命令，切到级别 1 为“init 1”（init 0 关机、init 6 重启）。选项 B 的“init1”是空格丢失后的写法，按出题意图即 init 1；inittA.1、level1、rlevel1 均不是命令。【选项文本有误】准确写法：init 1。", "d": 0}, {"k": "y25linux", "s": 307, "t": "单选", "q": "察看机器的硬件设备可以使用哪条命令?（ ）", "o": ["lspci", "pcibus", "pcidev", "showpci"], "a": "A", "n": "【答案正确】lspci 列出 PCI 总线上的硬件设备（同类还有 lsusb 查 USB、lsblk 查块设备）；pcibus、pcidev、showpci 都不是 Linux 标准命令。", "d": 0}, {"k": "y25linux", "s": 308, "t": "判断", "q": "（ ）用于交换CPU和内存数据的内存空间叫做交换分区", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】交换分区（swap）是磁盘上的分区，在物理内存不足时用于换出内存中暂时不用的数据，属于磁盘空间/交换空间而非\"内存空间\"；命题把它说成内存空间，对判断题而言不成立，答案 B（错误）正确。【版本差异】严格表述应为\"用于在内存与磁盘之间交换数据的磁盘空间叫做交换分区\"，题干\"CPU 和内存数据\"的说法也不准确。", "d": 0}, {"k": "y25linux", "s": 309, "t": "单选", "q": "实现从IP地址到以太网MAC地址转换的命令为:（ ）", "o": ["ping", "ifconfig", "arp", "traceroute"], "a": "C", "n": "【答案正确】arp 命令用于查看和维护 ARP 缓存表，实现 IP 地址到以太网 MAC 地址的映射；ping 只测试连通性，ifconfig 配置网络接口，traceroute 跟踪路由路径，均不做 IP→MAC 转换。", "d": 0}, {"k": "y25linux", "s": 310, "t": "单选", "q": "在系统重建的时候,下面哪个参数能用来对mkfs命令检查坏块（ ）。", "o": ["-b", "-e", "-c", "-check"], "a": "C", "n": "【答案正确】mkfs.ext2/ext3 等用 -c 选项在创建文件系统时调用 badblocks 扫描坏块；-b 用于指定块大小，-e、-check 不是 mkfs 检查坏块的参数。", "d": 0}, {"k": "y25linux", "s": 311, "t": "单选", "q": "Samba服务器的主配置文件是（ ）。", "o": ["/etc/samba/smb.conf", "/etc/smb.conf", "/var/smb.conf", "/etc/samba.conf"], "a": "A", "n": "【答案正确】Samba 主配置文件在 RedHat/CentOS 中位于 /etc/samba/smb.conf（早期版本曾为 /etc/smb.conf）；/var/smb.conf、/etc/samba.conf 均不存在，故 A 正确。", "d": 0}, {"k": "y25linux", "s": 312, "t": "判断", "q": "（ ）Linux文件系统的文件都按其作用分门别类的放在相关的目录中,对于外部设备,一般将其放在/bin目录中", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】按 FHS 目录组织，外部（块/字符）设备文件统一放在 /dev 目录，/bin 存放的是基本的用户命令。命题把设备文件位置说成 /bin，判断为错误成立。", "d": 0}, {"k": "y25linux", "s": 313, "t": "单选", "q": "FTP服务使用（ ）端口进行通信", "o": ["2120", "2324", "2123", "2023"], "a": "A", "n": "【答案正确】FTP 使用 TCP 21 作为控制连接端口、20 作为数据连接端口（主动模式数据传输），本意答案即“20 和 21”。选项 A“2120”是分隔符丢失后的排版痕迹（21、20 连写），四个选项中只有它能对应真实 FTP 端口，按出题意图选 A 成立。【选项文本有误】准确写法应为“20 和 21（数据端口 20、控制端口 21）”。", "d": 0}, {"k": "y25linux", "s": 314, "t": "单选", "q": "字符设备文件类型的标志是（ ）", "o": ["p", "c", "s", "1"], "a": "B", "n": "【答案正确】ls -l 的文件类型标志中，字符设备为 c（对应 /dev/tty 等），块设备为 b，管道为 p，套接字为 s，符号链接为 l。【术语提示】选项 D 写作“1”实为字母 l，但链接同样不是字符设备标志，不影响 B 为唯一正确项。", "d": 0}, {"k": "y25linux", "s": 315, "t": "判断", "q": "()所有用户都能读取/etc/shadow文件", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】/etc/shadow 属主为 root，权限在 RHEL 下为 000/400 之类的仅 root 可读设置（root 凭能力读写），普通用户不能读取，口令散列据此得到保护；“所有用户都能读取”为假，B（错误）正确。", "d": 0}, {"k": "y25linux", "s": 316, "t": "单选", "q": "哪些命令组合起来能统计多少用户登录系统。（ ）", "o": ["who|wc-w", "who|wc-l", "who|wc-c", ".who|wc-h61"], "a": "B", "n": "【答案正确】who 输出每个登录用户一行，接 wc -l 统计行数即登录用户数，故 who | wc -l 正确；wc -w 统计词数、wc -c 统计字节数都不能准确反映用户数，D 为乱码选项。【选项文本有误】各选项空格丢失，准确写法：who | wc -l。", "d": 0}, {"k": "y25linux", "s": 317, "t": "单选", "q": "下列选项中不是Iptables作用的是()", "o": ["分组数据过滤", "网络地址转换", "垃圾邮件拦截", "分组数据改造"], "a": "C", "n": "【答案正确】iptables 的作用是分组（包）过滤、网络地址转换（NAT）和分组数据改造（mangle 改写报文字段）；垃圾邮件拦截属于邮件服务器/反垃圾网关基于邮件内容的处理，iptables 只能按网络层规则放行或丢弃连接，无法识别邮件内容，故 C 不是其作用。", "d": 0}, {"k": "y25linux", "s": 318, "t": "判断", "q": "（ ）Windows的网络共享打印机，Linux不能连接使用", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Linux 可通过 Samba 客户端工具和 CUPS 打印系统（smb:// 共享 URI）连接并使用 Windows 网络共享打印机；命题“不能连接使用”过于绝对，为假，B（错误）正确。", "d": 0}, {"k": "y25linux", "s": 319, "t": "多选", "q": "Linux 下的进程有哪三种状态（）", "o": ["执行态", "等待态", "运行态", "就绪态"], "a": "BCD", "n": "【答案正确】经典进程三状态模型为运行态、就绪态、等待（阻塞）态，B、C、D 恰为这三个状态；A\"执行态\"与\"运行态\"是同一概念的同义词，题干限三种状态，选 A 会与 C 重复，故不选。✅ 集合 BCD 恰好正确。", "d": 0}, {"k": "y25linux", "s": 320, "t": "单选", "q": "用来分离目录名和文件名的字符是（ ）。", "o": ["dash(-)", "slash(/)", "period(.)", "asterisk(*)"], "a": "B", "n": "【答案正确】Linux 路径中用于分隔目录名和文件名的是斜杠 /（slash），如 /var/log/messages 中最后一段才是文件名；dash 用于选项，period 是隐藏文件前缀/当前目录，asterisk 是通配符。", "d": 0}, {"k": "y25linux", "s": 321, "t": "单选", "q": "inittab文件存放在（ ）目录下面。", "o": ["/etc", "/home", "/var", "/boot"], "a": "A", "n": "【答案正确】inittab 存放于 /etc/inittab（SysVinit），定义默认运行级别与各级别启动脚本等；/home、/var、/boot 下均无此文件。【版本差异】RHEL7 起 systemd 取代 inittab 机制，但此题按出题年代（RHEL5/6）口径判。", "d": 0}, {"k": "y25linux", "s": 322, "t": "单选", "q": "在RedHatLinux9中，系统默认的()用户对整个系统拥有完全的控制权（ ）", "o": ["root", "guest", "administrator", "supervistor."], "a": "A", "n": "【答案正确】RedHat Linux 9 中 root（UID 0）对整个系统拥有完全控制权；guest 是受限账户，administrator、supervisor 是 Windows 风格的称呼，Linux 默认无此类用户。【术语提示】选项 D\"supervistor.\"拼写有误，应为 supervisor。", "d": 0}, {"k": "y25linux", "s": 323, "t": "单选", "q": "具有很多C语言的功能，又称过滤器的是()", "o": ["csh", "tcsh", "awk", "sed"], "a": "C", "n": "【答案正确】awk 是一种脚本式模式扫描与处理语言，具有大量类 C 语言的语法功能（变量、数组、运算符、流程控制），逐行处理输入且常配合管道使用，惯例上被称为\"过滤器\"（filter）；csh/tcsh 是交互 shell，sed 虽也是过滤器但语法远不及 awk 接近 C。", "d": 0}, {"k": "y25linux", "s": 324, "t": "判断", "q": "()对名为fido的文件用chmod551fido进行了修改,则它的许可权是-rwxr-xr-x", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】chmod 551 fido 即给属主/属组 r-x、其他 --x，许可权应为 -r-xr-x--x；而题干称的 -rwxr-xr-x 对应的是 755。命题称 551 的许可权是 -rwxr-xr-x，两者不符，判断为错误成立。【选项文本有误】题干空格丢失，准确写法：对名为 fido 的文件执行 chmod 551 fido。", "d": 0}, {"k": "y25linux", "s": 325, "t": "判断", "q": "()进程可以处于僵死状态，而在当前进程表中仍有记录", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】僵死（zombie）进程已经终止运行，但其父进程尚未调用 wait/waitpid 回收退出状态，因此其进程表项（PID、退出码等）仍保留在进程表中，直到父进程回收或 init 接管；命题\"可以处于僵死状态而在当前进程表中仍有记录\"正确。", "d": 0}, {"k": "y25linux", "s": 326, "t": "单选", "q": "默认情况下管理员创建了一个用户，就会在( )目录下创建一个用户主目录", "o": ["/usr", "/home", "/root", "/etc"], "a": "B", "n": "【答案正确】默认情况下 useradd 按 /etc/default/useradd 中 HOME=/home 的设定，在 /home 下建立与用户名同名的主目录；root 的主目录特例在 /root，/usr、/etc 不用于放置用户主目录。", "d": 0}, {"k": "y25linux", "s": 327, "t": "单选", "q": "Samba服务器的配置文件是（ ）", "o": ["httpd.conf", "inetd.conf", "rc.samba", "smb.conf"], "a": "D", "n": "【答案正确】Samba 的配置文件是 smb.conf（RedHat/CentOS 中位于 /etc/samba/smb.conf）；httpd.conf 属于 Apache，inetd.conf 属于超级守护进程 inetd/xinetd 体系，rc.samba 是 Slackware 风格的启动脚本而非配置文件。", "d": 0}, {"k": "y25linux", "s": 328, "t": "判断", "q": "()由于系统的驱动不一样,所以Windows系统能够使用的打印机,Linux系统则不能使用", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Windows 与 Linux 驱动体系确实不同，但 Linux 借助 CUPS 与大量厂商/社区驱动支持绝大多数打印机型号，Windows 能用的打印机 Linux 一般也能使用；“则不能使用”把结论绝对化，为假，B（错误）正确。", "d": 0}, {"k": "y25linux", "s": 329, "t": "单选", "q": "用ftp进行文件传输时,有两种模式:（ ）", "o": ["Word和binary", "txt和WordDocument", "ASCII和binary", "ASCII和RichTextFormat"], "a": "C", "n": "【答案正确】FTP 传输文件有 ASCII（文本）和 binary（二进制/image）两种传输模式，文本模式会做换行符转换、二进制模式按字节原样传输；Word、txt、RichTextFormat 是文档格式概念，不是 FTP 的传输模式。", "d": 0}, {"k": "y25linux", "s": 330, "t": "单选", "q": "在bashshell环境下,当一命令正在执行时,按下ctrol-z会（ ）", "o": ["中止前台任务", "给当前文件加上EOF.", "将前台任务挂起", "注销当前用户"], "a": "C", "n": "【答案正确】bash 下按 Ctrl-Z 向前台作业发送 SIGTSTP，将其挂起（进入 stopped 状态），之后可用 bg 放入后台继续或 fg 恢复前台；中止任务用 Ctrl-C，发出 EOF 是 Ctrl-D，注销用 exit/logout。", "d": 0}, {"k": "y25linux", "s": 331, "t": "单选", "q": "iptables中（ ）链匹配源IP是本机的数据包", "o": ["FORWARD", "INPUT", "OUTPUT", "PREROUTING"], "a": "C", "n": "【答案正确】源 IP 为本机地址的数据包是本机进程产生的报文，经过 iptables 的 OUTPUT 链；INPUT 匹配发往本机的进站包（源 IP 通常是外部地址），FORWARD 匹配转发包，PREROUTING 用于路由前处理（如 DNAT）。", "d": 0}, {"k": "y25linux", "s": 332, "t": "单选", "q": "命令catfile.1>file.2的结果是?（ ）", "o": ["file.2将会被file.1替换", "file.2会更名为file.1", "将file.1的内容加入到file.2文件结尾", "将file.1的内容加入到file.2文件开头"], "a": "A", "n": "【答案正确】cat file.1 > file.2 中 > 会先截断（清空）file.2 再把 cat 的输出写入，结果 file.2 原内容被 file.1 的内容替换；把内容加入文件结尾应使用 >>（追加），文件改名/互换用 mv。", "d": 0}, {"k": "y25linux", "s": 333, "t": "多选", "q": "常见的单向加密算法有（     ）。", "o": ["md5", "sha1", "sha224", "RSA", "DSS"], "a": "ABC", "n": "【答案正确】单向加密指不可逆的散列/摘要算法：md5、sha1、sha224 均属此类，A、B、C 应选；RSA、DSS 是非对称加解密/数字签名算法，可由公私钥对还原明文，不属于单向加密，D、E 不选。✅ 集合 ABC 恰好正确。", "d": 0}, {"k": "y25linux", "s": 334, "t": "单选", "q": "当前系统的中断的信息保存在哪一个文件中?( )", "o": ["/proc/interrupts", "/var/log/IRQs", "/boot/interrupts", "/etc/proc/interrupts"], "a": "A", "n": "【答案正确】/proc 是反映内核运行信息的虚拟文件系统，/proc/interrupts 记录当前系统各中断源的请求次数与 CPU 分配；/var/log/IRQs、/boot/interrupts、/etc/proc/interrupts 均不存在。", "d": 0}, {"k": "y25linux", "s": 335, "t": "单选", "q": "下面关于DHCP参数描述错误的是（ ）", "o": ["default-lease-timenumber定义了默认的IP租约时间", "max-lease-timenumber定义客户端IP租约时间的最大值", "ignoreclient-updates定义客户端更新", "ddns-update-style定义所支持的DNS动态更新类型"], "a": "C", "n": "【答案正确】dhcpd.conf 中 ignore client-updates 的含义是忽略客户端提出的自行更新 DNS 记录的请求，把它描述为\"定义客户端更新\"不准确，为应选的错误描述；default-lease-time 定义默认租约、max-lease-time 定义最大租约、ddns-update-style 定义 DNS 动态更新类型，三项描述均正确。", "d": 0}, {"k": "y25linux", "s": 336, "t": "判断", "q": "（ ）硬链接和符号链接都是产生一个新的i节点", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】硬链接只是给同一 inode 再增加一个目录项（inode 链接计数加 1），并不产生新 i 节点；只有符号（软）链接才新建一个 inode 存放目标路径。命题说\"都是产生一个新的 i 节点\"，对硬链接不成立，B（错误）正确。", "d": 0}, {"k": "y25linux", "s": 337, "t": "单选", "q": "下列变量名中有效的shell变量名是：()", "o": ["-2-time", "_2$3", "trust_no_1", "2004file"], "a": "C", "n": "【答案正确】shell 变量名只能由字母、数字、下划线组成，不能以数字开头，也不能包含 $ 和 -：-2-time 含连字符，_2$3 含 $，2004file 以数字开头，均非法；只有 trust_no_1 完全合法。", "d": 0}, {"k": "y25linux", "s": 338, "t": "判断", "q": "（ ）syslogd守护进程，不仅可以将日志记录在本地机message文件中，还可以将日志记录通过网络发送出去", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】syslogd 除了按 syslog.conf 把日志写到本地 /var/log/messages 等文件外，还支持用 @loghost 把日志通过网络（UDP 514）转发给远程日志主机，并可用 -r/-h 接收或中转远程日志；命题正确。", "d": 0}, {"k": "y25linux", "s": 339, "t": "单选", "q": "用标准的输出重定向(>)像”>file01”能使文件file01的数据（）", "o": ["被复制", "被移动", "被覆盖", "被打印"], "a": "C", "n": "【答案正确】标准输出重定向 > 会先截断目标文件再写入，使 file01 原有数据被覆盖；向文件尾追加数据应使用 >>，复制与移动分别是 cp 和 mv 的功能。【选项文本有误】题干“像”为“使用”之误，准确写法：使用标准的输出重定向(>)符号“>file01”能使文件 file01 的数据被覆盖。", "d": 0}, {"k": "y25linux", "s": 340, "t": "判断", "q": "()Linux有两种常见的桌面环境:GNOME和KDE其中KDE用C语言编写,GNOME用C++语言编写", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】命题把两桌面环境的实现语言颠倒了：KDE 基于 Qt 库使用 C++ 编写，GNOME 基于 GTK+ 使用 C 编写。故\"KDE 用 C、GNOME 用 C++\"为假，B（错误）正确。", "d": 0}, {"k": "y25linux", "s": 341, "t": "单选", "q": "在GRUB的配置文件grub.Conf中,“timeout=-1”的含义是()", "o": ["不等待用户选择", "在10秒钟内,等待用户选择要启动的系统", "一直等待用户选择要启动的系统", "无效"], "a": "C", "n": "【答案正确】grub.conf（GRUB legacy）中 timeout 为正数时表示在显示菜单后等待指定秒数再引导默认项，timeout=0 立即引导；timeout=-1 表示不设时限、一直等待用户做出选择，故 C 正确。A（不等待）对应 0，B、D 与 -1 语义不符。", "d": 0}, {"k": "y25linux", "s": 342, "t": "单选", "q": "下面哪个命令用来启动XWindow（ ）。", "o": ["runx", "Startx", "startX", "Xwin"], "a": "C", "n": "【答案正确】启动 X Window 的命令是 startx，按出题意图对应 C“startX”；runx、Xwin 不是标准命令，B“Startx”的拼写同样不规范。【选项文本有误】选项存在大小写排版问题，准确写法为全小写的 startx（脚本，内部调用 xinit）。", "d": 0}, {"k": "y25linux", "s": 343, "t": "单选", "q": "下列关于/etc/fstab文件描述，正确的是()", "o": ["fstab文件只能描述属于linux的文件系统", "CD_ROM和软盘必须是自动加载的", "fstab文件中描述的文件系统不能被卸载", "启动时按fstab文件描述内容加载文件系统"], "a": "D", "n": "【答案正确】系统启动时由启动脚本按 /etc/fstab 的记录挂载文件系统（等效 mount -a），D 正确。A 错：fstab 也可描述 vfat、ntfs、swap 等非 Linux 本身格式的文件系统；B 错：加上 noauto 选项可不自动挂载；C 错：fstab 中描述的文件系统随时可以 umount 卸载。", "d": 0}, {"k": "y25linux", "s": 344, "t": "单选", "q": "默认情况下管理员创建了一个用户,就会在（）目录下创建一个用户主目录", "o": ["/usr", "/home", "/root", "/etc"], "a": "B", "n": "【答案正确】RHEL/CentOS 下普通用户主目录默认创建于 /home 下（如 /home/user1），由 useradd 按 HOME=/home 的默认设置决定。/usr 存放系统资源与应用，/root 是 root 用户的主目录，/etc 存放配置文件，均不是新用户主目录的默认位置。", "d": 0}, {"k": "y25linux", "s": 345, "t": "判断", "q": "（ ）Linux系统必须至少包含两种分区:系统分区和交换分区", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Linux 安装的最低要求只是一个根分区（/），交换分区并非必需：可以完全不配，也可用交换文件替代（老安装器在无 swap 时仅警告仍可继续）。另外'系统分区'是 Windows 风格的概念，Linux 分区以挂载点组织，故'必须至少包含两种分区'的说法错误。", "d": 0}, {"k": "y25linux", "s": 346, "t": "单选", "q": "在大多数Linux发行版本中，以下哪个属于块设备（ ）", "o": ["串行", "硬盘", "虚拟终端", "打印机"], "a": "B", "n": "【答案正确】硬盘以块为单位随机存取，有对应块设备文件（如 /dev/sda），属于块设备。串行口、虚拟终端、打印机均按字节流顺序访问，属于字符设备（打印机与串口常对应 /dev 下的 lp*/ttyS* 等字符设备节点）。", "d": 0}, {"k": "y25linux", "s": 347, "t": "单选", "q": "下列哪一个指令可以用来查看CPU的信息( )", "o": ["cpu", "mem", "uname", "cat/proc/cpuinfo"], "a": "D", "n": "【答案正确】按出题意图（空格丢失）应为 cat /proc/cpuinfo，该虚拟文件输出 CPU 型号、频率、缓存、核心数等信息。uname 显示内核与硬件架构信息但不罗列 CPU 详情；cpu、mem 不是 Linux 标准命令。", "d": 0}, {"k": "y25linux", "s": 348, "t": "判断", "q": "（ ）Apace的主配置文件为httpd.conf，在其中可对服务器进行各种设置", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Apache（RHEL 系软件包名 httpd）的主配置文件为 httpd.conf，可在此配置监听端口、虚拟主机、模块加载等。【术语提示】题干'Apace'为 Apache 之误；RHEL7+ 中主配置路径为 /etc/httpd/conf/httpd.conf，并辅以 conf.d 等子配置文件，但不影响本题结论。", "d": 0}, {"k": "y25linux", "s": 349, "t": "单选", "q": "哪个目录存放用户密码信息（ ）。", "o": ["/boot", "/etc", "/var", "/dev"], "a": "B", "n": "【答案正确】/etc 存放系统配置文件，用户账号信息 /etc/passwd 与口令加密信息 /etc/shadow 都在该目录下。/boot 存放内核与引导文件，/var 存放日志等可变数据，/dev 存放设备文件，均不存放密码。", "d": 0}, {"k": "y25linux", "s": 350, "t": "判断", "q": "（ ）SSL不仅保证连接的安全性,它本身也参与HTTP事务", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】SSL/TLS 位于应用层（HTTP）与传输层（TCP）之间，只负责对连接加密、认证与完整性保护，不解析也不处理 HTTP 报文；请求/响应事务仍由 HTTP 协议本身完成，故'SSL 本身参与 HTTP 事务'错误。", "d": 0}, {"k": "y25linux", "s": 351, "t": "单选", "q": "下列提法中，不属于ifconfig命令作用范围的是（ ）。", "o": ["配置本地回环地址", "牌值网卡的IP地址", "激活网络适配器", "加载网卡到内核中"], "a": "D", "n": "【答案正确】ifconfig 可以配置回环地址 lo、设置网卡 IP（'牌值'应为'配置/指定'）并用 up/down 激活或停用接口；但把网卡驱动加载进内核由 modprobe/insmod 等模块管理命令完成，不属于 ifconfig 的作用范围，故选 D。【题目缺陷】选项 B '牌值网卡'存在错别字。", "d": 0}, {"k": "y25linux", "s": 352, "t": "单选", "q": "已知某用户stud1，其用户目录为/home/stud1分页显示当前目录下的所有文件的文件或目录名用户组用户文件大小文件或目录权限文件创建时间等信息的命令是（ ）", "o": ["morels–al", "more–alls", "more", "ls–al|more"], "a": "D", "n": "【答案正确】按出题意图（原文空格丢失）应为 ls -al | more：ls -al 以长格式列出当前目录全部文件（含隐藏文件）的权限、属主属组、大小、创建/修改时间，管道交给 more 分页显示。其余选项把 more 与 ls 拼接成非法命令（morels–al、more–alls）或不完整，均无法实现题意。", "d": 0}, {"k": "y25linux", "s": 353, "t": "多选", "q": "下列（）模型是HTTPD并发访问响应模型。", "o": ["单进程I/O模型", "多进程I/O结构", "复用的I/O结构", "复用的多进程I/O结构"], "a": "ABCD", "n": "【答案正确】httpd 并发访问响应模型按教材分为四类：单进程I/O模型（一次仅处理一个请求）、多进程I/O模型（如 prefork）、复用的I/O模型（单进程借 select/poll 多路复用）、复用的多进程I/O模型（如 worker/event）。四个选项正好完整覆盖该分类集合，ABCD 无多选也无遗漏；后两类是主流生产模型。", "d": 0}, {"k": "y25linux", "s": 354, "t": "单选", "q": "Linux系统中，默认情况下第一块以太网卡的设备名叫做（ ）", "o": ["ppp0", "lo", "eth0", "eth1"], "a": "C", "n": "【答案正确】RHEL5/6 传统命名下第一块以太网卡为 eth0，第二块为 eth1；lo 是回环接口，ppp0 是 PPP 拨号接口。【版本差异】RHEL7/CentOS7 起采用一致性网络设备命名（如 enp3s0、eno16777736），默认不再叫 eth0，但按本题教材口径答案 eth0 无误。", "d": 0}, {"k": "y25linux", "s": 355, "t": "单选", "q": "在TCP/IP模型中，应用层包含了所有的高层协议，在下列的一些应用协议中，是能够实现本地与远程主机之间的文件传输工作（ ）", "o": ["telnet", "FTP", "SNMP", "NFS"], "a": "B", "n": "【答案正确】FTP（文件传输协议）专为本地与远程主机之间的文件上传/下载设计；telnet 用于远程登录，SNMP 用于网络管理，NFS 是网络文件系统（把远程目录挂载为本地使用，属于共享而非传输协议）。", "d": 0}, {"k": "y25linux", "s": 356, "t": "单选", "q": "()在Linux系统的/proc/sys下存放着某些可调内核参数的文件，如果想把Linux主机当路由器使用，将需要设置哪个文件?（ ）", "o": ["ip_local_port_range", "ip_forward", "conf/default/rp_filter", "file_max"], "a": "B", "n": "【答案正确】将主机作为路由器需开启内核 IP 转发，即把 /proc/sys/net/ipv4/ip_forward（sysctl 名 net.ipv4.ip_forward）置 1。ip_local_port_range 是本地出站端口范围，rp_filter 是反向路径过滤（防止 IP 欺骗），file_max 是系统最大打开文件数，均与路由转发无关。", "d": 0}, {"k": "y25linux", "s": 357, "t": "判断", "q": "()Linux的3组权限位的顺序是“属主-属组-其他”,每组中位的次序是“执行-写-读”", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】三组权限位顺序确为'属主-属组-其他'，但每组内次序是'读-写-执行'（rwx，对应数字 4-2-1），题干说'执行-写-读'顺序颠倒，判断为错误。例如 rwxr-xr-- 对应 754。", "d": 0}, {"k": "y25linux", "s": 358, "t": "判断", "q": "（ ）安装初始的MySQL服务器的root用户口令是为空的", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】RHEL5/6 时代的 MySQL（5.0/5.1）安装后 root 默认口令为空，首次使用需通过 mysqladmin -u root password 或 SET PASSWORD 设置。【版本差异】MySQL 5.7+/8.0 及 MariaDB 新装后行为不同：可能生成随机临时口令（root/.mysql_secret 或日志中）、unix_socket 认证，不再默认空口令；按本题教材口径'正确'成立。", "d": 0}, {"k": "y25linux", "s": 359, "t": "单选", "q": "iptables中()链匹配经由本机转发的数据包", "o": ["FORWARD", "INPUT", "OUTPUT", "PREROUTING"], "a": "A", "n": "【答案正确】iptables 的 FORWARD 链匹配经本机路由转发的数据包（本机充当网关/路由器场景）；INPUT 匹配目的地为本机的包，OUTPUT 匹配本机发出的包，PREROUTING 是 nat/mangle 表中路由前处理的链，不是 filter 表默认三条链之一。", "d": 0}, {"k": "y25linux", "s": 360, "t": "单选", "q": "在/etc/fstab文件中指定的文件系统加载参数中，参数一般用于CD-ROM等移动设备（ ）", "o": ["defaults", "sw", "rw和ro", "noauto"], "a": "D", "n": "【答案正确】CD-ROM、软盘等移动介质在 /etc/fstab 中一般配 noauto 选项，使其在开机 mount -a 时不被自动挂载，需要时手动 mount；defaults 是默认选项组合（rw/suid/dev/exec/auto/nouser/async），sw 用于交换分区，rw/ro 指定读写方式，均非移动介质的典型标志选项。", "d": 0}, {"k": "y25linux", "s": 361, "t": "判断", "q": "（）Apache构建的web平台能够发布多个站点,但是这些站点必须绑定于同一个IP地址", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Apache 虚拟主机可分别基于 IP（IP-based）、端口或域名（Name-based，NameVirtualHost/ServerName）实现一个平台发布多个站点，并不要求站点绑定同一个 IP 地址，故题干说法错误。基于域名的虚拟主机恰恰常见于多个域名共用一个 IP。", "d": 0}, {"k": "y25linux", "s": 362, "t": "单选", "q": "ntsysv这个程序是用来()", "o": ["设定runlevels的简易接口", "设定关机的接口", "设定硬件的接口", "设定安装的接口"], "a": "A", "n": "【答案正确】ntsysv 是 RHEL/CentOS 系提供的文本界面工具，用于按运行等级（runlevel）勾选/取消服务的开机自启，相当于 chkconfig 与 systemctl 的简易图形接口；它不用于配置关机、硬件或安装。", "d": 0}, {"k": "y25linux", "s": 363, "t": "单选", "q": "linux中,cdrom设备的表示方式是（ ）", "o": ["/dev/cdrom", "/mnt/cdrom", "/etc/cdrom", "/var/cdrom"], "a": "A", "n": "【答案正确】光驱的设备文件为 /dev/cdrom（通常是指向 /dev/sr0 的符号链接）；/mnt/cdrom、/media/cdrom 是习惯上的挂载点目录，/etc、/var 下不存在 cdrom 设备。设备文件才位于 /dev。", "d": 0}, {"k": "y25linux", "s": 364, "t": "单选", "q": "下列哪一个指令可以用来探查某一部主机是否连上网络（ ）", "o": ["ping", "netshow", "ifconfig", "route"], "a": "A", "n": "【答案正确】ping 用 ICMP 回显请求/应答直接测试目标主机网络是否连通，是探查连通性的标准手段；ifconfig/route 分别查看接口配置与路由表，netshow 不是标准 Linux 命令（属 Solaris 生态相关叫法）。", "d": 0}, {"k": "y25linux", "s": 365, "t": "单选", "q": "在Linux系统上做备份的两种类型是（）", "o": ["系统备份和数据备份", "系统备份和用户备份", "用户备份和数据备份", "文件备份和数据备份"], "a": "B", "n": "【答案正确】按教材口径，Linux 备份按对象分为两类：系统备份（备份系统文件、服务配置、安装的程序，用于系统崩溃后的灾难恢复）和用户备份（备份用户的个人数据与文档，防误删）。其余组合（系统/数据、用户/数据、文件/数据）均非教材标准分类。", "d": 0}, {"k": "y25linux", "s": 366, "t": "单选", "q": "BIND系统由解析库例程DNS命令行界面用于远程控制的程序及（ ）4个主要部分组成", "o": ["域名解析器", "域名服务器守护进程", "域名更新器", "域名应答器"], "a": "B", "n": "【答案正确】BIND 系统由四部分组成：解析库例程（resolver）、DNS 命令行界面（dig/nslookup/nsupdate 等）、用于远程控制的程序（rndc）以及域名服务器守护进程（named）。空缺的正是 named 守护进程；'域名更新器''域名应答器'不是 BIND 的组成部分。", "d": 0}, {"k": "y25linux", "s": 367, "t": "单选", "q": "mkfs默认建立的文件系统为()", "o": ["ext2", "ext3", "vfat", "jfs"], "a": "A", "n": "【答案正确】不指定文件系统类型时，传统 util-linux 的 mkfs 默认创建 ext2（mkfs 即 mkfs.ext2 的链接）。ext3 需用 mkfs.ext3 或 mkfs -t ext3，vfat 用 mkfs.vfat，jfs 用专门工具。【版本差异】现代发行版中该默认值未变，但主流安装已改用 ext4/xfs。", "d": 0}, {"k": "y25linux", "s": 368, "t": "多选", "q": "在进行linux系统分区时，我们至少要分出哪些分区（ ）。", "o": ["/", "/usr", "/swap", "/proc"], "a": "AC", "n": "【答案存疑】参考答案 AC（/ 与 swap）符合老教材'安装 Linux 至少划分根分区和交换分区'的传统惯例，RHEL5/6 时代 anaconda 无 swap 会警告，教材普遍按两分区教学，按教材口径 AC 可接受。但严格技术口径下交换分区并非必需（可用交换文件替代或不配置），最少仅需 A（/根分区）即可安装，这与本库第 345 题（判定'必须包含系统分区和交换分区'为错误）的口径相互矛盾。两说均有依据，按严格口径应为 A，故标存疑供复核裁决。【概念争议】", "d": 1}, {"k": "y25linux", "s": 369, "t": "判断", "q": "()符号链接只可以包含绝对路径,不可以包含相对路径", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】符号链接保存的是目标路径字符串，既可用绝对路径（ln -s /a/b link1）也可用相对路径（相对链接自身所在目录解析，如 ln -s ../b link2），题干称'只可以包含绝对路径'错误，故判 B（错误）正确。硬链接才不允许跨文件系统，与符号链接路径写法无关。", "d": 0}, {"k": "y25linux", "s": 370, "t": "判断", "q": "()/分区越大越好，因为/越大，Linux启动速度越快", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】分区大小与系统启动速度没有必然联系，启动时间主要取决于内核加载、磁盘 I/O 与系统服务数量，而非 / 分区容量。/ 分区过大反而使规划失衡（不便于隔离),题干因果错误，判 B 正确。", "d": 0}, {"k": "y25linux", "s": 371, "t": "单选", "q": "/dev/eth1表示()", "o": ["第二个以太网设备", "网卡", "第一个以太网设备", "视频压缩卡"], "a": "A", "n": "【答案正确】eth 编号从 0 起，eth1 表示第二个以太网设备（第一块是 eth0），故选 A。【术语提示】严格说 Linux 网卡是内核网络接口而非 /dev 下的设备文件（实际位于 /sys/class/net），/dev/eth1 并不存在，属题库沿用老教材的表述瑕疵，不影响按意图判 A。", "d": 0}, {"k": "y25linux", "s": 372, "t": "判断", "q": "()所谓的LAMP平台指的是:Linux+Apache+MySQL+Postfix", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】LAMP 指 Linux + Apache + MySQL + PHP（也可为 Perl/Python），最后一项是脚本语言而非软件；Postfix 是邮件传输代理（MTA），与 LAMP 无关，题干把 P 误作 Postfix，判错误正确。", "d": 0}, {"k": "y25linux", "s": 373, "t": "单选", "q": "（ ）在Linux系统的/proc/sys下存放着某些可调内核参数的文件，如果想保护系统不受SYN洪泛攻击，将需要设置哪个文件?", "o": ["tcp_syn", "tcp_syncookies", "udp_syn", "udp_syncookies"], "a": "B", "n": "【答案正确】防 SYN 洪泛攻击应开启 SYN Cookie，即把 /proc/sys/net/ipv4/tcp_syncookies（net.ipv4.tcp_syncookies）置 1，内核以密码学方式伪造应答绕过半连接队列耗尽；tcp_syn、udp_syn、udp_syncookies 均为虚构的参数名，不是内核真实文件。", "d": 0}, {"k": "y25linux", "s": 374, "t": "单选", "q": "Linux系统中,程序运行有若干优先级,最低的优先级是()", "o": ["18", "19", "-20", "-21"], "a": "B", "n": "【答案正确】Linux 进程 nice（谦让）值范围 -20～19，数值越大越'谦让'、抢占 CPU 的优先级越低，故 19 是最低优先级；-20 为最高优先级。root 可设置负值提高优先级，普通用户只能调大。", "d": 0}, {"k": "y25linux", "s": 375, "t": "单选", "q": "为用户提供浏览web服务的是（）应用程序", "o": ["FTP", "DNS", "DHCP", "Apache"], "a": "D", "n": "【答案正确】Apache 是 Web 服务器程序，通过 HTTP 向用户浏览器提供网页浏览服务；FTP 用于文件传输，DNS 提供域名解析，DHCP 动态分配 IP 地址，均与网页浏览无关。", "d": 0}, {"k": "y25linux", "s": 376, "t": "单选", "q": "哪个目录存放用户密码信息（ ）。", "o": ["/boot", "/etc", "/var", "/dev"], "a": "B", "n": "【答案正确】与第 349 题重复：/etc 目录存放账号与口令信息（/etc/passwd、/etc/shadow）。/boot 存引导文件，/var 存可变数据（日志、邮件队列等），/dev 存设备文件，均不保存用户密码信息。", "d": 0}, {"k": "y25linux", "s": 377, "t": "单选", "q": "谦让度的取值范围是()", "o": ["-50到100", "1到99", "-20到19", "0到100"], "a": "C", "n": "【答案正确】谦让度即 nice 值，取值范围 -20～19：值越小优先级越高，越大（最高 19）越'谦让'（让出 CPU）；-50～100、1～99、0～100 均不是 Linux 的 nice 范围（1～99 是部分教材中度量 PRI 优先级的说法，混淆项）。", "d": 0}, {"k": "y25linux", "s": 378, "t": "单选", "q": "在DNS区域文件里，$TTL指令为其后记录的存活时间字段设置默认值，$TTL值的默认单位是（ ）", "o": ["毫秒", "秒", "分", "小时"], "a": "B", "n": "【答案正确】$TTL 后的数字未带后缀时默认单位是秒（如 $TTL 86400 即 1 天），也可用 s/m/h/d/w 显式指定单位；DNS 记录存活时间从不以毫秒计。", "d": 0}, {"k": "y25linux", "s": 379, "t": "判断", "q": "（ ）目前流行的linux操作系统引导程序grub2只能引导linux", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】GRUB2 是通用的多系统引导程序，除 Linux 外还能引导 Windows、FreeBSD 等多种操作系统，支持链式加载其他引导器，'只能引导 linux'错误，判 B 正确。", "d": 0}, {"k": "y25linux", "s": 380, "t": "判断", "q": "()在Linux中可以使用whoami来查看当前用户的身份", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】whoami 打印当前有效用户名，可确认当前身份；如需查看 uid/gid 及所属全部组则用 id。题干说法正确。", "d": 0}, {"k": "y25linux", "s": 381, "t": "单选", "q": "Linux中使用(   )命令可以查看文件的属性", "o": ["ls", "ls–a", "ll", "cat"], "a": "C", "n": "【答案正确】ll 是 ls -l 的别名，以长格式显示文件权限、属主属组、大小、时间等属性，是'查看文件属性'最直接的命令；ls 只列文件名，ls -a 仅加显隐藏文件，cat 输出文件内容。【术语提示】个别系统未配置 ll 别名，规范写法为 ls -l。", "d": 0}, {"k": "y25linux", "s": 382, "t": "单选", "q": "假设文件filea的符号链接为fileb,那么删除filea后,下面的描述正确的是()", "o": ["fileb也随之被删除", "fileb仍存在,但是属于无效文件", "因为fileb未被删除,所以filea会被系统自动重新建立", "fileb会随filea的删除而被系统自动删除"], "a": "B", "n": "【答案正确】符号链接只保存目标的路径而非数据，删除 filea 后 fileb 文件本身仍然存在，但因其指向的目标已不存在而成为悬空链接（访问报 No such file or directory），属无效文件；系统既不会自动删除 fileb，也不可能重建 filea，故 B 正确。", "d": 0}, {"k": "y25linux", "s": 383, "t": "单选", "q": "BIND日志的常用术语有channel(通道)category(类别)module(模块)facility(设备)和（ ）", "o": ["severity(严重性)", "path(路径)", "time(时间)", "warning(警告)"], "a": "A", "n": "【答案正确】BIND 日志体系的核心术语包括：channel（通道，定义输出到文件/syslog/null）、category（类别，按消息来源选择通道）、severity（严重级别，critical/error/warning/notice/info 等）、facility（syslog 设备）、module（模块）；空缺项为 severity。path/time/warning 不是该术语体系的组成部分。", "d": 0}, {"k": "y25linux", "s": 384, "t": "单选", "q": "DNS域名系统主要负责主机名和（）之间的解析", "o": ["IP地址", "MAC地址", "网络地址", "主机别名"], "a": "A", "n": "【答案正确】DNS 的职责是在主机名（域名）与 IP 地址之间建立双向解析：正向解析（A/AAAA 记录）由名到 IP，反向解析（PTR 记录）由 IP 到名。MAC 地址由 ARP/NDP 协议解析，网络地址、主机别名都不是 DNS 解析的核心对象。", "d": 0}, {"k": "y25linux", "s": 385, "t": "多选", "q": "Linux系统中进行软件包卸载可用的命令为（    ）。", "o": ["rpm -ivh", "rpm -ev", "rpm -qa", "yum remove"], "a": "BD", "n": "【答案正确】B rpm -ev（-e 卸载、-v 显示详细信息）和 D yum remove 都能卸载软件包，参考集合 BD 恰好完整。A rpm -ivh 是安装（-i install、-v 详细、-h 显示进度），C rpm -qa 是查询全部已安装包，均不是卸载命令，不应选。", "d": 0}, {"k": "y25linux", "s": 386, "t": "判断", "q": "（ ）Samba为了更快速的与局域网内的主机通讯,使用UDP协议,范围是137~139,不使用TCP协议", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】Samba/SMB 同时依赖 TCP：SMB/CIFS 本体走 TCP 445，老式 NetBIOS 会话服务走 TCP 139；UDP 只用于 137（NetBIOS 名称服务）与 138（数据报服务）。'只使用 UDP、不使用 TCP'的说法错误，判 B 正确。", "d": 0}, {"k": "y25linux", "s": 387, "t": "单选", "q": "CentOS7系统中启动网络服务的命令是（ ）。", "o": ["servicenetworkstart", "/etc/init.d/networkstart", "systemctlstartnetwork.service", "/etc/init.d/rc.d/init.dstart"], "a": "C", "n": "【答案正确】按出题意图（原文空格丢失）应为 systemctl start network.service：CentOS7 采用 systemd，服务统一由 systemctl 启停；A（service network start）与 B（/etc/init.d/network start）是 RHEL5/6 的 SysV init 方式，D 的写法无效。【版本差异】CentOS7 官方推荐一套也提供 NetworkManager（systemctl start NetworkManager），但 network.service 依旧可用。", "d": 0}, {"k": "y25linux", "s": 388, "t": "单选", "q": "mc是UNIX风格操作系统的()", "o": ["文件编辑器/程序编译器", "配置网络的窗口工具", "目录浏览器/文件管理器", "Samba服务器管理工具"], "a": "C", "n": "【答案正确】mc（Midnight Commander）是类 UNIX 系统下仿 Norton Commander 的目录浏览器/文件管理器，提供双栏浏览、复制/移动/删除等文件操作并内置简易编辑器；它不是专门的文本编辑器、网络配置或 Samba 管理工具。", "d": 0}, {"k": "y25linux", "s": 389, "t": "单选", "q": "特殊权限有3种，分别是()", "o": ["suidguidstickey", "uidgidstickey", "uidguidstickey", "suiduidstickey"], "a": "A", "n": "【答案正确】Linux 的三种特殊权限为 SUID（u+s）、SGID（g+s）与 Sticky（o+t），对应选项 A。【术语提示】A 中'guid'应为 sgid、'stickey'应为 sticky，系拼写瑕疵，但 A 是唯一正确组合；B/C/D 把 uid/gid 等普通标识与特殊权限混拼，均不成立。", "d": 0}, {"k": "y25linux", "s": 390, "t": "判断", "q": "（ ）MBR(masterBootRecorder)的硬盘分区表的大小为512字节", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】整个 MBR 扇区为 512 字节 = 446 字节引导代码 + 64 字节分区表（4 个主分区表项×16 字节）+ 2 字节结束标志 55AA。题干把'分区表'的大小说成 512 字节，混淆了整个 MBR 与其中分区表，判错误正确。", "d": 0}, {"k": "y25linux", "s": 391, "t": "单选", "q": "改变文件所有者的命令为（ ）", "o": ["chmod", "touch", "chown", "cat"], "a": "C", "n": "【答案正确】chown 用于改变文件属主（可同时用 user:group 形式改属组，仅改属组用 chgrp）；chmod 修改权限位，touch 更新时间戳或创建空文件，cat 查看文件内容，均不改变所有者。", "d": 0}, {"k": "y25linux", "s": 392, "t": "单选", "q": "/etc/shadow文件中存放()", "o": ["用户账号基本信息", "用户口令的加密信息", "用户组信息", "文件系统信息"], "a": "B", "n": "【答案正确】/etc/shadow 存放用户口令的加密摘要及口令有效期/老化策略，权限仅 root 可读；用户账号基本信息在 /etc/passwd，组信息在 /etc/group，'文件系统信息'与 shadow 无关（分区信息在 /etc/fstab）。", "d": 0}, {"k": "y25linux", "s": 393, "t": "判断", "q": "()虚拟控制台登陆就是使用文本方式登陆", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】虚拟控制台（virtual console，tty1~tty6）是系统在本地提供的字符终端，在其上登录即为文本方式登录，这是教材的标准表述；图形登录走的是X会话，另一回事。判断成立。", "d": 0}, {"k": "y25linux", "s": 394, "t": "单选", "q": "内核不包括的子系统是()", "o": ["进程调度系统", "内存管理系统", "虚拟文件系统", "硬件管理系统"], "a": "D", "n": "【答案正确】Linux内核的核心子系统包括进程调度、内存管理、虚拟文件系统（VFS）、网络子系统及进程间通信等，教科书惯列为前A/B/C三项；并不存在名为\"硬件管理系统\"的内核子系统，硬件部分由各类驱动模块承担，故D为应选项。", "d": 0}, {"k": "y25linux", "s": 395, "t": "单选", "q": "从后台启动进程,应在命令的结尾加上符号（ ）", "o": ["&", "@", "#", "$"], "a": "A", "n": "【答案正确】shell中在命令末尾加\"&\"即可把作业放到后台执行；\"#\"是注释符、\"$\"用于变量引用、\"@\"用于数组下标/主机名补全，均无后台运行含义。", "d": 0}, {"k": "y25linux", "s": 396, "t": "判断", "q": "（ ）只有用RELAY在访问数据库中作了标记的主机,或者在/etc/mail/relay-domains中列出的主机才允许投递要进行中继转发的邮件", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】这是Sendmail时代的中继控制口径：只有access数据库（/etc/mail/access）中以RELAY标记的主机或/etc/mail/relay-domains中列出的主机才允许通过该服务器中继转发邮件，其余主机收到Relaying denied。【版本差异】现代MTA（如postfix的mynetworks/smtpd_recipient_restrictions）机制不同，但按RHEL5老教材口径判断\"正确\"成立。", "d": 0}, {"k": "y25linux", "s": 397, "t": "单选", "q": "yml语法书写中，每个缩进由（ ）个空格组成，不能使用tab键", "o": ["一", "二", "三", "四"], "a": "B", "n": "【答案正确】YAML（如Ansible的playbook）约定每级缩进为2个空格，且必须用空格、禁止Tab键，B正确。注意YAML语法本身只要求同一层级缩进宽度一致，2空格是通行惯例与教材口径，一/三/四均不符合该约定。", "d": 0}, {"k": "y25linux", "s": 398, "t": "单选", "q": "多个Linux系统共存的时候,进行升级需要()", "o": ["删除其他Linux系统,仅仅保留一个", "不能完成升级", "指定指定需要升级的主分区", "多个Linux系统同时升级"], "a": "C", "n": "【答案正确】同一磁盘上共存多个Linux系统时，升级安装程序会检测到已有安装并要求指定要升级的那一个（其所在的分区/主分区），既不需删除其他系统，也不会同时升级多个系统，升级可正常完成，故选C。【题目缺陷】选项C中\"指定指定\"为重复字排版瑕疵，准确写法为\"指定需要升级的主分区\"。", "d": 0}, {"k": "y25linux", "s": 399, "t": "单选", "q": "BIND9预制了default_syslogdefault_debugdefault_stderr和()四个默认通道", "o": ["default_module", "null", "default_facility", "default_log"], "a": "B", "n": "【答案正确】BIND9预定义四个日志通道：default_syslog（送syslog）、default_debug、default_stderr（送执行者stderr）和null（丢弃所有信息）；default_module/default_facility/default_log均为杜撰名词，故选B。", "d": 0}, {"k": "y25linux", "s": 400, "t": "单选", "q": "DHCP是动态主机配置协议的简称,其作用是可以使网络管理员通过一台服务器来管理一个网络系统,自动地为一个网络中的主机分配地址（ ）", "o": ["网络", "MAC", "TCP", "IP"], "a": "D", "n": "【答案正确】DHCP（动态主机配置协议）的作用就是管理员通过一台服务器集中管理网络，自动为主机分配IP地址及掩码、网关、DNS等参数，故填IP；选项A\"网络\"与题干语义重复，MAC地址绑定的是物理网卡、TCP是传输层协议，均非所分配的地址类型。", "d": 0}, {"k": "y25linux", "s": 401, "t": "多选", "q": "在NIS客户机上，可以使用 （ ）命令查看 NIS服务器中使用的数据库和映射文件的名称。", "o": ["yptest -x", "ypwhich -x", "ypcat -x", "yppasswd -x"], "a": "BC", "n": "【答案正确】多选集合B、C恰为全部正确项。在NIS客户机上，`ypwhich -x` 与 `ypcat -x` 都会显示NIS映射昵称（nickname）转换表，即服务器所使用的各数据库/映射文件的名称（如passwd→passwd.byname、passwd.byuid等）。A项yptest用于依次执行一组NIS连通性测试、D项yppasswd用于修改NIS口令，两者都没有-x选项，不应入选。", "d": 0}, {"k": "y25linux", "s": 402, "t": "单选", "q": "关于代理服务器的论述,正确的是()", "o": ["使用internet上已有的公开代理服务器,只需配置客户端", "代理服务器只能代理客户端http的请求", "设置好的代理服务器可以被网络上任何主机使用", "使用代理服务器的客户端没有自己的ip地址"], "a": "A", "n": "【答案正确】使用Internet上现成的公开代理服务器时，服务端已架设完毕，客户端只需配置代理地址和端口即可，A正确。B错，代理不止HTTP（还可代理FTP、HTTPS，SOCKS则是通用代理）；C错，正规代理有ACL/认证等访问控制，并非网络上任何主机都能用；D错，使用代理的客户端仍保有并使用自己的IP与代理通信。", "d": 0}, {"k": "y25linux", "s": 403, "t": "判断", "q": "（ ）域名区分大小写,所以“sina”和“Sina”是不一样的", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】DNS域名不区分大小写，域名解析时统一按大小写不敏感处理，sina.com与Sina.com指向同一主机；\"区分大小写\"的说法错误，判B（错误）正确。", "d": 0}, {"k": "y25linux", "s": 404, "t": "判断", "q": "()在字符界面环境下注销Linux，可用exit或Ctrl+D", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】字符界面下exit命令可退出当前登录shell；在空提示符行按Ctrl+D发送EOF同样注销登录。两种方式均正确，判断成立。", "d": 0}, {"k": "y25linux", "s": 405, "t": "单选", "q": "下列哪一个指令不可以用来列出目录的内容( )", "o": ["ls", "pss", "man", "dir"], "a": "C", "n": "【答案正确】man是联机手册分页程序，只能查看命令或配置文件的帮助页，不能用来列出目录内容，为出题意图答案（ls、dir均可列目录）。【题目缺陷】B项\"pss\"疑为\"ps\"的排版误写，若按ps理解同样不能列目录，选项设置欠严谨；但单选意图下C（man）是题库标准答案。", "d": 0}, {"k": "y25linux", "s": 406, "t": "单选", "q": "Linux将存储设备和输入/输出设备均看做文件来操作，（）不是以文件的形式出现", "o": ["目录", "软链接", "i节点表", "网络适配器"], "a": "C", "n": "【答案正确】Linux中目录、软链接、设备（含网络适配器，如/dev/eth*等设备文件）都以文件形式出现；而i节点表（inode table）是文件系统内部的元数据结构，记录文件属性与数据块指针，本身不作为文件出现，故选C。", "d": 0}, {"k": "y25linux", "s": 407, "t": "判断", "q": "()named的调试级别用0~100的整数表示100级关闭调试,1级和2级适用于调试用户的配置和数据库", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】named的调试信息级别用0起的整数表示，0级表示关闭调试（而非\"100级关闭调试\"），级别越高输出信息越详细，1、2级适合调试配置文件和区域数据库文件。题干把\"0级关闭\"写成\"100级关闭\"，说法错误，判B（错误）正确。", "d": 0}, {"k": "y25linux", "s": 408, "t": "单选", "q": "建立一个新文件可以使用的命令为（ ）", "o": ["chmod", "more", "cp", "touch"], "a": "D", "n": "【答案正确】touch可创建新的空文件（对已有文件则是更新时间戳）；chmod只改权限、more分页浏览内容、cp复制已有文件，三者均不能建立新文件，故选D。", "d": 0}, {"k": "y25linux", "s": 409, "t": "单选", "q": "如果Linux文件权限位对应的八进制值为400，意味着属主具有()权限", "o": ["读写", "只读", "执行", "任意"], "a": "B", "n": "【答案正确】八进制400对应 r--------，即仅属主有读权限（r=4），组和其他用户无任何权限，故属主为只读；\"任意权限\"对应的属主位应为7（rwx）。", "d": 0}, {"k": "y25linux", "s": 410, "t": "单选", "q": "Linux内核获得系统控制权后,进行的初始化工作,以下哪项是错误的()", "o": ["执行与体系结构相关的设置", "设置各种入口地址", "初始化IRQ中断处理机制", "重新启动计算"], "a": "D", "n": "【答案正确】内核取得系统控制权后的初始化包括执行与体系结构相关的设置、设置各种入口地址、初始化IRQ等中断处理机制等；\"重新启动计算机\"不属于初始化工作（初始化阶段重启即意味着引导失败），故选D。", "d": 0}, {"k": "y25linux", "s": 411, "t": "单选", "q": "我们一般使用（ ）命令工具来建立分区上的文件系统", "o": ["mknod", "fdisk", "format", "mkfs"], "a": "D", "n": "【答案正确】mkfs（及mkfs.ext4、mkfs.xfs等派生形式）用于在分区上建立文件系统；mknod用于创建设备特殊文件，fdisk用于磁盘分区，format并非Linux下建文件系统的标准命令，故选D。", "d": 0}, {"k": "y25linux", "s": 412, "t": "单选", "q": "数据库系统的数据独立性是指（）", "o": ["不会因为数据的变化而影响应用程序", "不会因为某些存储结构的变化而影响其他的存储结构", "不会因为存储策略的变化而影响存储结构", "不会因为系统数据存储结构与数据逻辑结构的变化而影响应用程序"], "a": "D", "n": "【答案正确】数据独立性是指应用程序不因数据的存储结构（物理独立性）与逻辑结构（逻辑独立性）变化而受影响，D的表述涵盖这两层、最完整；A只针对数据取值的变化，B、C仅描述存储/结构内部之间的关系，都不完整，故选D。", "d": 0}, {"k": "y25linux", "s": 413, "t": "单选", "q": "linux中cron后台常驻程序(daemon)用于（ ）", "o": ["负责文件在网络中的共享", "管理打印子系统Managestheprintingsubsystem", "跟踪管理系统信息和错误", "管理系统日常任务的调度(scheduling)"], "a": "D", "n": "【答案正确】crond是定时任务守护进程，按crontab的计划周期性调度系统与用户的日常工作任务，故选D。文件网络共享由nfs/samba负责（A），打印子系统由lpd/cups管理（B），系统信息和错误跟踪由syslogd完成（C）。", "d": 0}, {"k": "y25linux", "s": 414, "t": "单选", "q": "下面哪个不是docker容器的驱动程序？", "o": ["XFS", "ZFS", "Btrfs", "Device mapper"], "a": "A", "n": "【答案正确】Docker的存储驱动有overlay2、aufs、devicemapper、btrfs、zfs、vfs等；XFS是文件系统，常作为RHEL上overlay2驱动的底层文件系统（需ftype=1），但它本身不是容器存储驱动，故选A。", "d": 0}, {"k": "y25linux", "s": 415, "t": "单选", "q": "Linux文件系统的文件都按其作用分门别类地放在相关的目录中，对于外部设备文件，一般应将其放在目录中（ ）", "o": ["/bin", "/etc", "/dev", "/lib"], "a": "C", "n": "【答案正确】按FHS规范，外部设备（块设备、字符设备）文件统一放在/dev目录下，如/dev/sda、/dev/tty0、/dev/lp0；/bin放基本命令，/etc放配置文件，/lib放共享库。故选C。", "d": 0}, {"k": "y25linux", "s": 416, "t": "判断", "q": "（ ）Linux系统上的终端口对任何人都是可写的，从而使用户可以用write命令互相发送信息", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】终端设备并非\"对任何人都是可写\"：能否写入取决于终端文件的权限位与用户的mesg设置，用户执行mesg n后其他用户便无法再用write/wall向其终端写信息。该说法的绝对化表述错误，判B（错误）正确。", "d": 0}, {"k": "y25linux", "s": 417, "t": "单选", "q": "（ ）如果使用ln命令将生成了一个指向文件file的符号链接newfile,如果你删除了file文件,是否还能够访问文件中的数据?", "o": ["不可能再访问", "仍然可以访问", "能否访问取决于file的所有者", "能否访问取决于file的权限"], "a": "A", "n": "【答案正确】符号链接（ln -s）只保存目标文件的路径名而不直接指向数据块，删除file后newfile成为悬空链接，其数据块随文件删除而不可再访问（除非原本还建有指向同一数据的硬链接，但题设仅谈符号链接），故\"不可能再访问\"正确。", "d": 0}, {"k": "y25linux", "s": 418, "t": "单选", "q": "用ls–al命令列出下面的文件列表，文件是符号连接文件（ ）", "o": ["-rw-rw-rw-2hel-susers56Sep0911：05hello", "-rwxrwxrwx2hel-susers56Sep0911：05goodbey", "drwxr--r--1helusers1024Sep1008：10zhang", "lrwxr--r--1helusers2024Sep1208：12cheng"], "a": "D", "n": "【答案正确】ls -l输出首字符标识文件类型：\"-\"为普通文件、\"d\"为目录、\"l\"为符号链接，仅D项lrwxr--r--以l开头，故选D。术语提示：真实ls中符号链接权限一般显示为lrwxrwxrwx且文件名带\"->\"指向信息，此处按首字符l判定即可。", "d": 0}, {"k": "y25linux", "s": 419, "t": "单选", "q": "以下哪个命令可以终止一个用户的所有进程（ ）。", "o": ["skillall", "skill", "kill", "killall"], "a": "B", "n": "【已修正答案】平台原答案 D 有误（平台答案系 AI 生成、仅供参考），已按核验改为 B。skill可按用户、终端、进程名等条件向选中的进程发送信号，如 skill -KILL -u user1 即终止user1的全部进程，这正是\"终止一个用户的所有进程\"的命令；killall的本义是按命令名终止进程而非按用户（A项skillall是skill与killall的混拼、并不存在，C项kill按PID终止单个进程）。注：新版psmisc的killall支持-u选项按用户杀进程，但本题老教材考查点与标准答案为skill。", "d": 2}, {"k": "y25linux", "s": 420, "t": "单选", "q": "为卸载一个软件包,应使用（）", "o": ["rpm-i", "rpm-e", "rpm-q", "rpm-V"], "a": "B", "n": "【答案正确】rpm -e（erase）用于卸载软件包；rpm -i安装、-q查询、-V校验。【题目缺陷】选项排版丢失空格，\"rpm-e\"等实为 rpm -e、rpm -i、rpm -q、rpm -V。", "d": 0}, {"k": "y25linux", "s": 421, "t": "单选", "q": "为了达到使文件的所有者有读(R)和写(W)的许可，而其他用户只能进行访问，在设置文件的许可值时，应当设为( )。", "o": ["566", "644", "655", "744"], "a": "B", "n": "【答案正确】属主需读+写=6（rw-），其他用户\"只能进行访问\"即只读=4，组相应取4，许可值为644；566/655使其他用户获得写或执行权限、744使属主具有执行权，均不合题意，故选B。", "d": 0}, {"k": "y25linux", "s": 422, "t": "单选", "q": "Linux的内核版本不包括()", "o": ["二次版本号", "主版本号", "次版本号", "修正号"], "a": "A", "n": "【答案正确】Linux内核版本号由\"主版本号.次版本号.修正号（修订号）\"三部分构成，如2.6.18中2为主版本、6为次版本、18为修正号；不存在\"二次版本号\"的说法，故选A。", "d": 0}, {"k": "y25linux", "s": 423, "t": "单选", "q": "Linux的root用户默认UID值为()", "o": ["9", "99", "1", "0"], "a": "D", "n": "【答案正确】root（超级用户）的UID固定为0，系统正是凭UID=0识别超级用户；9、99属于系统账号段（如nobody常用65534/99），1多(daemon等系统账号)，均不对，故选D。", "d": 0}, {"k": "y25linux", "s": 424, "t": "判断", "q": "（ ）除root用户外，其它用户只能用kill命令终止自己的创建的进程", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】按Linux信号权限规则，进程只能向属于同一UID（自己创建）的进程发送信号，root拥有CAP_KILL不受限、可终止任意用户的进程。判断\"除root外其它用户只能用kill终止自己创建的进程\"与该规则一致，成立。", "d": 0}, {"k": "y25linux", "s": 425, "t": "单选", "q": "在Linux中，以下哪个命令用于将一个正在运行的进程置于后台运行？", "o": ["back", "pause", "bg", "runbg"], "a": "C", "n": "【答案正确】bash内建命令bg把被Ctrl+Z暂停的作业放到后台继续运行（正在前台运行的进程需先Ctrl+Z挂起再bg，或启动时在命令尾加&）；back、pause、runbg均不是bash的命令，故选C。", "d": 0}, {"k": "y25linux", "s": 426, "t": "单选", "q": "在重新启动Linux系统的同时把内存中的信息写入硬盘，应使用命令实现（ ）", "o": ["#poweroff", "#halt", "#reboot", "#shutdown–rnow"], "a": "D", "n": "【答案正确】shutdown -r now按教材口径是规范的\"重启\"方式：先正常运行关机流程（通知用户、同步缓冲把内存数据写回磁盘）再重新启动；poweroff只关机不重启，halt只是停机。A/B/C均不符。【题目缺陷】选项排版丢失空格，\"shutdown–rnow\"实为 shutdown -r now。", "d": 0}, {"k": "y25linux", "s": 427, "t": "单选", "q": "在本地的文件系统中下列哪些linux路径结构是有效的?（ ）", "o": ["//usr\\zhang/memo", "\\usr\\zhang\\memo", "/usr/zhang/memo", "\\usr/zhang/memo"], "a": "C", "n": "【答案正确】Linux路径以\"/\"为分隔符、以单个\"/\"开头表示根；反斜杠\"\\\\\"是Windows的写法，\"//usr\\\\zhang/memo\"等混用均无效，只有\"/usr/zhang/memo\"是有效的本地路径，故选C。", "d": 0}, {"k": "y25linux", "s": 428, "t": "单选", "q": "NFS服务的配置文件名为（ ）。", "o": ["/var/ftp/pub", "/etc/vsftpd", "/etc/exports", "/etc/rc.d"], "a": "C", "n": "【答案正确】NFS服务端的配置文件是/etc/exports，逐行定义共享目录、允许的客户机及权限（如rw、sync、ro）；/var/ftp/pub是vsftpd的默认匿名发布目录，/etc/vsftpd是vsftpd配置目录，/etc/rc.d是启动脚本目录，均与NFS无关，故选C。", "d": 0}, {"k": "y25linux", "s": 429, "t": "单选", "q": "以下哪条命令在创建一个xp用户的时候将用户加入到root组中（ ）。", "o": ["useradd-gxproot", "useradd-rrootxp", "useradd-grootxp", "useraddrootxp"], "a": "C", "n": "【答案正确】useradd -g root xp 表示创建用户xp并将其主（基本）组指定为root。A项还原后为 useradd -g xp root，是创建名为root的用户且主组为xp，语义不符；B、D缺少-g参数。【题目缺陷】选项内空格丢失，准确写法为 useradd -g root xp。", "d": 0}, {"k": "y25linux", "s": 430, "t": "单选", "q": "使用（ ）命令可以查看文件的属性", "o": ["ll", "ls", "ls–a", "cat"], "a": "A", "n": "【答案正确】ll通常是ls -l的别名，可显示文件的权限、链接数、属主属组、大小、修改时间等完整属性；ls仅列出文件名，ls -a只是额外包含隐藏文件，cat输出的是文件内容而非属性，故\"查看文件属性\"选A。", "d": 0}, {"k": "y25linux", "s": 431, "t": "单选", "q": "在下列命令中,不能显示文本文件内容的命令是:（ ）", "o": ["more", "less", "tail", "join"], "a": "D", "n": "【答案正确】more、less可分页查看文本，tail可显示文件尾部（tail -f常用于跟踪日志），均能显示文本文件内容；join用于对两个文件按公共字段进行连接合并后输出结果，不是内容查看命令，故选D。", "d": 0}, {"k": "y25linux", "s": 432, "t": "判断", "q": "()Linux系统安装过程中，默认情况下根口令没有字符长短的限制，但是必须把口令输入两次；如果两次输入的口令不一样，安装程序将会提示用户重新输入口令", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】安装时根口令必须输入两次，两次输入不一致时安装程序会提示重新输入，该核心考点与RHEL安装手册一致，判\"正确\"成立。【题目缺陷】题干\"根口令没有字符长短的限制\"与原口径矛盾——RHEL5安装手册原句为\"根口令必须至少6个字符\"，疑为排版/改写损失；按出题意图并参考教材，答案按\"正确\"处理。", "d": 0}, {"k": "y25linux", "s": 433, "t": "单选", "q": "如果想只查看Linux中Centos系统新增加的硬盘sdb的分区情况该使用什么命令？（ ）", "o": ["fdisk -l", "fdisk sdb", "fdisk /dev/sdb", "fdisk /dev/sda"], "a": "C", "n": "【答案正确】出题意图是针对新增硬盘sdb操作，故选C目录定位到/dev/sdb（进入fdisk后可按p查看该盘分区）。A项fdisk -l列出的是全部磁盘而非\"只查看sdb\"，D项针对的是旧盘sda。【题目缺陷】严格意义上查看sdb分区表的准确写法是 fdisk -l /dev/sdb，题面系从\"分区/查看\"混用的教材口径化简而来，按意图C成立。", "d": 0}, {"k": "y25linux", "s": 434, "t": "单选", "q": "添加用户的命令是（ ）。", "o": ["useradd", "usersadd", "addusers", "appenduser"], "a": "A", "n": "【答案正确】RHEL/CentOS中添加用户的标准命令是useradd（RHEL上adduser仅是指向useradd的符号链接，Debian系才是独立工具）；usersadd、addusers、appenduser均不是标准命令，故选A。", "d": 0}, {"k": "y25linux", "s": 435, "t": "单选", "q": "Linux内核版本号的第二部分如果是偶数，意味着该内核为()的内核", "o": ["稳定", "开发中", "测试", "发行"], "a": "A", "n": "【答案正确】按2.x时代的内核版本约定：主版本号.次版本号.修订号中的次版本号为偶数表示稳定（stable）内核，奇数表示开发测试版，故选A。【版本差异】自3.0起Linus取消了次版本号奇偶代表稳定/开发的含义，但该题按教材老口径A正确。", "d": 0}, {"k": "y25linux", "s": 436, "t": "单选", "q": "当系统工作负载增加时，CPU的()将占很大比重", "o": ["用户时间", "系统时间", "空闲时间", "进程时间"], "a": "A", "n": "【答案正确】系统负载增加主要表现为应用程序运算增多，用户态的用户时间（user time）随之显著上升；系统时间主要消耗在系统调用与中断处理上，仅在内核操作密集时才突出；空闲时间会随负载增加而下降；\"进程时间\"不是top等工具的独立统计口径，故选A。", "d": 0}, {"k": "y25linux", "s": 437, "t": "单选", "q": "在Linux中，如何在终端中列出当前目录下的所有文件和子目录，包括隐藏文件？", "o": ["ls -a", "ls -l", "ls -R", "ls -h"], "a": "A", "n": "【答案正确】ls -a显示目录下所有条目，包括\".\"、\"..\"及以点开头的隐藏文件；ls -l是长格式但不显示隐藏项，ls -R递归列出子目录，ls -h以人类可读单位显示大小，均不符合\"包括隐藏文件\"的要求，故选A。", "d": 0}, {"k": "y25linux", "s": 438, "t": "单选", "q": "下面哪个选项能取消shutdown命令（ ）。", "o": ["shutdown-c", "shutdown-x", "shutdown-u", "shutdown-n"], "a": "A", "n": "【答案正确】shutdown -c用于取消已排定（尚未执行）的关机或重启任务；-x、-u不是shutdown的选项，-n是老式不经init直接关机的开关也非取消功能，故选A。", "d": 0}, {"k": "y25linux", "s": 439, "t": "单选", "q": "在RHEL5及以上系统环境中，通过密钥对验证方式加强SSH登录的安全时，应该将客户机生成的公钥文件内容添加到服务器端目标用户的（ ）文件中", "o": ["~/.ssh/id_rsa", "~/.ssh/id_rsa.pub", "~/.ssh/known_hosts", "~/.ssh/authorized_keys"], "a": "D", "n": "【答案正确】密钥对验证时，需将客户端生成的公钥内容追加到服务器端目标用户的~/.ssh/authorized_keys文件中（ssh-copy-id默认即完成此操作）；id_rsa是客户端私钥本身、id_rsa.pub是客户端的公钥文件（应保留在客户端）、known_hosts保存的是服务端主机指纹，均不符，故选D。", "d": 0}, {"k": "y25linux", "s": 440, "t": "单选", "q": "为节省击键,bashshell提供了多种可补全部分输入值的方法,可输（ ）,然后按TEB键来补全主机名", "o": ["$", "@", "&", "~"], "a": "B", "n": "【答案正确】bash自动补全约定：输入@后按Tab键可补全主机名（依据/etc/hosts等），同理$后按Tab补全变量名、~后按Tab补全用户名，&无补全功能，故选B。【题目缺陷】题干\"TEB键\"为\"Tab键\"的排版误写。", "d": 0}, {"k": "y25linux", "s": 441, "t": "判断", "q": "()Linux的特点之一是:它是一种开放免费的操作系统", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】Linux遵循GPL发布，源代码开放，可自由获取、使用、修改和再分发，教材历来把\"开放源代码、免费使用\"列为其基本特点之一，判断\"正确\"成立。", "d": 0}, {"k": "y25linux", "s": 442, "t": "单选", "q": "将光盘/dev/hdc卸载的命令是（ ）", "o": ["umount/dev/hdc", "unmount/dev/hdc", "umount/mnt/cdrom/dev/hdc", "unmount/mnt/cdrom/dev/hdc"], "a": "A", "n": "【答案正确】Linux卸载命令是umount（不存在unmount命令），格式为 umount 设备名或挂载点，A即 umount /dev/hdc。B的unmount是臆造命令；C、D把挂载点与设备名拼在同一条命令里传给umount，参数错误。", "d": 0}, {"k": "y25linux", "s": 443, "t": "单选", "q": "下列关于链接描述，错误的是()", "o": ["硬链接就是让链接文件的i节点号指向被链接文件的i节点", "硬链接和符号连接都是产生一个新的i节点", "链接分为硬链接和符号链接", "硬连接不能链接目录文件"], "a": "B", "n": "【答案正确】B的说法错误在于：硬链接与被链接文件共用同一个i节点，并不产生新i节点，只有符号链接才新建i节点，所以B是应选的“错误描述”。A描述硬链接指向同一i节点（教材口径成立）、C链接分为硬链接和符号链接、D硬链接不能用于目录，均为正确陈述。", "d": 0}, {"k": "y25linux", "s": 444, "t": "单选", "q": "用户编写了一个文本文件a.txt,想将该文件名称改为txt.a,下列命令（）可以实现", "o": ["cda.txtxt.a", "echoa.txt>txt.a", "rma.txttxt.a", "cata.txt>txt.a"], "a": "D", "n": "【答案正确】【题目缺陷】严格说改名应使用“mv a.txt txt.a”，但选项未提供mv。echo a.txt>txt.a 只会把字面字符串a.txt写入文件；rm是删除文件；cd用于切换目录且选项空格丢失应为“cd a.txt txt.a”；只有“cat a.txt > txt.a”能生成内容相同的txt.a，按出题意图选D。", "d": 0}, {"k": "y25linux", "s": 445, "t": "单选", "q": "内核程序提供的使程序互相通信的机制不包括（ ）", "o": ["资源定位", "共享内存", "信号标志", "消息队列"], "a": "A", "n": "【答案正确】内核提供的进程间通信（IPC）机制包括管道、信号/信号量（信号标志）、消息队列、共享内存、套接字等。“资源定位”属于地址/资源查找概念，不是IPC机制，故选A。", "d": 0}, {"k": "y25linux", "s": 446, "t": "单选", "q": "在Linux中,管道分为（）种类型", "o": ["1", "2", "3", "4"], "a": "B", "n": "【答案正确】管道分为2种：无名（匿名）管道，用于有亲缘关系的进程间通信；命名管道（FIFO），可用于无亲缘关系的进程。故选B。", "d": 0}, {"k": "y25linux", "s": 447, "t": "单选", "q": "关闭linux系统(不重新启动)可使用命令（ ）", "o": ["ctrl+alt+del", "shutdown-r", "halt", "reboot"], "a": "C", "n": "【答案正确】halt停机且不重新启动；shutdown -r与reboot均为重启；ctrl+alt+del在默认配置下触发的是重启动作。故选C。", "d": 0}, {"k": "y25linux", "s": 448, "t": "单选", "q": "一个硬盘最多能够被分成____个主分区", "o": ["1", "2", "3", "4"], "a": "D", "n": "【答案正确】MBR分区表下一个硬盘最多4个主分区，超过需求须将一个主分区改作扩展分区再划逻辑分区。【版本差异】GPT磁盘主分区可远多于4个，本题按传统MBR/老教材口径判D无误。", "d": 0}, {"k": "y25linux", "s": 449, "t": "判断", "q": "()Linux不可以与MS-DOSOS/2Windows等其他操作系统共存于同一台机器上", "o": ["正确", "错误"], "a": "B", "n": "【答案正确】判断依据：Linux可通过GRUB/LILO多系统引导与MS-DOS、Windows、OS/2等安装在同一块磁盘上共存，因此“不可以共存”的说法是错误的，应判“错误”（B）。", "d": 0}, {"k": "y25linux", "s": 450, "t": "单选", "q": "在大多数Linux发行版本中，以下哪个属于块设备(block devices)", "o": ["串行口", "硬盘", "虚拟终端", "打印机"], "a": "B", "n": "【答案正确】硬盘按数据块随机存取，是典型的块设备；串行口、虚拟终端、打印机按字节流访问，属字符设备。故选B。", "d": 0}, {"k": "y25linux", "s": 451, "t": "单选", "q": "下列关于apache主配置文件配置参数解释不正确的是（ ）", "o": ["ServerName用于设置Apache服务器的主机名和端口号", "ServerRoot用于指定Apache服务器能够访问的每一个能够访问的每个目录及其子目录", "Listen使Apache能够监听指定的IP地址或端口", "DocumentRoot用于设置Apache提供的HTML文档根目录"], "a": "B", "n": "【答案正确】ServerRoot指定的是Apache的安装根目录（conf、logs、modules等所在目录），而非“能够访问的每个目录及其子目录”，B解释不正确，为应选项。ServerName设主机名和端口、Listen监听IP/端口、DocumentRoot设文档根目录的解释均正确。", "d": 0}, {"k": "y25linux", "s": 452, "t": "单选", "q": "用Samba共享的目录,但在Windows网上邻居中却看不到,应该在/etc/samba/smb.conf中设置（ ）。", "o": ["AllowWindowsClient=yes", "Browseable=yes", "Hidden=no", "AllowallClient=yes"], "a": "B", "n": "【答案正确】smb.conf中browseable=yes控制共享是否出现在浏览列表（网上邻居）中，共享不可见时应设为yes。AllowWindowsClient、Hidden、AllowallClient都不是Samba的有效配置参数。", "d": 0}, {"k": "y25linux", "s": 453, "t": "单选", "q": "/var/log主要适用于()", "o": ["各种服务的配置文件", "引导记录", "各种可执行文件", "日志记录文件"], "a": "D", "n": "【答案正确】/var/log存放系统及各种服务的日志记录文件；服务配置文件在/etc，可执行文件在/usr/bin、/usr/sbin、/bin等，引导记录位于磁盘引导扇区/启动目录。故选D。", "d": 0}, {"k": "y25linux", "s": 454, "t": "单选", "q": "使用PS获取当前运行进程的信息时,输出内容PPID的含义为( )", "o": ["进程调度的级别", "进程的用户ID", "进程ID", "父进程ID"], "a": "D", "n": "【答案正确】ps输出中PID为进程ID，PPID（Parent PID）是其父进程ID，故选D。", "d": 0}, {"k": "y25linux", "s": 455, "t": "单选", "q": "关于linux下列说明哪些是错误的?（）", "o": ["Linux是一个开放源码的操作系统.", "Linux是一个类UNIX的操作系统.", "Linux是一个单用户的操作系统.", "Linux是一个多任务的操作系统."], "a": "C", "n": "【答案正确】Linux是多用户多任务操作系统，“单用户的操作系统”说法错误，应选C。开源、类UNIX、多任务三项描述均正确。", "d": 0}, {"k": "y25linux", "s": 456, "t": "单选", "q": "当加载CDROM时缺省的文件系统类型是哪一个（）", "o": ["vfat", "ufs", "ext2", "iso9660"], "a": "D", "n": "【答案正确】CD-ROM光盘的标准文件系统是iso9660，mount光盘时缺省按该类型识别；vfat用于Windows FAT分区，ufs是BSD系文件系统，ext2是老式Linux文件系统。故选D。", "d": 0}, {"k": "y25linux", "s": 457, "t": "单选", "q": "常见的BIND服务配置有（ ）", "o": ["主DNS服务器", "DNS转发器", "正向DNS服务器", "反向DNS服务器"], "a": "A", "n": "【答案正确】教材中BIND/DNS服务器常见配置类型为主DNS服务器、辅助DNS服务器、缓存服务器（配转发器）；“正向”“反向”指解析方向（区域类型）而非服务器类别，故单选下A最标准、正确。", "d": 0}, {"k": "y25linux", "s": 458, "t": "单选", "q": "当用命令ls–al查看文件和目录时,欲观看卷过屏幕的内容,应使用组合键（ ）", "o": ["Shift+Home", "Ctrl+PgUp", "Alt+PgDn", "Shift+PgUp"], "a": "D", "n": "【答案正确】字符终端下按Shift+PgUp（或Shift+PgDn）可翻看终端回滚缓冲区中已滚出屏幕的内容，故选D；其余组合键不是标准的终端回滚键。", "d": 0}, {"k": "y25linux", "s": 459, "t": "单选", "q": "在给定文件中查找与设定条件相符字符串的命令为（ ）", "o": ["grep", "gzip", "find", "sort"], "a": "A", "n": "【答案正确】grep按字符串/正则表达式在给定文件内容中查找匹配行，故选A。find按文件名、大小、时间等属性查找文件本身；gzip是压缩工具，sort是排序工具。", "d": 0}, {"k": "y25linux", "s": 460, "t": "单选", "q": "关于硬链接的描述正确的是()", "o": ["跨文件系统", "目录系统", "可以做目录的连接", "链接文件的i节点同被链接文件的i节点"], "a": "D", "n": "【答案正确】硬链接与被链接文件共用同一个i节点，D正确。硬链接不能跨文件系统（A错）、不能对目录建立链接（C错），B“目录系统”语义不通，均应排除。", "d": 0}, {"k": "y25linux", "s": 461, "t": "单选", "q": "在rocky中部署apache服务器时，测试机浏览服务器主页失败，最不可能的原因是（       ）", "o": ["网络连接出问题", "服务器防火墙拦截", "测试机防火墙拦截", "selinux服务拦截"], "a": "C", "n": "【答案正确】测试机作为客户端发起的是出站HTTP访问，其本机防火墙默认策略是拦入站不拦出站，故“测试机防火墙拦截”最不可能。网络连接故障、服务器防火墙拦截、服务器上SELinux拦截都是浏览失败最常见的原因。", "d": 0}, {"k": "y25linux", "s": 462, "t": "单选", "q": "使用Samba服务器,一般来说,可以提供的服务有（ ）", "o": ["域名服务", "打印服务", "磁盘格式化", "Web服务"], "a": "B", "n": "【答案正确】Samba基于SMB/CIFS协议，典型提供文件共享与打印共享两类服务，选项中只有打印服务属于其服务范围。域名服务由DNS提供，Web服务由Apache/Nginx提供，磁盘格式化与Samba无关。", "d": 0}, {"k": "y25linux", "s": 463, "t": "单选", "q": "在linux系统中，Netfilter包过滤防火墙主要工作在OSI参考模型的（ ）", "o": ["物理层", "数据链路层", "网络层", "应用层"], "a": "C", "n": "【答案正确】Netfilter/iptables依据IP地址、协议、端口对IP数据包进行过滤，主要工作在OSI参考模型的网络层（部分规则涉及传输层端口，教材口径为网络层）。故选C。", "d": 0}, {"k": "y25linux", "s": 464, "t": "单选", "q": "使用者的信息（message），通常存放在( )", "o": ["/var/log", "/usr/local", "/var/spool/mail", "/home"], "a": "C", "n": "【答案正确】用户邮件信息（message）按用户名存放于/var/spool/mail/\u003c用户名>；/var/log是日志目录，/usr/local用于本地安装的软件，/home是用户主目录。故选C。", "d": 0}, {"k": "y25linux", "s": 465, "t": "单选", "q": "第一次发出的traceroute包的TTL被设为（）", "o": ["0", "1", "2", "3"], "a": "B", "n": "【答案正确】traceroute采用TTL逐跳递增的原理：第一批发出的探测包TTL设为1，到达第一跳路由器即超时并回送ICMP超时报文，从而测出第一跳地址。故选B。", "d": 0}, {"k": "y25linux", "s": 466, "t": "单选", "q": "你给公司的新同事添加一个用户，你起初指定他的帐号在30天后过期，现在想改变这个过期时间，用下面哪个命令？（ ）", "o": ["usermod-a", "usermod-d", "usermod-x", "usermod-e"], "a": "D", "n": "【答案正确】usermod -e 日期（YYYY-MM-DD）用于设置或修改账号过期时间。usermod -a 需配合 -G 向组追加成员，-d 修改用户主目录，usermod没有 -x 选项。故选D。", "d": 0}, {"k": "y25linux", "s": 467, "t": "单选", "q": "Linux有三个查看文件的命令,若希望在查看文件内容过程中可以用光标上下移动来查看文件内容,应使用命令（ ）。", "o": ["Cat", "More", "Less", "menu"], "a": "C", "n": "【答案正确】less查看文件时支持光标上下移动、前后逐行/逐页滚动；cat一次性输出全部内容，more一般只可向后翻页，menu不是查看命令。故选C。", "d": 0}, {"k": "y25linux", "s": 468, "t": "单选", "q": "Samba主配置文件由()组成", "o": ["global参数和share参数", "directoryshare和fileshare", "applicationshare", "virtualshare"], "a": "A", "n": "【
