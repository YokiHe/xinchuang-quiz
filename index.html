答案正确】Samba主配置文件smb.conf由[global]全局参数段和各共享（share）定义段组成，教材口径即“global参数和share参数”，故选A；其余三项均为生造词。", "d": 0}, {"k": "y25linux", "s": 469, "t": "单选", "q": "辅助域名服务器是通过比较（ ）值,确定是否需要更新主域名服务器数据", "o": ["Serial(序列号)", "Refresh(刷新)", "Expire(过期)", "Minimum(最小TTL值)"], "a": "A", "n": "【答案正确】辅助（从）域名服务器比较SOA记录中的Serial序列号：主服务器区域序列号增大时才发起区域传送更新本地数据。Refresh、Expire、Minimum是SOA的其他计时字段，不是判据。故选A。", "d": 0}, {"k": "y25linux", "s": 470, "t": "单选", "q": "以下哪个不是GRUB的特点()", "o": ["支持大硬盘", "支持开机画面", "不支持开机画面", "菜单式选择"], "a": "C", "n": "【答案正确】GRUB的特点包括支持大硬盘（突破LILO 1024柱面限制）、支持开机画面（splashimage）、菜单式多系统选择和交互式命令行，“不支持开机画面”不是其特点，故选C。", "d": 0}, {"k": "y25linux", "s": 471, "t": "单选", "q": "编写的Shell程序运行前赋予该脚本文件（）权限", "o": ["可读", "可写", "执行", "读写"], "a": "C", "n": "【答案正确】Shell脚本要以./script.sh方式直接运行，必须先赋予执行权限，如chmod +x script.sh；仅有可读权限时只能被解释器间接读取执行不了。故选C。", "d": 0}, {"k": "y25linux", "s": 472, "t": "单选", "q": "下列选项在麒麟桌面操作系统V 10里面哪个说法是错误的", "o": ["可以自定义快捷键", "系统里面有自带的快捷键", "无法自定义快捷键", "系统里面既有自带的快捷键又可以自定义快捷键"], "a": "C", "n": "【答案正确】银河麒麟桌面操作系统V10在系统设置的键盘/快捷键配置中既提供一批系统自带快捷键，也支持用户自定义快捷键，“无法自定义快捷键”说法错误，应选C。", "d": 0}, {"k": "y25linux", "s": 473, "t": "单选", "q": "下面哪个命令是用来定义shell的全局变量（ ）。", "o": ["exportfs", "alias", "exports", "export"], "a": "D", "n": "【答案正确】export用于把shell变量导出为全局（环境）变量。exportfs是NFS共享导出管理命令，alias用于定义命令别名，exports是NFS配置文件名而非命令。故选D。", "d": 0}, {"k": "y25linux", "s": 474, "t": "单选", "q": "安装通常Linux需要正确的设定BIOS,一般应该关闭MemoryHole选项,其作用是()", "o": ["避免Lilo死机", "让Linux正确的检测的网卡", "防止Linux仅仅检测到16M内存", "支持从光盘启动"], "a": "A", "n": "【答案正确】老式BIOS的Memory Hole选项会在15-16M内存处开洞供ISA设备映射，容易导致老版本LILO加载内核时死机，故安装Linux前应关闭。【版本差异】属RHEL5/6之前老教材/LILO时代口径，现代GRUB2/UEFI环境已无此要求。", "d": 0}, {"k": "y25linux", "s": 475, "t": "单选", "q": "将光盘CD-ROM(hdc)安装到文件系统的/mnt/cdrom目录下的命令是（ ）", "o": ["mount/mnt/cdrom", "mount/mnt/cdrom/dev/hdc", "mount/dev/hdc/mnt/cdrom", "mount/dev/hdc"], "a": "C", "n": "【答案正确】mount命令格式为“mount 设备名 挂载点”，即 mount /dev/hdc /mnt/cdrom，对应选项C。A、D只给出一个参数挂载无法完成，B把设备与挂载点顺序颠倒。", "d": 0}, {"k": "y25linux", "s": 476, "t": "单选", "q": "Linux有三个查看文件的命令,若希望在查看文件内容过程中可以用光标上下移动来查看文件内容,应使用（）命令", "o": ["cat", "more", "less", "menu"], "a": "C", "n": "【答案正确】与467题同考点：less支持用光标上下移动逐行浏览文件内容；cat直接输出全文，more通常只能向后翻页，menu不是文件查看命令。故选C。", "d": 0}, {"k": "y25linux", "s": 477, "t": "单选", "q": "修改一个文件的权限为:属主可读写可执行,属组只可执行,其他用户没有权限,相应的数字组合应该是()", "o": ["707", "710", "711", "722"], "a": "B", "n": "【答案正确】属主读写执行=4+2+1=7，属组只执行=1，其他用户无权限=0，数字组合为710，故选B。707给其他人读写执行权限、711给了其他人执行权限、722非标准组合，均不符。", "d": 0}, {"k": "y25linux", "s": 478, "t": "单选", "q": "下列信息是某系统用ps–ef命令列出的正在运行的进程，进程是运行Internet超级服务器，它负责监听Internetsockets上的连接，并调用合适的服务器来处理接收的信息（ ）", "o": ["root14.00.0344204?S17：090：00init", "root20.00.129161520?S17：090：00/sbin/getty", "root30.00.21364632?S17：090：00/usr/sbin/syslogd", "root40.013441204?S17：090：10/usr/sbin/inetd"], "a": "D", "n": "【答案正确】Internet超级服务器即inetd（后来为xinetd），常驻监听各sockets端口，收到连接后按配置调用相应服务进程处理，选项D显示的进程为/usr/sbin/inetd。init是1号初始化进程，getty是终端登录程序，syslogd是日志守护进程。", "d": 0}, {"k": "y25linux", "s": 479, "t": "单选", "q": "有关归档和压缩命令,下面描述正确的是（ ）", "o": ["用uncompress命令解压缩由Compress命令生成的后缀为.zip的压缩文件", "unzip命令和gzip命令可以解压缩相同类型的文件", "tar归档且压缩的文件可以由gzip命令解压缩", "tar命令归档后的文件也是一种压缩文件"], "a": "C", "n": "【答案正确】tar以 -z 调用gzip归档压缩生成的 .tar.gz 本质是gzip压缩流，可由gzip解压还原为.tar，C正确。A错：uncompress解压的是compress生成的.Z文件；B错：unzip与gzip处理的格式不同（zip与gzip）；D错：tar仅归档打包，本身不是压缩文件。", "d": 0}, {"k": "y25linux", "s": 480, "t": "单选", "q": "在麒麟桌面操作系统中sel提供命令补全的功能键是", "o": ["Shit", "A", "PrtSc", "Tab"], "a": "D", "n": "【答案正确】【术语提示】题干“sel”应为“shell”（麒麟桌面V10的shell提供命令补全），选项A的“Shit”应为Shift的笔误。命令/路径补全的功能键是Tab，故选D。", "d": 0}, {"k": "y25linux", "s": 481, "t": "单选", "q": "欲把当前目录下的file.txt复制为file2.txt，正确的命令是（ ）。", "o": ["copyfile.txtfile2.txt", "cpfile.txt丨file2.txt", "catfile2.txtfile.txt", "catfile.txt>file2.txt"], "a": "D", "n": "【答案正确】cat file.txt > file2.txt 把file.txt内容重定向写入file2.txt，可实现复制，故选D。A的copy是DOS命令，Linux下为cp；B中cp后接竖线（题面显示为“丨”应为|）使命令非法；C为cat file2.txt file.txt，仅拼接输出到屏幕且参数顺序无法达成复制。", "d": 0}, {"k": "y25linux", "s": 482, "t": "单选", "q": "利用yum安装Telnet服务器的方法是（ ）。", "o": ["yumupdatetelnet", "yuminstalltelnet", "yumupdatetelnet-server", "yum–yinstalltelnet-server"], "a": "D", "n": "【答案正确】安装Telnet服务器用 yum -y install telnet-server（选项D中的“–”为排版痕迹，应写半角连字符“-”，即yum空格-y空格install空格telnet-server）。yum update是升级软件包，yum install telnet安装的是客户端而非服务器。", "d": 0}, {"k": "y25linux", "s": 483, "t": "单选", "q": "在使用mkdir命令创建新的目录时，在其父目录不存在时先创建父目录的选项是（ ）。", "o": ["-m", "-d", "-f", "-p"], "a": "D", "n": "【答案正确】mkdir -p在父目录不存在时自动递归创建父目录。-m用于创建时同时设定权限，-f、-d不是mkdir用于此目的的选项。故选D。", "d": 0}, {"k": "y25linux", "s": 484, "t": "单选", "q": "Linux系统通过（ ）命令给其他用户发消息", "o": ["less", "mesgn", "write", "echoto"], "a": "C", "n": "【答案正确】write 用户名 [终端] 用于向系统中其他在线用户实时发送消息。mesg n的作用是拒绝他人向自己发消息，less是文件查看命令，echoto不是命令。故选C。", "d": 0}, {"k": "y25linux", "s": 485, "t": "单选", "q": "下面的网络协议中，面向连接的协议是：（ ）", "o": ["传输控制协议", "用户数据报协议", "网际协议", "网际控制报文协议"], "a": "A", "n": "【答案正确】传输控制协议（TCP）面向连接，通信前经三次握手建立连接并提供可靠传输；用户数据报协议（UDP）、网际协议（IP）、网际控制报文协议（ICMP）均为无连接协议。故选A。", "d": 0}, {"k": "y25linux", "s": 486, "t": "单选", "q": "麒麟桌面操作系统默认的shell是(A)", "o": ["bash", "kom", "tcsh", "shell"], "a": "A", "n": "【答案正确】银河麒麟桌面操作系统V10基于Linux内核，默认shell与主流发行版一致为bash；kom、tcsh、shell均不是其默认shell。故选A。", "d": 0}, {"k": "y25linux", "s": 487, "t": "单选", "q": "Linux下ping命令用来（ ）", "o": ["显示文件大小", "测试网络是否可达", "练习键盘指法", "显示操作系统版本"], "a": "B", "n": "【答案正确】ping利用ICMP回显请求/应答报文测试网络连通性与目标是否可达，故选B。显示文件大小用ls，显示系统版本用uname等，练习指法与ping无关。", "d": 0}, {"k": "y25linux", "s": 488, "t": "单选", "q": "创建多级目录命令是（ ）。", "o": ["mkdir-p", "mkdir-v", "mkdir-m", "mkdir-a"], "a": "A", "n": "【答案正确】mkdir -p可一次创建多级目录，父目录不存在时自动创建。mkdir -v仅显示创建过程，-m用于设置权限，mkdir无-a选项。故选A。", "d": 0}, {"k": "y25linux", "s": 489, "t": "单选", "q": "麒麟软件是一家做 (A) 的公司", "o": ["操作系统", "数据库", "办公软件", "芯片制造"], "a": "A", "n": "【答案正确】麒麟软件是国产基础软件厂商，主营操作系统（银河麒麟桌面/服务器操作系统、openKylin等）；数据库、办公软件、芯片制造均非其主业。故选A。", "d": 0}, {"k": "y25linux", "s": 490, "t": "单选", "q": "当登录Linux时,一个具有唯一进程ID号的shell将被调用,这个ID是什么()", "o": ["NID", "PID", "UID", "CID"], "a": "B", "n": "【答案正确】用户登录时系统调用shell并为该shell进程分配唯一进程号，即PID（进程ID）；UID是用户标识符，NID、CID非本题概念。故选B。", "d": 0}, {"k": "y25sec", "s": 1, "t": "单选", "q": "如何启动Nginx服务？", "o": ["systemctl start nginx", "systemctl restart nginx", "systemctl stop nginx", "systemctl reload nginx"], "a": "A", "n": "【答案正确】启动（拉起）服务的标准命令是 systemctl start nginx；restart 会对已运行服务重启并中断连接，stop 是停止、与启动语义相反，reload 只重载配置且服务未运行时会失败。A 为唯一符合“启动”语义的选项。", "d": 0}, {"k": "y25sec", "s": 2, "t": "单选", "q": "Nginx的默认服务器根目录是哪个路径？", "o": ["/var/www/html", "/usr/share/nginx/html", "/etc/nginx/conf.d", "/var/log/nginx"], "a": "B", "n": "【答案正确】RHEL/CentOS 7 通过 yum 安装 nginx 后，默认站点根目录是 /usr/share/nginx/html（nginx.conf 中默认 root 指令指向该路径，欢迎页 index.html 也在此）；/var/www/html 是 Apache(httpd) 的默认根目录，/etc/nginx/conf.d 只存放子配置文件，/var/log/nginx 是日志目录。", "d": 0}, {"k": "y25sec", "s": 3, "t": "多选", "q": "Nginx的主要用途是什么？", "o": ["HTTP Web服务器", "反向代理服务器", "负载均衡器", "邮件服务器"], "a": "ABC", "n": "【答案正确】Nginx 的核心定位是 HTTP Web 服务器、反向代理服务器与负载均衡器，题干问主要用途，A/B/C 即标准口径；Nginx 官方虽也提供邮件代理（mail proxy）功能，但这不是通常所列的主要用途，按主要用途口径 D 不选。", "d": 0}, {"k": "y25sec", "s": 4, "t": "多选", "q": "在 CentOS 上安装 Nginx 时，我们需要安装哪个软件包？", "o": ["epel-release", "nginx", "centos-release", "yum"], "a": "AB", "n": "【答案正确】CentOS 7 上安装 Nginx 需先装 epel-release 启用 EPEL 源、再装 nginx 包本身，A、B 都是必要软件包；yum 是系统自带包管理器、无需为装 Nginx 另行安装，centos-release 是基础仓库配置包与启用 EPEL 无关，故 C、D 不选。", "d": 0}, {"k": "y25sec", "s": 5, "t": "单选", "q": "如何隐藏Nginx的版本信息？", "o": ["在/etc/nginx/nginx.conf的http部分中添加server_tokens off;", "在/etc/nginx/nginx.conf的server部分中添加server_tokens off;", "在/etc/nginx/nginx.conf的http部分中添加version off;", "在/etc/nginx/nginx.conf的server部分中添加version off;"], "a": "A", "n": "【答案正确】隐藏版本号的标准指令是 server_tokens off；，它使响应头 Server 和错误页不再显示 Nginx 版本。C/D 的“version off”不是 Nginx 指令，属干扰项。需说明 server_tokens 合法上下文为 http/server/location，写在 server 块同样有效，但写在 http 块全局生效、是教材与安全基线的惯例写法，故 A 成立。", "d": 0}, {"k": "y25sec", "s": 6, "t": "单选", "q": "如何启用X-XSS保护？", "o": ["在/etc/nginx/nginx.conf的http部分中添加add_header X-XSS-Protection \"1; mode=block\";", "在/etc/nginx/nginx.conf的server部分中添加add_header X-XSS-Protection \"1; mode=block\";", "在/etc/nginx/nginx.conf的http部分中添加X-XSS-Protection \"1; mode=block\";", "在/etc/nginx/nginx.conf的server部分中添加X-XSS-Protection \"1; mode=block\";"], "a": "A", "n": "【答案正确】启用 X-XSS 保护必须通过 add_header 指令添加响应头 X-XSS-Protection “1; mode=block”，C/D 缺少 add_header 指令名、语法不成立。写在 http 块可对全部 server 全局生效，是标准写法（该指令也可用于 server/location，但 A 为教材惯例答案）；注：X-XSS-Protection 已被现代浏览器废弃，现多改用 CSP，但作为考题答案 A 正确。", "d": 0}, {"k": "y25sec", "s": 7, "t": "单选", "q": "如何防止点击劫持攻击？", "o": ["在/etc/nginx/nginx.conf的http部分中添加add_header X-Frame-Options \"SAMEORIGIN\";", "在/etc/nginx/nginx.conf的server部分中添加add_header X-Frame-Options \"SAMEORIGIN\";", "在/etc/nginx/nginx.conf的http部分中添加X-Frame-Options \"SAMEORIGIN\";", "在/etc/nginx/nginx.conf的server部分中添加X-Frame-Options \"SAMEORIGIN\";"], "a": "A", "n": "【答案正确】防点击劫持的标准措施是输出 X-Frame-Options 响应头，“SAMEORIGIN”只允许同源页面嵌入，可防御 iframe 嵌套劫持；同样必须由 add_header 生成响应头，C/D 缺指令名不成立。写在 http 块全局生效（server/location 亦可），A 是教材标准答案。", "d": 0}, {"k": "y25sec", "s": 8, "t": "多选", "q": "下面哪些方法是理想的HTTP方法？", "o": ["GET", "POST", "HEAD", "DELETE"], "a": "ABC", "n": "【答案正确】HTTP 方法中 GET、POST、HEAD 是正常页面浏览与表单交互必需且应当保留的方法，Web 加固白名单通常只放行这三种；DELETE（以及 PUT、TRACE 等）对一般站点不必要且易被滥用而应禁用，故 A、B、C 当选，D 不选。", "d": 0}, {"k": "y25sec", "s": 9, "t": "多选", "q": "Nginx 的优点是什么？", "o": ["轻量、快速、强大", "支持所有主要操作系统", "适用于高流量网站", "高度安全性"], "a": "ABC", "n": "【答案正确】Nginx 的典型优点是轻量快速、资源消耗低（A），支持 Linux/BSD/macOS/Windows 等主流操作系统（B），擅长高并发、适用于高流量网站（C）；高度安全性并非其传统优点清单的标准项（其卖点侧重性能与低开销），D 属主观表述不选。", "d": 0}, {"k": "y25sec", "s": 10, "t": "单选", "q": "邮件服务器中的邮件传输代理（MTA）主要负责什么？", "o": ["接收和存储邮件", "处理邮件的传输和路由", "提供邮件访问和管理功能", "进行用户认证和权限控制"], "a": "B", "n": "【答案正确】MTA（邮件传输代理，如 Postfix、Sendmail）运行在 SMTP 层，负责邮件在服务器间的收发、传输与路由转发，B 正确；“接收和存储邮件”是邮箱/投递环节（MDA）职责，“提供访问和管理”“用户认证权限控制”分属访问代理与认证环节，均非 MTA 的定位。", "d": 0}, {"k": "y25sec", "s": 11, "t": "单选", "q": "邮件服务器中的邮件访问代理（MDA）主要负责什么？", "o": ["接收和存储邮件", "处理邮件的传输和路由", "提供邮件访问和管理功能", "进行用户认证和权限控制"], "a": "C", "n": "【答案存疑】【术语提示】MDA 字面含义是邮件投递代理（Mail Delivery Agent），职责是把邮件投递并存储到用户邮箱，严格对应选项 A；而“邮件访问代理”应为 MAA（Mail Access Agent），其职责才是 C“提供邮件访问和管理”。参考答案 C 与题面中文称谓自洽（也与本库后题把 Dovecot 定位为收信访问服务的口径一致），但 MDA 缩写属于误用，命题术语混乱导致 A、C 两可，建议将题面改称“邮件访问代理（MAA）”或改答 A。", "d": 1}, {"k": "y25sec", "s": 12, "t": "单选", "q": "下列哪个是常见的邮件传输代理（MTA）软件？", "o": ["Postfix", "Dovecot", "Telnet", "OpenSSL"], "a": "A", "n": "【答案正确】Postfix 是 Linux 上最常用的 MTA（邮件传输代理），通过 SMTP 收发路由邮件；Dovecot 属收信访问/投递软件，Telnet 是远程登录工具，OpenSSL 是加密库，均与 MTA 无关。区分 MTA 与 MDA/MAA 是本组题的考查点。", "d": 0}, {"k": "y25sec", "s": 13, "t": "单选", "q": "下列哪个是常见的邮件访问代理（MDA）软件？", "o": ["Postfix", "Dovecot", "Telnet", "OpenSSL"], "a": "B", "n": "【答案正确】Dovecot 是常见邮件访问服务软件，提供 POP3/IMAP 收信访问（并内置 LDA 承担本地投递），选 B 正确；Postfix 是 MTA，Telnet、OpenSSL 与邮件访问无关。【术语提示】“邮件访问代理”严格缩写应记 MAA，MDA 通常指投递代理，题面延续了本库对 MDA 的混用写法，但不影响本题答案。", "d": 0}, {"k": "y25sec", "s": 14, "t": "多选", "q": "Postfix和Dovecot的作用是什么？", "o": ["处理邮件的传输和路由", "提供邮件访问和管理功能", "实现用户认证和权限控制", "进行反垃圾邮件过滤"], "a": "ABC", "n": "【答案正确】Postfix 是 MTA，负责邮件的传输与路由（SMTP 收发中转，A）；Dovecot 提供 POP3/IMAP 邮件访问与管理（B），并可实现用户认证（SASL）与邮箱/权限控制（C）；反垃圾邮件通常由 SpamAssassin、Rspamd 等专门组件承担，不是两者自身的基本作用，D 不选。", "d": 0}, {"k": "y25sec", "s": 15, "t": "多选", "q": "在测试邮件服务器时，以下哪些是常见的测试步骤？", "o": ["使用telnet测试110端口", "使用telnet测试25端口", "创建测试账户和密码", "使用telnet发送测试邮件"], "a": "ABCD", "n": "【答案正确】四个选项均为邮件服务器验收的常见测试步骤：telnet 110 端口验证 POP3 可用、telnet 25 端口手工走 SMTP 会话、先创建测试账户与密码作为收发主体、再用 telnet 生动发送测试邮件验证链路，属全对型多选，ABCD 均成立。", "d": 0}, {"k": "y25sec", "s": 16, "t": "多选", "q": "邮件服务器的防火墙规则中，以下哪些端口是常见的邮件服务器端口？", "o": ["TCP/80", "TCP/110", "TCP/25", "TCP/143"], "a": "BCD", "n": "【答案正确】25/TCP（SMTP）、110/TCP（POP3）、143/TCP（IMAP）是邮件服务器经典端口，防火墙通常需放行；80/TCP 是 HTTP 的 Web 端口，与邮件服务无关，A 不选。若启用加密还会用到 465/587/993/995，但不在本题选项之内。", "d": 0}, {"k": "y25sec", "s": 17, "t": "单选", "q": "SSL（Secure Sockets Layer）是一种用于保护信息传输安全的通信协议。它通过使用加密算法和数字证书来确保数据的机密性和完整性。以下哪个选项描述了SSL的作用？", "o": ["保护服务器的物理安全", "加速网络传输速度", "确保数据传输的安全性", "提供无线网络连接"], "a": "C", "n": "【答案正确】SSL/TLS 的核心作用是在不可信网络上建立加密通道，通过加密算法保证机密性、通过 MAC 与数字证书保证完整性和身份可信，即“确保数据传输的安全性”（C）；物理安全是机房管理范畴，SSL 不改变传输速度也无关无线接入，A/B/D 均错。", "d": 0}, {"k": "y25sec", "s": 18, "t": "单选", "q": "在配置Postfix服务的SSL时，我们需要生成SSL证书和私钥。以下哪个命令可以使用OpenSSL生成自签名的证书和私钥对？", "o": ["openssl genrsa", "openssl req", "openssl sign", "openssl ca"], "a": "B", "n": "【答案正确】openssl req 是生成证书请求/证书的入口命令，配合 -x509 -new（或 -newkey rsa:2048）可在生成私钥的同时直接颁发自签名证书，如 openssl req -x509 -nodes -days 365 -newkey rsa:2048 -keyout server.key -out server.crt；openssl genrsa 只生成 RSA 私钥、不产生证书，openssl ca 用于 CA 签发而非自签名，openssl sign 不是标准子命令。", "d": 0}, {"k": "y25sec", "s": 19, "t": "多选", "q": "在配置Postfix服务的SSL时，我们需要在Postfix的配置文件中指定SSL证书和私钥的路径，并启用SSL支持。以下哪个选项是配置文件中用于指定SSL证书和私钥路径的参数？", "o": ["smtpd_tls_cert_file", "smtpd_tls_security_level", "smtpd_use_tls", "smtpd_tls_key_file"], "a": "AD", "n": "【答案正确】多选逐项：A smtpd_tls_cert_file 指定服务器 SSL 证书路径、D smtpd_tls_key_file 指定私钥路径，正是题干要求的一对参数，均应选；B smtpd_tls_security_level 只设定 TLS 策略等级（may/encrypt 等）；C smtpd_use_tls 是已被 security_level 取代的旧开关，二者都不涉及证书/私钥路径。REFERENCES 答案集与 {A,D} 恰好一致，不多不漏。", "d": 0}, {"k": "y25sec", "s": 20, "t": "多选", "q": "在配置Postfix服务的SSL时，以下哪些步骤是必需的？", "o": ["生成SSL证书和私钥", "修改Postfix的配置文件设置SSL参数", "配置防火墙和网络安全", "安装Dovecot服务"], "a": "AB", "n": "【答案正确】配置 Postfix 的 SSL 必需两步：生成（或取得）SSL 证书和私钥（A），并在 main.cf 设置 smtpd_tls_cert_file、smtpd_tls_key_file 等 TLS 参数（B）；配置防火墙属于网络安全加固而非 SSL 配置的必需步骤，Postfix 的 SMTP 加密也不依赖 Dovecot（仅在需要 SASL 认证时才借助），C、D 不选。", "d": 0}, {"k": "y25sec", "s": 21, "t": "多选", "q": "在配置Dovecot服务的SSL时，以下哪些步骤是必需的？", "o": ["生成SSL证书和私钥", "修改Dovecot的配置文件设置SSL参数", "启用SSL支持", "安装Postfix服务"], "a": "ABC", "n": "【答案正确】配置 Dovecot SSL 需要：生成/取得证书和私钥（A），在 conf.d/10-ssl.conf 指定 ssl_cert、ssl_key 等 SSL 参数（B），并确认启用 SSL 支持（ssl = yes，C），三者共同构成完整步骤；Postfix 是 SMTP 服务，与 Dovecot 的 IMAP/POP3 加密无必然关系，D 不选。", "d": 0}, {"k": "y25sec", "s": 22, "t": "多选", "q": "配置Dovecot服务的SSL时，我们需要指定以下哪些路径？", "o": ["SSL证书的路径", "SSL私钥的路径", "SSL缓存文件的路径", "服务器配置文件的路径"], "a": "AB", "n": "【答案正确】Dovecot 的 SSL 配置核心就是两项路径：ssl_cert（SSL 证书路径）与 ssl_key（SSL 私钥路径），A、B 正确；不存在需要显式指定的 SSL 缓存文件路径，服务器配置文件的路径也不是 SSL 参数的一部分，C、D 不选。", "d": 0}, {"k": "y25sec", "s": 23, "t": "单选", "q": "FTP服务器是用于在计算机网络上进行什么操作？", "o": ["文件传输", "数据库管理", "网络安全", "网络浏览"], "a": "A", "n": "【答案正确】FTP 即文件传输协议（File Transfer Protocol），FTP 服务器专门用于客户端与服务器之间的文件上传下载，A 正确；数据库管理、网络安全属运维/安全范畴，网络浏览由 HTTP/Web 服务承担，均与 FTP 用途不符。", "d": 0}, {"k": "y25sec", "s": 24, "t": "单选", "q": "FTP服务器的工作原理是基于什么模型？", "o": ["客户端-客户端模型", "客户端-服务器模型", "对等模型", "分布式模型"], "a": "B", "n": "【答案正确】FTP 采用客户端-服务器（C/S）模型：客户端主动连接服务器 21 端口建立控制连接，传输数据时再按模式（主动/被动）建立数据连接；不存在“客户端-客户端”模型，对等（P2P）、分布式均与 FTP 的工作机制不符。", "d": 0}, {"k": "y25sec", "s": 25, "t": "单选", "q": "vsftpd是一个什么类型的FTP服务器？", "o": ["开源FTP服务器", "商业FTP服务器", "免费FTP服务器", "私有FTP服务器"], "a": "A", "n": "【答案正确】vsftpd（Very Secure FTP Daemon）是遵循 GPL 的开源 FTP 服务器，也是 RHEL/CentOS 默认的 FTP 服务端，A 的类型定位准确；它在许可上也免费，但描述软件“类型/性质”的标准答案是“开源”，且“私有”明显错误，“免费”不是类型分类。", "d": 0}, {"k": "y25sec", "s": 26, "t": "多选", "q": "FTP服务器的工作原理包括以下哪些步骤？", "o": ["客户端发起连接请求", "服务器认证客户端", "客户端与服务器建立数据连接", "客户端发送命令", "服务器发送命令", "文件传输"], "a": "ABCDF", "n": "【答案正确】FTP 工作流程：客户端向 21 端口发起控制连接请求（A）、服务器认证客户端（B）、客户端发送命令（D）、按主动或被动模式建立数据连接（C）、完成文件传输（F）；命令始终由客户端发出，服务器只回送应答码/响应，服务器发送命令（E）方向颠倒不选，故 ABCDF 正确。", "d": 0}, {"k": "y25sec", "s": 27, "t": "多选", "q": "vsftpd的特点和功能包括以下哪些？", "o": ["安全性", "性能", "简单配置", "虚拟用户支持", "日志记录"], "a": "ABCDE", "n": "【答案正确】vsftpd 全称 Very Secure FTP Daemon，以安全性著称（A），具备高性能与高并发能力（B），配置集中于单一 vsftpd.conf、简单直观（C），支持虚拟用户（D），并有 xferlog、vsftpd.log 等完整日志记录（E），五项均为真实特性，属全对型，ABCDE 正确。", "d": 0}, {"k": "y25sec", "s": 28, "t": "多选", "q": "以下哪些是常用的FTP命令？", "o": ["get", "put", "cd", "ls", "rm", "quit"], "a": "ABCDF", "n": "【答案正确】get 下载、put 上传、cd 切换远端目录、ls 列目录、quit 退出都是标准 ftp 客户端交互命令；ftp 中删除文件使用 delete/mdelete 命令而不是 rm，rm 是 shell 命令、不属于 ftp 客户端命令集，E 不选，故 ABCDF 正确。", "d": 0}, {"k": "y25sec", "s": 29, "t": "单选", "q": "SSL是用于保护网络通信安全的协议，它建立在哪个层次的协议之上？", "o": ["应用层协议", "传输层协议", "网络层协议", "数据链路层协议"], "a": "B", "n": "【答案正确】SSL/TLS 位于传输层与应用层之间，运行在 TCP 之上，为上层协议（HTTP、SMTP、POP3 等）提供加密保护，即“建立在传输层协议之上”，选 B；说它建立在应用层、网络层或数据链路层之上均不符合协议栈位置。", "d": 0}, {"k": "y25sec", "s": 30, "t": "单选", "q": "以下哪项配置可以启用vsftpd服务器的SSL支持？", "o": ["ssl_enable=YES", "allow_anon_ssl=NO", "force_local_data_ssl=YES", "ssl_tlsv1_1=YES"], "a": "A", "n": "【答案正确】vsftpd 启用 SSL/TLS 支持的总开关是 ssl_enable=YES，其余三个参数均为次级选项：allow_anon_ssl 只控制匿名用户是否可走 SSL，force_local_data_ssl 只强制数据连接加密，ssl_tlsv1_1 只是协议版本启用开关，单独设置它们无法开启 SSL。", "d": 0}, {"k": "y25sec", "s": 31, "t": "单选", "q": "在配置vsftpd服务器的SSL支持时，需要指定哪个文件作为证书的私钥？", "o": ["rsa_cert_file", "rsa_private_key_file", "ssl_cert_file", "ssl_private_key_file"], "a": "B", "n": "【答案正确】vsftpd 用 rsa_cert_file 指定证书、rsa_private_key_file 指定证书私钥（RHEL7 自带 vsftpd 3.0.2 的配置即如此，默认注释路径 /etc/pki/tls/...）；ssl_cert_file、ssl_private_key_file 不是 vsftpd 的配置指令，属干扰项。", "d": 0}, {"k": "y25sec", "s": 32, "t": "多选", "q": "SSL的主要概念包括以下哪些？", "o": ["数字证书", "公钥加密", "对称加密", "非对称加密"], "a": "ABCD", "n": "【答案正确】SSL/TLS 体系围绕数字证书（身份认证）、非对称（公钥）加密（密钥交换与签名）与对称加密（数据加密）展开，四个选项均为 SSL 涉及的核心概念；公钥加密与非对称加密虽是同一事物的两种叫法，但作为概念本身都成立，属概念罗列的全对型，ABCD 正确。", "d": 0}, {"k": "y25sec", "s": 33, "t": "多选", "q": "SSL使用了哪些加密技术来保证通信的安全性？", "o": ["非对称加密", "对称加密", "公钥加密", "私钥加密"], "a": "AB", "n": "【答案存疑】【题目缺陷】SSL 确实使用非对称加密（身份认证与密钥交换）与对称加密（数据加密），出题意图为 AB，此口径可接受；但公钥加密就是非对称加密的同义词，C 与 A 语义重复且技术上同样成立，严格按使用的技术而言 C 也应选，而私钥加密不是规范术语、D 不选尚可。由于 C 的取舍存在歧义、选项有同义重复缺陷，标存疑，按出题意图可保留 AB。", "d": 1}, {"k": "y25sec", "s": 34, "t": "单选", "q": "以下哪种是最不安全的FTP服务器认证模式？", "o": ["匿名开放模式", "本地用户模式", "虚拟用户模式", "都不正确"], "a": "A", "n": "【答案正确】匿名开放模式（anonymous_enable=YES）无需账号即可登录，无身份标识、权限宽泛、无法审计归属，是最不安全的认证模式；本地用户模式有系统账号约束，虚拟用户模式账号与系统隔离且可细粒度授权，安全性更高。“都不正确”错误。", "d": 0}, {"k": "y25sec", "s": 35, "t": "单选", "q": "在vsftpd中，如何配置chroot jail以限制FTP用户只能访问自己的主目录？", "o": ["在/etc/vsftpd/vsftpconf中添加chroot_local_user=YES", "在/etc/vsftpd/vsftpconf中添加allow_writeable_chroot=YES", "在/etc/vsftpd/vsftpconf中添加chroot_local_user=YES和allow_writeable_chroot=YES", "都不正确"], "a": "C", "n": "【答案正确】chroot_local_user=YES 将本地用户锁定在其主目录内实现 chroot 限制；RHEL7 的 vsftpd 3.x 出于安全对“可写的 chroot 目录”默认拒绝登录，需再配 allow_writeable_chroot=YES 才能正常登录使用，故完整答案是 C。仅 A 在可写主目录场景会登录失败，仅 B 不产生任何限制作用。【术语提示】配置文件准确名称应为 /etc/vsftpd/vsftpd.conf，题面“vsftpconf”系笔误。", "d": 0}, {"k": "y25sec", "s": 36, "t": "单选", "q": "为了允许vsftpd读取用户主目录中的文件，需要设置以下哪个SELinux布尔值？", "o": ["ftpd_full_access", "vsftpd_enable_access", "chroot_local_user", "allow_writeable_chroot"], "a": "A", "n": "【答案正确】ftpd_full_access 是真实的 SELinux 布尔值（setsebool -P ftpd_full_access on），放开 vsftpd 对用户主目录等文件的读写权限，A 正确；B（vsftpd_enable_access）并非真实布尔值，C（chroot_local_user）、D（allow_writeable_chroot）是 vsftpd.conf 配置项而非 SELinux 布尔值。【术语提示】更精细的布尔值还有 ftp_home_dir（仅放开主目录），题库未列入，但在给定选项中 A 是唯一成立项。", "d": 0}, {"k": "y25sec", "s": 37, "t": "单选", "q": "linux就是操作系统，意味著开放性源码就是民主自由需用。", "o": ["半封闭资源", "对外开放资源", "用户注册", "开放性二进制"], "a": "B", "n": "【答案正确】题干语句残缺不通（疑应为“Linux 是开放源代码的操作系统，意味着源码对外开放、自由使用”），按出题意图考查 Linux 的开源特性，答案“对外开放资源”成立；“半封闭资源”“用户注册”“开放性二进制”均与“开放源码”含义不符，后者故意混淆源代码与二进制。", "d": 0}, {"k": "y25sec", "s": 38, "t": "多选", "q": "下列关于chroot jail的描述哪些是正确的？", "o": ["chroot jail可以限制FTP用户只能访问自己的主目录", "chroot jail可以阻止程序访问或修改潜在的恶意文件", "chroot jail是一个虚拟的根目录，不是真实存在的目录", "chroot jail只适用于虚拟用户模式的认证方式"], "a": "AB", "n": "【已修正答案】平台原答案 ABC 有误（平台答案系 AI 生成、仅供参考），已按核验改为 AB。A 正确：vsftpd 的 chroot 机制可把 FTP 用户锁定在其主目录内；B 正确：chroot 将进程可见的文件系统限定在牢笼之内，阻止其访问或改动范围外的文件；C 错误：chroot jail 指向的是一个真实存在的目录（如 /var/ftp 或用户家目录，chroot 目标必须先创建出来），虚拟的只是进程把它当作根目录的视角，并非目录本身不存在；D 错误：chroot 与认证方式无关，本地用户、匿名用户乃至 bind、dhcpd 等服务的 chroot 运行方式都适用。原答案把 C 一并计入，故判错误。", "d": 2}, {"k": "y25sec", "s": 39, "t": "单选", "q": "下面那个命令容许对文件重命名", "o": ["rn", "rname", "replace", "mv"], "a": "D", "n": "【答案正确】mv（move）把文件移动到不同目标名时即完成重命名，是 Linux 标准改名命令，D 正确；rn、rname 均不是存在的命令，replace 也不是 Linux 文件改名工具（另存在批量改名的 rename 命令，但不含在本题选项中）。", "d": 0}, {"k": "y25sec", "s": 40, "t": "多选", "q": "以下关于vsftpd服务的本地用户模式认证配置哪些是正确的？", "o": ["将chroot_local_user设置为YES", "在vsftpconf文件中添加local_user=YES", "确保系统中已经创建了对应的本地用户账户", "设置vsftpd服务的监听端口为默认的21"], "a": "AC", "n": "【已修正答案】平台原答案 ABC 有误（平台答案系 AI 生成、仅供参考），已按核验改为 AC。A 正确：chroot_local_user=YES 可将本地用户 chroot 锁定在家目录；C 正确：本地用户模式依赖系统账户认证，需确保已创建对应本地用户；B 错误：配置文件是 /etc/vsftpd/vsftpd.conf（vsftpconf 为笔误），且 vsftpd 中根本不存在 local_user=YES 这一指令，启用本地用户登录的指令是 local_enable=YES；D 错误：21 是默认监听端口无需专门设置，也与本地用户认证配置无关。原答案包含 B，故判错误。", "d": 2}, {"k": "y25sec", "s": 41, "t": "单选", "q": "linux临时目录一般存在下面那个文件夹中", "o": ["/tmp", "/proc", "/data", "/dev"], "a": "A", "n": "【答案正确】/tmp 是系统公认的临时文件目录，权限 1777（sticky 位），任何用户可存放临时文件且系统会定期清理；/proc 是反映内核与进程状态的虚拟文件系统，/dev 存放设备文件，/data 不是标准目录层级。", "d": 0}, {"k": "y25sec", "s": 42, "t": "单选", "q": "Samba服务是用于在哪些操作系统之间共享文件和打印机？", "o": ["Linux和Windows", "Linux和Mac", "Windows和Mac", "Linux、Windows和Mac"], "a": "A", "n": "【答案正确】Samba 的定位是实现 Linux/UNIX 与 Windows 主机之间通过 SMB/CIFS 协议互通文件和打印机共享，教材标准表述即“Linux 和 Windows”之间（A）；严格说装了 SMB 客户端的 mac 也能访问，但 D“三系统之间”不是本题考查的标准定义，A 为最佳答案。", "d": 0}, {"k": "y25sec", "s": 43, "t": "单选", "q": "假如你获得一个运转命令被婉拒的信息，你可以用哪个命令回去修正它的权限并使之可以正常运转", "o": ["path=", "chmod", "grep", "chown"], "a": "B", "n": "【答案正确】“运行命令被拒绝（Permission denied）”通常因缺少执行权限，chmod 修改文件权限位（如 chmod u+x file）即可使其可运行，为标准答案；chown 只改属主/属组（属主错时也能解决，但“修正权限”一词对应 chmod），grep 是文本过滤，选项 A“path=”仅是环境变量拼写。", "d": 0}, {"k": "y25sec", "s": 44, "t": "单选", "q": "Samba服务的工作原理是什么？", "o": ["Samba服务通过HTTP协议进行通信", "Samba服务通过SMB/CIFS协议进行通信", "Samba服务通过FTP协议进行通信", "Samba服务通过SSH协议进行通信"], "a": "B", "n": "【答案正确】Samba 实现 SMB/CIFS 协议（smbd 监听 TCP 139/445），因此能与 Windows 的网上邻居/文件共享互通，B 正确；HTTP、FTP、SSH 分别是 Web、文件传输、远程登录协议，均不是 Samba 的通信协议。", "d": 0}, {"k": "y25sec", "s": 45, "t": "多选", "q": "关于linux以下表明哪些就是恰当的?", "o": ["linux就是一个开放源码的操作系统", "linux就是一个类unix的操作系统.", "linux就是一个多用户的操作系统", "linux就是一个多任务的操作系统"], "a": "ABCD", "n": "【答案正确】Linux 遵循 GPL 开放源码（A），内核设计源自 Unix、属类 Unix 操作系统（B），支持多用户并存与权限隔离（C），通过进程调度实现多任务并发（D）。四个说法尽管措辞别扭（就是一个），技术含义均成立，属全对型，ABCD 正确。", "d": 0}, {"k": "y25sec", "s": 46, "t": "单选", "q": "要允许客户端访问Samba服务，需要配置防火墙以打开哪些端口？", "o": ["TCP端口139和445，UDP端口137", "TCP端口80和443，UDP端口53", "TCP端口22和23，UDP端口123", "TCP端口3389和5900，UDP端口161"], "a": "A", "n": "【答案正确】Samba 需要开放的端口为 TCP 139（NetBIOS 会话服务）、TCP 445（SMB/CIFS 直连）和 UDP 137/138（NetBIOS 名称服务/数据报），选项 A“TCP 139 和 445、UDP 137”正确；B 是 Web/DNS 端口，C 是 Telnet/NTP，D 是 RDP/VNC/SNMP，均与 Samba 无关。", "d": 0}, {"k": "y25sec", "s": 47, "t": "多选", "q": "在vi中下列哪些命令不能用来在光标前插入文本?", "o": ["p[text]", "a[text]", "i[text]", "o[text]"], "a": "ABD", "n": "【答案正确】vi 中 i 在光标前进入插入模式，是唯一在光标前插入文本的命令；p 将寄存器内容粘贴到光标之后（粘贴到光标前的是 P），a 在光标后追加，o 在下方新开一行插入，均不能在光标前插入文本，故不能者为 p、a、o，选 ABD。", "d": 0}, {"k": "y25sec", "s": 48, "t": "多选", "q": "Samba服务的作用和功能包括以下哪些？", "o": ["实现Linux和Windows系统之间的文件共享", "提供远程桌面登录功能", "共享打印机和其他设备", "控制用户访问共享资源的权限"], "a": "ACD", "n": "【答案正确】Samba 基于 SMB/CIFS 协议实现 Linux 与 Windows 间文件共享（A），支持打印机等设备共享（C），并可通过共享定义、valid users、write list 等控制用户访问权限（D）；远程桌面登录由 RDP/VNC 等提供，与 Samba 功能无关，B 不选，故 ACD 正确。", "d": 0}, {"k": "y25sec", "s": 49, "t": "多选", "q": "如果你对文件和目录的权限不确定,则不能用以下哪些命令来检测权限。", "o": ["ps", "ls -l", "ck", "chown"], "a": "ACD", "n": "【答案正确】ls -l 显示文件的权限位（rwx）与属主属组，是检测权限的命令，B 不选；ps 用于查看进程状态、chown 用于修改文件属主（不是查看权限）、ck 不是 Linux 标准命令，三者都无法用来检测权限，AD 及 C 当选，故 ACD 正确。", "d": 0}, {"k": "y25sec", "s": 50, "t": "多选", "q": "Samba服务的安全性机制包括以下哪些？", "o": ["用户身份验证", "数据加密", "防火墙配置", "访问控制列表（ACL）"], "a": "ABD", "n": "【答案正确】Samba 自身的安全机制包括用户身份验证（tdbsam/smbpasswd 等密码后端，A）、数据加密（SMB2/3 的 smb encrypt 传输加密，B）以及共享与文件系统 ACL 的访问控制（D）；防火墙是操作系统层面的网络防护手段，不属于 Samba 服务自身的安全机制，C 不选，故 ABD 正确。", "d": 0}, {"k": "y25sec", "s": 51, "t": "多选", "q": "在本地的文件系统中下列哪些linux路径结构是无效的?", "o": ["//usr\\linux/memo", "\\usr\\linux\\memo", "/usr/linux/memo", "\\usr/linux/memo"], "a": "ABD", "n": "【答案正确】Linux 的路径分隔符是 /，反斜杠是 Windows 的分隔符：A 含反斜杠且以 // 开头、B 全部使用反斜杠且无前导 /、D 以反斜杠开头，均不符合 Linux 路径结构而无效；C /usr/linux/memo 是标准绝对路径、有效不选，故 ABD 正确。", "d": 0}, {"k": "y25sec", "s": 52, "t": "单选", "q": "在配置Samba独立服务器时，以下哪个选项是必须的？", "o": ["匿名访问共享", "使用Active Directory进行身份验证", "使用NT4域进行身份验证", "针对Samba主机上的本地用户数据库进行身份验证"], "a": "D", "n": "【答案正确】standalone（独立服务器）模式不加入任何域，必须使用 Samba 主机本地的用户数据库（tdbsam/smbpasswd，配合 smbpasswd -a 建号）进行身份验证，D 正确；ADS（B）、NT4 域（C）分别是域成员/域控制器模式的认证方式，匿名共享只是可选的共享类型而非常规“必须项”。", "d": 0}, {"k": "y25sec", "s": 53, "t": "单选", "q": "下面关于基本组和附加组的说法，错误的是？", "o": ["若用户被创建时没有指定用户组，系统会为用户创建一个与用户名相同的组，这个组就是该用户的基本组。", "可以在创建用户时，使用选项-G为其指定基本组。", "为用户组指定附加组，可以使该用户拥有对应组的权限。", "用户可以从附加组中移除，但不能从基本组中移除。"], "a": "B", "n": "【答案正确】useradd 的 -G 指定的是附加组（额外组），指定基本组用的是 -g，故 B 的说法错误、正是本题答案。A 符合 RHEL 默认行为（USERGROUPS_ENAB 时创建同名基本组）；C 正确，用户经附加组获得该组的权限；D 成立，用户必有且仅有一个基本组，不能移除、只能用 usermod -g 或 userdel -g 更换。", "d": 0}, {"k": "y25sec", "s": 54, "t": "单选", "q": "在创建本地用户帐户时，默认情况下，Samba使用哪个后端来存储数据库？", "o": ["mysql", "postgresql", "tdbsam", "ldap"], "a": "C", "n": "【答案正确】RHEL7 的 Samba4 默认 passdb backend 为 tdbsam（数据存于 /var/lib/samba/private/passdb.tdb，适合中小规模独立服务器）；ldap 用于大型 AD/LDAP 集成环境需显式配置，mysql、postgresql 不是 Samba 支持的 passdb 后端。", "d": 0}, {"k": "y25sec", "s": 55, "t": "单选", "q": "/etc/passwd文件中第一列表示的信息是？", "o": ["用户名", "用户ID", "密码", "组ID"], "a": "A", "n": "【答案正确】/etc/passwd 每行 7 个冒号分隔字段，第一列是用户名（登录名）；密码占位居第二列（实际口令已移入 /etc/shadow，此处为 x），第三列 UID、第四列 GID，故 A 正确。", "d": 0}, {"k": "y25sec", "s": 56, "t": "单选", "q": "在Samba配置文件smb.conf中，以下哪个选项指定共享目录的路径？", "o": ["share path", "path", "directory", "location"], "a": "B", "n": "【答案正确】smb.conf 的共享段内用 path = /目录路径 指定共享目录，如 [share] 段中 path = /data/share，B 正确；“share path”“directory”“location”均不是 Samba 的配置指令。【术语提示】配置文件准确名称为 smb.conf（题面表述无误）。", "d": 0}, {"k": "y25sec", "s": 57, "t": "单选", "q": "/etc/passwd中第几列表示用户登录的shell信息？", "o": ["5", "6", "7", "8"], "a": "C", "n": "【答案正确】/etc/passwd 字段顺序为：用户名：口令：UID：GID：注释(GECOS)：主目录：登录 shell，第 7 列即登录 shell（如 /bin/bash），选 C；第 5 列是注释、第 6 列是主目录，该文件只有 7 列、不存在第 8 列。", "d": 0}, {"k": "y25sec", "s": 58, "t": "多选", "q": "在配置安全的Samba服务时，以下哪些步骤是必需的？", "o": ["创建本地用户帐户", "设置共享目录的ACL", "设置共享目录的权限", "编辑smconf文件"], "a": "ABCD", "n": "【答案正确】【术语提示】配置安全的 Samba 服务需要：创建用于认证的本地用户账户（user 安全模式需 system 账户加 smbpasswd，A）、对共享目录设置权限（C）与 ACL 细化授权（B），并在配置文件中定义共享（D）；选项 D 的 smconf 应为 smb.conf（/etc/samba/smb.conf）的笔误，步骤本身完整，ABCD 正确。", "d": 0}, {"k": "y25sec", "s": 59, "t": "单选", "q": "Linux操作系统中，将用户添加到组的命令是？", "o": ["useradd", "groupadd", "usermod", "useraddgroup"], "a": "C", "n": "【答案正确】把已有用户加入组用 usermod -aG 组名 用户名（-a 追加防止覆盖原有附加组），故 C 正确；useradd、groupadd 只用于新建用户/组，useraddgroup 不是合法命令。题库外的 gpasswd -a 用户 组 亦可实现，但选项范围内 usermod 唯一正确。", "d": 0}, {"k": "y25sec", "s": 60, "t": "多选", "q": "在小型网络中设置Samba独立服务器的目的是什么？", "o": ["提供可匿名访问的共享", "需要针对本地用户数据库进行身份验证的共享", "配置Active Directory或NT4域", "设置基于域的用户认证"], "a": "AB", "n": "【答案正确】按 Samba 官方定义，小型网络中的 standalone（独立）服务器提供两类共享：可匿名访问的共享（map to guest，A）与需要针对本地用户数据库（本地 passdb）验证身份的共享（B）；接入 Active Directory/NT4 域或基于域的用户认证属于域成员/域控制器场景，不是独立服务器的目的，C、D 不选，故 AB 正确。", "d": 0}, {"k": "y25sec", "s": 61, "t": "单选", "q": "Linux操作系统中，更改用户的主要组的命令是？", "o": ["usermod -a", "usermod -g", "usermod -A", "usermod -G"], "a": "B", "n": "【答案正确】usermod -g 组名 用于更改用户的主要组（基本组），要求目标组已存在，B 正确；-G 更改的是附加组，-a 仅用于配合 -G 追加附加组，“-A”不是 usermod 的合法选项。", "d": 0}, {"k": "y25sec", "s": 62, "t": "多选", "q": "从Windows计算机访问Samba共享时，我们需要提供什么信息？", "o": ["Samba服务器的IP地址 s", "Samba服务器的域名", "用户名和密码进行身份验证", "共享目录的路径"], "a": "AC", "n": "【答案正确】【选项文本有误】从 Windows 访问 Samba 共享需以 \\\\服务器\\共享名 形式的 UNC 连接：需要 Samba 服务器的 IP 地址（或主机名，A）与进行身份验证的用户名密码（C）；客户端输入的是 Samba 定义的共享名，而非 Linux 端真实目录路径，D 不选；域名并非必需，B 不选。A 选项末尾多出的 s 为排版杂字。", "d": 0}, {"k": "y25sec", "s": 63, "t": "多选", "q": "Linux使用者的账号、密码与群组的名称文件放在哪些文件里？", "o": ["/etc/passwd", "/etc/shadow", "/etc/group", "/etc/users"], "a": "ABC", "n": "【答案正确】Linux 使用者的账号存于 /etc/passwd（A），口令密文存于 /etc/shadow（B），群组名称与 GID 存于 /etc/group（C）；/etc/users 不是 Linux 的标准文件（组口令相关的是 /etc/gshadow），故 D 不选，ABC 正确。", "d": 0}, {"k": "y25sec", "s": 64, "t": "单选", "q": "在Linux Samba服务器中，虚拟用户的用户名和密码信息存储在哪里？", "o": ["/etc/passwd", "/etc/shadow", "/etc/samba/smbusers", "/etc/smbusers"], "a": "C", "n": "【答案正确】Samba 虚拟用户通过 smb.conf 的 username map = /etc/samba/smbusers 指定映射文件，其中记录“虚拟名 = 真实系统用户”的对应关系，是题库设定的存储位置，C 正确；/etc/passwd、/etc/shadow 是系统账号/口令文件，/etc/smbusers 缺少 samba 目录路径。【术语提示】虚拟用户验证时实际使用的口令仍存于 passdb(tdb)，smbusers 严格说是名字映射文件，按题库简化口径无碍。", "d": 0}, {"k": "y25sec", "s": 65, "t": "多选", "q": "在Linux系统中创建一个新的用户后，通常要为新增加的用户设置登录的密码，用户的口令涉及到两个文件：shadow和passwd，下面对这两个文件描述正确的是？", "o": ["shadow 和 passwd 这两个文件均位于 /etc 目录下", "shadow 中存放的口令为密文形式，而 passwd 则是以明文的形式存放口令", "任意一个用户均可以对 shadow 和 passwd 这两个文件进行操作", "只有 root 用户才能查看 shadow 文件的内容"], "a": "AD", "n": "【答案正确】A 正确：两文件均位于 /etc；D 正确：/etc/shadow 通常为 root:shadow 的 640 或 000 权限，普通用户不可读，按考点口径视为仅 root 可查看；B 错误：passwd 的口令位只放 x 占位符，并非明文存放口令，密文哈希在 shadow 中；C 错误：shadow 连普通用户读取都不允许，绝非任意用户可操作。故 AD 正确。", "d": 0}, {"k": "y25sec", "s": 66, "t": "单选", "q": "虚拟用户是指在Samba服务中创建的一种用户账号，其特点是：", "o": ["虚拟用户存在于操作系统的用户列表中", "虚拟用户的用户名和密码由操作系统验证和认证", "虚拟用户的用户名和密码由Samba服务器验证和认证", "虚拟用户的用户名和密码由LDAP服务器验证和认证"], "a": "C", "n": "【答案正确】按虚拟用户的设计，其账号只在 Samba 中登记，由 Samba 服务器的 passdb 完成验证认证，C 正确；A、B 把虚拟用户等同于系统用户、由操作系统（PAM/系统口令）验证，正是虚拟用户机制要避免的；由 LDAP 服务器验证只是可选后端部署，不是虚拟用户的定义（D 错）。", "d": 0}, {"k": "y25sec", "s": 67, "t": "多选", "q": "关于Linux中的用户组，描述正确的是？", "o": ["用户组的身份标识叫做GID", "一个用户只能从属于一个用户组", "一个用户组能够包含多个用户", "一个用户的主用户组（primary group）只能有一个", "每个用户 必然 从属于一个与用户同名的独立的私有用户组"], "a": "ACD", "n": "【答案正确】A 正确：用户组的数字标识即 GID，记录于 /etc/group；C 正确：一个组可包含多个用户；D 正确：每个用户有且仅有一个主（基本）组，附加组可以有多个；B 错误：用户可同时从属多个附加组；E 错误：创建时不指定组则默认建同名私有组只是 RHEL/Debian 的默认行为，创建用户时可用 -g 指定已有组，并非必然。故 ACD 正确。", "d": 0}, {"k": "y25sec", "s": 68, "t": "判断", "q": "虚拟用户是在Samba服务中创建的一种用户账号，与操作系统的用户账号无关。这种说法是否正确？", "o": ["正确", "错误"], "a": "A", "n": "【答案正确】判断依据：虚拟用户是服务层面创建的账号，不出现在系统用户列表（/etc/passwd）、不占用系统账号，身份验证由 Samba 自身完成，与前一题口径一致，判“正确”成立。【术语提示】严格实现中虚拟名仍会经 /etc/samba/smbusers 映射到某个真实系统用户以保证文件属主权限，教学模型按“虚拟账号独立于 OS 账号”理解即可，不影响本题答案。", "d": 0}, {"k": "y25sec", "s": 69, "t": "多选", "q": "下面关于基本组和附加组的说法，正确的是？", "o": ["若用户被创建时没有指定用户组，系统会为用户创建一个与用户名相同的组，这个组就是该用户的基本组。", "可以在创建用户时，使用选项-G为其指定基本组。", "为用户组指定附加组，可以使该用户拥有对应组的权限。", "用户可以从附加组中移除，但不能从基本组中移除。"], "a": "ACD", "n": "【答案正确】A 正确：创建用户未指定组时，useradd 默认建立与用户同名的私有组作为其基本组；C 正确：将用户加入某附加组即获得该组的权限（措辞上应为为用户指定附加组）；D 正确：基本组对每个用户有且仅有一个、不可移除（gpasswd -d 仅对附加组有效），附加组成员可随时移除；B 错误：useradd 的 -G 指定的是附加组，指定基本组用 -g。故 ACD 正确。", "d": 0}, {"k": "y25sec", "s": 70, "t": "多选", "q": "虚拟用户是指在Samba服务器中创建的一种用户账号，其不在操作系统的用户列表中，而是由Samba服务器自己维护和管理。这种用户的优点是：", "o": ["独立于操作系统用户进行管理，更加灵活地控制对共享资源的访问权限。", "可以避免操作系统用户名和密码的泄漏对系统的安全造成影响。", "可以具有不同的权限级别，实现对不同用户的不同授权。", "执行系统管理命令时无需使用root权限。"], "a": "ABC", "n": "【答案正确】Samba 虚拟用户独立于操作系统账户进行管理、便于灵活控制共享访问（A），其凭据与系统口令分离、避免系统用户名密码泄漏威胁系统安全（B），可为不同虚拟用户设置不同共享权限实现差异化授权（C）；虚拟用户与执行系统管理命令是否免 root 无关，D 不选，故 ABC 正确。", "d": 0}, {"k": "y25sec", "s": 71, "t": "单选", "q": "Linux操作系统通过pam限制用户登录失败次数，使用以下哪个模块进行限制？", "o": ["pam_cracklib.so", "pam_passwdqc.so", "pam_pwquality.so", "pam_tally2.so"], "a": "D", "n": "【答案正确】pam_tally2.so 是限制登录/认证失败次数的经典 PAM 模块（deny 设定次数、unlock_time 设定解锁时间，配合 pam_tally2 --reset 解锁），D 正确；pam_cracklib.so、pam_passwdqc.so、pam_pwquality.so 均为密码复杂度检查模块，与失败计数锁定无关。【发行版差异】RHEL 7.1 起引入 pam_faillock 并在 RHEL8 中取代 pam_tally2，但本题背景（CentOS/RHEL 7）下 pam_tally2 是标准答案。", "d": 0}, {"k": "y25sec", "s": 72, "t": "多选", "q": "虚拟用户的工作原理是：", "o": ["Samba服务器维护一个用户数据库，包含虚拟用户的用户名和密码信息。", "当客户端发起连接请求时，Samba服务器对客户端提供的用户名和密码进行验证。", "Samba服务器根据客户端提供的用户名在操作系统的用户列表中查找对应的密码，并与客户端提供的密码进行比对。", "如果密码匹配成功，则认证通过，客户端可以访问Samba服务器上的共享资源。"], "a": "ABD", "n": "【答案正确】虚拟用户机制下，Samba 自行维护包含用户名和密码的用户数据库（A），客户端发起连接时由 Samba 直接校验所提供的用户名和密码（B），匹配成功即认证通过、可按授权访问共享（D）；C 错误：到操作系统用户列表中查密码正是虚拟用户要避免的行为（那是本地用户模式），不选，故 ABD 正确。", "d": 0}, {"k": "y25sec", "s": 73, "t": "单选", "q": "PAM的配置文件存在以下哪个目录下？", "o": ["/etc/config/", "/etc/pam.d/", "/root/", "/etc/my.cnf.d/"], "a": "B", "n": "【答案正确】各服务（sshd、login、su、sudo 等）的 PAM 策略配置文件存放于 /etc/pam.d/ 目录，每个服务一个同名文件；模块级的可调参数文件在 /etc/security/ 下。/etc/config/、/root/、/etc/my.cnf.d/（MariaDB 配置目录）均与 PAM 无关。", "d": 0}, {"k": "y25sec", "s": 74, "t": "多选", "q": "配置虚拟用户认证时，我们需要进行以下哪些步骤？", "o": ["在操作系统中创建虚拟用户账号", "将虚拟用户的用户名和密码添加到Samba数据库", "在smb.conf文件中添加用户名和密码的映射路径", "在smbusers文件中定义虚拟用户的映射关系"], "a": "BD", "n": "【答案正确】配置虚拟用户认证的要点：将虚拟用户的用户名和密码添加到 Samba 自身密码数据库（B，smbpasswd/tdbsam），并在 smbusers 映射文件中定义虚拟用户的映射关系（D，配合 username map 指令使用）；A 与定义矛盾，虚拟用户恰恰不创建在操作系统中；C 表述不通，smb.conf 中不存放用户名和密码的映射，只写映射文件路径，不选，故 BD 正确。", "d": 0}, {"k": "y25sec", "s": 75, "t": "单选", "q": "PAM配置文件中，第二列内容代表什么意思？", "o": ["模块类型", "控制标记", "模块路径", "模块参数"], "a": "B", "n": "【答案正确】PAM 配置行格式为“模块类型 控制标记 模块路径 参数”，第一列是模块类型（auth/account/password/session），第二列是控制标记（required、requisite、sufficient、optional 等，决定失败/成功如何 cumulatively 处理），第三列才是模块路径，故 B 正确、A/C/D 分别对应第一/第三/第四列内容。", "d": 0}, {"k": "y25sec", "s": 76, "t": "单选", "q": "在Linux Samba服务中，什么是winbind模块？", "o": ["一个用于与Windows AD域进行通信和身份验证的系统进程。", "一个用于加密Samba密码和提供安全性的软件模块。", "一个用于管理Samba共享和访问控制的用户界面。", "一个用于在Linux服务器上枚举和管理本地用户和组的工具。"], "a": "A", "n": "【答案正确】winbind 是 Samba 的守护进程（winbindd），负责与 Windows AD 域控制器通信，经 NSS/PAM 把域用户、组信息呈现给 Linux 并完成域身份验证，A 正确；它不负责加密（加密由 SMB 签名/传输加密承担），也不是图形管理界面，“枚举管理本地用户和组”是 NSS 本地模块的职责。", "d": 0}, {"k": "y25sec", "s": 77, "t": "单选", "q": "Linux-PAM有几种模块类型？", "o": ["2", "3", "4", "5"], "a": "C", "n": "【答案正确】Linux-PAM 的模块类型共 4 种：auth（身份认证）、account（账户有效性检查，如过期/锁定）、password（口令更新）、session（会话建立与审计），故选 C(4)；2、3、5 均不正确。", "d": 0}, {"k": "y25sec", "s": 78, "t": "单选", "q": "下面哪个配置项指定Samba工作组的名称？", "o": ["workgroup", "security", "realm", "encrypt passwords"], "a": "A", "n": "【答案正确】smb.conf 的 [global] 段中 workgroup = 指定 Samba 所属工作组名称（如 MYGROUP），A 正确；security 设置安全/认证模式，realm 指定 Kerberos 领域（AD 环境、习惯大写），encrypt passwords 只控制口令以明文还是加密形式处理（现代 Samba 已废弃明文），均不是工作组参数。", "d": 0}, {"k": "y25sec", "s": 79, "t": "多选", "q": "用来配置用户密码错误尝试次数的配置文件是哪个？", "o": ["password-auth", "systemd-user", "postlogin", "login"], "a": "AD", "n": "【答案正确】限制口令错误尝试次数依赖 PAM 的 pam_faillock/pam_tally2 模块：RHEL 7 通常将其配置写入 /etc/pam.d/system-auth 与 password-auth（远程与通用服务生效），本地终端登录则可在 /etc/pam.d/login 中配置（老教程常用 pam_tally2 deny=N），故 password-auth 与 login 可用于此目的；systemd-user 是 systemd 用户会话的 PAM 配置、postlogin 用于登录后处理，均与口令尝试限制无关，B、C 不选。", "d": 0}, {"k": "y25sec", "s": 80, "t": "单选", "q": "为了支持混合认证，在Samba配置文件中，将security配置项设置为什么？", "o": ["winbind", "ads", "smb", "local"], "a": "B", "n": "【答案正确】security 的合法取值为 share/user/server/domain/ads，四个选项中仅 ads 是合法值；ads 模式使 Samba 作为活动目录（AD）成员服务器、采用 Kerberos 认证，可兼容 AD 域混合模式环境，与题意“支持混合认证”的出题意图对应，选 B。【术语提示】winbind 是配合 ads 模式的守护进程而非 security 的取值，smb、local 均非合法取值。", "d": 0}, {"k": "y25sec", "s": 81, "t": "多选", "q": "下列说法错误的是？", "o": ["A. requisite表示即使本行指定的模块验证失败，也允许用户接受应用程序提供的服务，一般返回PAM_IGNORE(忽略)", "B. include表示将包括其他的一些认证，这样就可以建立一个分离式的配置文件管理机制。", "C. sufficient表示如果这个模块返回失败，则立刻向应用程序返回失败，表示此类型失败，不再进行同类型后面的操作。", "D. required表示如果一个用户通过这个模块的验证，PAM结构就会立刻返回验证成功信息（即使前面有模块验证失败，也会把失败结果忽略掉），把控制权交回应用程序。"], "a": "ACD", "n": "【答案正确】本题选错误说法：A 错——requisite 验证失败会立即终止认证并返回失败，失败仍放行并返回 PAM_IGNORE 不是其语义；C 错——模块失败立刻返回失败是 requisite 的行为，sufficient 失败时仅被忽略、继续后续模块；D 错——验证通过立即返回成功是 sufficient 的行为，required 失败不会立即返回，所有模块执行完才统一判定；B 的 include 描述正确（引入其他 PAM 配置形成分层管理），不属于错误说法，不选。故 ACD 正确。", "d": 0}, {"k": "y25sec", "s": 82, "t": "多选", "q": "Samba混合认证中的winbind模块的功能是什么？", "o": ["进行与Windows AD域的通信和身份验证", "加密Samba密码", "枚举Windows AD中的用户列表", "管理Samba共享和访问控制"], "a": "AC", "n": "【答案正确】winbind 是 Samba 与 Windows 域集成的守护进程，负责与 AD 域控通信并对域用户进行身份验证（A），同时提供域用户/组信息的解析与枚举（如 wbinfo -u 列出 AD 用户、getent 查询，C）；加密 Samba 口令由密码后端（smbpasswd/tdbsam）承担，共享与访问控制由 smb.conf 配置管理，均非 winbind 功能，B、D 不选，故 AC 正确。", "d": 0}, {"k": "y25sec", "s": 83, "t": "多选", "q": "下面属于PAM的模块类型的是？", "o": ["include", "auth", "required", "password"], "a": "BD", "n": "【答案正确】PAM 模块类型共四种：auth（认证）、account（账户属性检查）、password（口令修改）、session（会话管理），故 auth、password 属于模块类型；include 是配置文件中的控制关键词（引入其他配置文件），required 是控制标志（决定返回值如何处理），都不是模块类型，A、C 不选，故 BD 正确。", "d": 0}, {"k": "y25sec", "s": 84, "t": "多选", "q": "下面哪些配置项是在Samba配置文件中用于支持混合认证的？", "o": ["workgroup", "security", "realm", "smbpasswd"], "a": "ABC", "n": "【答案正确】workgroup、security、realm 都是 smb.conf 中与认证直接相关的指令：security 决定认证模式（user/domain/ads），ads/域模式配合 workgroup（域工作组）与 realm（KDC 大写域名）实现跨域混合认证；smbpasswd 是管理口令的命令（或 passdb 后端文件名），不是认证模式配置项，排除 D 正确。【术语提示】配置文件准确名称为 /etc/samba/smb.conf，smbpasswd 作为配置参数应写作 smb passwd file / passdb backend。", "d": 0}, {"k": "y25sec", "s": 85, "t": "单选", "q": "在Linux中，su命令和sudo命令的主要区别是？", "o": ["su命令只能切换到root用户，sudo命令可以切换到任意用户。", "su命令需要输入目标用户的密码，sudo命令需要输入当前用户的密码。", "su命令可以在当前会话中保留环境变量，sudo命令会重置环境变量。", "su命令只能在交互式终端中使用，sudo命令可以在任何地方使用。"], "a": "B", "n": "【答案正确】su 切换身份需要输入目标用户（常为 root）的口令，sudo 执行命令时验证的是当前用户自己的口令、并按 sudoers 授权执行，B 是二者的本质区别。A 颠倒事实（su 可切换任意已存在用户，sudo 也支持 sudo -u 指定身份）；C 描述片面（sudo 默认 env_reset 重置环境，但 su 不带“-”同样混用环境，非主要区别）；D 错误，两者均可用于脚本/非交互场景。", "d": 0}, {"k": "y25sec", "s": 86, "t": "单选", "q": "NFS（Network File System）是一种用于在网络上共享文件和目录的协议。它的工作原理是：", "o": ["客户端发送文件访问请求给NFS服务器，服务器进行验证后返回文件。", "客户端直接在服务器上进行文件操作。", "服务器主动将文件发送给客户端。", "服务器根据客户端请求将文件传输给客户端。"], "a": "D", "n": "【答案正确】NFS基于客户端/服务器架构（底层为RPC）：客户端发出文件访问请求，服务器根据请求响应并传输数据，D准确描述了这一请求-响应模式。A说“服务器验证后返回文件”表述不准——NFS的访问控制在exports授权/Kerberos等层面完成，且文件访问是细粒度的RPC读写调用而非整文件返回；B错在客户端并非直接在服务器上操作；C与NFS工作原理相反（服务器不会主动推送文件），这与第92题把“服务器主动将文件发送给客户端”判为错误说法的设计一致。", "d": 0}, {"k": "y25sec", "s": 87, "t": "单选", "q": "在配置sudo权限时，以下哪个选项是正确的？", "o": ["使用sudoedit命令添加用户权限。", "编辑sudoers文件并添加相关授权规则。", "使用su -c命令指定用户权限。", "在用户账号的配置文件中设置sudo权限。"], "a": "B", "n": "【答案正确】配置sudo权限的标准做法是用visudo安全编辑/etc/sudoers文件（或/etc/sudoers.d/下的文件），按“用户 主机=(以谁的身份) 命令”格式添加授权规则，B正确。A的sudoedit是让用户以安全方式编辑指定文件的命令，不是给用户添加权限的工具；C的su -c只是以其他身份执行一条命令，与sudo授权机制无关；D不存在所谓“用户账号配置文件中设置sudo权限”的做法。", "d": 0}, {"k": "y25sec", "s": 88, "t": "单选", "q": "在设置NFS服务器时，下列哪个命令可以启动nfs-server服务并在系统启动时自动启动？", "o": ["systemctl start nfs-server", "systemctl enable nfs-server", "systemctl status nfs-server", "systemctl reload nfs-server"], "a": "B", "n": "【答案存疑】【题目缺陷】题干要求“启动服务并在系统启动时自动启动”，两个动作缺一不可，但没有一个选项能同时满足：A的start只启动当前服务、B的enable只设置开机自启（RHEL 7中enable不会立即启动服务）。严格正确的命令应为systemctl enable --now nfs-server，或组合执行systemctl start nfs-server && systemctl enable nfs-server。按出题意图（落脚点在“系统启动时自动启动”）应维持B，可作为参考答案保留，但题干与选项不严谨，建议修改题干为“设置nfs-server服务开机自启”。", "d": 1}, {"k": "y25sec", "s": 89, "t": "单选", "q": "在执行命令时，sudo命令的作用是？", "o": ["以root用户身份执行命令。", "让用户进入root用户的交互式环境。", "让用户临时拥有root用户的权限执行命令。", "自动切换用户到root用户。"], "a": "C", "n": "【答案正确】sudo的作用是让被授权用户临时以root（或其他指定用户）的身份执行命令，凭的是用户自身口令且按sudoers规则限定范围，C最准确。B、D描述的其实是su的效果（进入root交互式环境、切换用户身份）；A表述过于绝对——sudo能否以root执行取决于授权，且可用-u指定其他用户身份，并非“以root身份执行”这一笼统说法。", "d": 0}, {"k": "y25sec", "s": 90, "t": "单选", "q": "NFS服务器的配置文件是：", "o": ["/etc/nfs.conf", "/etc/nfsmount.conf", "/etc/exports", "/etc/nfs-server.conf"], "a": "C", "n": "【答案正确】RHEL/CentOS 7中NFS共享目录在/etc/exports中配置，每行格式为“共享目录 客户端(权限选项)”，修改后用exportfs -rav或重启nfs-server生效，C正确。/etc/nfs.conf是RHEL 8+的nfs-utils才引入的守护进程参数文件（RHEL 7调整参数主要用/etc/sysconfig/nfs），不含共享定义；nfsmount.conf是客户端挂载参数文件；/etc/nfs-server.conf并不存在。", "d": 0}, {"k": "y25sec", "s": 91, "t": "单选", "q": "以下哪个命令可以切换到root用户？", "o": ["sudo -u root", "su root", "sudo su", "root"], "a": "B", "n": "【答案正确】su root（更规范是su - root）输入root口令后切换到root用户，是切换用户的标准命令，B正确。C的sudo su在用户已获sudo授权时也能获得root shell，但它依赖sudoers配置且本质是调用su，单选题中B为最标准答案；A的sudo -u root后面不接命令会报用法错误；D的root不是命令。", "d": 0}, {"k": "y25sec", "s": 92, "t": "单选", "q": "下列关于NFS的说法中，错误的是：", "o": ["NFS可以在不同操作系统之间进行文件共享。", "NFS允许多个计算机共享文件和目录。", "NFS客户端通过网络访问远程文件系统。", "NFS的工作原理是服务器主动将文件发送给客户端。"], "a": "D", "n": "【答案正确】本题选错误的说法：NFS基于客户端/服务器请求-响应模式（RPC机制），数据只在响应客户端请求时传输，服务器绝不会主动将文件推送给客户端，故D为正确选项。A正确——NFS可跨不同操作系统（各类Unix/Linux，甚至Windows客户端）共享；B、C分别描述了多机共享与网络访问远程文件系统，均为NFS的基本特征。与第86题考点呼应。", "d": 0}, {"k": "y25sec", "s": 93, "t": "多选", "q": "以下关于su命令的说法正确的是？", "o": ["su命令可以切换到任意用户的账户。", "su命令需要输入目标用户的密码。", "su命令可以保留当前用户的环境变量。", "su命令只能在交互式终端中使用。"], "a": "BC", "n": "【答案存疑】B、C 成立：su 需输入目标用户口令（root 除外），且不带 \"-\" 的 su 会保留大部分当前环境变量（如 PATH、LANG，仅 HOME/SHELL/USER/LOGNAME 等被改写）。但 A \"su 可以切换到任意用户的账户\" 技术上同样成立——只要知道目标口令即可，root 甚至免口令，A 与 B 并不矛盾，更合理的答案应是 ABC。【题目缺陷】若出题意图是\"必须知道口令才能切换\"以否定\"任意\"二字，则 BC 属出题口径，建议修订题干。", "d": 1}, {"k": "y25sec", "s": 94, "t": "多选", "q": "NFS的优势包括：", "o": ["跨平台性，允许在不同操作系统之间进行文件共享。", "提供方便和灵活的文件共享解决方案。", "允许多个计算机共享文件和目录。", "提高了文件系统的性能和安全性。"], "a": "ABC", "n": "【答案正确】A/B/C 是 NFS 的公认优势：基于 RPC 可在 Unix/Linux 等不同系统间共享（跨平台），部署使用方便灵活（只需 exports+NFS 服务），支持多台客户端并发共享同一目录。D 不成立：NFS 只是把目录暴露为网络共享，并不提升底层文件系统性能与安全性，反而引入网络延迟和额外攻击面，安全需另靠防火墙、Kerberos（sec=krb5*）等加固。", "d": 0}, {"k": "y25sec", "s": 95, "t": "多选", "q": "以下关于sudo命令的说法正确的是？", "o": ["sudo命令可以切换到任意用户的账户。", "sudo命令需要输入当前用户的密码。", "sudo命令可以保留当前用户的环境变量。", "sudo命令允许管理员授权普通用户执行特定命令。"], "a": "BCD", "n": "【答案正确】B 正确：sudo 默认要求输入发起者（当前用户）自己的口令，这是与 su（输目标口令）的核心区别；C 正确：通过 sudo -E 或 sudoers 的 env_keep 可以保留环境变量（默认 env_reset 会重置，但\"可以保留\"成立）；D 正确：sudoers 就是管理员授权普通用户执行特定命令的机制。A 错误：sudo 只能执行授权范围内的操作（用 -u 指定目标用户也须在 sudoers 中授权），不能\"任意\"切换。【发行版差异】root 调用或 NOPASSWD 条目可免密，属默认规则例外。", "d": 0}, {"k": "y25sec", "s": 96, "t": "多选", "q": "在设置NFS服务器时，以下哪些命令是必须的？", "o": ["yum install nfs-utils -y", "systemctl start nfs-server", "systemctl enable nfs-server", "exportfs -arv"], "a": "ABCD", "n": "【答案正确】四个命令构成 RHEL7 上 NFS 服务端的标准流程：安装 nfs-utils；启动 nfs-server；设为开机自启；在 /etc/exports 写入共享后用 exportfs -arv 重新导出全部目录并立即生效（a=全部，r=重新导出，v=显示详情）。严格说 enable 并非运行所必需、也可用 systemctl restart nfs-server 代替 exportfs，但按出题的教学流程四项都是规范步骤。【术语提示】RHEL7 服务名为 nfs-server（旧称 nfs）。", "d": 0}, {"k": "y25sec", "s": 97, "t": "多选", "q": "以下关于sudoers文件的说法正确的是?", "o": ["sudoers文件位于/etc/sudoers。", "只有root用户可以编辑sudoers文件。", "sudoers文件中可以配置允许用户执行特定命令的规则。", "对sudoers文件的更改需要使用visudo命令。"], "a": "ACD", "n": "【答案正确】A 正确：sudoers 位于 /etc/sudoers；C 正确：sudoers 用 \"用户 主机=(目标用户) 命令\" 规则授权特定命令；D 正确：规范要求用 visudo 修改，它自带语法检查与文件锁，防止改坏导致 sudo 不可用。B 排除有理：并非\"只有 root\"——被授权的用户（如 wheel 组成员执行 sudo visudo）同样能编辑该文件。", "d": 0}, {"k": "y25sec", "s": 98, "t": "多选", "q": "在NFS服务器上，以下哪些选项可以在导出文件系统时使用：", "o": ["rw - 允许对文件系统进行读写访问。", "sync - 告诉NFS服务器在请求时执行写操作。", "all_squash - 将来自客户端请求的所有UID和GID映射到匿名用户。", "root_squash - 将来自客户端的root用户或UID/GID 0的请求映射到匿名UID/GID。"], "a": "ABCD", "n": "【答案正确】四个都是 /etc/exports 导出项的标准描述：rw 允许读写；sync 表示写请求落盘（稳定存储）后才应答；all_squash 把所有客户端 UID/GID 映射为匿名用户（nfsnobody）；root_squash 仅把 UID/GID 0 即 root 映射为匿名用户（RHEL 默认开启）。B 的表述\"在请求时执行写操作\"稍欠精确（准确说是\"写入稳定存储后才响应\"），但大意与方向正确，不构成知识性错误。", "d": 0}, {"k": "y25sec", "s": 99, "t": "多选", "q": "以下关于sudo命令的执行方式的说法正确的是?", "o": ["sudo命令会在后台执行。", "sudo命令会记录命令的执行日志。", "sudo命令会检查用户的授权规则。", "sudo命令会在执行命令前询问用户是否需要输入密码。"], "a": "BCD", "n": "【答案正确】B 正确：sudo 通过 syslog（authpriv）/audit 记录每次命令执行，可审计追责；C 正确：每次执行都逐条匹配 sudoers 授权规则，不匹配即拒绝；D 的本意是\"需要时提示输入口令\"（首次执行或超出 timestamp 超时后再次提示），符合 sudo 行为。A 错误：sudo 在前台执行命令，并不在后台运行。【选项文本有误微瑕】D 的准确表述应为\"提示用户输入密码\"，而非\"询问是否需要输入密码\"。", "d": 0}, {"k": "y25sec", "s": 100, "t": "单选", "q": "iSCSI是一种在IP网络上传输什么协议的存储协议？", "o": ["SCSI", "TCP", "HTTP", "FTP"], "a": "A", "n": "【答案正确】iSCSI（Internet SCSI，互联网小型计算机系统接口）就是把SCSI指令/数据封装后在IP网络上传输的存储协议，让主机把远端块设备当本地硬盘使用，A正确。TCP、HTTP、FTP都不是它“在IP网络上传输”的对象协议；TCP/IP只是其底层承载（见第106题）。", "d": 0}, {"k": "y25sec", "s": 101, "t": "单选", "q": "Linux中，使用命令chmod可以修改文件的基本权限。以下哪个选项是设置文件所有者具有读权限的命令？", "o": ["chmod u+r file.txt", "chmod g+w file.txt", "chmod o-x file.txt", "chmod a+w file.txt"], "a": "A", "n": "【答案正确】chmod符号模式中u代表所有者(user)、g代表属组(group)、o代表其他(other)、a代表全部(all)，u+r即给文件所有者增加读权限。B是给属组加写权限，C是去掉其他用户的执行权限，D是给所有用户加写权限，均与题目要求的“所有者加读”不符。", "d": 0}, {"k": "y25sec", "s": 102, "t": "单选", "q": "iSCSI目标是什么？", "o": ["专用的网络连接硬盘存储设备", "iSCSI客户端", "iSCSI服务器", "IP网络"], "a": "C", "n": "【答案正确】iSCSI体系分两端：target（目标）是提供服务的一端，即iSCSI存储服务器（RHEL 7中用targetcli配置并导出后端块设备/LUN），C正确。它与第104题的initiator（启动器，客户端发起端）角色互补；A描述的“专用网络连接硬盘设备”更接近NAS设备的概念，B是客户端、D是承载网络，均不是target定义。", "d": 0}, {"k": "y25sec", "s": 103, "t": "单选", "q": "Linux中，每个文件都有一个所有者和一个所在组。以下哪个命令可以查看文件的所有者和所在组？", "o": ["ps -ef", "ls -l", "chown", "chmod"], "a": "B", "n": "【答案正确】ls -l长格式列出文件，第3、4列分别是所有者和所属组，如-rw-r--r-- 1 alice dev ...，B正确。ps -ef用于查看进程；chown修改文件所有者/属组，chmod修改权限，二者是“改”而不是“查”，且它们的作用对象是权限归属本身而非查看输出。", "d": 0}, {"k": "y25sec", "s": 104, "t": "单选", "q": "iSCSI启动器是什么？", "o": ["专用的网络连接硬盘存储设备", "iSCSI客户端", "iSCSI服务器", "IP网络"], "a": "B", "n": "【答案正确】iSCSI initiator（启动器）是发起SCSI请求、连接到target并使用其存储资源的客户端（RHEL 7用iscsiadm发现和登录target），B正确。target（服务端）与initiator（客户端）角色与第102题互补；A是存储设备概念、D是网络载体、C方向恰好相反。", "d": 0}, {"k": "y25sec", "s": 105, "t": "单选", "q": "Linux中，文件的基本权限分为读、写和执行权限。以下哪个命令可以将文件的所有用户的执行权限删除？", "o": ["chmod u-x file.txt", "chmod g-w file.txt", "chmod o-r file.txt", "chmod a-rx file.txt"], "a": "D", "n": "【答案正确】题目要求删除“所有用户”的执行权限，作用域应为a（all）；四个选项中只有D的a-rx面向全部用户去除了执行(x)权限——虽然它连读(r)也一并删除（严格更精确的写法是chmod a-x file.txt），但作为单选它是唯一覆盖所有用户并包含-x的选项。A只删所有者的执行权限，B删的是属组写权限，C删的是其他用户读权限，均不符合“所有用户”。", "d": 0}, {"k": "y25sec", "s": 106, "t": "单选", "q": "iSCSI协议使用什么协议栈作为传输层？", "o": ["UDP/IP", "FTP", "TCP/IP", "HTTP"], "a": "C", "n": "【答案正确】iSCSI把SCSI命令封装后在TCP/IP网络上传输，默认使用TCP 3260端口，依靠TCP的可靠传输、确认与重传机制保证块数据完整性，故C正确。标准iSCSI不基于UDP/IP；FTP、HTTP与之无关；TCP是其传输层协议而SCSI是所承载的上层指令集（与第100题呼应）。", "d": 0}, {"k": "y25sec", "s": 107, "t": "单选", "q": "在Linux系统中，文件权限可以分为几个级别？", "o": ["1个级别", "2个级别", "3个级别", "4个级别"], "a": "C", "n": "【已修正答案】平台原答案 B 有误（平台答案系 AI 生成、仅供参考），已按核验改为 C。Linux文件权限按用户身份分为3个级别：文件所有者(user)、所属组(group)、其他用户(other)，对应u/g/o三档，这是通行教材与同类题库（本题干在多个题库中即考核u/g/o三级）的标准答案。按权限类型也可说读、写、执行三种，同样不是2。参考答案“2个级别”无通行依据，疑为命题人把“所有者和所在组”两类归属概念（第103题题干）误当作权限级别。", "d": 2}, {"k": "y25sec", "s": 108, "t": "多选", "q": "以下哪些操作系统可以提供iSCSI目标功能？", "o": ["Windows Server", "macOS", "Linux", "FreeBSD"], "a": "ACD", "n": "【已修正答案】平台原答案 AC 有误（平台答案系 AI 生成、仅供参考），已按核验改为 ACD。FreeBSD 在基础系统中自带 ctld(8)（基于 CAM 目标层 CTL），此外还有 istgt 等，完全可以提供 iSCSI 目标（target），故 D 亦成立；B（macOS）无原生 iSCSI 支持（无论发起端还是目标端都需第三方且支持极弱），排除正确。出题口径可能只讲了 Windows Server 的 iSCSI Target Server 角色与 Linux（targetcli/LIO），但按\"可以提供\"的事实判断，把 FreeBSD 排除属于漏选。", "d": 2}, {"k": "y25sec", "s": 109, "t": "多选", "q": "Linux基本权限系统中，文件的权限是由三部分组成的？", "o": ["用户权限", "用户组权限", "其他用户权限", "根权限"], "a": "ABC", "n": "【答案正确】Linux 基本权限按 three-class 模型划分：属主 u（用户权限）、属组 g（用户组权限）、其他 o（其他用户权限），对应 ls -l 中 rwx 三组九字符。D \"根权限\"不是权限类别——root 不受这些基本权限约束（CAP_DAC_OVERRIDE），是超级用户身份而非一组权限位。", "d": 0}, {"k": "y25sec", "s": 110, "t": "多选", "q": "以下哪些文件系统可以在iSCSI目标上创建？", "o": ["NTFS", "FAT32", "ext4", "xfs"], "a": "ABCD", "n": "【已修正答案】平台原答案 ACD 有误（平台答案系 AI 生成、仅供参考），已按核验改为 ABCD。iSCSI 目标只导出块设备，文件系统由发起端在其上格式化创建：Linux 发起端可用 ext4、xfs，也可 mkfs.vfat 创建 FAT32；Windows 发起端可创建 NTFS、FAT32。凡能建在块设备上的文件系统均可行，FAT32（有 4GB 单文件上限、无日志）虽不常用但完全可以创建；题库选项已计入 NTFS（同样需 Windows 侧或 ntfs-3g 支持）却排除更通用的 FAT32，自相矛盾，属漏选。", "d": 2}, {"k": "y25sec", "s": 111, "t": "多选", "q": "在Linux系统中，文件权限有几种形式？", "o": ["字符形式", "数值形式", "二进制形式", "列表形式"], "a": "AB", "n": "【答案正确】Linux 权限的两种表示形式：字符（符号）形式 rwxr-xr-x（如 chmod u+x）和数值形式 755（每组权限 r=4、w=2、x=1 求和，八进制）。\"二进制形式\"只是内核权限位的底层位实现，不作为使用/表达形式；\"列表形式\"不是权限表示法。【发行版差异】无，各 Unix-like 一致。", "d": 0}, {"k": "y25sec", "s": 112, "t": "多选", "q": "在iSCSI目标配置中，以下哪些步骤是必需的？", "o": ["创建存储块", "创建访问控制规则", "创建逻辑单元", "创建端口"], "a": "ABCD", "n": "【答案正确】targetcli 配置 iSCSI 目标的标准步骤：创建 backstore（block 类型存储块）→ 创建 iqn 目标 → 创建 LUN（逻辑单元）→ 创建 ACL（访问控制规则，绑定发起端 IQN 限制准入）→ 创建 portal。四个选项恰好对应 backstore、ACL、LUN、portal。【术语提示】\"创建端口\"实为 targetcli 中的 portals（门户），指 IP:3260 的监听入口，默认 0.0.0.0:3260。", "d": 0}, {"k": "y25sec", "s": 113, "t": "多选", "q": "在Linux系统中，以下哪些权限表示文件所有者具有读取权限？", "o": ["r", "w", "x", "u"], "a": "AD", "n": "【答案存疑】【题目缺陷】r 是读权限位，u 是\"属主\"类别符号，两者都不是\"文件所有者具有读取权限\"的完整表达；若题意为 chmod 符号模式中给属主赋读权限（u+r 或 u=r），u 与 r 是配合使用的两个符号，这样参考答案 AD（r 和 u）勉强可解释为\"表示属主读取所需用到的符号\"，但题干把它们称为\"权限\"属表述混淆。建议改题干为\"哪些符号用于表达属主的读权限\"，技术上更准确。", "d": 1}, {"k": "y25sec", "s": 114, "t": "单选", "q": "ACL是什么的缩写？", "o": ["Access Control List", "Advanced Configuration Language", "Application Control Logic", "Authorization Control Language"], "a": "A", "n": "【答案正确】ACL即Access Control List（访问控制列表），是传统u/g/o三级权限之外的细粒度权限机制，可为任意指定用户、组设置rwx权限，Linux上通过getfacl/setfacl操作。B、C、D（Advanced Configuration Language、Application Control Logic、Authorization Control Language）均为干扰造词，并无这些常见缩写含义。", "d": 0}, {"k": "y25sec", "s": 115, "t": "单选", "q": "Kerberos是一种用于验证用户和服务身份的协议，它主要用于哪个领域？", "o": ["网络安全", "数据库管理", "云计算", "多媒体传输"], "a": "A", "n": "【答案正确】Kerberos是应用于网络安全领域的网络身份认证协议（源自MIT Athena项目，Windows AD、Linux的SSSD+KRB5环境广泛使用），解决开放网络中身份认证与防窃听/防重放问题。它不用于数据库管理、云计算资源调度或多媒体传输，其余三项均不沾边。", "d": 0}, {"k": "y25sec", "s": 116, "t": "单选", "q": "以下哪个命令用于查看文件或目录的ACL权限？", "o": ["chmod", "chown", "getfacl", "setfacl"], "a": "C", "n": "【答案正确】getfacl用于查看文件或目录的ACL权限条目，setfacl用于设置、修改、删除ACL，两者配对记忆（get查看、set设置），C正确。chmod、chown只管理传统的基本权限和所有者/属组，看不到且改不了扩展ACL条目。", "d": 0}, {"k": "y25sec", "s": 117, "t": "单选", "q": "Kerberos服务器由哪两个部分组成？", "o": ["认证服务和票据授权服务", "用户服务和密码服务", "数据库服务和文件服务", "客户端服务和目标服务"], "a": "A", "n": "【答案正确】Kerberos服务器的核心即KDC（密钥分发中心），由两部分组成：AS（认证服务，Authentication Server，验证用户身份并发放TGT）和TGS（票据授权服务，Ticket-Granting Service，凭TGT换取针对具体服务的服务票据），A正确。B、C、D均为无关联的干扰项。", "d": 0}, {"k": "y25sec", "s": 118, "t": "单选", "q": "默认ACL（Default ACL）用于？", "o": ["设置文件的基本权限", "设置文件的高级权限", "设置新文件和目录的默认权限", "设置特定用户的权限"], "a": "C", "n": "【答案正确】默认ACL（Default ACL）只能设置在目录上，作用是让该目录下新建的文件和子目录自动继承其ACL规则，即C“设置新文件和目录的默认权限”。它不影响已存在文件的权限，也不是给特定用户单独授权（那是访问ACL/ACE的用途），A、B、D均不成立。", "d": 0}, {"k": "y25sec", "s": 119, "t": "单选", "q": "Kerberos的认证过程中，客户端向KDC的AS发送什么请求？", "o": ["密钥请求", "票据请求", "身份验证请求", "授权请求"], "a": "C", "n": "【答案正确】Kerberos认证的第一步是客户端向KDC的AS（认证服务器）发送身份验证请求（AS_REQ，内含经用户密钥加密的时间戳做预认证），AS验证通过后返回TGT；而“票据请求”（TGS_REQ）是后续客户端拿TGT向TGS换取服务票据时的交互， belongs在后一阶段，故C正确、B不选。", "d": 0}, {"k": "y25sec", "s": 120, "t": "单选", "q": "想要为用户Alice设置读写权限，以下命令正确的是？", "o": ["setfacl -m alice:rw file.txt", "setfacl -u alice:rw file.txt", "setfacl -g alice:rw file.txt", "setfacl -a alice:rw file.txt"], "a": "A", "n": "【答案正确】setfacl用-m修改/添加ACL条目，用户条目可写作setfacl -m u:alice:rw file.txt并允许省略u:写成-m alice:rw，A正确。setfacl没有-u、-a这类选项；组条目应写为-m g:组名：权限而非-g alice:rw，B、C、D均是错误用法（会报参数错误）。", "d": 0}, {"k": "y25sec", "s": 121, "t": "单选", "q": "Kerberos可以与以下哪个技术结合使用，用于实施企业级安全解决方案？", "o": ["FTP", "HTTP", "DNS", "LDAP"], "a": "D", "n": "【答案正确】企业级安全方案中Kerberos最常与LDAP结合：LDAP目录（如OpenLDAP、Active Directory、FreeIPA等）集中存储用户与主机信息，Kerberos负责强身份认证，二者互补构成统一认证体系，D正确。FTP、HTTP只是普通网络应用，DNS负责名称解析，都不是与Kerberos组合实现统一认证的典型技术。", "d": 0}, {"k": "y25sec", "s": 122, "t": "单选", "q": "如何删除文件或目录的ACL权限？", "o": ["chmod -x file.txt", "setfacl -x file.txt", "setfacl -d file.txt", "chown root: file.txt"], "a": "B", "n": "【答案正确】setfacl -x用于删除ACL条目（完整写法需指明条目，如setfacl -x u:alice file.txt；选项缺条目单独执行会报“缺少ACL条目”，但本题考核的是-x删除这一用法，B正确，与-m相对）。C的-d是--default，即让操作作用于默认ACL（配合-m/-x使用），并非删除普通ACL条目；A、D与ACL机制无关。", "d": 0}, {"k": "y25sec", "s": 123, "t": "多选", "q": "Kerberos的主体可以是以下哪些类型？", "o": ["个人用户", "服务账户", "机器账户", "集群账户"], "a": "ABC", "n": "【答案正确】Kerberos 主体（principal）即 KDC 数据库中的身份条目，常见三类：用户主体（user@REALM）、服务主体（service/host@REALM，如 HTTP/server）和机器/主机主体（host/machine@REALM）。“集群账户”不是 Kerberos 的主体类型，集群节点各自以主机/服务主体参与，无此独立类型。", "d": 0}, {"k": "y25sec", "s": 124, "t": "多选", "q": "以下哪些命令可以用于设置文件的ACL权限？", "o": ["chmod", "chown", "getfacl", "setfacl"], "a": "D", "n": "【已修正答案】平台原答案 AC 有误（平台答案系 AI 生成、仅供参考），已按核验改为 D。设置文件 ACL 的命令是 setfacl（如 setfacl -m u:tom:rw file）；题库把 getfacl 计入\"设置\"明显矛盾——getfacl 只是只读查看工具。chmod 只修改传统属主/属组/其他的 rwx 位（在使用 POSIX ACL 的系统上会联动改写基础 ACL 项，但不是\"设置 ACL\"的手段），chown 改属主属组与权限无关。【术语提示】若题意确为\"设置 ACL 权限\"，唯一工具是 setfacl。", "d": 2}, {"k": "y25sec", "s": 125, "t": "多选", "q": "Kerberos可以实现以下哪些功能？", "o": ["单点登录（SSO）", "安全的远程访问", "数据库访问控制", "电子邮件加密"], "a": "ABC", "n": "【答案正确】A 正确：一次认证换取多重服务票据即 SSO；B 正确：Kerberos 化的 ssh/telnet/rlogin 等可实现安全的远程访问（防口令明文与重放）；C 成立：PostgreSQL（GSSAPI）、Oracle 等数据库支持 Kerberos 身份认证接入，可纳入统一认证体系。D 错误：Kerberos 只解决身份认证与会话密钥，不提供电子邮件加密功能，邮件加密属 PGP/S/MIME 职责。", "d": 0}, {"k": "y25sec", "s": 126, "t": "多选", "q": "以下哪些命令可以用于查看文件的ACL权限？", "o": ["ls", "stat", "getfacl", "setfacl"], "a": "AC", "n": "【答案正确】getfacl 直接列出文件的 ACL 条目（user/group/mask/default），是标准查看命令；ls -l 权限位末尾的 \"+\" 可以判断文件带有扩展 ACL，按教学口径也算查看手段之一。setfacl 用于设置而非查看，stat 不显示 ACL 内容。【术语提示】RHEL7 下要看到具体条目必须用 getfacl，ls 只能发现 \"＋\" 标记。", "d": 0}, {"k": "y25sec", "s": 127, "t": "多选", "q": "Kerberos的架构包括以下哪些组件？", "o": ["客户端", "Kerberos服务器", "受保护的服务", "监控服务器"], "a": "ABC", "n": "【答案正确】Kerberos 体系由三部分 组成：客户端（申请票据）、Kerberos 服务器（KDC：AS 发初始票据、TGS 发服务票据）、受保护的应用服务（凭服务票据验证客户端，实现双向认证）。“监控服务器”不是 Kerberos 架构组件，监控属运维体系（如 zabbix/nagios），与协议无关。", "d": 0}, {"k": "y25sec", "s": 128, "t": "多选", "q": "ACL权限可以授予哪些用户或用户组？", "o": ["根用户（root）", "系统管理员", "普通用户", "匿名用户"], "a": "AC", "n": "【答案存疑】技术上 setfacl 可对任意用户/组设置条目（-m u:用户:rwx、-m g:组:rwx，支持数字 UID/GID），因此根用户账户、管理员账户、普通用户账户乃至 nobody（匿名）都可以被授予 ACL，按\"恰好成立\"的标准 B、D 同样可行；参考答案 AC 应视为教学口径（强调 ACL 可对 root 和普通用户细分权限，区别于传统 owner/group/other 三类）。【题目缺陷】\"系统管理员/匿名用户\"并非 Linux 权限体系中的用户类别术语，题干过于含糊。", "d": 1}, {"k": "y25sec", "s": 129, "t": "多选", "q": "在CentOS系统上配置和安装Kerberos的步骤包括以下哪些？", "o": ["安装Kerberos软件包", "配置Kerberos服务器", "创建Kerberos数据库", "设置Kerberos管理员密码"], "a": "ABCD", "n": "【答案正确】CentOS/RHEL7 部署 KDC 的完整流程即四步：安装 krb5-server/krb5-workstation 软件包；配置 /etc/krb5.conf、/var/kerberos/krb5kdc/kdc.conf；用 kdb5_util create 初始化 Kerberos 数据库；用 kadmin.local addprinc admin/admin 并设置管理员口令。全选成立，选项划分与实际工程步骤对应。【术语提示】之后还需启动 krb5kdc、kadmin 服务并放行 88/749 端口。", "d": 0}, {"k": "y25sec", "s": 130, "t": "多选", "q": "默认ACL（Default ACL）用于什么目的？", "o": ["设置特定用户的默认权限", "设置文件的默认权限", "设置新文件和目录的默认权限", "设置访问控制的规则"], "a": "BC", "n": "【答案正确】默认 ACL（setfacl -d）只能设置在目录上，其作用是让该目录下新建的文件和子目录自动继承一组权限，故 B、C（本质同义）正确。A 可被曲解为\"给特定用户预授权\"——默认 ACL 虽支持具名用户条目，但教材口径强调其核心语义是\"继承默认权限\"而非\"特定用户\"；D \"设置访问控制规则\"过泛，非默认 ACL 的专门定义。【术语提示】setfacl -d 对普通文件会报错 \"Only directories can have default ACLs\"。", "d": 0}, {"k": "y25sec", "s": 131, "t": "多选", "q": "以下哪些权限可以在ACL中授予用户？", "o": ["读权限", "写权限", "执行权限", "删除权限"], "a": "ABC", "n": "【已修正答案】平台原答案 ABCD 有误（平台答案系 AI 生成、仅供参考），已按核验改为 ABC。POSIX ACL（RHEL7 的 setfacl）条目权限位只有 r、w、x（另有 X 逻辑执行位与 mask 有效权限位），不存在独立的\"删除\"权限位；文件的删除由其父目录的 w 权限（配合 sticky bit）控制，不能在 ACL 中直接授予\"删除权\"。故 A 读、B 写、C 执行正确，D 删除属过度延伸，参考答案 ABCD 多选了 D。", "d": 2}, {"k": "y25sec", "s": 132, "t": "单选", "q": "Kerberos认证是一种强大的网络认证协议，它的工作原理是基于什么进行认证和授权？", "o": ["共享密钥和时间戳", "用户名和密码", "公钥和私钥", "IP地址和端口号"], "a": "A", "n": "【答案正确】Kerberos基于对称加密的共享密钥体系：KDC同用户、服务共享各自密钥，认证报文中还强制携带时间戳以防重放攻击，A“共享密钥和时间戳”准确。B的用户名口令只是初始凭据且口令不在网络明文传输；C的公钥/私钥是非对称体系（传统Kerberos不用，仅PKINIT扩展涉及）；D的IP地址、端口与认证机制无关。", "d": 0}, {"k": "y25sec", "s": 133, "t": "单选", "q": "iptables是Linux操作系统上用于配置和管理什么的工具？", "o": ["网络连接", "防火墙规则", "硬盘分区", "用户权限"], "a": "B", "n": "【答案正确】iptables是Linux上配置和管理netfilter防火墙规则的用户态工具，通过表、链、规则实现对数据包的过滤、NAT和报文修改，B正确。它不管理网络连接本身，更与硬盘分区、用户权限无涉（分别是fdisk/parted和chmod/chown等工具的职责）。", "d": 0}, {"k": "y25sec", "s": 134, "t": "单选", "q": "Kerberos认证与其他认证方式相比，最大的优势是什么？", "o": ["配置简单", "安全性高", "学习门槛低", "不依赖基础设施"], "a": "B", "n": "【答案正确】Kerberos相对其他认证方式的最大优势是安全性高：口令不在网络上明文传输、基于票据与时间戳的双向认证、防重放、并天然支持单点登录，B正确。恰恰相反，Kerberos以“配置复杂、强依赖KDC基础设施”著称，所以A（配置简单）、D（不依赖基础设施）与事实相反，C（学习门槛低）也不是其特点。", "d": 0}, {"k": "y25sec", "s": 135, "t": "单选", "q": "iptables规则链的执行顺序是什么？", "o": ["INPUT -> FORWARD -> OUTPUT", "FORWARD -> INPUT -> OUTPUT", "OUTPUT -> FORWARD -> INPUT", "INPUT -> OUTPUT -> FORWARD"], "a": "A", "n": "【答案存疑】【题目缺陷】iptables的三个内建过滤链并不存在INPUT→FORWARD→OUTPUT的固定执行顺序：进入本机的包走PREROUTING→INPUT，被转发的包走PREROUTING→FORWARD→POSTROUTING，本机发出的包走OUTPUT→POSTROUTING，每个包只按其路径经过其中一条链。四个选项都是三链排列组合，技术上均不严谨；若按该题库惯例把filter表三条链取列举顺序作答，A是唯一说得通的选项，可维持原答案，但命题应改为“filter表包含哪些内建链”或按数据包流向设问。", "d": 1}, {"k": "y25sec", "s": 136, "t": "单选", "q": "在配置SSH服务器以使用Kerberos认证时，需要修改SSH配置文件中的哪些选项？", "o": ["GSSAPIAuthentication和GSSAPICleanupCredentials", "PasswordAuthentication和PermitRootLogin", "AllowTcpForwarding和X11Forwarding", "Port和ListenAddress"], "a": "A", "n": "【答案正确】SSH通过GSSAPI对接Kerberos：sshd_config中设置GSSAPIAuthentication yes启用GSSAPI/Kerberos认证，GSSAPICleanupCredentials控制会话结束时是否清理（撤销）缓存的Kerberos凭证，A正确。B是口令认证与root登录控制，C是TCP/X11转发功能，D是监听端口与地址，均与Kerberos认证无关。", "d": 0}, {"k": "y25sec", "s": 137, "t": "单选", "q": "使用iptables添加一个允许特定IP地址（192.168.1.100）的流量的规则，应该使用哪个选项？", "o": ["【-d】", "【-s】", "【-p】", "【-j】"], "a": "B", "n": "【答案正确】匹配“来自特定IP的流量”用-s（--source）指定源地址，如iptables -A INPUT -s 192.168.1.100 -j ACCEPT，B正确。-d指定目标地址（用于访问该IP的出方向流量），-p指定协议，-j指定处理动作（ACCEPT/DROP/REJECT等）；按题意“该IP的流量”惯例以该IP为源地址匹配。", "d": 0}, {"k": "y25sec", "s": 138, "t": "多选", "q": "Kerberos认证的优势包括哪些？", "o": ["安全性高", "单点登录功能", "配置简单", "可扩展性强"], "a": "ABD", "n": "【答案正确】Kerberos 基于对称密钥与票据双向认证，口令不在网络明文传输，安全性高（A）；一次认证可访问域内多个服务，实现单点登录（B）；realm/domain 可支撑大规模主机与服务，可扩展性强（D）。C 错误：Kerberos 涉及 realm、principal、keytab、krb5.conf 与严格的时间同步，部署和维护并不简单，是公认配置复杂度较高的认证体系。", "d": 0}, {"k": "y25sec", "s": 139, "t": "单选", "q": "使用iptables添加一个拒绝HTTP（端口80）流量的规则，应该使用哪个选项？", "o": ["【-p】", "【-s】", "【--dport】", "【-j】"], "a": "C", "n": "【答案正确】针对HTTP端口80过滤需要用--dport 80指定目标端口（且必须配合-p tcp，端口匹配仅对tcp/udp等协议有意义），如iptables -A INPUT -p tcp --dport 80 -j DROP，C正确。-p只能指定协议不能定位端口，-s匹配源地址，-j用于指定动作（如 DROP/REJECT），都不是端口匹配选项。", "d": 0}, {"k": "y25sec", "s": 140, "t": "多选", "q": "在配置SSH服务器以使用Kerberos认证时，需要修改哪些配置文件？", "o": ["/etc/krb5.conf", "/etc/ssh/sshd_config", "/etc/hosts", "/etc/passwd"], "a": "AB", "n": "【答案正确】SSH 启用 Kerberos（GSSAPI）认证：客户端/服务端都要在 /etc/krb5.conf 配置 realm 与 KDC（A），/etc/ssh/sshd_config 中设 GSSAPIAuthentication yes（B）。/etc/hosts 用于主机名解析（Kerberos 依赖反向解析一致，属配套而非认证配置文件），/etc/passwd 与票据认证机制无关。【术语提示】服务端还需导出 /etc/krb5.keytab 并对时（kinit 对时间偏差敏感）。", "d": 0}, {"k": "y25sec", "s": 141, "t": "多选", "q": "下面哪些是iptables的基本动作？", "o": ["ACCEPT", "REJECT", "DROP", "REDIRECT"], "a": "ABC", "n": "【答案正确】filter 链的三个基本处置动作：ACCEPT 放行、DROP 静默丢弃（不给回应）、REJECT 拒绝并回应 ICMP port-unreachable/重置。REDIRECT 虽也是合法 target，但属于 nat 表的地址改写动作（重定向到本机另一端口），不属于\"基本动作\"；此外常见 target 还有 LOG、RETURN、MASQUERADE、SNAT/DNAT。", "d": 0}, {"k": "y25sec", "s": 142, "t": "多选", "q": "Kerberos认证的工作原理是基于什么进行认证和授权？", "o": ["共享密钥", "时间戳", "用户名和密码", "公钥和私钥"], "a": "AB", "n": "【答案正确】Kerberos 使用对称加密：用户口令派生共享密钥存于 KDC（A），认证交互用时间戳防重放（默认时钟偏差容忍 5 分钟，B）。\"用户名和密码\"是口令登录方式而非票据协议的核心（协议传输的是票据与会话密钥，不是明文密码）；\"公钥和私钥\"属 PKI 体系，Kerberos 不依靠非对称密钥认证。", "d": 0}, {"k": "y25sec", "s": 143, "t": "多选", "q": "iptables可以使用哪些选项来指定源IP地址或目标IP地址？", "o": ["【-s】", "【-d】", "【-m】", "【--source】"], "a": "ABD", "n": "【已修正答案】平台原答案 AB 有误（平台答案系 AI 生成、仅供参考），已按核验改为 ABD。-s 与 --source 是同一选项的短/长写法（iptables 手册：-s, --source, --src address[/mask]），都能指定源 IP，因此 D \"--source\" 同样成立；-d（--destination）指定目标 IP，B 正确。【题目缺陷】参考答案把 --source 排除属于漏选，可能误以为长选项不存在。C（-m）用于加载扩展匹配模块（如 -m iprange/-m tcp），不用于指定 IP。", "d": 2}, {"k": "y25sec", "s": 144, "t": "多选", "q": "下面哪些是iptables的表？", "o": ["filter", "nat", "mangle", "route"], "a": "ABC", "n": "【答案正确】iptables 内置表：filter（默认，包过滤）、nat（地址转换，PREROUTING/POSTROUTING/OUTPUT）、mangle（改写报文头、TTL、Mark）。“route”不是 iptables 的表——策略路由是把 mangle 表打标记后配合 ip rule/ip route 实现。【发行版差异】RHEL7 的 iptables 还有 raw（免 conntrack）和 security（配合 SELinux）两个表，但本题四个选项中排除 route 即可，ABC 正确。", "d": 0}, {"k": "y25sec", "s": 145, "t": "单选", "q": "iptables中的SNAT和DNAT用于什么目的？", "o": ["实现负载均衡", "实现网络地址转换", "实现安全策略", "实现流量控制"], "a": "B", "n": "【答案正确】SNAT（源网络地址转换）与DNAT（目的网络地址转换）就是iptables nat表中实现的网络地址转换：SNAT在POSTROUTING改写源地址供内网共享上网，DNAT在PREROUTING改写目的地址把外部访问映射到内部服务器，B正确。负载均衡只是DNAT的一种应用，实现安全策略或流量控制都不是SNAT/DNAT的目的。", "d": 0}, {"k": "y25sec", "s": 146, "t": "单选", "q": "负载均衡的作用是什么？", "o": ["提高系统的可用性和可靠性", "增加系统的带宽", "减少系统的延迟", "增加用户的带宽"], "a": "A", "n": "【答案正确】负载均衡将请求分摊到多台后端服务器，避免单点故障、在部分节点失效时仍能持续服务，核心作用是提高系统的可用性和可靠性（顺带提升扩展性与吞吐），A正确。“增加系统/用户带宽、减少延迟”至多是间接效果，不是负载均衡的定义性作用。", "d": 0}, {"k": "y25sec", "s": 147, "t": "单选", "q": "使用iptables进行负载均衡时，以下哪个表用于处理网络连接请求？", "o": ["nat表", "filter表", "mangle表", "raw表"], "a": "A", "n": "【答案正确】用iptables做负载均衡本质是通过DNAT把新连接请求分发到多个后端，规则要写在nat表（通常PREROUTING链），如-t nat -A PREROUTING -j DNAT --to-destination后端地址区间（配合random/statistic等模块实现轮询），A正确。filter表只做包过滤，mangle用于修改报文字段（TTL、MARK），raw用于豁免连接跟踪，都不承担连接请求的地址分发。", "d": 0}, {"k": "y25sec", "s": 148, "t": "多选", "q": "iptables负载均衡的优点包括哪些？", "o": ["提高系统的可用性和可靠性", "提高系统的性能和并发能力", "减少系统的带宽消耗", "增加系统的带宽"], "a": "AB", "n": "【答案正确】iptables（借助 --statistic nth/random 等）做负载均衡可将请求分摊到多台后端，避免单点过载或宕机导致不可访问，从而提高可用性和可靠性（A）；总体吞吐量与并发处理能力也随节点扩展而提高（B）。C 错误：转发不减少带宽消耗，NAT 处理反而多一跳开销；D 错误：负载均衡不增加任何物理带宽，只是利用现有链路。", "d": 0}, {"k": "y25sec", "s": 149, "t": "多选", "q": "在iptables负载均衡中，以下哪些算法可以用于选择服务器？", "o": ["轮询（Round-Robin）", "最少连接（Least Connections）", "源IP哈希（Source IP Hash）", "随机（Random）"], "a": "ABCD", "n": "【答案存疑】【概念争议】按通用负载均衡理论，轮询、最少连接、源 IP 哈希、随机都是常见调度算法，ABCD 可算成立；但严格对应 iptables 能力：原生 --statistic 模块仅提供 nth（轮询）与 random（随机）两种分发方式，\"最少连接\"与\"源 IP 哈希\"是 LVS/IPVS 的调度器（lc、sh），iptables 自身无法感知后端连接数或做源哈希。若题目问\"iptables 可用的算法\"应为轮询+随机；按教学泛化口径则四项皆可，需按教材口径确认。", "d": 1}, {"k": "y25sec", "s": 150, "t": "多选", "q": "在iptables中实现负载均衡时，以下哪些动作可以用于实现数据包转发？", "o": ["DNAT", "SNAT", "INPUT", "ACCEPT"], "a": "AB", "n": "【答案正确】负载均衡的包转发依靠 nat 表改写地址实现：DNAT 把目的地址/端口改写到后端服务器（A），SNAT 用于统一回程源地址或在后端网关不指向本机时保证会话通畅（B），两者都是实现转发的动作。INPUT 是内置链不是动作，ACCEPT 只是放行匹配包、不改变其去向，都不能\"转发\"数据包。", "d": 0}, {"k": "y25sec", "s": 151, "t": "单选", "q": "firewalld是一种什么类型的防火墙软件？", "o": ["应用层防火墙", "包过滤型防火墙", "网关型防火墙", "主机型防火墙"], "a": "B", "n": "【已修正答案】平台原答案 A 有误（平台答案系 AI 生成、仅供参考），已按核验改为 B。firewalld是基于内核netfilter的动态防火墙管理器，按端口/协议/源地址等对数据包在内核态进行过滤（并支持状态检测），工作在网络/传输层，属于包过滤型防火墙，B正确。“应用层防火墙”指以代理方式解析应用内容的一类（如WAF、代理网关），firewalld不具备该性质，参考答案A判断明显错误。另注：若按部署位置分类，firewalld保护单台主机也可称“主机型防火墙”（D有一定道理），但按防火墙技术类型划分应选包过滤型，A无论如何不成立。", "d": 2}, {"k": "y25sec", "s": 152, "t": "单选", "q": "以下哪个命令可以启动firewalld服务？", "o": ["systemctl start firewalld", "service start firewalld", "/etc/init.d/firewalld start", "rc.firewalld start"], "a": "A", "n": "【答案正确】RHEL/CentOS 7使用systemd，启动firewalld服务用systemctl start firewalld（开机自启用systemctl enable firewalld），A正确。B的service start firewalld连SysV风格的参数顺序都不对（应为service firewalld start），C的/etc/init.d脚本与D的BSD风格rc脚本在该系统上均非启动firewalld的正确途径。", "d": 0}, {"k": "y25sec", "s": 153, "t": "单选", "q": "如何添加firewalld的规则来允许特定端口的访问？", "o": ["firewall-cmd --add-port=80/tcp", "firewall-cmd --allow-port=80/tcp", "firewall-cmd --enable-port=80/tcp", "firewall-cmd --open-port=80/tcp"], "a": "A", "n": "【答案正确】firewall-cmd放行端口的选项是--add-port=端口/协议，如firewall-cmd --add-port=80/tcp（可加--permanent持久化、--zone指定区域，随后--reload生效），A正确。--allow-port、--enable-port、--open-port都不是firewall-cmd存在的选项，属于干扰项。", "d": 0}, {"k": "y25sec", "s": 154, "t": "多选", "q": "以下哪些命令可以用于查看当前firewalld的状态？", "o": ["firewall-cmd --state", "systemctl status firewalld", "firewalld-cmd --status", "firewall-cmd --list-all"], "a": "ABD", "n": "【答案正确】A firewall-cmd --state 只输出 running/not running（查 firewalld 是否在运行）；B systemctl status firewalld 查看服务运行状态；D firewall-cmd --list-all 列出默认区当前生效的全部规则，可反映运行中的防火墙状态。C 错误：命令名是 firewall-cmd 而非 firewalld-cmd，且不存在 --status 选项，属编造命令。", "d": 0}, {"k": "y25sec", "s": 155, "t": "多选", "q": "以下哪些操作可以用于配置firewalld服务和端口？", "o": ["firewall-cmd --add-service=service_name", "firewall-cmd --remove-service=service_name", "firewall-cmd --add-port=port_number/protocol", "firewall-cmd --remove-port=port_number/protocol"], "a": "ABCD", "n": "【答案正确】四个都是 firewall-cmd 的合法运行时选项：--add-service/--remove-service 按预定义服务名（/usr/lib/firewalld/services/*.xml）增删放行，--add-port/--remove-port 以 端口/协议（如 8080/tcp）形式增删，用于配置服务和端口。【术语提示】以上为运行时配置，需加 --permanent 才写入持久化配置，并执行 firewall-cmd --reload 生效。", "d": 0}, {"k": "y25sec", "s": 156, "t": "多选", "q": "以下哪些命令可以用于启用firewalld服务并设置开机自启动？", "o": ["systemctl start firewalld", "systemctl enable firewalld", "systemctl enable-firewalld", "systemctl restart firewalld"], "a": "AB", "n": "【答案正确】A systemctl start firewalld 启动服务，B systemctl enable firewalld 设置开机自启，两步合起来即题意。C 错误：sysv/daemon 子命令与单元名之间必须有空格，\"enable-firewalld\" 连字符写法不是 systemctl 的合法语法；D restart 只是重启，与\"启用+自启\"无关。【术语提示】常配合 systemctl status firewalld 或 firewall-cmd --state 验证。", "d": 0}, {"k": "y25sec", "s": 157, "t": "单选", "q": "firewalld是什么", "o": ["一种操作系统", "一种网络安全工具", "一种编程语言", "一种数据库管理系统"], "a": "B", "n": "【答案正确】firewalld是RHEL 7起默认的动态防火墙守护进程及其管理工具（配合firewall-cmd命令），属于网络安全防护工具，B正确。它是运行在操作系统上的程序，不是操作系统、编程语言或数据库管理系统。", "d": 0}, {"k": "y25sec", "s": 158, "t": "单选", "q": "下面哪个命令可以在firewalld中查看当前的规则列表？", "o": ["firewall-cmd --reload", "firewall-cmd --list-all", "firewall-cmd --add-rule", "firewall-cmd --permanent"], "a": "B", "n": "【答案正确】firewall-cmd --list-all列出当前运行时默认区域的全部配置（已放行的服务、端口、协议、富规则、伪装等），是查看规则列表的常用命令，B正确。--reload是重载防火墙规则，--add-rule本身不是独立有效的添加命令（添加富规则为--add-rich-rule），--permanent只是声明针对持久化配置进行操作的选项而非查看命令。", "d": 0}, {"k": "y25sec", "s": 159, "t": "单选", "q": "以下哪个命令可以配置firewalld实现NAT伪装？", "o": ["firewall-cmd --add-masquerade", "firewall-cmd --add-forward-port", "firewall-cmd --add-port", "firewall-cmd --add-rich-rule"], "a": "A", "n": "【答案正确】firewalld中开启NAT伪装（masquerade，动态SNAT）的命令是firewall-cmd --zone=区域 --add-masquerade（常配--permanent），A正确。--add-forward-port用于端口转发（DNAT类），--add-port仅放行端口，--add-rich-rule用于添加富规则，均不是启用伪装的选项。", "d": 0}, {"k": "y25sec", "s": 160, "t": "单选", "q": "如何开启系统级别的IP转发功能？", "o": ["sysctl -w net.ipv4.ip_forward=1", "sysctl -w net.ipv6.ip_forward=1", "sysctl -w net.ipv4.ip_forwarding=1", "sysctl -w net.ipv6.ip_forwarding=1"], "a": "A", "n": "【答案正确】开启IPv4转发的内核参数是net.ipv4.ip_forward，临时设置sysctl -w net.ipv4.ip_forward=1，持久化则写入/etc/sysctl.conf或/etc/sysctl.d/*.conf后执行sysctl -p，A正确。IPv6的对应参数是net.ipv6.conf.all.forwarding，且内核参数中不存在ip_forwarding这一写法，B、C、D均错误。", "d": 0}, {"k": "y25sec", "s": 161, "t": "多选", "q": "firewalld的特点是什么？", "o": ["支持动态更新防火墙规则", "可以设置端口转发和NAT伪装", "支持IPv4和IPv6协议", "仅适用于Linux系统"], "a": "ABC", "n": "【答案存疑】【概念争议】A/B/C 确为 firewalld 特点：基于 dbus 支持规则动态更新（无需重启服务或断连接）、通过 rich rule/forward-port/masquerade 支持端口转发与 NAT 伪装、同时管理 IPv4 与 IPv6 规则。但 D \"仅适用于Linux系统\"字面上也是事实——firewalld 依赖内核 netfilter/nftables，只能运行在 Linux 上；作为\"特点\"被排除属出题口径问题。若按\"字面真伪\"则 D 成立，按\"优点式特点\"则维持 ABC。", "d": 1}, {"k": "y25sec", "s": 162, "t": "多选", "q": "当使用firewalld实现端口转发时，需要配置的参数包括：", "o": ["源地址", "源端口", "目的地址", "目的端口"], "a": "BCD", "n": "【答案正确】firewalld 端口转发语法 --add-forward-port=port=源端口:proto=协议:toaddr=目的地址:toport=目的端口，必需的三要素即源端口、目的地址、目的端口，故 B、C、D。源地址（A）只是可选的限定条件（只转发来自特定来源的流量），通常不必配置。【术语提示】转发到其他主机还要开启 masquerade 伪装，且 RHEL7 下需 sysctl net.ipv4.ip_forward=1。", "d": 0}, {"k": "y25sec", "s": 163, "t": "多选", "q": "在firewalld中，可以通过以下哪些方式实现端口转发？", "o": ["使用iptables命令手动配置端口转发规则", "使用port forwarding选项", "使用rich rule选项", "使用forward-port选项"], "a": "BD", "n": "【答案存疑】【选项文本有误】firewalld 官方方式是 --add-forward-port（即 forward-port 选项，D 正确）；同时 rich rule 里内嵌 forward-port 元素（rule family=ipv4 forward-port port=… to-port=…）也能实现端口转发，C 同样成立，参考答案 BD 漏选了 C。B \"port forwarding 选项\"并非真实选项名，若视为 --add-forward-port 的泛称则与 D 重复；A \"用 iptables 命令手动配置\"不是 firewalld 的管理方式（只能经 --direct 接口兼容实现）。建议以 C、D 作为 firewalld 的官方答案口径。", "d": 1}, {"k": "y25sec", "s": 164, "t": "单选", "q": "SELinux是一种用于强化Linux系统安全的安全模块，它基于以下哪个安全模型？", "o": ["DAC (Discretionary Access Control)", "RBAC (Role-Based Access Control)", "MAC (Mandatory Access Control)", "ACL (Access Control List)"], "a": "C", "n": "【答案正确】SELinux实现的是强制访问控制（MAC）：访问由系统安全策略统一裁决，进程与文件都带安全上下文标签，文件属主无法自主放权，与DAC（普通rwx权限）相对，C正确。其内部机制结合了TE类型强制、RBAC角色和MLS/MCS多级安全，但作为安全模型分类的标准答案是MAC；ACL只是细粒度权限列表，不构成SELinux的安全模型。", "d": 0}, {"k": "y25sec", "s": 165, "t": "单选", "q": "下列哪个命令可以查看SELinux的状态和模式？", "o": ["sestatus", "getenforce", "setenforce", "semanage"], "a": "A", "n": "【答案正确】sestatus完整显示SELinux的状态（enabled/disabled）、当前模式（enforcing/permissive）、加载的策略及进程/文件上下文等，是“查看状态和模式”的最佳命令，A正确。getenforce只输出当前模式一个词；setenforce用于切换模式，semanage用于管理策略（如端口、上下文映射），均不是查看状态命令。", "d": 0}, {"k": "y25sec", "s": 166, "t": "单选", "q": "下列哪个命令可以临时禁用SELinux，重启后会自动重新启用？", "o": ["setenforce 0", "getenforce 1", "semanage 0", "selinux-policy 0"], "a": "A", "n": "【答案正确】setenforce 0在运行时把SELinux由强制切换为宽容（Permissive）模式，只审计不拦截；由于未修改/etc/selinux/config，重启后按配置文件恢复到既定模式，符合“临时禁用、重启后自动恢复”，A正确。另注：setenforce只能在enforcing/permissive间切换，真正永久禁用需改配置文件并重启；getenforce不带参数仅用于查看，其余两项不是有效命令。", "d": 0}, {"k": "y25sec", "s": 167, "t": "多选", "q": "下列哪些命令可以用于查看SELinux的状态或模式？", "o": ["sestatus", "getenforce", "semanage", "setenforce"], "a": "AB", "n": "【答案正确】sestatus 输出 SELinux 是否启用、当前模式与加载策略名等状态信息；getenforce 只输出 Enforcing/Permissive/Disabled 三值之一，两者都可用于查看状态或模式。C semanage 用于策略管理（fcontext/port/boolean），D setenforce 用于在 1/0 间切换模式，都是\"改\"不是\"看\"。【术语提示】更直观的还有 /etc/selinux/config（记录持久化模式）。", "d": 0}, {"k": "y25sec", "s": 168, "t": "多选", "q": "下列哪些是SELinux的三种模式？", "o": ["强制模式", "宽容模式", "禁用模式", "混合模式"], "a": "ABC", "n": "【答案正确】SELinux 三种模式：Enforcing 强制（拒绝违规并审计记录）、Permissive 宽容（只记录不拦截，供排错）、Disabled 禁用（内核不挂载 SELinux），对应 /etc/selinux/config 的 SELINUX=enforcing|permissive|disabled。“混合模式”不存在；setenforce 只能在强制/宽容间临时切换，进出 Disabled 必须改配置并重启。", "d": 0}, {"k": "y25sec", "s": 169, "t": "单选", "q": "在SELinux中，安全上下文是用来做什么的？", "o": ["标识文件和进程的唯一标识符", "控制文件和进程的访问权限", "加密文件和进程的内容", "限制文件和进程的运行时间"], "a": "B", "n": "【答案正确】SELinux安全上下文（如unconfined_u:object_r:httpd_sys_content_t:s0）是附加在进程和文件等客体上的安全标签（用户:角色:类型:级别），安全策略据此裁决进程能否访问客体，其实质作用就是“控制文件和进程的访问权限”，B正确。它不是加密手段，也不限制运行时长；说“唯一标识符”不贴切，其用途是访问控制而非身份编码。", "d": 0}, {"k": "y25sec", "s": 170, "t": "单选", "q": "下面哪个命令可以修改文件的安全上下文？", "o": ["semanage", "chcon", "setenforce", "restorecon"], "a": "B", "n": "【答案正确】chcon直接修改指定文件的SELinux安全上下文（如chcon -t httpd_sys_content_t /web/index.html），立即生效，B正确。semanage fcontext修改的是策略中的上下文映射规则（配合restorecon应用，属持久化做法，不直接改现有文件标签）；setenforce只切换模式；restorecon按策略规则恢复文件上下文，是“恢复”而非直接的修改入口。就“修改某文件的上下文”而言chcon最贴切。", "d": 0}, {"k": "y25sec", "s": 171, "t": "单选", "q": "下面哪个命令可以查看文件的安全上下文？", "o": ["ls -Z", "getenforce", "semanage", "chcon"], "a": "A", "n": "【答案正确】ls -Z在列出文件的同时显示其SELinux安全上下文（-Z通用选项亦用于ps -Z、id -Z等），A正确。getenforce仅显示SELinux模式，semanage管理策略映射，chcon用于修改上下文而非查看，均不能查看文件的安全上下文。", "d": 0}, {"k": "y25sec", "s": 172, "t": "单选", "q": "SELinux中的MLS策略指的是什么？", "o": ["多级安全性策略", "强制访问控制策略", "标签访问控制策略", "宽松访问控制策略"], "a": "A", "n": "【答案正确】MLS（Multi-Level Security）即多级安全策略，SELinux 在 targeted 策略之外提供 MLS 策略，以 Bell-LaPadula 型敏感度标签（s0-s15、类别 c0.c1023）按密级实现分级强制访问控制，故选 A。干扰项 B\"强制访问控制策略\"是 SELinux 整体（TE 模型）的共性特征，并非 MLS 的专名；C、D 均非标准术语。", "d": 0}, {"k": "y25sec", "s": 173, "t": "多选", "q": "关于SELinux的安全策略，哪些是正确的说法？", "o": ["SELinux策略决定了如何标记和控制文件、进程的访问权限。", "SELinux策略是静态的，无法动态调整。", "SELinux策略可以根据需要进行自定义和修改。", "SELinux策略通常包含标签、规则和类型转换规则。"], "a": "ACD", "n": "【答案正确】A/D 正确：SELinux 策略由类型强制（TE）规则、文件标签（file context）与类型转换（type transition）规则组成，决定进程与文件如何被标记以及能否被访问；C 正确：可通过自定义策略模块、audit2allow 和布尔值按需修改并动态加载生效。B 错误：策略并非静态不可调——semodule 加载模块、setsebool 切换布尔值都是动态调整手段。故 ACD。", "d": 0}, {"k": "y25sec", "s": 174, "t": "多选", "q": "在SELinux中，以下哪些命令可用于管理SELinux安全上下文策略？", "o": ["getenforce", "setenforce", "semanage", "chcon"], "a": "CD", "n": "【答案正确】管理安全上下文的两个命令：chcon 直接修改文件/目录的标签（临时，restorecon 或重打标后可能还原），semanage fcontext 定义持久的默认上下文规则（再以 restorecon 应用）。getenforce/setenforce 只查看或切换执行模式，不涉及上下文，故 A、B 排除，选 C、D。【术语提示】生产上推荐 semanage fcontext 而非 chcon，防止重启后标签回退。", "d": 0}, {"k": "y25sec", "s": 175, "t": "多选", "q": "在SELinux中，以下哪些因素可能会影响文件的安全上下文？", "o": ["文件系统类型", "文件的访问权限", "文件的所在目录", "文件的大小"], "a": "ABC", "n": "【答案存疑】文件的安全上下文取决于：所在文件系统是否支持扩展属性/SELinux 标签（A 成立，如 ext4 支持而某些网络文件系统默认不支持），以及父目录标签与类型转换规则（C 成立，新建文件默认继承目录上下文或触发 type_transition）。“文件的访问权限”（DAC 的 rwx 位）并不决定 SELinux 的安全上下文，两者独立管理（B 依题库口径被选中属可辩护但技术上牵强）；文件大小无关（D 排除正确）。倾向正确集合为 A、C。", "d": 1}, {"k": "y25sec", "s": 176, "t": "单选", "q": "下列哪个工具可以用来配置SELinux安全服务的服务端口？", "o": ["iptables", "systemd", "semanage", "SSH"], "a": "C", "n": "【答案正确】semanage（由 policycoreutils-python 包提供）用 `semanage port -a/-m -t 类型 -p 协议 端口` 管理服务的 SELinux 端口标签，是把自定义端口划入 http_port_t 等端口类型、控制服务可用端口的标准工具，选 C。iptables 负责网络包过滤、systemd 管理服务进程、SSH 是远程登录协议，均与 SELinux 端口标签无关。", "d": 0}, {"k": "y25sec", "s": 177, "t": "单选", "q": "在SELinux策略文件中，可以通过什么方式配置服务端口的访问权限？", "o": ["修改/etc/selinux/config文件", "使用semanage命令", "修改/etc/ssh/sshd_config文件", "使用setenforce命令"], "a": "B", "n": "【答案正确】配置服务端口访问权限的实质是修改端口的安全上下文类型，须用 semanage port 命令写入 SELinux 策略，选 B。A /etc/selinux/config 只能设置 SELinux 运行模式（enforcing/permissive/disabled）与策略类型；C 是 sshd 自身的配置文件；D setenforce 仅在 1/0 间切换模式，均不涉及端口。题干\"在SELinux策略文件中\"措辞不严谨，实为通过 semanage 命令更新策略中的端口定义，不影响作答。", "d": 0}, {"k": "y25sec", "s": 178, "t": "单选", "q": "为了允许Web服务器访问HTTP服务的默认端口80，下列命令中哪一个是正确的？", "o": ["semanage port -a -t http_port_t -p tcp 80", "semanage port -a -t http_port_t -p udp 80", "semanage port -a -t httpd_t -p tcp 80", "semanage port -a -t httpd_t -p udp 80"], "a": "A", "n": "【答案正确】Web 服务端口应标注 http_port_t 类型，且 HTTP 使用 TCP 协议，故 `semanage port -a -t http_port_t -p tcp 80` 语法与语义均正确，选 A。B 协议写成 udp 错误；C、D 的 httpd_t 是进程域类型而非端口类型，端口场景必须用 *_port_t。注：80 端口默认已预映射 http_port_t，实际中新端口（如 8080）才用 -a 添加，本题考察命令语法。", "d": 0}, {"k": "y25sec", "s": 179, "t": "多选", "q": "配置SELinux安全服务的服务端口时，可以通过以下哪些方式实现？", "o": ["修改SELinux配置文件", "使用semanage命令", "修改iptables配置文件", "使用setenforce命令"], "a": "AB", "n": "【答案正确】为服务开放 SELinux 受控端口的规范做法是 semanage port（如 semanage port -a -t http_port_t -p tcp 8080），B 正确；也可通过定制策略（编写 .te 模块声明端口类型并 semodule 加载）实现，对应选项 A\"修改SELinux配置文件\"的说法。C 修改 iptables 与 SELinux 端口管控无关，D setenforce 只切换模式、会降低整体防护，均不得作为\"配置服务端口\"的手段。【术语提示】A 若理解为改 /etc/selinux/config 则不正确，该文件只管模式与策略类型。", "d": 0}, {"k": "y25sec", "s": 180, "t": "多选", "q": "在SELinux中，可以使用哪些命令来查询并修改服务端口的类型？", "o": ["semanage port -l", "semanage port -m -t  -p", "semanage port -a -t  -p", "semanage port -d -t  -p"], "a": "AB", "n": "【答案正确】查询用 semanage port -l 列出全部端口/协议与类型的映射（A）；修改已存在映射用 -m（如 semanage port -m -t http_port_t -p tcp 8080，B），符合“查询并修改”的题意。-a 是新增（端口未被任何类型占用时），-d 是删除，语义不同故 C、D 不选。【术语提示】三条命令都要求类型已存在，否则报 not defined 错误。", "d": 0}, {"k": "y25sec", "s": 181, "t": "多选", "q": "配置SELinux服务端口时，可以同时指定多个端口，以及使用通配符来表示一定范围的端口，以下哪些选项是正确的？", "o": ["semanage port -a -t http_port_t -p tcp 80, 443, 8080", "semanage port -a -t http_port_t -p tcp 80-82", "semanage port -a -t http_port_t -p tcp 80-82, 8080", "semanage port -a -t http_port_t -p tcp 80,443,8080"], "a": "B", "n": "【已修正答案】平台原答案 ABC 有误（平台答案系 AI 生成、仅供参考），已按核验改为 B。semanage port 一次只接受单个端口或\"起始-结束\"范围形式（如 80-82，RHEL 7.2 起支持范围），不支持逗号分隔列表：A 中 \"80, 443, 8080\" 带空格会被 shell 拆成三个参数而报错；C 的 \"80-82, 8080\" 与 D 的 \"80,443,8080\" 都不是合法语法。因此唯一可执行的是 B（范围写法 80-82），参考答案 ABC 有误；若要放行多个不连续端口应多次执行 semanage 命令。【题目缺陷】A、C 的写法在任何解析规则下都无法成功，题干把三者并列为正确属组题缺陷。", "d": 2}, {"k": "y25sec", "s": 182, "t": "单选", "q": "在Linux系统中，以下哪个命令用于查看当前已挂载的磁盘和文件系统？", "o": ["lsblk", "fdisk", "mount", "parted"], "a": "C", "n": "【答案正确】mount 不带参数时依据 /proc/mounts 列出当前已挂载的文件系统、挂载点及选项，与题意完全对应，选 C。lsblk 侧重列出块设备树（含未挂载的设备），fdisk、parted 是分区工具，均不如 mount 直接回答\"已挂载\"的情况（df -h 亦可查看使用情况，但不在选项中）。", "d": 0}, {"k": "y25sec", "s": 183, "t": "单选", "q": "以下哪个命令用于创建新的磁盘分区？", "o": ["fdisk", "mount", "format", "lsblk"], "a": "A", "n": "【答案正确】fdisk 是经典 MBR 分区工具，以 `fdisk /dev/sdb` 进入交互界面用 n 指令创建分区，选 A。mount 用于挂载文件系统，lsblk 仅查看设备列表；Linux 没有 format 命令，格式化实际使用 mkfs 系列（如 mkfs.xfs）。", "d": 0}, {"k": "y25sec", "s": 184, "t": "单选", "q": "当需要将新的磁盘挂载到Linux系统时，下列哪个步骤是正确的顺序？", "o": ["格式化磁盘 -> 创建挂载点 -> 挂载磁盘 -> 更新/etc/fstab", "创建挂载点 -> 格式化磁盘 -> 挂载磁盘 -> 更新/etc/fstab", "挂载磁盘 -> 创建挂载点 -> 格式化磁盘 -> 更新/etc/fstab", "创建挂载点 -> 挂载磁盘 -> 格式化磁盘 -> 更新/etc/fstab"], "a": "B", "n": "【答案存疑】【题目缺陷】全流程的关键约束是\"格式化必须先于挂载、挂载后才能写入 /etc/fstab\"；而\"创建挂载点\"只是 mkdir，与格式化没有任何依赖关系。因此选项 A（格式化→建挂载点→挂载→fstab）与选项 B（建挂载点→格式化→挂载→fstab）都是技术上完全可行的顺序，单选题出现双答案。若按\"分区→格式化→创建挂载点→挂载\"的常规教学顺序，A 更贴近；参考答案 B 亦可辩护但不唯一，建议改题消除歧义。", "d": 1}, {"k": "y25sec", "s": 185, "t": "单选", "q": "以下哪个命令用于查看现有分区？", "o": ["ls", "lsblk", "du", "free"], "a": "B", "n": "【答案正确】lsblk 以树状结构列出系统中所有块设备及其分区（含挂载点、大小、类型），是查看现有分区的标准命令，选 B。ls 只列目录内容，du 统计目录磁盘占用量，free 查看内存使用，均与分区无关（fdisk -l 也可查看分区信息，但不在选项中）。", "d": 0}, {"k": "y25sec", "s": 186, "t": "多选", "q": "以下哪些命令可以用于挂载或卸载磁盘到Linux系统？", "o": ["mount", "umount", "fsck", "mountpoint"], "a": "AB", "n": "【答案正确】挂载与卸载的标准命令是 mount 和 umount（A、B）。fsck 用于卸载状态下检查并修复文件系统，本身不执行挂载；mountpoint 只查询某路径是否为挂载点（判断性质），也不能执行挂载/卸载，故 C、D 排除。【术语提示】卸载时若提示 target is busy，可用 umount -l 或 lsof/fuser 查占用进程。", "d": 0}, {"k": "y25sec", "s": 187, "t": "多选", "q": "linux常见的文件系统有哪些", "o": ["Ext4", "NTFS", "FAT32", "DISK"], "a": "ABC", "n": "【概念争议】严格口径下 Linux 原生常见文件系统是 ext4（RHEL7 默认 xfs，另有 btrfs 等），NTFS 是 Windows 文件系统、FAT32 源自 DOS/Windows，Linux 需借助 ntfs-3g、vfat 驱动才能读写。题库按“Linux 支持使用的文件系统”宽松口径判 ABC，可辩护但欠严谨；DISK 根本不是文件系统，作为干扰项排除正确。应试时按题库口径记 ABC。", "d": 1}, {"k": "y25sec", "s": 188, "t": "多选", "q": "以下哪些命令可以用于查看磁盘分区表的信息？", "o": ["mount", "umount", "lsblk", "fdisk"], "a": "CD", "n": "lsblk 可列出块设备及其分区布局（盘/分区树、容量），fdisk -l 可查看分区表详情（MBR/GPT、各分区起止柱面与类型），均属查看分区信息；mount/umount 只负责挂载与卸载，不显示分区表。选 CD 正确。", "d": 0}, {"k": "y25sec", "s": 189, "t": "单选", "q": "逻辑卷是以下哪个概念的扩展？", "o": ["物理卷", "卷组", "文件系统", "磁盘"], "a": "A", "n": "【答案正确】物理卷（PV）对应实际磁盘/分区，容量固定、不能动态调整；LVM 将物理卷汇入卷组后划分出的逻辑卷（LV）可跨多块盘、支持在线扩缩容，本质上是对固定\"物理卷/传统分区\"这一存储单元概念的扩展与抽象，故选 A。卷组（B）是 LV 取用空间的上游来源而非\"被扩展\"的对象，文件系统（C）建立在 LV 之上，磁盘（D）是更底层的物理载体，均不符合题意。", "d": 0}, {"k": "y25sec", "s": 190, "t": "单选", "q": "在Linux系统中，创建逻辑卷的命令是？", "o": ["lvcreate", "vgcreate", "pvcreate", "fdisk"], "a": "A", "n": "【答案正确】创建逻辑卷的命令是 lvcreate，例如 `lvcreate -L 10G -n lv_data datavg`，选 A。LVM 的创建层次依次为 pvcreate（初始化物理卷）→ vgcreate（创建卷组）→ lvcreate（划分逻辑卷），vgcreate、pvcreate 都是上游步骤；fdisk 用于磁盘分区，与创建逻辑卷无直接关系。", "d": 0}, {"k": "y25sec", "s": 191, "t": "单选", "q": "如何扩展逻辑卷的容量？", "o": ["使用pvextend命令", "使用vgextend命令", "使用lvextend命令", "使用fdisk命令"], "a": "C", "n": "【答案正确】扩展逻辑卷用 lvextend，如 `lvextend -L +5G /dev/vg_data/lv_data`（之后需 xfs_growfs 或 resize2fs 扩展文件系统），选 C。pvextend 并不存在（调整 PV 用 pvresize）；vgextend 是向卷组添加新物理卷以增大存储池，不直接扩某逻辑卷；fdisk 与逻辑卷扩容无关。", "d": 0}, {"k": "y25sec", "s": 192, "t": "多选", "q": "以下哪些命令可以用于创建逻辑卷？", "o": ["lvcreate", "vgcreate", "pvcreate", "fdisk"], "a": "ABC", "n": "创建逻辑卷需按 LVM 完整链路：pvcreate 建物理卷、vgcreate 建卷组、lvcreate 在卷组上建逻辑卷，三者缺一不可；fdisk 只做传统磁盘分区，不参与逻辑卷创建。选 ABC 正确。", "d": 0}, {"k": "y25sec", "s": 193, "t": "多选", "q": "下列哪些操作可以用于管理逻辑卷的容量？", "o": ["lvextend", "vgextend", "pvextend", "lvreduce"], "a": "AD", "n": "A lvextend 用于对逻辑卷扩容、D lvreduce 用于缩减逻辑卷容量，均属 LV 容量管理，AD 正确；B vgextend 是向卷组追加物理卷，扩的是卷组容量而非单个逻辑卷；C pvextend 命令不存在，调整物理卷大小实际用 pvresize。", "d": 0}, {"k": "y25sec", "s": 194, "t": "多选", "q": "创建逻辑卷时，可以指定的参数包括：", "o": ["逻辑卷名称", "逻辑卷大小", "逻辑卷路径", "逻辑卷权限"], "a": "AB", "n": "lvcreate 创建时用 -n 指定逻辑卷名称、-L/-l 指定大小，AB 正确；逻辑卷路径由 /dev/卷组名/逻辑卷名 自动生成，创建时不能指定；逻辑卷也没有创建时设置的“权限”参数（只读属性属事后 lvchange 调整）。", "d": 0}, {"k": "y25sec", "s": 195, "t": "单选", "q": "在Linux系统中，下列哪个命令可以用于将本地目录与远程目录同步？", "o": ["rsync", "scp", "ftp", "wget"], "a": "A", "n": "【答案正确】rsync 采用增量传输算法，可通过 ssh 通道（rsync -av /src/ user@host:/dst/）实现本地目录与远程目录的差异同步与镜像，选 A。scp 只做整份复制、不做增量同步；ftp 需要专门服务且无同步语义；wget 用于下载网络资源，均不符。", "d": 0}, {"k": "y25sec", "s": 196, "t": "单选", "q": "下列哪个选项是rsync命令的常用参数，用于保持备份文件的权限和属性不变？", "o": ["【-a】", "【-r】", "【-l】", "【-p】"], "a": "A", "n": "【答案正确】rsync 的 -a（--archive）归档模式等价于 -rlptgoD，递归传输并保留权限、属主/属组、时间戳、符号链接及设备文件等全部属性，是\"保持备份文件权限和属性不变\"的标准参数，选 A。-r 仅保证递归复制，-l 只保留符号链接，-p 只覆盖权限一项，均不完整。", "d": 0}, {"k": "y25sec", "s": 197, "t": "单选", "q": "在使用rsync命令进行备份时，下列哪个选项可以排除指定的文件或目录？", "o": ["【--delete】", "【--include】", "【--exclude】", "【--verbose】"], "a": "C", "n": "【答案正确】`rsync --exclude=模式`（可多次使用，或用 --exclude-from=文件）在同步/备份时排除指定的文件或目录，选 C。--include 作用相反，用于指定必传内容（须与 --exclude 配合调整规则顺序）；--delete 是删除目标端多余文件以保持完全镜像，--verbose 仅控制输出详细程度。", "d": 0}, {"k": "y25sec", "s": 198, "t": "多选", "q": "rsync命令可以用于哪些操作？", "o": ["远程备份", "文件同步", "数据压缩", "文件加密"], "a": "AB", "n": "rsync 的定位就是远程备份与文件同步（基于增量传输算法），AB 正确；-z 仅在传输过程中临时压缩、到达对端即解压，不算独立的数据压缩用途；rsync 自身不提供加密，加密依赖 ssh 隧道承载，故 C、D 不选。", "d": 0}, {"k": "y25sec", "s": 199, "t": "多选", "q": "在使用rsync命令进行备份时，下列哪些选项可以保持备份文件的权限和属性不变？", "o": ["【-a】", "【-r】", "【-l】", "【-p】"], "a": "AD", "n": "-a 归档模式等价于 -rlptgoD，可完整保留权限、属主、时间戳等属性；-p 专用于保留权限，二者均满足“保持权限和属性不变”。-r 仅递归复制、-l 仅保留符号链接，都不保权限。选 AD 正确。", "d": 0}, {"k": "y25sec", "s": 200, "t": "多选", "q": "rsync命令的哪些选项可以用于排除指定的文件或目录？", "o": ["【--exclude】", "【--include】", "【--delete】", "【--verbose】"], "a": "A", "n": "【已修正答案】平台原答案 AC 有误（平台答案系 AI 生成、仅供参考），已按核验改为 A。rsync 中排除指定文件或目录的选项只有 --exclude；--include 是反向的“仅包含”匹配模式而非排除；--delete 是删除接收端存在而源端没有的多余文件、使两端一致，属同步删除行为，与“排除”无关；--verbose 只控制输出详细程度。正确集合仅 A。", "d": 2}, {"k": "y25sec", "s": 201, "t": "单选", "q": "SSH服务是用于实现什么功能的？", "o": ["远程登录和文件传输", "数据加密和安全通信", "网络管理和监控", "数据备份和恢复"], "a": "A", "n": "【答案正确】SSH（Secure Shell）的核心用途是加密的远程登录（ssh 命令获取远程 shell），并延伸出 scp、sftp 等安全文件传输方式，A 概括最准确。B\"数据加密和安全通信\"是 SSH 的实现手段与安全特性而非功能定位；C 网络管理和监控、D 数据备份和恢复分别是 SNMP 类工具和备份软件的职责，均非 SSH 的本来用途。", "d": 0}, {"k": "y25sec", "s": 202, "t": "单选", "q": "下列哪个选项是配置SSH服务的默认端口号？", "o": ["20", "22", "23", "80"], "a": "B", "n": "【已修正答案】平台原答案 A 有误（平台答案系 AI 生成、仅供参考），已按核验改为 B。sshd 服务默认监听 TCP 22 端口（/etc/ssh/sshd_config 中 Port 22），本题答案应为 B。选项 A 的 20 是 FTP 数据端口，23 是 Telnet 默认端口，80 是 HTTP；参考答案 A（20）混淆了 FTP 数据端口与 SSH 端口。", "d": 2}, {"k": "y25sec", "s": 203, "t": "单选", "q": "使用SSH客户端进行远程登录时，正确的命令是什么？", "o": ["ssh-login", "ssh-connect", "ssh-remote", "ssh"], "a": "D", "n": "【答案正确】SSH 远程登录直接执行 `ssh 用户名@主机 [-p 端口]`，ssh 本身就是 OpenSSH 客户端命令，选 D。ssh-login、ssh-connect、ssh-remote 都是把常见英文动词拼在 ssh 后虚构出来的命令，Linux/OpenSSH 中并不存在。", "d": 0}, {"k": "y25sec", "s": 204, "t": "多选", "q": "SSH服务的优点包括哪些？", "o": ["数据加密传输", "跨平台支持", "安全远程登录", "高速文件传输"], "a": "ABC", "n": "SSH 传输数据全程加密（防窃听篡改）、提供安全远程登录替代 telnet、且 Linux/Windows/macOS 均有客户端与服务端实现，ABC 成立；“高速文件传输”并非 SSH 的定位，经其加密的 scp/sftp 反而有一定性能开销，D 不选。", "d": 0}, {"k": "y25sec", "s": 205, "t": "多选", "q": "在配置SSH服务时，以下哪些配置选项可以提高安全性？", "o": ["禁用root用户远程登录", "使用公钥认证", "设置复杂的密码策略", "开启SSH服务器的调试模式"
