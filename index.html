<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fd6">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>信创理论题库刷题</title>
<style>
  :root{ --blue:#2f6fd6; --blue-d:#24529f; --blue-l:#eaf1fc; --green:#1e9e58; --green-l:#e6f6ee;
         --red:#d64545; --red-l:#fdeeee; --amber:#e8990c; --amber-l:#fdf3e0;
         --bg:#f1f3f8; --card:#fff; --line:#e4e8f0; --soft:#f8fafd; --field:#f8fafd; --soft2:#edf1f7;
         --text:#232a3b; --muted:#7c8597; }
  body.dark{ --bg:#10141d; --card:#1a2233; --line:#2a3450; --soft:#202a3d; --field:#202a3d; --soft2:#232c40;
             --text:#e7ecf6; --muted:#92a0b8; --blue:#4b8bf5; --blue-d:#8db3f9; --blue-l:#1d2c4d;
             --green:#37b573; --green-l:#173429; --red:#e05c5c; --red-l:#3a1d1d;
             --amber:#e8a53a; --amber-l:#3a2d13; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  .opt,.btn,.star,.seg,.tab-item,.chin,.hbtn{ touch-action:manipulation; }
  body{ margin:0; background:var(--bg); color:var(--text); font-size:15px; padding-bottom:env(safe-area-inset-bottom);
        font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        transition:background .2s,color .2s; }
  button{ font-family:inherit; }

  /* ===== 顶部 ===== */
  .topwrap{ position:sticky; top:0; z-index:20; box-shadow:0 1px 8px rgba(24,44,90,.10); }
  .appbar{ display:flex; align-items:center; gap:10px; padding:10px 14px;
           background:linear-gradient(135deg,#2f6fd6,#4b8bf5 70%,#5f9bff); color:#fff; }
  .brand{ font-weight:800; font-size:16.5px; letter-spacing:.5px; display:flex; align-items:center; gap:7px; }
  .brand .logo{ width:24px; height:24px; border-radius:7px; background:rgba(255,255,255,.22);
                display:flex; align-items:center; justify-content:center; font-size:14px; }
  .appactions{ margin-left:auto; display:flex; gap:8px; }
  .hbtn{ position:relative; border:none; background:rgba(255,255,255,.18); color:#fff; border-radius:10px;
         padding:7px 11px; font-size:14px; cursor:pointer; }
  .hbtn .bub{ background:#fff; color:var(--blue-d); border-radius:999px; font-weight:800; font-size:12px;
              padding:0 6px; margin-left:4px; }
  body.dark .hbtn{ color:#fff; }
  .toolbar{ background:var(--card); padding:9px 12px 10px; transition:background .2s; }
  .seg{ display:flex; background:var(--soft2); border-radius:11px; padding:3px; gap:2px; }
  .seg button{ flex:1; border:none; background:transparent; padding:8px 2px; border-radius:9px;
               font-size:14px; color:var(--muted); cursor:pointer; font-weight:600; }
  .seg button.on{ background:var(--card); color:var(--blue-d); box-shadow:0 1px 4px rgba(24,44,90,.14); }
  body.dark .seg button.on{ background:var(--soft); }
  .picks{ display:flex; gap:7px; margin-top:8px; }
  .selwrap{ position:relative; }
  .selwrap::after{ content:'▾'; position:absolute; right:9px; top:50%; transform:translateY(-54%);
                   color:var(--muted); font-size:12px; pointer-events:none; }
  select{ appearance:none; -webkit-appearance:none; border:1px solid var(--line); background:var(--field);
          border-radius:10px; padding:9px 24px 9px 10px; font-size:14px; color:var(--text); max-width:220px;
          outline:none; }
  select:focus{ border-color:var(--blue); }
  .searchwrap{ flex:1; position:relative; }
  .searchwrap::before{ content:'🔍'; position:absolute; left:9px; top:50%; transform:translateY(-52%); font-size:12px; opacity:.7; }
  .searchwrap input{ width:100%; border:1px solid var(--line); background:var(--field); border-radius:10px;
                     padding:9px 10px 9px 29px; font-size:16px; color:var(--text); outline:none; min-width:0; }
  .searchwrap input:focus{ border-color:var(--blue); }
  .gbarw{ margin-top:9px; display:flex; align-items:center; gap:8px; }
  .gtrack{ flex:1; height:5px; background:var(--soft2); border-radius:99px; overflow:hidden; }
  .gbar{ height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--amber)); border-radius:99px; transition:width .25s; }
  #gpText{ font-size:12px; color:var(--muted); white-space:nowrap; }

  /* ===== 主体 ===== */
  .wrap{ max-width:820px; margin:0 auto; padding:10px 12px calc(86px + env(safe-area-inset-bottom)); }
  @media (min-width:641px){ .wrap{ padding-bottom:20px; } }
  .stats{ display:flex; flex-wrap:wrap; gap:5px 6px; align-items:center; margin:2px 2px 9px;
          color:var(--muted); font-size:13px; }
  .statchip{ display:inline-flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--line);
             border-radius:999px; padding:3px 10px; font-size:12.5px; color:var(--muted); }
  .statchip b{ color:var(--text); }
  .statchip.hero{ background:var(--blue-l); border-color:#d7e4fa; color:var(--blue-d); font-weight:600; }
  body.dark .statchip.hero{ border-color:#2c3f68; }
  .statchip.link{ cursor:pointer; }
  .statchip.link:active{ border-color:var(--blue); }
  .statchip.cta{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
         box-shadow:0 1px 3px rgba(20,40,80,.05); }
  .meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px; }
  .chin{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; }
  .chin.bank{ background:var(--blue-l); color:var(--blue-d); font-weight:600; }
  .chin.gray{ background:var(--soft2); color:var(--muted); }
  .chin.fixed{ background:var(--green-l); color:var(--green); font-weight:600; }
  .chin.warn{ background:var(--amber-l); color:var(--amber); font-weight:600; }
  .star{ font-size:21px; cursor:pointer; color:#c6ccda; background:none; border:none; padding:0 4px; line-height:1; }
  .star.on{ color:#f5b301; }
  .stem{ font-weight:650; font-size:16px; line-height:1.7; white-space:pre-wrap; }
  .opts{ display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .opt{ display:flex; gap:10px; align-items:flex-start; padding:12px 13px; border:1.5px solid var(--line);
        border-radius:12px; cursor:pointer; background:var(--soft); line-height:1.55; font-size:15px; text-align:left; }
  .opt .letter{ font-weight:800; color:var(--blue-d); min-width:18px; }
  .opt.sel{ border-color:var(--blue); background:var(--blue-l); }
  .opt.ok{ border-color:var(--green); background:var(--green-l); } .opt.ok .letter{ color:var(--green); }
  .opt.bad{ border-color:var(--red); background:var(--red-l); } .opt.bad .letter{ color:var(--red); }
  .locked .opt{ cursor:default; }
  .verdict{ margin-top:13px; padding:11px 13px; border-radius:11px; font-weight:700; }
  .verdict.ok{ background:var(--green-l); color:var(--green); }
  .verdict.bad{ background:var(--red-l); color:var(--red); }
  .why{ margin-top:10px; padding:12px 14px; border-radius:11px; background:var(--soft2); color:#3a4358;
        line-height:1.75; font-size:14px; white-space:pre-wrap; }
  body.dark .why{ color:#c6d0e0; }
  .multi-note{ margin-top:10px; color:var(--muted); font-size:13px; }
  .bigcta{ width:100%; margin-top:13px; padding:13px; font-size:16px; }
  .nav{ margin:14px 0 4px; }
  .navbtns{ display:flex; gap:10px; }
  .navbtns .btn{ flex:1; }
  .jrow{ display:flex; gap:6px; align-items:center; justify-content:center; color:var(--muted);
         font-size:13px; margin-top:10px; }
  .nav input[type=number]{ width:74px; font-size:16px; padding:8px; border:1px solid var(--line);
                           border-radius:10px; outline:none; background:var(--field); color:var(--text); }
  .nav input[type=number]:focus{ border-color:var(--blue); }
  .btn{ padding:10px 14px; border:1px solid var(--line); border-radius:11px; background:var(--card); cursor:pointer;
        font-size:14.5px; color:var(--text); }
  .btn:hover{ border-color:var(--blue); }
  .btn.primary{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:650; }
  .btn.danger{ color:var(--red); border-color:#f2caca; }
  body.dark .btn.danger{ border-color:#4a2530; }
  .btn:disabled{ opacity:.4; cursor:default; }

  /* ===== 底部标签栏（手机） ===== */
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:space-around;
           background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line);
           padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
  body.dark .tabbar{ background:rgba(16,20,29,.96); }
  .tab-item{ flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center;
             gap:2px; font-size:11.5px; color:var(--muted); cursor:pointer; padding:4px 0; border-radius:10px;
             position:relative; }
  .tab-item .ic{ font-size:19px; line-height:1; }
  .tab-item.on{ color:var(--blue-d); font-weight:700; }
  body.dark .tab-item.on{ color:var(--blue); }
  .tbub{ position:absolute; top:-2px; left:calc(50% + 6px); background:var(--red); color:#fff; font-size:10.5px;
         font-weight:800; border-radius:999px; padding:1px 5.5px; line-height:1.5; }
  .tbub.amber{ background:var(--amber); }
  .tbub.zero{ display:none; }

  /* ===== 抽屉 ===== */
  .mask{ position:fixed; inset:0; background:rgba(15,25,48,.48); z-index:40; display:none; }
  .mask.open{ display:block; }
  .panel{ position:absolute; left:0; right:0; bottom:0; max-height:88%; background:var(--bg);
          border-radius:18px 18px 0 0; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom);
          animation:up .18s ease; }
  @keyframes up{ from{ transform:translateY(40px); opacity:.4; } to{ transform:none; opacity:1; } }
  .grab{ width:42px; height:4.5px; border-radius:99px; background:var(--muted); opacity:.5; margin:9px auto 2px; }
  .phead{ display:flex; align-items:center; gap:8px; padding:6px 14px 10px; flex-wrap:wrap; }
  .phead .ttl{ font-size:16.5px; font-weight:800; display:flex; align-items:center; gap:7px; }
  .phead .cnt{ background:var(--blue-l); color:var(--blue-d); border-radius:999px; font-size:12.5px;
               font-weight:800; padding:2px 9px; }
  .phead .sp{ flex:1; }
  .pbody{ overflow:auto; padding:2px 12px calc(14px + env(safe-area-inset-bottom)); }
  .pgroup{ margin:10px 4px 3px; color:var(--muted); font-size:12.5px; font-weight:700;
           display:flex; align-items:center; gap:6px; }
  .pgroup::after{ content:''; flex:1; height:1px; background:var(--line); }
  .item{ display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line);
         border-radius:13px; padding:12px 12px; margin:7px 1px; cursor:pointer; }
  .item[data-kind="wrong"]{ border-left:4px solid var(--red); }
  .item[data-kind="star"]{ border-left:4px solid var(--amber); }
  .item .info{ flex:1; min-width:0; }
  .item .meta{ color:var(--muted); font-size:12px; margin-bottom:3px; }
  .item .t{ font-size:14px; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .iwbtn{ flex:none; border:none; background:var(--red-l); color:var(--red); border-radius:9px;
          padding:7px 9px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .item[data-kind="star"] .iwbtn{ background:var(--amber-l); color:var(--amber); }
  .two{ display:flex; gap:8px; margin-top:2px; }
  .two .btn{ flex:1; }
  .chips{ display:flex; flex-direction:column; gap:2px; padding:2px 4px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 6px;
        border-bottom:1px solid var(--line); font-size:15px; }
  .row:last-child{ border-bottom:none; }
  .row .hint{ display:block; color:var(--muted); font-size:12.5px; margin-top:3px; font-weight:400; }
  .sw{ position:relative; width:46px; height:27px; flex:none; }
  .sw input{ opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; z-index:2; }
  .sw .kn{ position:absolute; inset:0; background:var(--muted); opacity:.65; border-radius:99px; transition:.15s; }
  .sw .kn::after{ content:''; position:absolute; top:3px; left:3px; width:21px; height:21px; background:var(--card);
                  border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .sw input:checked + .kn{ background:var(--green); opacity:1; }
  .sw input:checked + .kn::after{ left:22px; }
  .psec{ color:var(--muted); font-size:12.5px; font-weight:700; margin:12px 4px 7px; }
  .szchips{ display:flex; gap:7px; flex-wrap:wrap; padding:0 4px; }
  .szchips button{ border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px;
                   padding:8px 14px; font-size:14px; cursor:pointer; }
  .szchips button.on{ border-color:var(--blue); background:var(--blue-l); color:var(--blue-d); font-weight:700; }
  .statcard{ background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px 14px; margin:8px 1px; }
  .statcard .nm{ font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; }
  .statcard .nm span{ color:var(--muted); font-weight:500; font-size:12.5px; }
  .sbar{ height:7px; background:var(--soft2); border-radius:99px; margin-top:9px; overflow:hidden; }
  .sbar i{ display:block; height:100%; border-radius:99px; }
  .sbar.done i{ background:var(--blue); } .sbar.acc i{ background:var(--green); }
  .srow{ display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-top:5px; }
  .srow .lbl{ width:30px; flex:none; }
  .srow .acc-t{ width:78px; flex:none; text-align:right; }
  .srow .sbar{ flex:1; margin:0; }
  .bchart{ display:flex; align-items:flex-end; gap:6px; height:96px; padding-top:6px; }
  .bcol{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
  .bcol .bb{ width:100%; max-width:34px; border-radius:5px 5px 2px 2px; background:var(--blue); opacity:.85; min-height:2px; }
  .bcol .bl{ font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .bcol .bv{ font-size:11px; font-weight:700; color:var(--text); }
  .result-card{ text-align:center; padding:8px 4px 4px; }
  .result-big{ font-size:46px; font-weight:800; color:var(--blue-d); margin:6px 0 2px; }
  .result-detail{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 16px; }
  .rd-item{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:11px 6px; }
  .rd-item b{ display:block; font-size:19px; font-weight:700; }
  .rd-item span{ font-size:12px; color:var(--muted); }
  .r-ok{ color:var(--green) !important; } .r-bad{ color:var(--red) !important; }
  .gridcells{ display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr)); gap:8px; }
  .gcell{ border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px;
          padding:10px 0; font-size:13.5px; font-weight:600; cursor:pointer; position:relative; }
  .gcell.ok{ background:var(--green-l); border-color:var(--green); color:var(--green); }
  .gcell.bad{ background:var(--red-l); border-color:var(--red); color:var(--red); }
  .gcell.cur{ outline:2.5px solid var(--blue); outline-offset:1px; }
  .gcell .stmark{ position:absolute; top:1px; right:3px; font-size:9px; }
  .glegend{ display:flex; gap:13px; margin-top:12px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .glegend i{ display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .empty-big{ text-align:center; padding:44px 10px 30px; color:var(--muted); }
  .empty-big .em{ font-size:44px; display:block; margin-bottom:10px; }
  @media (min-width:641px){
    .tabbar{ display:none; }
    .wrap{ padding-bottom:20px; }
    .panel{ left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%); width:680px;
            max-height:84%; border-radius:16px; padding-bottom:14px; animation:pop .15s ease; }
    @keyframes pop{ from{ transform:translate(-50%,-48%); opacity:.35; } to{ transform:translate(-50%,-50%); opacity:1; } }
    .grab{ display:none; }
  }
  @media (max-width:640px){
    .appbar{ padding:9px 12px; }
    .toolbar{ padding:9px 10px 10px; }
    .picks select{ max-width:none; }
    .picks .selwrap{ flex:1.35; } .picks .selwrap:nth-child(2){ flex:1; }
    .stem{ font-size:16px; }
  }
</style>
</head>
<body>

<header class="topwrap">
  <div class="appbar">
    <div class="brand"><span class="logo">📘</span>信创理论题库</div>
    <div class="appactions">
      <button class="hbtn" id="hStar">⭐<span class="bub" id="hStarN">0</span></button>
      <button class="hbtn" id="hWrong">📕<span class="bub" id="hWrongN">0</span></button>
      <button class="hbtn" id="hSet">⚙️</button>
    </div>
  </div>
  <div class="toolbar">
    <div class="seg" id="modeSeg">
      <button data-m="seq">顺序</button>
      <button data-m="random">随机</button>
      <button data-m="wrong">错题</button>
      <button data-m="star">收藏</button>
    </div>
    <div class="picks">
      <div class="selwrap"><select id="bankSel"></select></div>
      <div class="selwrap"><select id="typeSel">
        <option value="all">全部题型</option><option value="单选">单选题</option>
        <option value="多选">多选题</option><option value="判断">判断题</option>
      </select></div>
      <div class="searchwrap"><input id="search" type="search" placeholder="搜题干 / 选项关键词"></div>
    </div>
    <div class="gbarw"><div class="gtrack"><div class="gbar" id="gBar"></div></div><span id="gpText"></span></div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="card" id="card"></div>
  <div class="nav">
    <div class="navbtns">
      <button class="btn" id="prevBtn">← 上一题</button>
      <button class="btn primary" id="nextBtn">下一题 →</button>
    </div>
    <div class="jrow">跳到第 <input type="number" id="jumpNo" min="1"> 题 <button class="btn" id="jumpBtn">跳转</button></div>
  </div>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab-item on" data-tab="quiz"><span class="ic">📖</span>刷题</button>
  <button class="tab-item" data-tab="wrong"><span class="ic">📕</span>错题本<span class="tbub" id="nWrong">0</span></button>
  <button class="tab-item" data-tab="star"><span class="ic">⭐</span>收藏集<span class="tbub amber" id="nStar">0</span></button>
  <button class="tab-item" data-tab="set"><span class="ic">⚙️</span>设置</button>
</nav>

<div class="mask" id="sheetWrong">
  <div class="panel">
    <div class="grab"></div>
    <div class="phead">
      <span class="ttl">📕 错题集 <span class="cnt" id="wHeadN">0</span></span><span class="sp"></span>
      <button class="btn" id="wClose">✕ 关闭</button>
    </div>
    <div class="pbody">
      <div class="two">
        <button class="btn primary" id="wRetry">▶ 一键重刷全部错题</button>
        <button class="btn danger" id="wClear">清空错题</button>
      </div>
      <div id="wList"></div>
    </div>
  </div>
</div>

<div class="mask" id="sheetStar">
  <div class="panel">
    <div class="grab"></div>
    <div class="phead">
      <span class="ttl">⭐ 收藏集 <span class="cnt" id="sHeadN">0</span></span><span class="sp"></span>
      <button class="btn" id="sClose">✕ 关闭</button>
    </div>
    <div class="pbody">
      <div class="two">
        <button class="btn primary" id="sRetry">▶ 一键重刷全部收藏</button>
        <button class="btn danger" id="sClear">清空收藏</button>
      </div>
      <div id="sList"></div>
    </div>
  </div>
</div>

<div class="mask" id="sheetSet">
  <div class="panel">
    <div class="grab"></div>
    <div class="phead"><span class="ttl">⚙️ 设置</span><span class="sp"></span>
      <button class="btn" id="setClose">✕ 关闭</button></div>
    <div class="pbody">
      <div class="psec">每组题量（刷完自动出成绩单）</div>
      <div class="szchips" id="sizeChips">
        <button data-s="10">10 题</button><button data-s="20">20 题</button>
        <button data-s="30">30 题</button><button data-s="50">50 题</button>
        <button data-s="0">不限</button>
      </div>

<script>
const RAW = [{"k": "y26", "s": 1, "t": "单选", "q": "写出银河麒麟服务器操作系统中的命令：在当前目录及其子目录所有的.cpp文件中查找串\"example\"，不区分大小写。（）", "o": ["grep -i \"example\" ./*.cpp", "grep -v \"example\" ./*.cpp", "grep -i -v \"example\" ./*.cpp", "grep -i -r \"example\" ./*.cpp"], "a": "D", "n": "【答案正确】-i 忽略大小写、-r 递归子目录，四个选项中仅 D 同时具备两者；A 缺 -r，B/C 的 -v 是反向匹配（输出不含 example 的行），方向反了。【题目缺陷】严格说 -r 只对目录参数生效，“./*.cpp”展开成普通文件后不会进入子目录，规范写法是 grep -i -r \"example\" . 或配合 find，但按选项意图判 D 无异议。", "d": 0}, {"k": "y26", "s": 2, "t": "单选", "q": "创建raid10最少需要几块硬盘？", "o": ["2", "3", "4", "5"], "a": "C", "n": "【答案正确】RAID10=先镜像(RAID1)再条带(RAID0)，每组镜像2块、至少2组，最少4块。2块只能做RAID1，3块组不成完整的两组镜像，5块可用但非最小值。", "d": 0}, {"k": "y26", "s": 3, "t": "单选", "q": "创建raid5最少需要几块硬盘？", "o": ["2", "3", "4", "5"], "a": "B", "n": "【答案正确】RAID5 采用分布式奇偶校验，n块中相当于1块容量存校验，最少3块（2份数据+1份校验）即可容忍1块盘故障；2块无法构成RAID5，4/5块可用但非“最少”。", "d": 0}, {"k": "y26", "s": 4, "t": "单选", "q": "执行vim a.txt，在另一个终端中查询该进程pid为78513，执行kill -20 78513后进程挂起，请问要将该进程重新调回前台执行，应该执行哪个命令？", "o": ["fg", "bg", "ctrl+c", "ctrl+z"], "a": "A", "n": "【答案正确】信号20即 SIGTSTP，作用等同 Ctrl+Z，使进程进入停止（挂起）态；fg 把停止的作业调回前台继续运行。bg 是让它在后台继续跑而非回前台，Ctrl+C 直接终止，Ctrl+Z 是再挂起一次。注意 fg 需在启动该作业的原终端中执行（可用 fg 作业号）。", "d": 0}, {"k": "y26", "s": 5, "t": "单选", "q": "执行echo 3 > /proc/sys/vm/drop_caches，以下哪种描述是正确的？", "o": ["释放页面缓存", "释放目录缓存", "释放所有缓存", "以上内容均不对"], "a": "C", "n": "【答案正确】向 /proc/sys/vm/drop_caches 写值：1=仅释放页缓存(pagecache)，2=释放目录项(dentries)和 inode 缓存，3=1+2 全部释放，即“释放所有缓存”。A 对应1、B 对应2，均不完整，D 错。实操时常先 sync 清脏页。", "d": 0}, {"k": "y26", "s": 6, "t": "单选", "q": "执行ps aux有如下回显\nUSER         PID %CPU %MEM    VSZ   RSS TTY      STAT START   TIME COMMAND\n#省略部分信息\n请问执行ps aux | sort -k3nr | head -10将得到", "o": ["CPU占用前10的进程", "CPU占用后10的进程", "内存占用前10的进程", "内存占用后10的进程"], "a": "A", "n": "【答案正确】ps aux 输出第3列是 %CPU，sort -k3nr 按第3列数值(-n)降序(-r)排序，head -10 取最高者，即 CPU 占用前10的进程。%MEM 是第4列，内存前10应写 -k4nr；取“后10”则需升序，B 不符。", "d": 0}, {"k": "y26", "s": 7, "t": "单选", "q": "父进程退出后，子进程还在运行，这类进程被称为", "o": ["孤儿进程", "僵尸进程", "守护进程", "以上内容均不对"], "a": "A", "n": "【答案正确】父进程先退出、子进程仍在运行并被 systemd/init(PID 1) 收养的进程称孤儿进程。僵尸进程是子进程已终止但父进程尚未读取其退出状态（Z 状态）；守护进程是脱离终端长期后台运行的服务进程，三者概念不能混。", "d": 0}, {"k": "y26", "s": 8, "t": "单选", "q": "“当前用户Shell类型”是哪个环境变量？", "o": ["HOSTNAME", "SHELL", "MAIL", "LANGUAGE"], "a": "B", "n": "【答案正确】$SHELL 记录用户登录 shell 的路径（如 /bin/bash）。HOSTNAME 是主机名、MAIL 是收件箱文件路径、LANGUAGE 是消息语言优先级，均与 shell 类型无关。", "d": 0}, {"k": "y26", "s": 9, "t": "单选", "q": "“基本提示符，对于root用户是#，对于普通用户是$”是在哪个环境变量中定义的？", "o": ["SHELL", "PS1", "MAIL", "LANGUAGE"], "a": "B", "n": "【答案正确】PS1 是一级（主）提示符变量，默认 root 为 #、普通用户为 $；PS2 为二级提示符（默认 >）。SHELL 是 shell 路径，MAIL、LANGUAGE 与提示符无关。", "d": 0}, {"k": "y26", "s": 10, "t": "单选", "q": "在 bash 中, 在一条命令后加入\"1>&2\"意味着", "o": ["标准错误输出重定向到标准输入", "标准输入重定向到标准错误输出", "标准输出重定向到标准错误输出", "标准输出重定向到标准输入"], "a": "C", "n": "【答案正确】文件描述符 0=stdin、1=stdout、2=stderr，n>&m 表示把 fd n 重定向到 fd m 当前的去向；1>&2 即标准输出重定向到标准错误输出，全程不涉及标准输入，故 A/B/D 均错。", "d": 0}, {"k": "y26", "s": 11, "t": "单选", "q": "执行ping命令后，系统给出的回显中，以下哪个指标是反映是否存在丢包情况的？", "o": ["icmp_seq", "ttl", "time", "以上都不是"], "a": "A", "n": "【答案正确】ping 回显的 icmp_seq 是 ICMP 序列号，序号缺号/断档即说明对应请求包丢失，用它判断丢包；ttl 是剩余跳数（可粗判经过路由数/对方系统），time 是往返时延，都不直接反映丢包。严格说回显末尾的 packet loss 统计行直接给出丢包率，但选项表中只有 icmp_seq 符合题意。", "d": 0}, {"k": "y26", "s": 12, "t": "单选", "q": "现要统计etc目录下占用存储空间最大的前十个文件和目录，以下哪个命令是正确的？", "o": ["du -sh /etc/* |sort -hr |head -10", "du -sh /etc/* |sort -r |head -10", "du -sh /etc/* |sort -h |head -10", "du -sh /etc/* |sort  |head -10"], "a": "A", "n": "【答案正确】du -sh /etc/* 输出各条目的人类可读大小，sort -h 能按 K/M/G 实际数值排序、-r 降序，head -10 即取最大前10项。缺 -h（B）会按字典序比较“10M\u003c9M”出错；缺 -r（C）是升序取最小；D 纯字典序完全不对。", "d": 0}, {"k": "y26", "s": 13, "t": "单选", "q": "使用rpm命令安装的软件包是什么包？（）", "o": [".rpm", ".tar.gz", ".deb", ".tar.bz2"], "a": "A", "n": "【答案正确】rpm 是 RHEL 系（含麒麟服务器版）的二进制包管理器，安装 .rpm 包。.deb 属 Debian/Ubuntu 系（如 UOS），.tar.gz/.tar.bz2 是压缩归档包，需解压/编译而非 rpm 安装。", "d": 0}, {"k": "y26", "s": 14, "t": "单选", "q": "打开Mate终端的快捷组合键是哪个", "o": ["Ctrl+Alt+T", "Ctrl+Shift", "Shift+Alt+W", "Ctrl+Enter"], "a": "A", "n": "【答案正确】银河麒麟桌面（UKUI）与 MATE 桌面默认打开终端的快捷键均为 Ctrl+Alt+T；其余组合均非默认打开终端的快捷键。", "d": 0}, {"k": "y26", "s": 15, "t": "单选", "q": "“决定了shell将到哪些目录中寻找命令或程序”是哪个环境变量？", "o": ["HOME", "LOGNAME", "PATH", "HISTSIZE"], "a": "C", "n": "【答案正确】PATH 是冒号分隔的目录列表，决定 shell 按何顺序到哪些目录查找命令/程序。HOME 是家目录、LOGNAME 是登录名、HISTSIZE 是历史命令保留条数，均不管命令查找。", "d": 0}, {"k": "y26", "s": 16, "t": "单选", "q": "“当前用户的登录名”是哪个环境变量？", "o": ["HOME", "PATH", "HISTSIZE", "LOGNAME"], "a": "D", "n": "【答案正确】LOGNAME（与 USER 等价）保存当前登录用户名。HOME 是家目录、PATH 是命令搜索路径、HISTSIZE 是历史条数，均非登录名。", "d": 0}, {"k": "y26", "s": 17, "t": "单选", "q": "以下哪个命令可以对文件demo.txt排序并去重？（）", "o": ["uniq demo.txt", "sort demo.txt", "uniq demo.txt |sort", "sort demo.txt |uniq"], "a": "D", "n": "【答案正确】uniq 只能合并“相邻”重复行，必须先排序：sort demo.txt | uniq 先排序使重复行相邻再去重。A 的 uniq 未排序去不干净；B 只排序未去重；C 先 uniq（未排序时基本无效）再 sort，顺序颠倒。", "d": 0}, {"k": "y26", "s": 18, "t": "单选", "q": "下列哪个命令能查找当前目录一个月（30天）以前大于100M的日志文件（.log）？（）", "o": ["find . -name \"*.log\" -m time +30 -type f -size +10", "find . -name \"*.log\" -mtime +30 -type f -size +100", "find . -name \"*.log\" -mtime +30 -type  -size +100M", "find . -name \"*.log\" -m time +30 -type -size +100M"], "a": "C", "n": "【答案存疑】【题目缺陷】平台答案 C 的意图正确，但选项 C 文本无法执行：-type 后漏了参数 f。正确命令应为 find . -name \"*.log\" -mtime +30 -type f -size +100M（-mtime +30=修改时间在30天前，-type f=普通文件，-size +100M=大于100M）。B 的 -size +100 漏单位 M，默认按512字节块计仅约50KB；A/D 的“-m time”被空格拆开属无效写法，D 还缺 -type 参数。四个选项均不严谨，C 是唯一接近意图的选项，练习时按正确写法记忆。", "d": 1}, {"k": "y26", "s": 19, "t": "单选", "q": "以下对硬盘的使用过程，不正确的是？（）", "o": ["及时对硬盘内容进行整理，包括目录的整理、文件的清理等", "控制环境温度，防止高温、潮湿和磁场的影响", "硬盘工作时搬动机器", "定期查杀病毒，防止计算机病毒对硬盘的破坏"], "a": "C", "n": "【答案正确】硬盘（尤其机械盘）工作时搬动机器易使磁头振动划伤盘片、损坏数据，是明确的错误操作；A 整理清理内容、B 控温防潮防磁、D 定期查毒都是正确的硬盘使用养护做法。", "d": 0}, {"k": "y26", "s": 20, "t": "单选", "q": "下列关于fstab文件描述正确的是？（）", "o": ["fstab文件只能描述属于银河麒麟服务器操作系统的文件系统", "CD_ROM和USB硬盘必须是自动加载的", "fstab文件中描述的文件系统不能被卸载", "系统启动时按fstab文件描述内容加载文件系统"], "a": "D", "n": "【答案正确】/etc/fstab 记录文件系统及挂载点/挂载选项，系统启动时（以及执行 mount -a 时）按其内容挂载。A 错——fstab 可描述任意类型文件系统；B 错——光驱/U盘可用 noauto 控制不必自动挂载；C 错——fstab 中的文件系统仍可 umount。", "d": 0}, {"k": "y26", "s": 21, "t": "单选", "q": "银河麒麟服务器操作系统中，有一个文件夹里面有若干文件，通常用哪个命令可以获取这个文件夹的大小？（）", "o": ["ls -h", "du -sh", "df -h", "fdish -h"], "a": "B", "n": "【答案正确】du -sh 目录 递归汇总该目录总占用空间并以人类可读单位显示。ls -h 只把大小单位变可读、不做汇总；df -h 面向文件系统/分区的容量使用率；“fdish”是错误拼写（fdisk 是分区工具，也不用于看目录大小）。", "d": 0}, {"k": "y26", "s": 22, "t": "单选", "q": "软件项目存储于/ftproot，用ls -l /ftproot，命令输出信息为：drwxr-xr-x    2 root root  4096 Nov 30 10:22 ftproot，该软件项目的维护由apache用户负责，下面哪个命令可以实现该需求？（）", "o": ["chown -R apache /ftproot", "chown -r apache /ftproot", "chgrp -R apache /ftproot", "chgrp -r apache /ftproot"], "a": "A", "n": "【答案正确】需求是把整个目录树的属主改为 apache 用户：chown -R apache /ftproot（-R 大写=递归）。chgrp 改的是属组、不符合“由 apache 用户负责”的题意；B/D 的小写 -r 不是 chown/chgrp 的递归选项。", "d": 0}, {"k": "y26", "s": 23, "t": "单选", "q": "银河麒麟服务器操作系统默认的文件系统格式是？", "o": ["FAT32", "ext3", "ext4", "xfs"], "a": "D", "n": "【答案正确】银河麒麟高级服务器操作系统 V10 与 RHEL/CentOS 8 同源，安装时 / 默认使用 xfs；ext4 是 openEuler 系及早年发行版的常见默认，ext3 是更早版本，FAT32 是 Windows 系文件系统。", "d": 0}, {"k": "y26", "s": 24, "t": "单选", "q": "假如你需要找出 /etc/mysql/my.cnf 文件属于哪个包 (package) ，你可以执行以下哪个命令？", "o": ["rpm -la /etc/mysql/my.conf", "rpm -aL /etc/mysql/my.conf", "rpm -qs /etc/mysql/my.conf", "rpm -qf /etc/mysql/my.conf"], "a": "D", "n": "【答案正确】rpm -qf 文件路径（query file owner）可按已安装文件反查其所属软件包。-q -l/-a 用于查询包的文件清单而非按文件反查，-qs 也不具备该功能。注意反查要求该文件确实由 rpm 包安装。", "d": 0}, {"k": "y26", "s": 25, "t": "单选", "q": "局域网的网络地址192.168.1.0/24，局域网络连接其它网络的网关地址是192.168.1.1，主机192.168.1.20 访问172.16.1.0/24 网络时，其路由设置正确的是", "o": ["route add –net 192.168.1.0 gw 192.168.1.1 netmask 255.255.255.0", "route add –net 172.16.1.0 gw 192.168.1.1 netmask 255.255.255.0", "route add –net 172.16.1.0 gw 172.16.1.1 netmask 255.255.255.0", "route add default 192.168.1.0 netmask 172.168.1.1"], "a": "B", "n": "【答案正确】目标网 172.16.1.0/24 非本机直连网段，须添加以它为目标、下一跳为本地网关 192.168.1.1 的路由，即 B。A 把目标写成自身所在网段属无意义路由；C 的网关 172.16.1.1 不在本机直连网段内不可达；D 语法完全错误。【题目缺陷】各选项中的“–”是长破折号（排版问题），实际命令应为半角连字符“-”，判卷不受影响。", "d": 0}, {"k": "y26", "s": 26, "t": "单选", "q": "下列提法中，不属于ifconfig 命令作用范围的是", "o": ["配置本地回环地址", "配置网卡的IP 地址", "激活网络适配器", "加载网卡到内核中"], "a": "D", "n": "【答案正确】网卡被内核识别取决于驱动模块，加载需 modprobe/insmod 或系统自动完成，不属 ifconfig 职责。ifconfig 可以配置回环地址(A)、配置网卡 IP(B)、up/down 激活网卡(C)。", "d": 0}, {"k": "y26", "s": 27, "t": "单选", "q": "下列文件中，哪个文件包含了主机名到IP 地址的映射关系？", "o": ["/etc/HOSTNAME", "/etc/hosts", "/etc/resolv.conf", "/etc/network/interfaces"], "a": "B", "n": "【答案正确】/etc/hosts 提供主机名到 IP 的静态映射（按 nsswitch.conf 的 hosts 顺序通常优先于 DNS）。/etc/resolv.conf 只指定 DNS 服务器；/etc/HOSTNAME（多数系统为 /etc/hostname）仅存本机主机名；/etc/network/interfaces 是 Debian 系网卡配置文件，均不提供映射关系。", "d": 0}, {"k": "y26", "s": 28, "t": "单选", "q": "你给单位的新同事添加一个用户账号，你起初指定他的账号在30天后过期，现在想改变这个过期时间，用下面哪个命令？", "o": ["usermod -a", "usermod -d", "usermod -x", "usermod -e"], "a": "D", "n": "【答案正确】usermod -e YYYY-MM-DD 修改账号过期日期（对应 /etc/shadow 第8字段，等价于 chage -E）。-a 须与 -G 连用追加附加组、-d 改家目录，usermod 没有 -x 选项。", "d": 0}, {"k": "y26", "s": 29, "t": "单选", "q": "系统中有用户user1和user2，主组同为users组。在user1 用户目录下有一文件file1，它拥有644 的权限，如果user2 用户想修改user1 用户目录下的file1 文件，应拥有什么权限?", "o": ["744", "664", "646", "746"], "a": "B", "n": "【答案正确】644=属主rw、组r、其他r；user2 与属主同属 users 组，要修改该文件需增加“组的写权限”，即 664（rw-rw-r--）。A(744)/D(746) 的组位仍是 r-- 无写权，C(646) 把写权给了“其他用户”而组内仍只读。严格说还需 user1 家目录对 user2 有可进入(x)权限，本题按权限位本身考查。", "d": 0}, {"k": "y26", "s": 30, "t": "单选", "q": "在/etc/passwd文件第一行“root:x:0:0:root:/root:/bin/bash”中“x”表示的是什么意思?", "o": ["权限", "密码", "用户标识符", "组标识符"], "a": "B", "n": "【答案正确】/etc/passwd 第2字段是口令占位符，“x”表示加密口令已移入 /etc/shadow（仅 root 可读），是占位标记而非密码本身，也不是 UID(GID)。", "d": 0}, {"k": "y26", "s": 31, "t": "单选", "q": "用ls -la命令输出的显示内容中有一行如：“-rw-r--r-- 1 root root 3106 10月 23 2015 .bashrc ”其中“-rw-r--r--”的第一位“-”表示什么？", "o": ["拥有者权限", "文件类型", "所属用户组权限", "其他用户权限"], "a": "B", "n": "【答案正确】ls 长格式首字符是文件类型：- 普通文件、d 目录、l 符号链接、b/c 块/字符设备；其后9位才依次是属主/属组/其他用户的 rwx 权限，故第一位不是权限位而是文件类型。", "d": 0}, {"k": "y26", "s": 32, "t": "单选", "q": "显示当前目录的命令是？", "o": ["cd", "pwd", "mkdir", "rmdir"], "a": "B", "n": "【答案正确】pwd（print working directory）输出当前工作目录绝对路径；cd 切换目录、mkdir 创建目录、rmdir 删除空目录。", "d": 0}, {"k": "y26", "s": 33, "t": "单选", "q": "新建一个空目录的命令是？", "o": ["cd", "pwd", "mkdir", "rmdir"], "a": "C", "n": "【答案正确】mkdir 新建（空）目录，常用 -p 递归创建多级；cd 切换、pwd 显示路径、rmdir 删除空目录。", "d": 0}, {"k": "y26", "s": 34, "t": "单选", "q": "如果要列出一个目录下的所有文件可以使用以下哪个命令？", "o": ["ls -l", "ls", "ls -a", "ls -d"], "a": "C", "n": "【答案正确】ls -a 列出全部文件，包括 . 开头的隐藏文件。-l 只是长格式（默认不含隐藏文件），无参数不含隐藏文件，-d 仅显示目录项本身不展开内容。", "d": 0}, {"k": "y26", "s": 35, "t": "单选", "q": "银河麒麟服务器操作系统文件权限一共10位长度，分成四段，第三段表示的内容是？", "o": ["文件类型", "文件所有者的权限", "文件所有者所在组的权限", "其他用户的权限"], "a": "C", "n": "【答案正确】10位权限按“1+3+3+3”分四段：第1段文件类型，第2段属主权限，第3段（第5-7位）属组权限，第4段其他用户权限，故第三段是所属组的权限，选 C。【解析表述有误】原解析中“第1段属主、第2段属组、第3段其他”一句与四段划分自相矛盾（那是按9位权限分三段说的），正确结论应以“第5-7位=属组权限”为准。", "d": 0}, {"k": "y26", "s": 36, "t": "单选", "q": "某文件的组外成员的权限为只读；所有者有全部权限；组内的权限为读与写，则该文件的权限是什么？", "o": ["467", "746", "476", "764"], "a": "D", "n": "【答案正确】数字权限按属主/属组/其他顺序排列：所有者全部权限7、组内读写6、组外只读4 → 764。B(746) 组无写、其他有写；C(476) 属主无写；A(467) 顺序全乱。", "d": 0}, {"k": "y26", "s": 37, "t": "单选", "q": "如果执行命令 #chmod 746 file.txt，执行后file.txt文件的权限是？", "o": ["rwxr--rw-", "rw-r--r--", "--xr--rwx", "rwxr--r--"], "a": "A", "n": "【答案正确】chmod 746 = 属主7(rwx)、属组4(r--)、其他6(rw-)，拼成 rwxr--rw- 即 A。B 是 644，C 是 147(--xr--rwx)，D 是 744，均与 746 不符。", "d": 0}, {"k": "y26", "s": 38, "t": "单选", "q": "为了找到文件try_grep中含有以a字母为行开头的内容，可以使用以下哪个命令？", "o": ["grep -E \"#$\" try_grep", "grep -E \"#a\" try_grep", "grep -E \"^$\" try_grep", "grep -E \"^a\" try_grep"], "a": "D", "n": "【答案正确】正则中 ^ 锚定行首、$ 锚定行尾，行首以字母 a 开头即 \"^a\"，grep -E \"^a\" try_grep 正确。A 是匹配以 # 结尾的行，B 匹配含“#a”的行，C 的 \"^$\" 只匹配空行。", "d": 0}, {"k": "y26", "s": 39, "t": "单选", "q": "如果你想列出当前目录以及子目录下所有扩展名为\".txt\"的文件，可以使用以下的哪个命令？", "o": ["find . -name \"*.txt\"", "ls *.txt", "find . \"*.txt\"", "ls -d *.txt"], "a": "A", "n": "【答案正确】find . -name \"*.txt\" 从当前目录递归查找所有 .txt 文件。ls 的通配符展开不进入子目录；C 的 find . \"*.txt\" 缺 -name（会被当作路径报错）；ls -d 只列目录项本身且不递归。", "d": 0}, {"k": "y26", "s": 40, "t": "单选", "q": "以下哪组命令全部是文件查找的命令？", "o": ["ls 、touch 、cp 、rm 、mv", "head 、more、 less、 tail", "which 、whereis 、locate、 find", "rm、 tail、 find、 more"], "a": "C", "n": "【答案正确】which（按 PATH 查命令）、whereis（查二进制/手册/源码位置）、locate（查文件名数据库）、find（磁盘遍历查找）都是查找类命令。A 组是文件操作（增删改），B 组是文本内容查看（head/more/less/tail），D 组混入 rm/tail/more 等非查找命令。", "d": 0}, {"k": "y26", "s": 41, "t": "单选", "q": "以下哪个命令可以查找命令scp的路径？", "o": ["apropos scp", "find scp", "where scp", "which scp"], "a": "D", "n": "【答案正确】which scp 按 PATH 定位 scp 可执行文件的绝对路径。apropos 是按关键字搜 man 手册主题；find scp 缺路径与判断条件（应为 find / -name scp）；where 不是麒麟系统的标准命令（仅 csh 等 shell 内建）。", "d": 0}, {"k": "y26", "s": 42, "t": "单选", "q": "以下哪个命令允许你使用加密通道登录到另一台计算机?", "o": ["telnet", "ssh", "rlogin", "ftp"], "a": "B", "n": "【答案正确】ssh 对认证和传输数据全程加密；telnet、rlogin 是明文终端登录协议，ftp 是明文文件传输，均无加密通道，口令可被嗅探。", "d": 0}, {"k": "y26", "s": 43, "t": "单选", "q": "执行find -newer file1 !file2命令的结果是什么？（）", "o": ["查找更改时间比文件file1新但比文件file2旧的文件", "查找更改时间比文件file1旧但比文件file2新的文件", "查找更改时间比文件file1旧且比文件file2旧的文件", "查找更改时间比文件file1新且比文件file2新的文件"], "a": "A", "n": "【答案存疑】【题目缺陷】平台答案 A 的语义判断正确，但题干命令写法有误：应为 find . -newer file1 ! -newer file2（! 后需空格，被否定的应是 -newer 判断），原文“!file2”会使 find 报非法表达式错误。其含义为“mtime 比 file1 新 且 不比 file2 新”，即比 file1 新、比（或等效于不晚于）file2 旧，对应描述 A。练习时按修正后的命令掌握。", "d": 1}, {"k": "y26", "s": 44, "t": "单选", "q": "在银河麒麟服务器操作系统上，下面哪个命令不可以用来查看文件内容？（）", "o": ["cat", "ls", "less", "more"], "a": "B", "n": "【答案正确】ls 输出的是目录条目（文件名列表及属性），不能显示文件正文；cat 直接输出全部内容，less/more 分页查看，都可查看文件内容。", "d": 0}, {"k": "y26", "s": 45, "t": "单选", "q": "用ls -al命令列出以下的文件列表，哪个文件是符号连接文件？（）", "o": ["-rw-rw-rw- 2 kylin users 56 9月 09 11:05 hello", "-rwxrwxrwx 2 kylin users 97 9月 09 14:05 check.sh", "drwxr--r-- 1 kylin users 1024 4月 03 14:05 jl", "lrwxr--r-- 1 kylin users 2024 7月 23 09:05 cheng &g"], "a": "D", "n": "【答案正确】ls 长格式首字符为文件类型，以 l 开头（lrwxr--r--）即符号链接，选 D。A/B 以 - 开头是普通文件，C 以 d 开头是目录；D 选项文件名“cheng &g”排版怪异不影响按首字符判型。", "d": 0}, {"k": "y26", "s": 46, "t": "单选", "q": "下面哪个命令可以统计一个文件中“麒麟”出现的行数？（）", "o": ["vim \"麒麟\" 文件名 | wc -l", "grep \"麒麟\" 文件名 | wc -l", "ls \"麒麟\"  | wc -l", "vim \"麒麟\" 文件名 | wc"], "a": "B", "n": "【答案正确】grep \"麒麟\" 文件名 输出含“麒麟”的行，管道给 wc -l 统计行数。vim 是交互式编辑器，不能以 A/D 那样接管道统计；ls 只列文件名不读文件内容。【术语提示】grep | wc -l 统计的是“包含该串的行数”（一行出现多次只计一行）；若要统计出现总次数应用 grep -o \"麒麟\" 文件 | wc -l。题干问行数，B 恰当。", "d": 0}, {"k": "y26", "s": 47, "t": "单选", "q": "使用什么命令进行查询，并不真正对硬盘上的文件系统进行查找，而是对文件名数据库进行检索，而且可以使用通配符?和* ？（）", "o": ["whereis", "find", "locate", "type"], "a": "C", "n": "【答案正确】locate 查询由 updatedb 预建的文件名数据库（mlocate.db），不做实时磁盘遍历、速度快，且模式本身支持 * 与 ? 通配（含通配的模式需引号防 shell 先展开）。whereis 只在固定目录找二进制/手册/源码；find 是实时遍历磁盘；type 用于判断命令类型。", "d": 0}, {"k": "y26", "s": 48, "t": "单选", "q": "银河麒麟服务器操作系统有多个文件目录，每个文件目录都有其独特的功能和作用，以下描述正确的是？（）", "o": ["/bin：必要的用户二进制可执行文件（部分用户使用）", "/usr：是文件系统的第二个主要部分，存放不可共享的只读数据", "/etc：存放系统配置文件", "/boot：系统启动时要用到的所有文件"], "a": "C", "n": "【答案正确】/etc 存放系统及服务的配置文件，描述准确。A 错——/bin 是全体用户可用的必要命令（非“部分用户使用”）；B 错——/usr 属可共享的只读数据，“不可共享”说法反了；D 的“所有文件”过于绝对，/boot 只存放启动所需文件（内核、initramfs、引导程序等）。C 是唯一准确描述。", "d": 0}, {"k": "y26", "s": 49, "t": "单选", "q": "在某特定文件夹内查找内容含有\"abc\"的文件，选出以下可以实现该功能的命令。（）", "o": ["find . -name abc", "grep \"abc\" *", "find -name \"abc\"", "whereis \"abc\""], "a": "B", "n": "【答案正确】题目要求按“文件内容”查找含 abc 的文件，grep \"abc\" * 在当前目录的文件中逐个检索内容，符合要求。A/C 的 find -name 按文件名匹配，D 的 whereis 只按名称在系统默认路径定位命令/源码/手册，均不查内容。注：grep 不带 -r 只搜当前目录一层，但与题干“某特定文件夹内”语义相符。", "d": 0}, {"k": "y26", "s": 50, "t": "单选", "q": "银河麒麟服务器操作系统中，想给文件start.sh设置权限为文件所有者可读可修改可执行，组内用户为可读可执行不可修改，其他用户没有任何权限，那么应使用以下哪个命令？（）", "o": ["chmod  706  start.sh", "chmod 750  start.sh", "chmod  705  start.sh", "chmod  760  start.sh"], "a": "B", "n": "【答案正确】所有者 rwx=7（可读可改可执行），组 r-x=5（可读可执行、不可写），其他=0 → 750。A(706) 其他用户有读写、C(705) 其他用户有读执行、D(760) 组用户可写，均不符。", "d": 0}, {"k": "y26", "s": 51, "t": "单选", "q": "chrony的服务端配置文件是", "o": ["chronyd", "chronyc", "Chrony.conf", "chrony.conf"], "a": "D", "n": "【答案正确】麒麟 V10（RHEL/openEuler 系）chrony 服务端主配置文件为 /etc/chrony.conf，全小写。chronyd 是守护进程、chronyc 是管理客户端命令；C 项 Chrony.conf 首字母大写，Linux 文件名区分大小写，与实际文件名不符。", "d": 0}, {"k": "y26", "s": 52, "t": "单选", "q": "在chrony的配置文件中哪个字段是用来定义允许的客户端信息的", "o": ["allow", "Allow", "keyfile", "allowclients"], "a": "A", "n": "【答案正确】chrony.conf 中 allow [主机/网段] 定义允许访问 NTP 服务的客户端（deny 则拒绝），不写 allow 默认拒绝所有。keyfile 指定认证密钥文件；Allow 首字母大写不是有效指令，chrony 指令区分大小写；allowclients 非配置关键字。", "d": 0}, {"k": "y26", "s": 53, "t": "单选", "q": "查看与设置时区的命令是", "o": ["timedatectl", "date", "set-time", "uptime"], "a": "A", "n": "【答案正确】timedatectl 可查看时间/时区状态，timedatectl set-timezone 设置时区、set-ntp 控制同步。date 只能显示/设置系统时间，不管理时区；uptime 显示开机时长与负载。【术语提示】set-time 并非完全“非标准命令”，它是 timedatectl 的子命令（timedatectl set-time），但确实不是独立的时区管理命令，不影响 A 为正确答案。", "d": 0}, {"k": "y26", "s": 54, "t": "单选", "q": "在使用mount挂载nfs共享时，nfs的文件系统类型为？", "o": ["ext3", "xfs", "glusterfs", "nfs"], "a": "D", "n": "【答案正确】挂载 NFS 共享用集群标准类型 nfs：mount -t nfs server:/export /mnt（NFSv4 也写作 -t nfs 或 nfs4，同属该类型）。ext3/xfs 是本地文件系统，glusterfs 是另一种分布式文件系统类型。", "d": 0}, {"k": "y26", "s": 55, "t": "单选", "q": "在nfs中，可以使用下列哪条命令查看到nfs使用的端口？", "o": ["port", "rpcinfo", "show", "ls"], "a": "B", "n": "【答案正确】NFS 基于 RPC 体系，端口由 rpcbind 登记，rpcinfo -p 可列出已注册的 RPC 程序及端口号（nfs/d 2049、mountd 等动态端口）。port/show 不是 Linux 命令，ls 只列目录；showmount 只能查看共享目录列表，不显示端口。", "d": 0}, {"k": "y26", "s": 56, "t": "单选", "q": "dhcp的租约文件存放在哪个目录下？", "o": ["/var", "/dhcp", "/etc", "/log"], "a": "A", "n": "【答案正确】RHEL 系（含麒麟 V10）dhcpd 租约记录在 /var/lib/dhcpd/dhcpd.leases，位于 /var 下。/etc 存放配置文件，/dhcp、/log 不是标准目录（日志在 /var/log）。", "d": 0}, {"k": "y26", "s": 57, "t": "单选", "q": "dns服务的名称为", "o": ["dns", "dnsd", "named", "bind"], "a": "C", "n": "【答案正确】BIND 是 DNS 服务软件套件，实际运行的守护进程为 named，systemd 服务单元为 named.service。dns/dnsd 不是有效服务名，bind 是软件名而非进程/服务名。", "d": 0}, {"k": "y26", "s": 58, "t": "单选", "q": "dns配置主文件的名称是？", "o": ["dns.conf", "name.conf", "named.conf", "bind.conf"], "a": "C", "n": "【答案正确】BIND 的主配置文件是 /etc/named.conf，在其中用 zone 语句声明区域并指向 zone 文件。dns.conf/name.conf/bind.conf 均非实际文件名。", "d": 0}, {"k": "y26", "s": 59, "t": "单选", "q": "在dns的zone文件中用来定义别名的关键字是？", "o": ["CNAME", "A", "AAAA", "PTR"], "a": "A", "n": "【答案正确】zone 文件中 CNAME 记录定义别名，指向规范主机名。A 记录是 IPv4 正向解析、AAAA 是 IPv6、PTR 用于反向解析（IP→域名）。", "d": 0}, {"k": "y26", "s": 60, "t": "单选", "q": "在dns的zone文件中用来定义IPV4的解析记录的关键字是？", "o": ["PTR", "NS", "AAAA", "A"], "a": "D", "n": "【答案正确】A（A 记录）定义主机名到 IPv4 地址的正向解析。AAAA 是 IPv6，PTR 是反向解析，NS 指定区域的权威名称服务器。", "d": 0}, {"k": "y26", "s": 61, "t": "单选", "q": "nginx.conf中，哪个字段指定nginxpid文件的位置？", "o": ["pid-file", "pid", "file", "npid"], "a": "B", "n": "【答案正确】nginx.conf 主（全局）段用 pid 指令指定 PID 文件位置，如 pid /run/nginx.pid;。pid-file/file/npid 均不是 nginx 的指令。", "d": 0}, {"k": "y26", "s": 62, "t": "单选", "q": "nginx.conf的日志格式中，哪个字段表示记录访问时间？", "o": ["$request", "$time_local", "$remote_user", "$status"], "a": "B", "n": "【答案正确】log_format 中变量 $time_local 记录请求到达的本地时间（如 17/Oct/2026:10:00:00 +0800）。$request 是请求行（方法+URI+协议版本），$remote_user 是认证用户名，$status 是响应状态码。", "d": 0}, {"k": "y26", "s": 63, "t": "单选", "q": "在时间服务器中，使用下列哪个字段可以定义时间服务器的地址？", "o": ["driftfile", "makestep", "rtcsync", "server"], "a": "D", "n": "【答案正确】chrony.conf 中 server \u003c地址> 定义上游 NTP 时间源（pool 定义地址池），是同步时间的地址来源。driftfile 保存时钟频率偏差，makestep 控制偏差过大时立即步进校正，rtcsync 使系统时钟同步到硬件 RTC——三者均不定义服务器地址。", "d": 0}, {"k": "y26", "s": 64, "t": "单选", "q": "在时间服务器中，下列哪个字段定义日志文件？", "o": ["logdir", "pool", "driftfile", "server"], "a": "A", "n": "【答案正确】chrony.conf 用 logdir 定义跟踪/统计等日志的目录（默认 /var/log/chrony，配合 log measurements/statistics 等指令生效）。pool/server 定义时间源，driftfile 是频率偏差文件，均与日志无关。", "d": 0}, {"k": "y26", "s": 65, "t": "单选", "q": "在chronyc sources -v命令中，哪个符号是表示时间错误的？", "o": ["？", "*", "^", "x"], "a": "D", "n": "【答案正确】chronyc sources -v 图例中状态列：* 为当前同步源、+ 可参与合并、- 不参与合并、x 表示该源时间可能有错（被判定为 falseticker 剔除）、~ 时间波动过大、? 不可达。“时间错误”对应 x。^ 出现在模式（M）列表示 server 模式，并非时间错误标记。", "d": 0}, {"k": "y26", "s": 66, "t": "单选", "q": "team链路聚合最多支持几块网卡", "o": ["2", "6", "8", "10"], "a": "C", "n": "【答案存疑】“team 最多支持 8 块网卡”出自国内麒麟培训教材/题库的既定口径，竞赛按教材标准判 C(8) 可接受。但从通用 Linux 技术事实看，libteam/nmcli 及红帽官方文档均未规定 team 端口数量的硬性上限，8 并无权威出处；A(2) 只是双网卡绑定的常见做法而非上限，10 亦无依据。此题属教材口径题，按平台答案记忆即可，但技术上答案可商榷。", "d": 1}, {"k": "y26", "s": 67, "t": "单选", "q": "iscsi存储共享属于哪种存储结构", "o": ["NAS", "SAN", "MAC", "DAS"], "a": "B", "n": "【答案正确】iSCSI 将 SCSI 块级指令封装在 TCP/IP 上传输，向主机提供块设备（虚拟磁盘）共享，属于 IP-SAN，即 SAN 的一种。NAS 是文件级共享（NFS/SMB），DAS 是服务器直连存储，MAC 与存储架构无关。", "d": 0}, {"k": "y26", "s": 68, "t": "单选", "q": "在银河麒麟服务器操作系统中，系统日志守护程序是", "o": ["xinetd", "systemd", "message", "rsyslogd"], "a": "D", "n": "【答案正确】麒麟 V10（RHEL 系）系统日志守护进程是 rsyslogd。xinetd 是按需唤醒服务的“超级守护进程”，systemd 是初始化系统（PID 1），message 只是日志文件名相关的词，均不负责日志守护。", "d": 0}, {"k": "y26", "s": 69, "t": "单选", "q": "日志服务定义了日志信息的分类，具体的哪些日志信息存放在哪个文本文档中，可以通过这个配置文件来自定义设置日志文档。系统日志主配置文件为", "o": ["/etc/logrotate.d/rsyslog", "/etc/rsyslog.conf", "/etc/sysconfig/rsyslog", "/etc/systemd"], "a": "B", "n": "【答案正确】rsyslog 主配置文件为 /etc/rsyslog.conf（附加片段在 /etc/rsyslog.d/）。/etc/logrotate.d/rsyslog 是日志轮转规则，/etc/sysconfig/rsyslog 存放服务启动参数（旧版本），/etc/systemd 是 systemd 配置目录，均非日志分类规则文件。", "d": 0}, {"k": "y26", "s": 70, "t": "单选", "q": "系统主配置文件中记录*.*;auth,authpriv.none          -/var/log/syslog的含义是", "o": ["除了auth与authpriv这两个有关认证服务的信息外，其余的信息都被记录在了/var/log/syslog中。", "auth与authpriv这两个有关认证服务的信息被记录在了/var/log/syslog中", "所有信息都被记录在了/var/log/syslog中。", "/var/log/syslog是系统主配置文件"], "a": "A", "n": "【答案正确】规则 *.*;auth,authpriv.none：*.* 表示全部设施全部级别，分号后追加选择器把 auth、authpriv 两类以 none 级别排除，故含义为“除认证相关日志外，其余全部写入 /var/log/syslog”（行首 - 表示异步写入、不立即落盘）。B 把排除关系说反，C 忽略了排除条件，D 混淆了配置文件与日志文件。【发行版差异】/var/log/syslog 是 Debian 系路径，麒麟 V10 实际日志为 /var/log/messages，此处按题库统一口径判定。", "d": 0}, {"k": "y26", "s": 71, "t": "单选", "q": "衡量系统CPU性能好的标准是，CPU综合使用率为", "o": ["\u003c 40%", "\u003c 50%", "\u003c 60%", "\u003c 70%"], "a": "D", "n": "【答案正确】运维教材经验阈值：CPU 综合使用率长期保持在 70% 以下视为性能良好，70%~85% 为高负载警戒，再高需优化或扩容。此为经验口径题，选 D(\u003c70%) 符合通行教材标准。", "d": 0}, {"k": "y26", "s": 72, "t": "单选", "q": "Vmstat输出结果us+sy 的参考值为80%，如果us+sy大于80%说明", "o": ["CPU资源状态良好", "CPU资源不足", "内存资源状态良好", "内存资源不足"], "a": "B", "n": "【答案正确】vmstat 中 us（用户态）+sy（内核态）合计为 CPU 实际工作时间占比，经验参考值 80%；超过 80% 说明 CPU 长期满负荷、资源不足。内存不足应看 si/so（换页）与 wa 等，与 C/D 无关。", "d": 0}, {"k": "y26", "s": 73, "t": "单选", "q": "只修改列的数据类型的指令是？", "o": ["alter table...alter column", "alter table...modify column…", "alter table... update...", "alter table...update column…"], "a": "B", "n": "【答案正确】按 MySQL 口径：ALTER TABLE t MODIFY COLUMN col 新类型; 只修改列的数据类型/定义、不改列名。ALTER COLUMN 在 MySQL 中仅用于设置或删除列的默认值，不改类型；UPDATE 是修改表数据（DML）而非表结构。", "d": 0}, {"k": "y26", "s": 74, "t": "单选", "q": "删除列的命令是？", "o": ["alter table...delete..", "alter table...delete column…", "alter table..drop record…", "alter table...drop column…"], "a": "D", "n": "【答案正确】删除列用 ALTER TABLE t DROP COLUMN col;（可省略 COLUMN）。DELETE 是删除行数据的 DML 语句，delete column 与 drop record 均非有效 SQL 语法。", "d": 0}, {"k": "y26", "s": 75, "t": "单选", "q": "不具备扩展性的存储架构的是？", "o": ["DAS", "NAS", "SAN", "IP SAN"], "a": "A", "n": "【答案正确】DAS（直连存储）通过线缆直接挂在单台服务器上，受机箱、接口与线缆限制，扩展性最差。NAS/SAN/IP SAN 基于网络架构，可通过交换机和存储节点横向扩容。", "d": 0}, {"k": "y26", "s": 76, "t": "单选", "q": "运行一个脚本，用户需要什么样的权限？", "o": ["acl", "write", "read和execute", "browse on the directory"], "a": "C", "n": "【答案正确】脚本须同时具备 r+x 才能执行：内核按 shebang 启动解释器读取脚本内容（需 r），且文件需有执行位 x。仅写权限或 ACL 都无法运行；D 的“目录浏览”与执行脚本无关。", "d": 0}, {"k": "y26", "s": 77, "t": "单选", "q": "在银河麒麟服务器操作系统中，下列描述错误的是？（）", "o": ["/etc/ld.so.conf是ping的配置文件", "tar -czvf filename.tgz *此命令可以打包并压缩文件", "httpd.conf是apache的主配置文件", "tar -xzvf filename.tgz 此命令可以解压缩tar文件"], "a": "A", "n": "【答案正确】/etc/ld.so.conf 是动态链接器 ld.so 的共享库搜索路径配置，与 ping 无关，故 A 描述错误、为应选项。B 的 tar -czvf 打包并 gzip 压缩（.tgz）、D 的 tar -xzvf 解压、C 的 httpd.conf 是 Apache 主配置，三项描述均正确。", "d": 0}, {"k": "y26", "s": 78, "t": "单选", "q": "在终端中如何获取上一条命令的退出状态？（）", "o": ["echo  \"$1\"", "echo  \"$0\"", "echo  \"$?\"", "echo  \"$#\""], "a": "C", "n": "【答案正确】echo \"$?\" 输出上一条命令的退出状态码（0 成功、非 0 失败）。$1 是第一个位置参数，$0 是脚本名/Shell 名，$# 是位置参数个数。", "d": 0}, {"k": "y26", "s": 79, "t": "单选", "q": "银河麒麟服务器操作系统终端中，从后台启动进程，应在命令的结尾加上哪个符号？", "o": ["符号：@", "符号：&", "符号：^", "符号：*"], "a": "B", "n": "【答案正确】命令结尾加 & 使该进程后台运行（可用 jobs/fg/bg/nohup 配合管理）。@ 与 ^ 无特殊后台作用，* 是文件名通配符。", "d": 0}, {"k": "y26", "s": 80, "t": "单选", "q": "在银河麒麟服务器操作系统中，用Ctrl+ALT+F*可以切换到图形终端?", "o": ["Ctrl+ALT+F1", "Ctrl+ALT+F3", "Ctrl+ALT+F7", "Ctrl+ALT+F12"], "a": "A", "n": "【答案正确】麒麟 V10（RHEL8 系+UKUI 桌面）图形会话默认运行在 tty1，Ctrl+Alt+F1 切回图形界面，F2~F6 为字符终端。【发行版差异】老式 RHEL5/6 与 Ubuntu 习惯图形在 tty7（Ctrl+Alt+F7），故 C 是旧口径干扰项；按麒麟 V10 实际判定 A 正确。", "d": 0}, {"k": "y26", "s": 81, "t": "单选", "q": "在实际操作中,想了解命令lpr的用法,可以键入什么得到帮助？", "o": ["man lpr", "lpr /？", "whereis lpr", "dpkg -i lpr"], "a": "A", "n": "【答案正确】man lpr 查看联机手册，含用法与选项说明。whereis 只定位命令与手册文件的路径，不讲解用法；lpr /? 是 Windows 风格；dpkg -i 是 Debian 系安装软件包命令（麒麟 V10 属 rpm/yum 体系）。", "d": 0}, {"k": "y26", "s": 82, "t": "单选", "q": "创建组账户的通用命令是什么？", "o": ["groupadd", "gpadd", "grpadd", "usergroupadd"], "a": "A", "n": "【答案正确】创建组账户的命令是 groupadd 组名（配套 groupmod 改、groupdel 删）。gpadd/grpadd/usergroupadd 均不是真实存在的命令。", "d": 0}, {"k": "y26", "s": 83, "t": "单选", "q": "以下哪条命令可以用来使用指定的用户来执行命令，而不用切换用户?", "o": ["su", "sudo", "su do", "以上都不可以"], "a": "B", "n": "【答案正确】sudo [-u 用户] 命令 以指定用户（默认 root）身份执行单条命令，无需切换登录会话。su 是整体切换用户身份；“su do” 是无效拼写。", "d": 0}, {"k": "y26", "s": 84, "t": "单选", "q": "root用户的UID是?", "o": ["0", "1", "1000", "500"], "a": "A", "n": "【答案正确】root 的 UID 固定为 0，内核判定超级用户的依据就是 UID=0 而非用户名。普通用户在 RHEL/openEuler 系从 1000 起（500 是 RHEL5 旧起点），UID 1 通常是 bin 等系统账号。", "d": 0}, {"k": "y26", "s": 85, "t": "单选", "q": "使用fdisk分区工具的p选项观察分区表情况时，标记可引导分区使用的标志是", "o": ["a", "*", "@", "+"], "a": "B", "n": "【答案正确】fdisk 的 p 子命令打印分区表，Boot 列用 * 标记可引导（活动）分区；交互模式下按键 a 是设置/取消该标志的操作入口，表中仍显示为 *。@、+ 不是此处的标记。", "d": 0}, {"k": "y26", "s": 86, "t": "单选", "q": "在使用mkdir命令创建新的目录时,在其父目录不存在时先创建父目录的选项是？", "o": ["-m", "-d", "-f", "-p"], "a": "D", "n": "【答案正确】mkdir -p 递归创建缺失的父目录（目录已存在也不报错）。-m 用于创建时指定权限位，-f/-d 不是 GNU mkdir 的选项。", "d": 0}, {"k": "y26", "s": 87, "t": "单选", "q": "用ls -la命令输出的显示内容中有一行如：“-rw-r--r--  1 root root 3106 10月 23 2015 .bashrc ”其中“3106”表示什么？", "o": ["文件大小", "连接数", "唯一标识号", "随机数"], "a": "A", "n": "【答案正确】ls -l 长格式自左向右为：权限、硬链接数(此行 1)、属主、属组、文件大小、修改时间、文件名，3106 位于属组之后，是文件大小（字节）。连接数是第二个字段 1，不要混淆。", "d": 0}, {"k": "y26", "s": 88, "t": "单选", "q": "切换目录的命令是？", "o": ["cd", "pwd", "mkdir", "rmdir"], "a": "A", "n": "【答案正确】cd 切换当前工作目录（cd .. 上级、cd ~或无参数 回家目录、cd - 回上一工作目录）。pwd 显示当前路径，mkdir/rmdir 创建/删除目录。", "d": 0}, {"k": "y26", "s": 89, "t": "单选", "q": "哪个目录是系统自动产生的映射，查看该目录中的文件可获取有关系统硬件运行的信息？", "o": ["/root", "/proc", "/sbin", "/boot"], "a": "B", "n": "【答案正确】/proc 是内核导出的虚拟文件系统（内存映射），/proc/cpuinfo、/proc/meminfo、/proc/interrupts 等反映硬件与内核运行信息，/sys 与之类似。/root 是 root 家目录，/sbin 存放系统管理命令，/boot 存放启动文件。", "d": 0}, {"k": "y26", "s": 90, "t": "单选", "q": "以下哪个不属于文件访问权限？", "o": ["读", "执行", "写", "保存"], "a": "D", "n": "【答案正确】Linux 文件访问权限只有读 r、写 w、执行 x 三类（对目录的 rwx 语义是列出/改名新建/进入），不存在“保存”权限位。", "d": 0}, {"k": "y26", "s": 91, "t": "单选", "q": "cd命令可以改变用户的当前目录，当用户键入命令“cd”并按Enter键后，", "o": ["当前目录改为根目录", "当前目录改为用户家目录", "当前目录不变", "当前目录改为上一级目录"], "a": "B", "n": "【答案正确】cd 不带参数等价于 cd $HOME，回到当前用户家目录。去根目录需 cd /，去上一级是 cd ..，且执行后目录必然发生变化而非保持不变。", "d": 0}, {"k": "y26", "s": 92, "t": "单选", "q": "下面对mv命令描述错误的是", "o": ["mv命令既可以移动目录，也可以重命名目录", "mv命令既可以完成移动文件，也可以重命名文件", "对于文件来说，目的文件名不存在，mv命令为文件重命名", "对于目录来说，目的路径不存在，mv命令为目录重命名"], "a": "C", "n": "【答案存疑】【题目缺陷】题目要求选出“错误”的描述，但四个选项的表述技术上均成立：A/B 是 mv 的基本功能（移动+重命名，文件与目录通用）；C（文件目标名不存在→重命名）与 D（目录目标路径不存在→重命名）句式对称，mv 在目标不存在时的行为确为重命名，二者都正确，没有一项构成“错误描述”。平台判 C，只能作为该题库存疑口径记忆；原“参考详细解析”也未给出 C 与 D 的实质技术区别，仅依平台结论表述。", "d": 1}, {"k": "y26", "s": 93, "t": "单选", "q": "使用ln -s命令将生成了一个指向文件old的符号链接new，如果你将文件old删除，是否还能够访问文件new中的数据？", "o": ["不可能再访问", "仍然可以访问", "能否访问取决于文件的所有者", "能否访问取决于文件的权限"], "a": "A", "n": "【答案正确】符号（软）链接只保存目标的路径名，源文件 old 被删除后 new 成为悬空死链，访问报 No such file or directory，数据不可再访问；这与硬链接不同（硬链接共享 inode，删除其一仍可访问，直到链接数归 0）。与所有者、权限无关。", "d": 0}, {"k": "y26", "s": 94, "t": "单选", "q": "显示一个文件最后几行的命令是", "o": ["tac", "tail", "rear", "last"], "a": "B", "n": "【答案正确】tail（默认 10 行，-n N 指定行数）显示文件末尾几行。tac 倒序输出整个文件内容，last 查看登录历史，不是 rear 这种命令（rear 是灾备恢复工具，与显示无关）。", "d": 0}, {"k": "y26", "s": 95, "t": "单选", "q": "使用以下哪个命令可以更改文件的属主或属组？", "o": ["id", "chown", "chmod", "su"], "a": "B", "n": "【答案正确】chown 属主[:属组] 文件 修改文件属主与属组（仅改属组也可用 chgrp）。chmod 修改权限位，id 查看用户 UID/GID，su 切换用户身份，均不改变文件归属。", "d": 0}, {"k": "y26", "s": 96, "t": "单选", "q": "为了动态查看的日志文件内容，可以使用的命令是？", "o": ["ls", "vi", "more", "tail -f"], "a": "D", "n": "【答案正确】tail -f 持续监视文件并在新增内容写入时实时刷新输出（如 tail -f /var/log/messages），是动态跟踪日志的标准命令。ls 只列目录，vi 与 more 均为静态查看，无实时跟踪能力。", "d": 0}, {"k": "y26", "s": 97, "t": "单选", "q": "下列哪个命令不可用来查看网络故障？（）", "o": ["telnet", "ping", "init", "netstat"], "a": "C", "n": "【答案正确】init 是切换/管理运行级别的命令（systemd 时代对应 systemctl isolate），与网络诊断无关。telnet 可测试端口连通、ping 测网络连通性、netstat 查看连接和端口状态，三者均可辅助排查网络故障，故选 C。", "d": 0}, {"k": "y26", "s": 98, "t": "单选", "q": "在银河麒麟服务器操作系统中查看ARP缓存记录的命令是？（）", "o": ["arp -a", "arp -d", "arp -L", "arp -D"], "a": "A", "n": "【答案正确】net-tools 的 arp -a 用于显示主机全部 ARP 缓存条目；arp -d \u003c地址> 删除指定条目，arp -D 是用接口硬件地址替代（不是查看），arp -L 并非 arp 的缓存查看选项。现代系统也可用 ip neigh 查看邻居表，但本组选项中 arp -a 是唯一正确答案。", "d": 0}, {"k": "y26", "s": 99, "t": "单选", "q": "文件夹中不可存放（）。", "o": ["单个文件", "字符", "多个文件", "文件夹"], "a": "B", "n": "【答案正确】目录（文件夹）中存放的对象是文件和子目录，且目录可以嵌套；\"字符\"属于文件内容层面的概念，不是文件夹中可直接存放的对象。A/C/D 均可被存放。", "d": 0}, {"k": "y26", "s": 100, "t": "单选", "q": "命令cat file1>>file2 的功能是？（）", "o": ["将文件file2的内容添加到文件file1的末尾", "将文件file1的内容添加到文件file2的末尾", "删除文件file1和file2", "显示文件file1和file2"], "a": "B", "n": "【答案正确】>> 是追加重定向，cat file1>>file2 把 cat 读出的 file1 内容追加写入 file2 的末尾。A 把方向说反了（那样应是 cat file2>>file1），C/D 与 cat 功能无关。", "d": 0}, {"k": "y26", "s": 101, "t": "单选", "q": "cat -n file1 file2命令的意思是？（）", "o": ["把文件file1改名为file2，然后把文件内容输出到屏幕上", "把文件file1和file2连在一起，带行号输出到屏幕上", "创建文件file1和file2", "把file2的内容输出到file1中并保存"], "a": "B", "n": "【答案正确】cat 的功能是连接文件并打印，参数 -n 给输出加行号；cat -n file1 file2 将两个文件顺序连接、统一带行号输出到屏幕。cat 不改名（非 mv）、不创建文件、不落盘保存，A/C/D 均错。", "d": 0}, {"k": "y26", "s": 102, "t": "单选", "q": "在nginx中通过哪个字段定义日志格式", "o": ["access_log", "error_log", "log_format", "format"], "a": "C", "n": "【答案正确】nginx 用 log_format 指令定义日志格式模板，再由 access_log 引用；access_log/error_log 只负责指定日志文件路径和级别，format 不是 nginx 的指令。", "d": 0}, {"k": "y26", "s": 103, "t": "单选", "q": "nginx中的反向代理是通过哪个关键字实现的", "o": ["proxy_pass", "proxy", "PROXY_PASS", "pass"], "a": "A", "n": "【答案正确】nginx 反向代理通过 proxy_pass 指令将请求转发到后端服务器；nginx 指令区分大小写，PROXY_PASS 大写无效，proxy/pass 不是完整指令名。", "d": 0}, {"k": "y26", "s": 104, "t": "单选", "q": "在nfs的共享设置文件中，如果有多个权限的话，权限之间使用哪个符号分隔？", "o": [".", ",", ":", ";"], "a": "B", "n": "【答案正确】NFS 共享设置文件 /etc/exports 中，同一客户端的多个权限选项写在一对括号内并用逗号分隔，如 (rw,sync,no_root_squash)；句点、冒号、分号均不是权限分隔符。", "d": 0}, {"k": "y26", "s": 105, "t": "单选", "q": "nfs的客户端查看共享时，使用哪条命令？", "o": ["showmount", "shouw", "export", "exportfs"], "a": "A", "n": "【答案正确】NFS 客户端用 showmount -e 服务器地址 查看服务端导出的共享列表（showmount -a 还可查看已挂载的客户机）；exportfs/export 是服务端管理导出的命令，\"shouw\" 是无效拼写。", "d": 0}, {"k": "y26", "s": 106, "t": "单选", "q": "在exportfs命令中，哪个参数可以取消共享？", "o": ["r", "u", "v", "o"], "a": "B", "n": "【答案正确】exportfs -u \u003c主机:目录> 用于取消（unexport）指定的已导出共享；-r 全部重新导出、-v 仅显示详细过程、-o 指定导出选项，都不是取消操作。", "d": 0}, {"k": "y26", "s": 107, "t": "单选", "q": "如何使用exportfs命令，取消所有的nfs共享？", "o": ["au", "ar", "rv", "ru"], "a": "A", "n": "【答案正确】exportfs -a 表示对 /etc/exports 的全部条目操作，-u 表示取消导出，组合 exportfs -au 即取消所有 NFS 共享；-ar 是全部重新导出，rv/ru 组合不符合题意。", "d": 0}, {"k": "y26", "s": 108, "t": "单选", "q": "dns服务使用的端口是？", "o": ["53", "35", "67", "153"], "a": "A", "n": "【答案正确】DNS 服务监听 UDP/TCP 53 端口；67 是 DHCP 服务端端口，35 和 153 与 DNS 服务无关。", "d": 0}, {"k": "y26", "s": 109, "t": "单选", "q": "nginx的日志文件的父目录名称为？", "o": ["logs", "log", "access", "error"], "a": "A", "n": "【答案正确】题目按源码编译安装口径：nginx 默认日志目录为 \u003c安装前缀>/logs（如 /usr/local/nginx/logs），父目录名为 logs，故选 A。【发行版差异】若为 RHEL/openEuler 系发行软件包（含麒麟 yum 源）安装，日志在 /var/log/nginx 下，父目录名为 nginx；四个选项中只有 logs 在源码安装口径下成立。", "d": 0}, {"k": "y26", "s": 110, "t": "单选", "q": "nginx使用的端口是？", "o": ["25", "20", "53", "80"], "a": "D", "n": "【答案正确】nginx 默认以 HTTP 服务监听 80 端口（HTTPS 默认 443）；25 是 SMTP、20 是 FTP 数据端口、53 是 DNS。", "d": 0}, {"k": "y26", "s": 111, "t": "单选", "q": "chrony服务使用的端口是？", "o": ["123", "23", "323", "67"], "a": "A", "n": "【答案正确】chronyd 与外部时间服务器同步使用 NTP 协议的 UDP 123 端口；323 是 chronyd 只监听本机 127.0.0.1 上供 chronyc 连接的命令端口（易混淆项），23 是 telnet、67 是 DHCP。", "d": 0}, {"k": "y26", "s": 112, "t": "单选", "q": "chrony的核心组件有几个？", "o": ["2", "3", "4", "5"], "a": "A", "n": "【答案正确】chrony 由两个核心组件构成：常驻守护进程 chronyd（负责后台时间同步）和命令行工具 chronyc（用于配置查询与管理）。", "d": 0}, {"k": "y26", "s": 113, "t": "单选", "q": "在chronyc sources -v命令中，哪个符号是表示时间服务器的？", "o": ["^", "*", "=", "?"], "a": "A", "n": "【答案正确】chronyc sources -v 图例中模式（M）列：^ 表示该源是一台网络时间服务器，= 表示对等端（peer），# 表示本地连接的参考时钟；* 与 ? 属于状态符号（* 当前同步源、? 不可达），不代表源类型。问\"表示时间服务器的\"应为 ^。", "d": 0}, {"k": "y26", "s": 114, "t": "单选", "q": "在chronyc sources -v命令中，哪个符号是表示时间服务器不可达的？", "o": ["^", "*", "?", "="], "a": "C", "n": "【答案正确】chronyc sources 输出中 ? 表示该源的可达性丢失（不可达/不可用）；^ 是类型符号表示时间服务器，* 表示当前正用于同步的源，= 表示对等端，均非\"不可达\"。", "d": 0}, {"k": "y26", "s": 115, "t": "单选", "q": "在银河麒麟服务器操作系统中firewalld的daemon文件保存的目录是", "o": ["/etc/firewalld/services目录", "/usr/lib/firewalld/services/目录", "/usr/share/doc目录", "/etc/firewalld目录"], "a": "B", "n": "【答案正确】firewalld 预定义的 service 配置文件（XML）位于 /usr/lib/firewalld/services/；管理员自定义/覆盖的服务文件放 /etc/firewalld/services/；/usr/share/doc 是文档目录。【术语提示】题干\"daemon文件\"实指 firewalld 的 service 定义文件，非守护进程本体。", "d": 0}, {"k": "y26", "s": 116, "t": "单选", "q": "在银河麒麟服务器操作系统中，查看当前kysec的安全状态的命令为", "o": ["getenforce", "setenforce", "getstatus", "setstatus"], "a": "C", "n": "【答案正确】银河麒麟 kysec 安全框架提供 getstatus 命令查看当前安全状态（是否启用及工作模式等），setstatus 用于启用/禁用或切换模式；getenforce/setenforce 是 SELinux 的命令，对 kysec 不适用。", "d": 0}, {"k": "y26", "s": 117, "t": "单选", "q": "在双系统安装时syslog日志报错：error：Runing \"grub-install\"  --force \"/dev/sda\" failed  问题原因是什么", "o": ["日志文件记录错误", "grub引导程序损坏", "硬盘损坏", "双系统启动模式不一致"], "a": "D", "n": "【答案正确】双系统安装中出现 grub-install --force \"/dev/sda\" failed，典型原因是两套系统（或安装介质引导）的启动模式不一致——一侧 UEFI、另一侧 Legacy/BIOS，grub 按错误模式写引导失败；将两系统统一为 UEFI（或统一 Legacy）模式即可避免。【题目缺陷】故障也可能由磁盘写入权限/分区表问题引起，但本题考点与教材口径为启动模式不一致，D 正确。", "d": 0}, {"k": "y26", "s": 118, "t": "单选", "q": "查看系统运行时物理内存和交换空间等内存使用状况的命令有", "o": ["ps", "top", "free", "systemd"], "a": "C", "n": "【答案正确】free 命令按总量/已用/空闲/缓存列式显示物理内存和 swap 交换空间的使用状况，是查内存的标准命令；ps 面向进程状态，top 是综合动态监控（虽含内存摘要但非本题标准答案），systemd 是初始化系统。", "d": 0}, {"k": "y26", "s": 119, "t": "单选", "q": "下面的数据库产品中，开源数据库是？", "o": ["Oracle", "DB2", "MariaDB", "SQL Server"], "a": "C", "n": "【答案正确】MariaDB 是 MySQL 分支、遵循 GPL 的开源关系型数据库；Oracle、DB2、SQL Server 均为商业闭源数据库产品。", "d": 0}, {"k": "y26", "s": 120, "t": "单选", "q": "（）命令用于删除一个数据库？", "o": ["create database", "drop database", "alter database", "Use mysql"], "a": "B", "n": "【答案正确】SQL 删除数据库用 DROP DATABASE；CREATE DATABASE 建库，ALTER DATABASE 修改库属性，USE mysql 只是切换当前库到 mysql，均不删除数据库。", "d": 0}, {"k": "y26", "s": 121, "t": "单选", "q": "vsftp服务的软件包的名称是?", "o": ["vsftp", "vsftpd", "ftp", "ftpd"], "a": "B", "n": "【答案正确】FTP 服务软件 vsftpd（Very Secure FTP Daemon）的软件包名即 vsftpd，守护进程习惯带 d；vsftp/ftpd 不是包名，ftp 包是 FTP 客户端。", "d": 0}, {"k": "y26", "s": 122, "t": "单选", "q": "vsftp服务的配置文件的名称为?", "o": ["vsftpd.conf", "vsftp.conf", "ftp.conf", "vsftpd.cfg"], "a": "A", "n": "【答案正确】vsftpd 主配置文件为 /etc/vsftpd/vsftpd.conf；vsftp.conf/ftp.conf 拼写不对且不属于 vsftpd，vsftpd.cfg 无此文件。", "d": 0}, {"k": "y26", "s": 123, "t": "单选", "q": "vsftp的下载目录存放在下列哪个目录?", "o": ["/var", "/etc", "/lib", "/ftp"], "a": "A", "n": "【答案正确】vsftpd 的匿名 FTP 根目录为 /var/ftp（默认含 pub 子目录作为下载点），故下载目录位于 /var 下；/etc 放配置、/lib 放库文件、/ftp 不是标准目录。", "d": 0}, {"k": "y26", "s": 124, "t": "单选", "q": "以长格式显示当前目录下所有文件时，若文件test属性的第一部分为：drwxrw-r--，则test的文件类型及文件属主的权限是什么？", "o": ["目录文件、浏览目录修改目录下文件和进入目录", "目录文件、浏览目录修改目录下文件", "普通文件、读写", "普通文件、读"], "a": "A", "n": "【答案正确】首字符 d 表示目录文件；属主位 rwx 对目录的含义是：r 可浏览（列出）目录内容、w 可修改目录下条目（增删改名文件）、x 可进入（cd 至）该目录，A 三项俱全；B 漏了\"进入\"，C/D 把类型误判为普通文件。", "d": 0}, {"k": "y26", "s": 125, "t": "单选", "q": "系统识别到的第二块SAS硬盘的第一个分区的标识是哪个？", "o": ["/dev/sda1", "/dev/sdb1", "/dev/sdc1", "/dev/sdd1"], "a": "B", "n": "【答案正确】SAS/SCSI/SATA 盘由 sd 驱动按发现顺序命名为 sda、sdb、sdc……，第二块 SAS 盘即 sdb，其第一个分区为 /dev/sdb1。", "d": 0}, {"k": "y26", "s": 126, "t": "单选", "q": "在终端执行ls *.*命令返回一组文件的列表，如何描述被列出的这些文件？", "o": ["当前工作目录中所有文件的列表", "当前目录中所有非隐藏文件的列表", "当前工作目录中所有名称中有.的文件列表,但是不包括.是起始字符的文件。", "当前工作目录中所有名称中有.的文件列表"], "a": "C", "n": "【答案正确】shell 通配符 * 默认不匹配以 . 开头的隐藏文件，且模式 *.* 要求文件名中必须含一个字面点号，因此列出的是\"名称中有 . 但不以 . 开头\"的文件；A/B 缺少点号限制，D 少了排除隐藏文件的限制。", "d": 0}, {"k": "y26", "s": 127, "t": "单选", "q": "你当前的工作目录中有以下文件：parrot,pelican,penguin；你在终端输入：ls -l pa，然后按tab键。当前shell是bash。 会发生什么？", "o": ["“pa”将扩展为“parrot”", "什么也没有发生", "“pa”将扩展为“parrot”, 然后执行了ls命令", "显示当前目录下的文件，等待输入"], "a": "A", "n": "【答案正确】bash 的 Tab 补全在唯一前缀时直接补全：parrot、pelican、penguin 中仅 parrot 以 pa 开头，故 \"pa\" 扩展为 \"parrot\"；补全只填充命令行、不自动回车执行，所以 C 错、B/D 不符。", "d": 0}, {"k": "y26", "s": 128, "t": "单选", "q": "用自动补全功能时，输入命令名或文件名的前1个或几个字母后按什么键？", "o": ["【Ctrl】键", "【Tab】键", "【Alt】键", "【Shift】键"], "a": "B", "n": "【答案正确】bash 命令名/文件名自动补全按 Tab 键触发（单候补直接补全，多候补双击 Tab 列出）；Ctrl/Alt/Shift 均不是补全键。", "d": 0}, {"k": "y26", "s": 129, "t": "单选", "q": "以下哪个命令关机不重启?", "o": ["shutdown -h now", "shutdown -r now", "reboot", "init 6"], "a": "A", "n": "【答案正确】shutdown -h now 立即停机/关机（-h 即 halt/poweroff），不重启；shutdown -r 表示重启，reboot 和 init 6（切换到重启目标）也都会重启。", "d": 0}, {"k": "y26", "s": 130, "t": "单选", "q": "系统管理员编写了shell程序prog1.sh，测试时程序死循环无法结束，可以通过下列方式结束程序？", "o": ["Ctrl+C", "Ctrl+X", "Alt F2 kill 进程ID", "Ctrl+d"], "a": "A", "n": "【答案正确】前台死循环程序按 Ctrl+C 向进程组发送 SIGINT 使其中止，是结束运行程序最直接的方式；Ctrl+D 发送 EOF、Ctrl+X 不是终止信号；Alt F2 后 kill PID 需要另开终端先查 PID，明显繁琐。", "d": 0}, {"k": "y26", "s": 131, "t": "单选", "q": "在银河麒麟服务器操作系统中，系统默认的哪个用户对整个系统拥有完全的控制权？", "o": ["root", "guest", "administrator", "kylin"], "a": "A", "n": "【答案正确】Linux/银河麒麟默认的超级用户是 root（UID 0），拥有对整个系统的完全控制权；guest 是受限访客账号，administrator 是 Windows 的概念，kylin 只是普通用户的常见命名。", "d": 0}, {"k": "y26", "s": 132, "t": "单选", "q": "chattr +i file命令的执行结果是什么？", "o": ["禁止任何修改，文件file不可改动。", "file文件将压缩后保存，进行读操作时会自动解压缩。", "file文件只能使用插入模式打开；可以增加数据，但是不能修改和删除原有内容。", "file文件只能使用改写模式打开；可以修改和删除原有内容。"], "a": "A", "n": "【答案正确】chattr +i 设置 immutable（不可变）属性，文件被禁止修改、删除、改名和建链接，root 也不例外；B 描述的是 c（压缩）属性，C 描述的是 a（append-only 只许追加）属性，D 无对应属性。", "d": 0}, {"k": "y26", "s": 133, "t": "单选", "q": "银河麒麟服务器操作系统磁盘的开机挂载需要将挂载参数写入哪个文件里？", "o": ["/etc/services", "/etc/sysctl.conf", "/etc/fstab", "/etc/crontab"], "a": "C", "n": "【答案正确】开机自动挂载由 /etc/fstab 控制，将设备、挂载点、文件系统类型和挂载选项按格式写入即可开机自动挂载；/etc/services 是端口服务名映射，/etc/sysctl.conf 是内核参数，/etc/crontab 是计划任务。", "d": 0}, {"k": "y26", "s": 134, "t": "单选", "q": "关于swap分区，下面哪一条语句的叙述是正确的？", "o": ["用于存储备份数据的分区", "用于存储内存出错信息的分区", "在系统引导时用于装载内核的分区", "作为虚拟内存的一个分区"], "a": "D", "n": "【答案正确】swap（交换分区）在物理内存不足时把不活跃页换出，充当虚拟内存的落盘空间；它不用于存备份，也不在引导时装载内核（装载内核的是 /boot），无\"存储内存出错信息\"之说。", "d": 0}, {"k": "y26", "s": 135, "t": "单选", "q": "存放设备文件的是哪个目录？", "o": ["/bin", "/boot", "/dev", "/etc"], "a": "C", "n": "【答案正确】/dev 存放设备文件（如 /dev/sda、/dev/null、/dev/tty）；/bin 是用户基本命令、/boot 是启动文件、/etc 是配置文件。", "d": 0}, {"k": "y26", "s": 136, "t": "单选", "q": "存放系统配置文件，如网络配置、设备配置等的目录是哪个？", "o": ["/bin", "/boot", "/dev", "/etc"], "a": "D", "n": "【答案正确】/etc 存放系统配置文件（网络、服务、设备相关配置均在其中）；/bin 命令、/boot 启动文件、/dev 设备文件。", "d": 0}, {"k": "y26", "s": 137, "t": "单选", "q": "银河麒麟服务器操作系统中哪个目录是为光盘、软盘等设备提供的默认挂载点？", "o": ["/opt", "/media", "/dev", "/home"], "a": "B", "n": "【答案正确】按 FHS 规范，/media 是可移动介质（光盘、软盘、U 盘等）的默认挂载点（如 /media/cdrom）；/opt 用于第三方软件、/dev 是设备文件、/home 是普通用户主目录。", "d": 0}, {"k": "y26", "s": 138, "t": "单选", "q": "下面哪一个命令是用来设置用户对文件的权限的?", "o": ["adduser", "chgrp", "chown", "chmod"], "a": "D", "n": "【答案正确】chmod 用于修改文件访问权限（rwx 权限位）；adduser 添加用户、chgrp 修改属组、chown 修改属主，均不设置权限。", "d": 0}, {"k": "y26", "s": 139, "t": "单选", "q": "假如文件权限是按8进制来定义，下面哪个值代表了读和写?", "o": ["2", "6", "4", "1"], "a": "B", "n": "【答案正确】八进制权限：读=4、写=2、执行=1，读+写=4+2=6；2 仅写、4 仅读、1 仅执行，故 6 代表读和写。", "d": 0}, {"k": "y26", "s": 140, "t": "单选", "q": "银河麒麟服务器操作系统中文件名长度不得超过多少个英文字符？", "o": ["64", "128", "256", "512"], "a": "C", "n": "【答案正确】按题库教材口径文件名上限为 256 个字符，在 64/128/256/512 中 256 正确。【术语提示】Linux ext2/ext3/ext4 文件系统 NAME_MAX 实际为 255 字节，256 是传统教材的宽泛说法；作为\"不得超过\"上界仍成立，且是四个选项中最接近真实上限的值。", "d": 0}, {"k": "y26", "s": 141, "t": "单选", "q": "银河麒麟服务器操作系统中，用户文件描述符0表示？（）", "o": ["标准输入设备文件描述符", "标准输出设备文件描述符", "管道文件描述符", "标准错误输出设备文件描述符"], "a": "A", "n": "【答案正确】文件描述符 0、1、2 按惯例固定对应标准输入、标准输出、标准错误，故 0 为标准输入设备文件描述符；管道描述符由系统按需分配编号，不是 0。", "d": 0}, {"k": "y26", "s": 142, "t": "单选", "q": "我希望看最近执行的3个命令（不包括history）,需要用以下哪个命令？（）", "o": ["history -n 3", "history  3", "history 4", "history -n 4"], "a": "C", "n": "【答案正确】bash 中 history N 显示最近 N 条历史，且刚执行的 history 命令本身也已记入并计数，故要看到\"最近 3 个命令（不含 history 本身）\"需 N=4；history 没有 \"-n 数量\" 的计数用法（-n 是读取历史文件中尚未读入的行）。", "d": 0}, {"k": "y26", "s": 143, "t": "单选", "q": "当内网内没有条件建立dns服务器，又不想用IP访问网站，应配置什么文件？（）", "o": ["/etc/hosts", "/etc/sysconfig", "/etc/network", "/etc/hostname"], "a": "A", "n": "【答案正确】没有 DNS 服务器时，可在 /etc/hosts 中写入\"IP 主机名\"静态映射实现按名字访问；/etc/sysconfig（RHEL 系网络脚本目录）、/etc/network（Debian 系接口配置）都不做名字解析，/etc/hostname 只保存本机主机名。", "d": 0}, {"k": "y26", "s": 144, "t": "单选", "q": "以下哪个命令不可以查看某IP是否可达？（）", "o": ["ssh", "ping", "traceroute", "top"], "a": "D", "n": "【答案正确】top 用于查看进程与系统负载（CPU/内存），与探测 IP 可达性无关；ssh 可尝试连接目标主机、ping 测连通性、traceroute 跟踪路径，均可用于判断某 IP 是否可达。", "d": 0}, {"k": "y26", "s": 145, "t": "单选", "q": "nginx的禁止访问是通过哪个字段实现的", "o": ["deny", "allow", "autoindex", "location"], "a": "A", "n": "【答案正确】nginx 用 deny 指令拒绝指定 IP/网段的访问（如 deny 192.168.1.0/24;），allow 则为放行；autoindex 是开启目录列表，location 是路径匹配块，均与禁止访问无关。", "d": 0}, {"k": "y26", "s": 146, "t": "单选", "q": "nginx默认的页面文件名称是什么", "o": ["index.html", "index", "html", "INDEX.HTML"], "a": "A", "n": "【答案正确】nginx 默认 index 指令为 index.html，即默认站点目录下的首页文件。Linux 文件系统大小写敏感，INDEX.HTML 不会被当作默认首页；index、html 均非默认首页文件名。", "d": 0}, {"k": "y26", "s": 147, "t": "单选", "q": "nfs的共享配置文件存放在哪个目录下？", "o": ["/etc/", "/usr/", "/var/", "/sbin/"], "a": "A", "n": "【答案正确】NFS 的共享配置文件是 /etc/exports（新版还支持 /etc/exports.d/），位于 /etc 目录；/usr 放程序资源、/var 放可变数据、/sbin 放系统管理命令，均非配置文件位置。", "d": 0}, {"k": "y26", "s": 148, "t": "单选", "q": "nfs的只读权限是用下列哪个参数指定？", "o": ["ro", "rw", "readonly", "rs"], "a": "A", "n": "【答案正确】/etc/exports 的导出选项 ro 表示只读共享，rw 表示读写；readonly 和 rs 都不是 NFS 的有效导出参数。", "d": 0}, {"k": "y26", "s": 149, "t": "单选", "q": "在nfs的共享设置文件中，通过哪个参数可以指定访问用户的UID？", "o": ["all_squash", "hide", "anonuid", "anongid"], "a": "C", "n": "【答案正确】anonuid 指定匿名映射用户的 UID（常与 all_squash 搭配，把所有用户映射为该 UID）；all_squash 是触发映射的开关而非指定 UID 的参数，hide 与 UID 无关，anongid 指定的是 GID。", "d": 0}, {"k": "y26", "s": 150, "t": "单选", "q": "在nfs的共享设置文件中，通过哪个参数可以指定访问用户的GID？", "o": ["all_squash", "hide", "anonuid", "anongid"], "a": "D", "n": "【答案正确】anongid 指定匿名映射组的 GID，与 anonuid（管 UID）成对使用；all_squash 是映射开关，hide 与 GID 无关，anonuid 对应 UID 而非 GID。", "d": 0}, {"k": "y26", "s": 151, "t": "单选", "q": "在dns的配置文件中，使用哪个关键字可以定义dns服务器的类型", "o": ["view", "type", "file", "zone"], "a": "B", "n": "【答案正确】BIND 区域声明块中用 type 关键字定义服务器类型（master 主、slave 从、hint 根提示、forward 转发）；view 是分流视图、file 指定区域数据文件、zone 只是区域声明块本身。", "d": 0}, {"k": "y26", "s": 152, "t": "单选", "q": "在安装nginx时，下列软件包不是必须安装的是？", "o": ["gcc", "pcre-devel", "zlib-devel", "httpd"], "a": "D", "n": "【答案正确】源码编译安装 nginx 需要 gcc（编译器）、pcre-devel（rewrite 正则支持）、zlib-devel（gzip 模块压缩支持）；httpd 是 Apache 服务器的软件包，与 nginx 编译无关，故非必须。", "d": 0}, {"k": "y26", "s": 153, "t": "单选", "q": "nginx的日志文件存放在哪个目录？", "o": ["/etc", "/usr", "/log", "/var"], "a": "D", "n": "【答案正确】RHEL/麒麟系软件包安装的 nginx 日志位于 /var/log/nginx/（access.log、error.log），属于 /var 目录；/etc 存配置、/usr 存程序、/log 不是标准文件系统目录。（源码自编译 prefix 定制到别处的情况不在本题选项范围。）", "d": 0}, {"k": "y26", "s": 154, "t": "单选", "q": "nginx的url重写使用的关键字为？", "o": ["rewrite", "if", "set", "url_rewrite"], "a": "A", "n": "【答案正确】nginx 的 URL 重写指令是 rewrite（如 rewrite ^/(.*)$ /index.php last;）；if 是条件判断、set 只用于设置变量，url_rewrite 不是 nginx 指令。", "d": 0}, {"k": "y26", "s": 155, "t": "单选", "q": "在nginx配置文件中，定义返回值的关键字为？", "o": ["location", "root", "back", "return"], "a": "D", "n": "【答案正确】nginx 用 return 指令直接向客户端返回状态码或内容（如 return 301/return 200 \"ok\"）；location 是路径匹配块、root 指定站点根目录、back 不是 nginx 指令。", "d": 0}, {"k": "y26", "s": 156, "t": "单选", "q": "使用哪个命令可以查看时间同步的源？", "o": ["chronyc", "chronyd", "chrony", "date"], "a": "A", "n": "【答案正确】chronyc 是 chrony 的命令行客户端，chronyc sources 可查看当前时间同步源及其状态；chronyd 是守护进程本身不是查询工具，date 只显示时间，chrony 是服务/软件名而非命令。", "d": 0}, {"k": "y26", "s": 157, "t": "单选", "q": "查看当前系统时间使用的命令是？", "o": ["date", "time", "uname", "getime"], "a": "A", "n": "【答案正确】date 显示（带参数也可设置）系统当前时间；time 用于统计命令耗时、uname 查看内核与系统信息、getime 不是有效命令。", "d": 0}, {"k": "y26", "s": 158, "t": "单选", "q": "在银河麒麟服务器操作系统中，默认防火墙区域（zone）被设置为", "o": ["home", "work", "trust", "public"], "a": "D", "n": "【答案正确】麒麟 V10 使用 firewalld，默认区域为 public（接口未指定区域时归入 public）；home、work 是其他内置区域，trust 允许全部流量，均非默认。", "d": 0}, {"k": "y26", "s": 159, "t": "单选", "q": "在银河麒麟服务器操作系统中，firewalld默认每个服务是", "o": ["允许", "通过", "拒绝", "丢弃"], "a": "C", "n": "【答案正确】firewalld 默认策略是拒绝：public 区域默认 target 为 REJECT，未经 --add-service/--add-port 放行的服务连接一律被拒绝（是拒绝而非静默丢弃 drop）。", "d": 0}, {"k": "y26", "s": 160, "t": "单选", "q": "启用firewalld防火墙默认区域中的http服务，其命令为", "o": ["firewall-cmd --reload=http", "firewall-cmd --getzones=http", "firewall-cmd --get-all-roules=http", "firewall-cmd --add-service=http"], "a": "D", "n": "【答案正确】在默认区域运行时放行 http 服务的命令是 firewall-cmd --add-service=http；--reload 是重载配置、 --getzones 是查询命令，均不是放行动作。", "d": 0}, {"k": "y26", "s": 161, "t": "单选", "q": "firewalld防火墙配置文件修改后需要重新加载才能生效。防火墙加载命令为：", "o": ["firewall-cmd --reload", "firewall-cmd --getzones", "firewall-cmd --get-all-roules", "firewall-cmd --add-service"], "a": "A", "n": "【答案正确】配置文件修改后需 firewall-cmd --reload 重新加载才生效；--getzones 为查询区域命令，--add-service 是放行单个服务的动作，都不能完成重载。", "d": 0}, {"k": "y26", "s": 162, "t": "单选", "q": "记录本次开机启动的日志信息，收集来自内核，启动过程的早期阶段系统日志，该程序是", "o": ["logrotate", "systemd-journald", "xinetd", "cron"], "a": "B", "n": "【答案正确】systemd-journald 在启动早期即收集内核（kmsg）与各服务日志，开机最早期阶段的日志由它记录；logrotate 是日志轮转工具、cron 是定时任务、xinetd 是按需唤醒服务的超级守护进程，均不负责启动日志。", "d": 0}, {"k": "y26", "s": 163, "t": "单选", "q": "systemd-journald 的日志保存在 /run/log/journal 中，系统重启就会", "o": ["更新", "清除", "加载", "挂载"], "a": "B", "n": "【答案正确】/run 是 tmpfs 内存文件系统，journald 未做持久化时日志仅存于 /run/log/journal，重启即被清除；如需持久化要创建 /var/log/journal 并生效（systemd-tmpfiles --create --prefix /var/log/journal 后重启 journald）。", "d": 0}, {"k": "y26", "s": 164, "t": "单选", "q": "systemd统一管理所有的服务单元，查看系统的有关内核、应用日志信息的命令是", "o": ["journald", "xinetd", "cron", "journalctl"], "a": "D", "n": "【答案正确】journalctl 是查看 systemd 日志的命令（journalctl -k 查看内核日志、journalctl -b 查看本次开机日志）；journald 是守护进程名而非查看命令，xinetd、cron 与日志查询无关。", "d": 0}, {"k": "y26", "s": 165, "t": "单选", "q": "在麒麟服务器操作系统中，事件记录监控程序日志存放在", "o": ["/etc/logrotate.d/rsyslog", "/etc/rsyslog.conf", "/var/log/syslog", "/var/systemd"], "a": "C", "n": "【答案正确】【发行版差异】按全库统一口径系统日志位于 /var/log/syslog，选 C。A 是 logrotate 的轮转规则片段、B 是 rsyslog 主配置文件、D /var/systemd 非日志文件。注：麒麟 V10（RHEL 系）rsyslog 实际默认写 /var/log/messages，/var/log/syslog 是 Debian 系路径，仅按题库口径应答 C。", "d": 0}, {"k": "y26", "s": 166, "t": "单选", "q": "Nginx服务的主进程是", "o": ["httpd", "logrotated", "master", "named"], "a": "C", "n": "【答案正确】nginx 采用 master-worker 模型，读取配置、绑定端口并派生 worker 的主进程是 master；httpd 是 Apache 进程、named 是 DNS（BIND）进程、logrotated 并非实际进程名。", "d": 0}, {"k": "y26", "s": 167, "t": "单选", "q": "shell中将变量VAR对应内容打印到屏幕的命令是", "o": ["print $VAR", "print VAR", "echo $VAR", "echo VAR"], "a": "C", "n": "【答案正确】echo $VAR 用 $ 取变量值后由 echo 打印到屏幕；echo VAR 只原样输出字面量 VAR；print 不是 bash 的内建命令（print 是 ksh 内建，非本环境标准用法）。", "d": 0}, {"k": "y26", "s": 168, "t": "单选", "q": "FTP的工作模式有几种", "o": ["2", "3", "4", "5"], "a": "A", "n": "【答案正确】FTP 有 2 种工作模式：主动模式 PORT（服务器从 20 端口主动连客户端）和被动模式 PASV（客户端连服务器开放的高位随机端口）。", "d": 0}, {"k": "y26", "s": 169, "t": "单选", "q": "包含连接FTP的工具的软件包的名称是?", "o": ["ftp", "tftp", "vftp", "ftpd"], "a": "A", "n": "【答案正确】RHEL/麒麟系中提供 ftp 命令行客户端的软件包名就是 ftp；tftp 对应 TFTP（简单文件传输）客户端、ftpd 属服务端守护程序、vftp 并非实际存在的软件包。", "d": 0}, {"k": "y26", "s": 170, "t": "单选", "q": "为了达到使文件的所有者有读(r)和写(w)的许可，而其他用户只能进行只读访问，在设置文件的许可值时，应当设为什么？", "o": ["566", "644", "777", "744"], "a": "B", "n": "【答案正确】属主读+写为 rw-=6，其他用户只读为 r--=4，按惯例同组也只读（4），故为 644；744 多给了属主执行位（rwx），566 给了组其他写权限，777 完全放开，均不符题意。", "d": 0}, {"k": "y26", "s": 171, "t": "单选", "q": "银河麒麟服务器操作系统中以源码方式安装软件可以分为以下几个步骤：①解压源码；②执行make，编译源码；③下载源码包软件；④执行make install，将软件安装至指定目录；⑤进入解压文件目录，执行configure，生成Makefile文件。这些步骤排列正确的是（）：", "o": ["①②③⑤④", "④③②①⑤", "②①⑤③④", "③①⑤②④"], "a": "D", "n": "【答案正确】源码安装流程：③下载源码包 → ①解压 → ⑤进入解压目录执行 ./configure 生成 Makefile → ②make 编译 → ④make install 安装至指定目录，即 ③①⑤②④。", "d": 0}, {"k": "y26", "s": 172, "t": "单选", "q": "当前工作目录用什么表示？", "o": ["~", "*", ".", "$"], "a": "C", "n": "【答案正确】点符号（.）代表当前工作目录（.. 为上一级）；~ 是家目录、* 是通配符、$ 是提示符/变量引用符。", "d": 0}, {"k": "y26", "s": 173, "t": "单选", "q": "设置默认路由为192.168.1.1的命令是", "o": ["route add 192.168.1.1", "route add gw 192.168.1.1", "route add default 192.168.1.1", "route add default gw 192.168.1.1"], "a": "D", "n": "【答案正确】route 传统语法为 route add default gw 下一跳地址，D 同时写出 default 目标与 gw 关键字、语法完整；A 缺 default 与 gw，B 位置错误，C 缺 gw，均不成立。", "d": 0}, {"k": "y26", "s": 174, "t": "单选", "q": "SSH服务默认端口为", "o": ["22", "25", "161", "8080"], "a": "A", "n": "【答案正确】SSH 默认端口为 22（在 /etc/ssh/sshd_config 的 Port 定义）；25 是 SMTP、161 是 SNMP、8080 常作 HTTP 备用端口。", "d": 0}, {"k": "y26", "s": 175, "t": "单选", "q": "在/etc/passwd文件中的一行“root:x:0:0:root:/root:/bin/bash\"中第二个“root”表示的是什么意思？", "o": ["用户全名信息", "主目录", "用户别名", "使用的shell"], "a": "A", "n": "【答案正确】/etc/passwd 七字段依次为 用户名:密码:UID:GID:用户说明(GECOS):主目录:shell，第二个 root（第 5 字段）是用户全名/描述信息；主目录是第 6 字段 /root，shell 是第 7 字段 /bin/bash。", "d": 0}, {"k": "y26", "s": 176, "t": "单选", "q": "下面哪个命令不能查看用户信息？", "o": ["usermod", "who", "id", "whoami"], "a": "A", "n": "【答案正确】usermod 用于修改用户属性（如 -g 改基本组、-L 锁定），不是查看命令；who 查看在线用户、id 查看 UID/GID、whoami 显示当前有效用户名，均可查看用户信息。", "d": 0}, {"k": "y26", "s": 177, "t": "单选", "q": "银河麒麟服务器操作系统临时目录一般存在下面哪个文件夹中？", "o": ["/tmp", "/proc", "/data", "/dev"], "a": "A", "n": "【答案正确】临时文件存放于 /tmp（系统重启或按tmpwatch/systemd-tmpfiles策略清理）；/proc 是内核与进程虚拟文件系统、/dev 存设备文件、/data 非标准目录。", "d": 0}, {"k": "y26", "s": 178, "t": "单选", "q": "若当前目录为/home,命令ls –l 将显示什么信息？", "o": ["所有文件", "所有隐藏文件", "所有非隐藏文件", "所有非隐藏文件的具体信息"], "a": "D", "n": "【答案正确】ls -l 以长格式列出目录下所有非隐藏文件的详细信息（权限、链接数、属主属组、大小、修改时间、文件名）；点开头隐藏文件需 -a 才显示，仅列文件名的是不加 -l 的 ls。", "d": 0}, {"k": "y26", "s": 179, "t": "单选", "q": "存放用于系统启动的内核文件和引导装载程序文件的目录是哪个？", "o": ["/bin", "/boot", "/dev", "/etc"], "a": "B", "n": "【答案正确】/boot 存放系统启动所需文件，含内核 vmlinuz、initramfs 与 GRUB 引导程序；/bin 存命令、/dev 存设备文件、/etc 存配置文件。", "d": 0}, {"k": "y26", "s": 180, "t": "单选", "q": "文件权限读、写、执行的三种标志符号依次是", "o": ["rwx", "xrw", "rdx", "srw"], "a": "A", "n": "【答案正确】读、写、执行的符号标志按序为 r、w、x（对应八进制 4、2、1），合写为 rwx；其余选项顺序或字母均不正确（xrw 颠倒、rdx/srw 中 d 和 s 不是读写执行符号）。", "d": 0}, {"k": "y26", "s": 181, "t": "单选", "q": "通配符a[1-6]最多可以表示多少个文件名？", "o": ["10", "6", "5", "1"], "a": "B", "n": "【答案正确】[1-6] 是范围字符集，匹配 1～6 中任意一个字符，a[1-6] 即可匹配 a1～a6，最多表示 6 个文件名（不是 6-1=5，区间两端都取）。", "d": 0}, {"k": "y26", "s": 182, "t": "单选", "q": "ls -l 命令不能够列出文件的哪些内容？", "o": ["链接数", "文件名", "存取权限", "文件内容在磁盘的位置"], "a": "D", "n": "【答案正确】ls -l 输出权限、链接数、属主属组、大小、时间、文件名；文件内容在磁盘上的物理块位置属于文件系统底层信息（需 debugfs/stat 之类工具），ls -l 不显示。", "d": 0}, {"k": "y26", "s": 183, "t": "单选", "q": "将整个目录树的文件名都显示出来的命令是", "o": ["ls -f", "ls -R", "dir /s", "ls -all"], "a": "B", "n": "【答案正确】ls -R 递归列出目录及其全部子目录的文件名；ls -f 只是关闭排序不递归，ls -all 是非规范写法（被解析为 -a -l -l，无递归），dir /s 是 Windows/DOS 命令。", "d": 0}, {"k": "y26", "s": 184, "t": "单选", "q": "退出交互式登录状态，应键入的shell命令是什么？（）", "o": ["ESC", "q", "exit", "quit"], "a": "C", "n": "【答案正确】退出交互式登录 shell 用 exit（等效于按 Ctrl+D）；ESC 和 q 是 less/vim 等交互程序的按键，quit 不是合法 shell 命令。", "d": 0}, {"k": "y26", "s": 185, "t": "单选", "q": "以下哪个环境变量表示当前路径？（）", "o": ["PWD", "HOME", "ROOT", "PATH"], "a": "A", "n": "【答案正确】环境变量 PWD 保存当前工作目录完整路径（可用 echo $PWD 或 printenv PWD 验证）；HOME 是家目录、PATH 是命令搜索路径、ROOT 不是标准环境变量。", "d": 0}, {"k": "y26", "s": 186, "t": "单选", "q": "如果你使用一个普通账户ssh远程登录到银河麒麟服务器操作系统中，使用以下哪个命令可以改变身份以root权限管理", "o": ["chgrp", "su", "chusr", "chmod"], "a": "B", "n": "【答案正确】普通用户登录后用 su 命令（输入 root 密码）切换为 root 进行管理；chgrp 改属组、chmod 改文件权限，chusr 不是标准命令。", "d": 0}, {"k": "y26", "s": 187, "t": "单选", "q": "下列哪个字段可以开启nginx压缩功能", "o": ["gzip", "user", "pid", "server"], "a": "A", "n": "【答案正确】nginx 配置中 gzip on; 开启响应内容压缩（可配 gzip_min_length、gzip_comp_level 等）；user 指定运行用户、pid 指定 PID 文件路径、server 是虚拟主机配置块。", "d": 0}, {"k": "y26", "s": 188, "t": "单选", "q": "nginx配置文件中定义web主目录的字段是", "o": ["listen", "root", "pid", "gzip"], "a": "B", "n": "【答案正确】nginx 用 root 指令定义 web 站点主目录（默认 root /usr/share/nginx/html/）；listen 设监听端口、pid 设主进程 PID 文件路径、gzip 是压缩开关。", "d": 0}, {"k": "y26", "s": 189, "t": "单选", "q": "nfs服务使用的端口是？", "o": ["2049", "111", "25", "110"], "a": "A", "n": "【答案正确】NFS 服务本身监听 TCP 2049（NFSv4 仅需 2049，NFSv3 还需 rpcbind 辅助端口）；111 是 rpcbind、25 是 SMTP、110 是 POP3。", "d": 0}, {"k": "y26", "s": 190, "t": "单选", "q": "rpcbind使用的端口是？", "o": ["2049", "111", "25", "110"], "a": "B", "n": "【答案正确】rpcbind（旧称 portmap）监听 TCP/UDP 111，为 NFS 等 RPC 服务做端口映射；2049 是 NFS、25 是 SMTP、110 是 POP3。", "d": 0}, {"k": "y26", "s": 191, "t": "单选", "q": "在nfs共享的配置文件中，下列哪个字段使用来指定数据同步写入的？", "o": ["async", "ro", "rw", "sync"], "a": "D", "n": "【答案正确】/etc/exports 中 sync 表示同步写入：响应请求前先把数据落盘，更安全；async 为异步写入（性能高但断电可能丢数据），ro/rw 只控制读写权限，与落盘方式无关。", "d": 0}, {"k": "y26", "s": 192, "t": "单选", "q": "下列哪个文件是用来记录nfs的完整权限设定值的？", "o": ["etab", "nfs", "nfs.conf", "exports"], "a": "A", "n": "【答案正确】NFS 导出生效后展开的完整权限（含全部默认选项）记录在 /var/lib/nfs/etab；exports (/etc/exports) 只是管理员编辑的配置源文件，nfs.conf 是服务运行参数文件，nfs 并非权限记录文件。", "d": 0}, {"k": "y26", "s": 193, "t": "单选", "q": "如果想让dns以chroot模式运行，需要安装哪个软件包？", "o": ["bind-chroot", "named-chroot", "chroot", "name-chroot"], "a": "A", "n": "【答案正确】DNS(BIND)以 chroot 方式运行需安装 bind-chroot 包，安装后服务以 /var/named/chroot 为伪根，named-chroot 是该包提供的服务名而非包名，chroot/name-chroot 均非实际包名。", "d": 0}, {"k": "y26", "s": 194, "t": "单选", "q": "在dns的配置文件中，每一行需要以哪个符号结尾？", "o": [";", ",", ":", "/"], "a": "A", "n": "【答案正确】BIND 的 named.conf 中每条语句、每个资源记录字段都必须以分号 ; 结尾，这是 BIND 配置语法的硬性要求，缺少分号会导致 named 启动报错。逗号、冒号、斜杠均不符合语法。", "d": 0}, {"k": "y26", "s": 195, "t": "单选", "q": "在dns的配置文件中，使用哪个关键字可以定义一个视图？", "o": ["view", "acl", "type", "file"], "a": "A", "n": "【答案正确】BIND 配置中用 view 语句定义视图（根据客户端来源地址返回不同解析结果，view 必须写在 options 之后且所有 zone 之外）。acl 定义地址匹配列表，type 指定区域类型（master/slave/hint 等），file 指定区域文件，均与视图无关。", "d": 0}, {"k": "y26", "s": 196, "t": "单选", "q": "在dns的配置文件中，使用哪个关键字可以定义dns解析文件的名称", "o": ["file", "zone", "type", "acl"], "a": "A", "n": "【答案正确】zone 块中用 file \"xxx.zone\" 指定该区域的解析（区域数据）文件名。zone 声明区域名，type 定义区域类型，acl 定义地址列表，都不是指定文件名的关键字。", "d": 0}, {"k": "y26", "s": 197, "t": "单选", "q": "如果想要修改nginx的端口的话，需要修改配置文件中的那个字段？", "o": ["listen", "access_log", "location", "root"], "a": "A", "n": "【答案正确】nginx 监听端口由 listen 指令定义（如 listen 8080;），改端口即改它。access_log 定义访问日志，location 是路径匹配块，root 指定站点根目录。", "d": 0}, {"k": "y26", "s": 198, "t": "单选", "q": "在nginx的配置文件中，通过哪个字段定义主页文件名称？", "o": ["listen", "home", "homepage", "index"], "a": "D", "n": "【答案正确】nginx 用 index 指令定义默认主页文件（如 index index.html index.htm;）。listen 定义监听端口，home/homepage 不是 nginx 指令。", "d": 0}, {"k": "y26", "s": 199, "t": "单选", "q": "在nginx配置文件中，使用哪个字段禁止用户访问", "o": ["deny", "disable", "stop", "drop"], "a": "A", "n": "【答案正确】nginx 的访问控制用 allow/deny 指令（基于 ngx_http_access_module），如 deny 192.168.1.0/24; 禁止该网段访问。disable/stop/drop 不是 nginx 指令。", "d": 0}, {"k": "y26", "s": 200, "t": "单选", "q": "在时间服务器中，下列哪个字段定义允许的网段？", "o": ["allow", "allow-networks", "pool", "logdir"], "a": "A", "n": "【答案正确】chrony 时间服务器在 /etc/chrony.conf 中用 allow \u003c网段> 允许指定网段的客户端进行时间同步。pool 用于定义 NTP 源池，logdir 指定日志目录，allow-networks 不是 chrony 的配置关键字。", "d": 0}, {"k": "y26", "s": 201, "t": "单选", "q": "系统中使用哪个命令查看时区？", "o": ["time", "date", "timedatectl", "timectl"], "a": "C", "n": "【答案正确】timedatectl 可查看/设置时区（timedatectl set-timezone）、NTP 同步状态等。date 显示系统时间（带时区缩写）但不用于管理时区，time 是命令计时工具，timectl 不是有效命令。", "d": 0}, {"k": "y26", "s": 202, "t": "单选", "q": "ansible 中定义被管理主机的文件是", "o": ["hosts", "roles", "playbook", "group"], "a": "A", "n": "【答案正确】ansible 的被管理主机定义在 inventory（主机清单）文件中，默认为 /etc/ansible/hosts。roles 是角色目录，playbook 是任务剧本（YAML），group 是清单内的主机组概念而非文件。", "d": 0}, {"k": "y26", "s": 203, "t": "单选", "q": "在chrony中，下列哪个字段可以定义时间服务器？", "o": ["timeserver", "time", "pool", "iburst"], "a": "C", "n": "【答案正确】chrony 用 server \u003c地址> 或 pool \u003c地址> 定义时间服务器（pool指向一组服务器），选项中只有 pool 有效。iburst 只是 server/pool 行的选项（首次同步时加速），timeserver/time 不是 chrony 关键字。", "d": 0}, {"k": "y26", "s": 204, "t": "单选", "q": "firewall防火墙提供了一个 daemon 和 service，还有命令行和图形界面配置工具，其底层使用的防火墙管理规则是", "o": ["firewalld", "iptables", "filter", "router"], "a": "B", "n": "【答案正确】firewalld 是规则管理前端，底层调用 netfilter 之上的 iptables 规则体系实现包过滤（麒麟V10/openEuler 系的 firewalld 默认后端 FirewallBackend=iptables）。firewalld 是其守护进程自身，filter 只是 iptables 的一张表，router 与此无关。【发行版差异】上游 firewalld 0.6+ 在支持 nftables 的发行版（如 RHEL8 上游默认配置）可改用 nftables 后端，但本题按麒麟教学口径选 iptables。", "d": 0}, {"k": "y26", "s": 205, "t": "单选", "q": "实现日志切割，保留最新的日志记录，该程序为", "o": ["logrotate", "xinetd", "systemd", "message"], "a": "A", "n": "【答案正确】logrotate 是日志切割（轮转）工具，按周期切割压缩旧日志并保留最新记录，配置于 /etc/logrotate.conf 与 /etc/logrotate.d/。xinetd 是超级守护进程，systemd 是 init 系统，message 是日志文件名。", "d": 0}, {"k": "y26", "s": 206, "t": "单选", "q": "日志轮转主配置文件是", "o": ["/etc/logrotate.d/rsyslog", "/etc/rsyslog.conf", "/etc/logrotate.conf", "/etc/systemd"], "a": "C", "n": "【答案正确】logrotate 主配置文件为 /etc/logrotate.conf，/etc/logrotate.d/ 下是各服务的子配置片段（如 rsyslog），由主配置 include 进来。/etc/rsyslog.conf 是 rsyslog 的配置，/etc/systemd 是目录。", "d": 0}, {"k": "y26", "s": 207, "t": "单选", "q": "启动日志轮转的守护进程是", "o": ["logrotate", "xinetd", "cron", "systemd"], "a": "C", "n": "【答案正确】logrotate 本身不是常驻守护进程，传统上由 crond 定时执行 /etc/cron.daily/logrotate 来触发轮转，故\"启动日志轮转的守护进程\"答 cron。xinetd 是按需启动服务的超级守护，systemd 是 init（新版发行版也有 logrotate.timer 机制，但本题口径与教材一致为 cron）。", "d": 0}, {"k": "y26", "s": 208, "t": "单选", "q": "检测系统磁盘I/O瓶颈的常用命令有", "o": ["iostat", "sysstat", "netstat", "vmstat"], "a": "A", "n": "【答案正确】iostat 报告磁盘 I/O 统计（tps、await、%util 等），是检测磁盘 I/O 瓶颈的常用命令。sysstat 是包含 iostat/sar/mpstat 的软件包名而非单条命令，netstat 查网络连接，vmstat 侧重内存/CPU/进程。", "d": 0}, {"k": "y26", "s": 209, "t": "单选", "q": "Nginx是一个轻量级什么服务器", "o": ["数据库", "web", "域名解析", "时间"], "a": "B", "n": "【答案正确】nginx 是轻量级高性能的 web（HTTP）服务器，也常用作反向代理/负载均衡。它与数据库、DNS（bind）、时间服务（chrony）无关。", "d": 0}
