<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b4bd6">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>信创规划管理师题库</title>
<style>
  :root{ --blue:#5b4bd6; --blue-d:#4232b4; --blue-l:#eeecfc; --green:#1e9e58; --green-l:#e6f6ee;
         --red:#d64545; --red-l:#fdeeee; --amber:#e8990c; --amber-l:#fdf3e0;
         --bg:#f1f3f8; --card:#fff; --line:#e4e8f0; --soft:#f8fafd; --field:#f8fafd; --soft2:#edf1f7;
         --text:#232a3b; --muted:#7c8597; }
  body.dark{ --bg:#10141d; --card:#1a2233; --line:#2a3450; --soft:#202a3d; --field:#202a3d; --soft2:#232c40;
             --text:#e7ecf6; --muted:#92a0b8; --blue:#8f7bff; --blue-d:#b9adff; --blue-l:#2b2454;
             --green:#37b573; --green-l:#173429; --red:#e05c5c; --red-l:#3a1d1d;
             --amber:#e8a53a; --amber-l:#3a2d13; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  .opt,.btn,.star,.seg,.tab-item,.chin,.hbtn{ touch-action:manipulation; }
  body{ margin:0; background:var(--bg); color:var(--text); font-size:15px; padding-bottom:env(safe-area-inset-bottom);
        font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
        transition:background .2s,color .2s; }
  button{ font-family:inherit; }

  /* ===== 顶部 ===== */
  .topwrap{ position:sticky; top:0; z-index:20; box-shadow:0 1px 8px rgba(24,44,90,.10); }
  .appbar{ display:flex; align-items:center; gap:10px; padding:10px 14px;
           background:linear-gradient(135deg,#5b4bd6,#7a68f0 70%,#9083f5); color:#fff; }
  .brand{ font-weight:800; font-size:16.5px; letter-spacing:.5px; display:flex; align-items:center; gap:7px; }
  .brand .logo{ width:24px; height:24px; border-radius:7px; background:rgba(255,255,255,.22);
                display:flex; align-items:center; justify-content:center; font-size:14px; }
  .appactions{ margin-left:auto; display:flex; gap:8px; }
  .hbtn{ position:relative; border:none; background:rgba(255,255,255,.18); color:#fff; border-radius:10px;
         padding:7px 11px; font-size:14px; cursor:pointer; }
  .hbtn .bub{ background:#fff; color:var(--blue-d); border-radius:999px; font-weight:800; font-size:12px;
              padding:0 6px; margin-left:4px; }
  body.dark .hbtn{ color:#fff; }
  .toolbar{ background:var(--card); padding:9px 12px 10px; transition:background .2s; }
  .seg{ display:flex; background:var(--soft2); border-radius:11px; padding:3px; gap:2px; }
  .seg button{ flex:1; border:none; background:transparent; padding:8px 2px; border-radius:9px;
               font-size:14px; color:var(--muted); cursor:pointer; font-weight:600; }
  .seg button.on{ background:var(--card); color:var(--blue-d); box-shadow:0 1px 4px rgba(24,44,90,.14); }
  body.dark .seg button.on{ background:var(--soft); }
  .picks{ display:flex; gap:7px; margin-top:8px; }
  .selwrap{ position:relative; }
  .selwrap::after{ content:'▾'; position:absolute; right:9px; top:50%; transform:translateY(-54%);
                   color:var(--muted); font-size:12px; pointer-events:none; }
  select{ appearance:none; -webkit-appearance:none; border:1px solid var(--line); background:var(--field);
          border-radius:10px; padding:9px 24px 9px 10px; font-size:14px; color:var(--text); max-width:220px;
          outline:none; }
  select:focus{ border-color:var(--blue); }
  .searchwrap{ flex:1; position:relative; }
  .sic{ position:absolute; left:9px; top:50%; transform:translateY(-52%); color:var(--muted); }
  .searchwrap input{ width:100%; border:1px solid var(--line); background:var(--field); border-radius:10px;
                     padding:9px 10px 9px 29px; font-size:16px; color:var(--text); outline:none; min-width:0; }
  .searchwrap input:focus{ border-color:var(--blue); }
  .gbarw{ margin-top:9px; display:flex; align-items:center; gap:8px; }
  .gtrack{ flex:1; height:5px; background:var(--soft2); border-radius:99px; overflow:hidden; }
  .gbar{ height:100%; width:0; background:linear-gradient(90deg,var(--blue),var(--amber)); border-radius:99px; transition:width .25s; }
  #gpText{ font-size:12px; color:var(--muted); white-space:nowrap; }

  /* ===== 主体 ===== */
  .wrap{ max-width:820px; margin:0 auto; padding:10px 12px calc(86px + env(safe-area-inset-bottom)); }
  @media (min-width:641px){ .wrap{ padding-bottom:20px; } }
  .stats{ display:flex; flex-wrap:wrap; gap:5px 6px; align-items:center; margin:2px 2px 9px;
          color:var(--muted); font-size:13px; }
  .statchip{ display:inline-flex; align-items:center; gap:4px; background:var(--card); border:1px solid var(--line);
             border-radius:999px; padding:3px 10px; font-size:12.5px; color:var(--muted); }
  .statchip b{ color:var(--text); }
  .statchip.hero{ background:var(--blue-l); border-color:#d7e4fa; color:var(--blue-d); font-weight:600; }
  body.dark .statchip.hero{ border-color:#2c3f68; }
  .statchip.link{ cursor:pointer; }
  .statchip.link:active{ border-color:var(--blue); }
  .statchip.cta{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:700; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
         box-shadow:0 1px 3px rgba(20,40,80,.05); }
  .meta{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px; }
  .chin{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; }
  .chin.bank{ background:var(--blue-l); color:var(--blue-d); font-weight:600; }
  .chin.gray{ background:var(--soft2); color:var(--muted); }
  .chin.fixed{ background:var(--green-l); color:var(--green); font-weight:600; }
  .chin.warn{ background:var(--amber-l); color:var(--amber); font-weight:600; }
  .star{ font-size:21px; cursor:pointer; background:none; border:none; padding:0 4px; line-height:1; color:#c6ccda; }
  .star svg{ stroke:#c6ccda; }
  .star.on{ color:#f5b301; }
  .star.on svg{ stroke:#f5b301; fill:#f5b301; }
  .ic{ vertical-align:-2px; }
  .brand .logo .ic{ stroke:#fff; }
  .verdict .ic{ vertical-align:-3px; }
  .appbar .ic{ vertical-align:-3px; }
  .stem{ font-weight:650; font-size:16px; line-height:1.7; white-space:pre-wrap; }
  .opts{ display:flex; flex-direction:column; gap:9px; margin-top:14px; }
  .opt{ display:flex; gap:10px; align-items:flex-start; padding:12px 13px; border:1.5px solid var(--line);
        border-radius:12px; cursor:pointer; background:var(--soft); line-height:1.55; font-size:15px; text-align:left; }
  .opt .letter{ font-weight:800; color:var(--blue-d); min-width:18px; }
  .opt.sel{ border-color:var(--blue); background:var(--blue-l); }
  .opt.ok{ border-color:var(--green); background:var(--green-l); } .opt.ok .letter{ color:var(--green); }
  .opt.bad{ border-color:var(--red); background:var(--red-l); } .opt.bad .letter{ color:var(--red); }
  .locked .opt{ cursor:default; }
  .verdict{ margin-top:13px; padding:11px 13px; border-radius:11px; font-weight:700; }
  .verdict.ok{ background:var(--green-l); color:var(--green); }
  .verdict.bad{ background:var(--red-l); color:var(--red); }
  .why{ margin-top:10px; padding:12px 14px; border-radius:11px; background:var(--soft2); color:#3a4358;
        line-height:1.75; font-size:14px; white-space:pre-wrap; }
  body.dark .why{ color:#c6d0e0; }
  .multi-note{ margin-top:10px; color:var(--muted); font-size:13px; }
  .bigcta{ width:100%; margin-top:13px; padding:13px; font-size:16px; }
  .nav{ margin:14px 0 4px; }
  .navbtns{ display:flex; gap:10px; }
  .navbtns .btn{ flex:1; }
  .jrow{ display:flex; gap:6px; align-items:center; justify-content:center; color:var(--muted);
         font-size:13px; margin-top:10px; }
  .nav input[type=number]{ width:74px; font-size:16px; padding:8px; border:1px solid var(--line);
                           border-radius:10px; outline:none; background:var(--field); color:var(--text); }
  .nav input[type=number]:focus{ border-color:var(--blue); }
  .btn{ padding:10px 14px; border:1px solid var(--line); border-radius:11px; background:var(--card); cursor:pointer;
        font-size:14.5px; color:var(--text); }
  .btn:hover{ border-color:var(--blue); }
  .btn.primary{ background:var(--blue); border-color:var(--blue); color:#fff; font-weight:650; }
  .btn.danger{ color:var(--red); border-color:#f2caca; }
  body.dark .btn.danger{ border-color:#4a2530; }
  .btn:disabled{ opacity:.4; cursor:default; }

  /* ===== 底部标签栏（手机） ===== */
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:space-around;
           background:rgba(255,255,255,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line);
           padding:6px 4px calc(6px + env(safe-area-inset-bottom)); }
  body.dark .tabbar{ background:rgba(16,20,29,.96); }
  .tab-item{ flex:1; border:none; background:none; display:flex; flex-direction:column; align-items:center;
             gap:2px; font-size:11.5px; color:var(--muted); cursor:pointer; padding:4px 0; border-radius:10px;
             position:relative; }
  .tab-item .ic{ width:20px; height:20px; display:flex; align-items:center; justify-content:center; }
  .tab-item.on{ color:var(--blue-d); font-weight:700; }
  body.dark .tab-item.on{ color:var(--blue); }
  .tbub{ position:absolute; top:-2px; left:calc(50% + 6px); background:var(--red); color:#fff; font-size:10.5px;
         font-weight:800; border-radius:999px; padding:1px 5.5px; line-height:1.5; }
  .tbub.amber{ background:var(--amber); }
  .tbub.zero{ display:none; }

  /* ===== 抽屉 ===== */
  .mask{ position:fixed; inset:0; background:rgba(15,25,48,.48); z-index:40; display:none; }
  .mask.open{ display:block; }
  .panel{ position:absolute; left:0; right:0; bottom:0; max-height:88%; background:var(--bg);
          border-radius:18px 18px 0 0; display:flex; flex-direction:column; padding-bottom:env(safe-area-inset-bottom);
          animation:up .18s ease; }
  @keyframes up{ from{ transform:translateY(40px); opacity:.4; } to{ transform:none; opacity:1; } }
  .grab{ width:42px; height:4.5px; border-radius:99px; background:var(--muted); opacity:.5; margin:9px auto 2px; }
  .phead{ display:flex; align-items:center; gap:8px; padding:6px 14px 10px; flex-wrap:wrap; }
  .phead .ttl{ font-size:16.5px; font-weight:800; display:flex; align-items:center; gap:7px; }
  .phead .cnt{ background:var(--blue-l); color:var(--blue-d); border-radius:999px; font-size:12.5px;
               font-weight:800; padding:2px 9px; }
  .phead .sp{ flex:1; }
  .pbody{ overflow:auto; padding:2px 12px calc(14px + env(safe-area-inset-bottom)); }
  .pgroup{ margin:10px 4px 3px; color:var(--muted); font-size:12.5px; font-weight:700;
           display:flex; align-items:center; gap:6px; }
  .pgroup::after{ content:''; flex:1; height:1px; background:var(--line); }
  .item{ display:flex; gap:10px; align-items:center; background:var(--card); border:1px solid var(--line);
         border-radius:13px; padding:12px 12px; margin:7px 1px; cursor:pointer; }
  .item[data-kind="wrong"]{ border-left:4px solid var(--red); }
  .item[data-kind="star"]{ border-left:4px solid var(--amber); }
  .item .info{ flex:1; min-width:0; }
  .item .meta{ color:var(--muted); font-size:12px; margin-bottom:3px; }
  .item .t{ font-size:14px; line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .iwbtn{ flex:none; border:none; background:var(--red-l); color:var(--red); border-radius:9px;
          padding:7px 9px; font-size:12.5px; font-weight:700; cursor:pointer; }
  .item[data-kind="star"] .iwbtn{ background:var(--amber-l); color:var(--amber); }
  .two{ display:flex; gap:8px; margin-top:2px; }
  .two .btn{ flex:1; }
  .chips{ display:flex; flex-direction:column; gap:2px; padding:2px 4px; }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 6px;
        border-bottom:1px solid var(--line); font-size:15px; }
  .row:last-child{ border-bottom:none; }
  .row .hint{ display:block; color:var(--muted); font-size:12.5px; margin-top:3px; font-weight:400; }
  .sw{ position:relative; width:46px; height:27px; flex:none; }
  .sw input{ opacity:0; width:100%; height:100%; position:absolute; margin:0; cursor:pointer; z-index:2; }
  .sw .kn{ position:absolute; inset:0; background:var(--muted); opacity:.65; border-radius:99px; transition:.15s; }
  .sw .kn::after{ content:''; position:absolute; top:3px; left:3px; width:21px; height:21px; background:var(--card);
                  border-radius:50%; transition:.15s; box-shadow:0 1px 3px rgba(0,0,0,.25); }
  .sw input:checked + .kn{ background:var(--green); opacity:1; }
  .sw input:checked + .kn::after{ left:22px; }
  .psec{ color:var(--muted); font-size:12.5px; font-weight:700; margin:12px 4px 7px; }
  .szchips{ display:flex; gap:7px; flex-wrap:wrap; padding:0 4px; }
  .szchips button{ border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px;
                   padding:8px 14px; font-size:14px; cursor:pointer; }
  .szchips button.on{ border-color:var(--blue); background:var(--blue-l); color:var(--blue-d); font-weight:700; }
  .statcard{ background:var(--card); border:1px solid var(--line); border-radius:13px; padding:13px 14px; margin:8px 1px; }
  .statcard .nm{ font-weight:700; font-size:14.5px; display:flex; justify-content:space-between; }
  .statcard .nm span{ color:var(--muted); font-weight:500; font-size:12.5px; }
  .sbar{ height:7px; background:var(--soft2); border-radius:99px; margin-top:9px; overflow:hidden; }
  .sbar i{ display:block; height:100%; border-radius:99px; }
  .sbar.done i{ background:var(--blue); } .sbar.acc i{ background:var(--green); }
  .srow{ display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); margin-top:5px; }
  .srow .lbl{ width:30px; flex:none; }
  .srow .acc-t{ width:78px; flex:none; text-align:right; }
  .srow .sbar{ flex:1; margin:0; }
  .bchart{ display:flex; align-items:flex-end; gap:6px; height:96px; padding-top:6px; }
  .bcol{ flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; }
  .bcol .bb{ width:100%; max-width:34px; border-radius:5px 5px 2px 2px; background:var(--blue); opacity:.85; min-height:2px; }
  .bcol .bl{ font-size:10.5px; color:var(--muted); white-space:nowrap; }
  .bcol .bv{ font-size:11px; font-weight:700; color:var(--text); }
  .result-card{ text-align:center; padding:8px 4px 4px; }
  .result-big{ font-size:46px; font-weight:800; color:var(--blue-d); margin:6px 0 2px; }
  .result-detail{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 16px; }
  .rd-item{ background:var(--card); border:1px solid var(--line); border-radius:11px; padding:11px 6px; }
  .rd-item b{ display:block; font-size:19px; font-weight:700; }
  .rd-item span{ font-size:12px; color:var(--muted); }
  .r-ok{ color:var(--green) !important; } .r-bad{ color:var(--red) !important; }
  .gridcells{ display:grid; grid-template-columns:repeat(auto-fill,minmax(54px,1fr)); gap:8px; }
  .gcell{ border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:10px;
          padding:10px 0; font-size:13.5px; font-weight:600; cursor:pointer; position:relative; }
  .gcell.ok{ background:var(--green-l); border-color:var(--green); color:var(--green); }
  .gcell.bad{ background:var(--red-l); border-color:var(--red); color:var(--red); }
  .gcell.cur{ outline:2.5px solid var(--blue); outline-offset:1px; }
  .gcell .stmark{ position:absolute; top:1px; right:3px; font-size:9px; }
  .glegend{ display:flex; gap:13px; margin-top:12px; font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .glegend i{ display:inline-block; width:11px; height:11px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .empty-big{ text-align:center; padding:44px 10px 30px; color:var(--muted); }
  .empty-big .em{ font-size:44px; display:block; margin-bottom:10px; }
  @media (min-width:641px){
    .tabbar{ display:none; }
    .wrap{ padding-bottom:20px; }
    .panel{ left:50%; right:auto; bottom:auto; top:50%; transform:translate(-50%,-50%); width:680px;
            max-height:84%; border-radius:16px; padding-bottom:14px; animation:pop .15s ease; }
    @keyframes pop{ from{ transform:translate(-50%,-48%); opacity:.35; } to{ transform:translate(-50%,-50%); opacity:1; } }
    .grab{ display:none; }
  }
  @media (max-width:640px){
    .appbar{ padding:9px 12px; }
    .toolbar{ padding:9px 10px 10px; }
    .picks{ flex-wrap:wrap; }
    .picks select{ max-width:none; }
    .picks .selwrap{ flex:1 1 38%; }
    .picks .searchwrap{ flex:1 1 100%; }
    .stem{ font-size:16px; }
  }
</style>
</head>
<body>

<header class="topwrap">
  <div class="appbar">
    <div class="brand"><span class="logo" data-ic="book" data-ics="14"></span>信创规划管理师题库</div>
    <div class="appactions">
      <button class="hbtn" id="hStar"><span data-ic="star" data-ics="14"></span><span class="bub" id="hStarN">0</span></button>
      <button class="hbtn" id="hWrong"><span data-ic="shield" data-ics="14"></span><span class="bub" id="hWrongN">0</span></button>
      <button class="hbtn" id="hSet"><span data-ic="gear" data-ics="14"></span></button>
    </div>
  </div>
  <div class="toolbar">
    <div class="seg" id="modeSeg">
      <button data-m="seq">顺序</button>
      <button data-m="random">随机</button>
      <button data-m="wrong">错题</button>
      <button data-m="star">收藏</button>
    </div>
    <div class="picks">
      <div class="selwrap"><select id="bankSel"></select></div>
      <div class="selwrap"><select id="typeSel">
        <option value="all">全部题型</option><option value="单选">单选题</option>
        <option value="多选">多选题</option><option value="判断">判断题</option><option value="背诵卡">背诵卡</option>
      </select></div>
      <div class="searchwrap"><span class="sic" data-ic="search" data-ics="13"></span><input id="search" type="search" placeholder="搜题干 / 选项关键词"></div>
    </div>
    <div class="gbarw"><div class="gtrack"><div class="gbar" id="gBar"></div></div><span id="gpText"></span></div>
  </div>
</header>

<main class="wrap">
  <div class="stats" id="stats"></div>
  <div class="card" id="card"></div>
  <div class="nav">
    <div class="navbtns">
      <button class="btn" id="prevBtn">← 上一题</button>
      <button class="btn primary" id="nextBtn">下一题 →</button>
    </div>
    <div class="jrow">跳到第 <input type="number" id="jumpNo" min="1"> 题 <button class="btn" id="jumpBtn">跳转</button></div>
  </div>
</main>

<nav class="tabbar" id="tabbar">
  <button class="tab-item on" data-tab="quiz"><span class="ic" data-ic="book" data-ics="20"></span>刷题</button>
  <button class="tab-item" data-tab="wrong"><span class="ic" data-ic="shield" data-ics="20"></span>错题本<span class="tbub" id="nWrong">0</span></button>
  <button class="tab-item" data-tab="star"><span class="ic" data-ic="star" data-ics="20"></span>收藏集<span class="tbub amber" id="nStar">0</span></button>
  <button class="tab-item" data-tab="set"><span class="ic" data-ic="gear" data-ics="20"></span>设置</button>
</nav>

<div class="mask" id="sheetWrong">
  <div class="panel">
    <div class="grab"></div>
    <div class="phead">
      <span class="ttl"><span data-ic="shield" data-ics="16"></span> 错题集 <span class="cnt" id="wHeadN">0</span></span><span class="sp"></span>
      <button class="btn" id="wClose">✕ 关闭</button>
    </div>
    <div class="pbody">
      <div class="two">
        <button class="btn primary" id="wRetry"><span data-ic="play" data-ics="13"></span> 一键重刷全部错题</button>
        <button class="btn danger" id="wClear"><span data-ic="trash" data-ics="13"></span> 清空错题</button>
      </div>
      <div id="wList"></div>
    </div>
  </div>
</div>

<div class="mask" id="sheetStar">
  <div class="panel">
    <div class="grab"></div>
    <div class="phead">
      <span class="ttl"><span data-ic="star" data-ics="16"></span> 收藏集 <span class="cnt" id="sHeadN">0</span></span><span class="sp"></span>
      <button class="btn" id="sClose">✕ 关闭</button>
    </div>
    <div class="pbody">
      <div class="two">
        <button class="btn primary" id="sRetry"><span data-ic="play" data-ics="13"></span> 一键重刷全部收藏</button>

const RAW = [{"k": "dx", "s": 1, "t": "单选", "q": "在某省级政务项目规划中，双轨运行的含义是（）", "o": ["运行新系统并停用旧系统", "新旧系统同时运行验证稳定性", "运行旧系统暂不切换新系统", "随机切换系统运行模式"], "a": "B", "n": "双轨（并行）运行指新国产化环境与旧环境同步部署、同步运行、业务流量双向同步并实时对比运行状态，用并行期验证国产化环境稳定性（知识点总结“并行运行实施方案”）；A、C 未保持新旧系统同时运行，D 的“随机切换”没有对比验证机制。", "d": 0}, {"k": "dx", "s": 2, "t": "单选", "q": "在国产化战略推进过程中，应用市场系统应支持的国产化技术路线是（）路线。", "o": ["龙芯+麒麟", "飞腾+麒麟", "鲲鹏+UOS", "信创全适配"], "a": "D", "n": "应用市场面向全部信创终端提供应用分发与适配管理，必须对龙芯、飞腾、鲲鹏等芯片路线和麒麟、统信UOS等操作系统全适配（知识点总结“主流技术路线”）；A、B、C 只是某一固定组合，覆盖不了其他信创终端。", "d": 0}, {"k": "dx", "s": 3, "t": "单选", "q": "在某国有银行国产化产品选型评估中，国产化采购的核心要求是（）", "o": ["国产化比例", "价格最低", "进口品牌", "快速交付"], "a": "A", "n": "信创采购的核心要求是国产化比例、安全资质、适配能力、服务能力与供应链稳定（知识点总结“信创采购”）；“价格最低”是传统招标倾向，与信创自主可控导向不符，“进口品牌”更直接违背国产化要求。", "d": 0}, {"k": "dx", "s": 4, "t": "单选", "q": "在某国有银行国产化产品选型评估中，国产化需求归集后，结果分析的核心任务是（）", "o": ["需求分类排序与可行性分析", "直接进入系统设计开发", "编写用户操作手册文档", "制定硬件采购计划方案"], "a": "A", "n": "需求归集后要先分类排序并做可行性分析，据此确定适配、改造、替换的优先级与推进时序（知识点总结“可行性研究”“适配策略”）；直接开发（B）会把未经评估的需求带入建设，编写手册（C）与采购计划（D）属于后续实施阶段的产出。", "d": 0}, {"k": "dx", "s": 5, "t": "单选", "q": "在某国有银行国产化产品选型评估中，国产化系统架构中，业务架构设计的核心任务是（）", "o": ["业务域划分与核心流程梳理", "数据库表结构设计", "网络拓扑规划", "安全策略制定"], "a": "A", "n": "业务架构回答“业务如何组织”，核心是业务域划分与核心流程梳理（知识点总结“业务层规划”）；数据库表结构属数据架构，网络拓扑属技术/网络层设计，安全策略属安全架构。", "d": 0}, {"k": "dx", "s": 6, "t": "单选", "q": "在某系统建设方案设计中，安全架构设计中，纵深防御体系的核心是（）", "o": ["多层安全防护形成完整防护链", "部署单一安全防护设备", "依靠防火墙进行边界防护", "依靠入侵检测监测威胁"], "a": "A", "n": "纵深防御要求在物理、网络、主机、应用、数据等多个层面叠加防护、形成完整防护链，任一单点被突破仍有后续防线（知识点总结“安全系统基础”）；防火墙（C）、入侵检测（D）只是链上单一环节，B 更是典型的单点依赖。", "d": 0}, {"k": "dx", "s": 7, "t": "单选", "q": "在某国有银行国产化产品选型评估中，国产化项目范围基准的作用是（）", "o": ["计算项目利润", "定义工作边界和交付物", "制定人员考核标准", "确定供应商名单"], "a": "B", "n": "范围基准用来定义工作边界和交付物，是后续判断变更、衡量验收完成与否的受控基准（知识点总结“配置管理：基线”）；利润测算、人员考核、确定供应商都不是范围管理的职能。", "d": 0}, {"k": "dx", "s": 8, "t": "单选", "q": "在某系统建设方案设计中，业务能力组件化拆解的目的是（）", "o": ["减少代码行数", "降低硬件成本", "实现业务能力复用和解耦", "加快开发速度"], "a": "C", "n": "业务能力组件化拆解把业务功能封装为可复用、可独立替换的组件，实现业务与实现解耦，便于国产化适配和独立演进（知识点总结“应用层规划：拆分单体、模块化、 和自主可控程度（底层技术栈国产化）；界面颜色美观度属于外观体验，不是决策维度。对应知识点平台建设验收指标与三重合规要求。", "d": 0}, {"k": "dxm", "s": 119, "t": "多选", "q": "信创云部署模式选型时，需要考虑的因素包括（）。", "o": ["数据敏感度等级涉密选私有云", "成本预算约束私有云成本高", "云平台厂商的品牌偏好", "运维团队规模公有云成本低"], "a": "ABD", "n": "部署模式选型的决定因素是数据敏感度（涉密或高敏感选私有云）、成本预算（私有云成本高）和运维团队规模（公有云门槛与成本低）；厂商品牌偏好不构成选型依据。", "d": 0}, {"k": "dxm", "s": 120, "t": "多选", "q": "信创云计费标准中，常见的计费方式包括（）。", "o": ["包年包月即适合长期稳定使用", "免费使用即所有资源均免费", "预留实例即适合预留资源保障场景", "按量计费即适合弹性伸缩场景"], "a": "ACD", "n": "常见计费方式为包年包月（长期稳定负载）、预留实例（保障预留资源场景）和按量计费（弹性伸缩负载）；所有资源免费不是现实中存在的商业计费方式。", "d": 0}, {"k": "pd", "s": 1, "t": "判断", "q": "SaaS 的含义是软件即服务。", "o": ["正确", "错误"], "a": "A", "n": "SaaS（Software as a Service）即软件即服务，是云计算 IaaS/PaaS/SaaS 三种服务模式之一，与知识点总结中“云计算（IaaS/PaaS/SaaS）”一致。", "d": 0}, {"k": "pd", "s": 2, "t": "判断", "q": "电子政务外网与电子政务内网之间、互联网之间都采用物理隔离方式。", "o": ["正确", "错误"], "a": "B", "n": "政务外网与互联网之间通常采用逻辑隔离（安全隔离设备、防火墙等），政务内网与外网、互联网之间才要求物理隔离，“都采用物理隔离”不成立。", "d": 0}, {"k": "pd", "s": 3, "t": "判断", "q": "业务架构设计的核心任务是业务域划分与核心流程梳理。", "o": ["正确", "错误"], "a": "A", "n": "业务架构设计的核心任务正是业务域划分与核心业务流程梳理，它是应用架构、数据架构设计的基础和输入。", "d": 0}, {"k": "pd", "s": 4, "t": "判断", "q": "国产化技术架构设计的核心是国产化技术栈组合选型与部署架构规划。", "o": ["正确", "错误"], "a": "A", "n": "国产化技术架构设计的核心就是完成国产化技术栈的组合选型并做好部署架构规划，对应知识点 2.3.4 技术层规划（全栈国产化技术路线）。", "d": 0}, {"k": "pd", "s": 5, "t": "判断", "q": "信创产业是以数据安全、网络安全为基础的新基建重要组成部分。", "o": ["正确", "错误"], "a": "A", "n": "按课程口径，信创产业以网络安全、数据安全为基础、以自主研发为核心，是新基建的重要组成部分（知识点：信创新基建、产业背景）。", "d": 0}, {"k": "pd", "s": 6, "t": "判断", "q": "号称基础软件“三驾马车”的是操作系统、数据库、中间件。", "o": ["正确", "错误"], "a": "A", "n": "操作系统、数据库、中间件同为基础软件核心，业内并称基础软件“三驾马车”，与知识点中桌面/服务器 OS、数据库、中间件三类国产基础软件对应。", "d": 0}, {"k": "pd", "s": 7, "t": "判断", "q": "华为是国产服务器主流厂商之一。", "o": ["正确", "错误"], "a": "A", "n": "华为（鲲鹏、泰山系列服务器）是国产服务器主流厂商之一，同类主流厂商还有浪潮、中科曙光等（知识点：国产化服务器）。", "d": 0}, {"k": "pd", "s": 8, "t": "判断", "q": "数据质量核心维度包括完整性、准确性、一致性和及时性。", "o": ["正确", "错误"], "a": "A", "n": "数据质量核心维度即完整性、准确性、一致性、及时性（知识点还列出唯一性、有效性），题干列举属实。", "d": 0}, {"k": "pd", "s": 9, "t": "判断", "q": "当前时期，我国信创产业发展的主要问题是产业类型覆盖不全面。", "o": ["正确", "错误"], "a": "A", "n": "【存疑】公开权威资料常将信创发展的主要问题归纳为核心技术受制于人等，“产业类型覆盖不全面”疑为讲义专用表述，无法从公知常识完全证实，保留原答案。\n我国信创产业仍处培育期，部分细分领域的产品与类型覆盖不全，说法与课程资料口径一致。", "d": 1}, {"k": "pd", "s": 10, "t": "判断", "q": "国产操作系统高质量发展三年行动计划的实施周期是 2025-2027 年。", "o": ["正确", "错误"], "a": "A", "n": "【存疑】公开渠道无法核实“国产操作系统高质量发展三年行动计划”文件及其具体周期，仅能凭原答案与内部资料认定，保留原答案。\n按题给答案与内部资料口径，该三年行动计划的实施周期为 2025-2027 年。", "d": 1}, {"k": "pd", "s": 11, "t": "判断", "q": "信创产业生态中，安全软件和应用软件是同一分类。", "o": ["正确", "错误"], "a": "B", "n": "二者是不同分类：知识点将应用软件（办公软件、业务系统等）与安全产品（网络安全设备、商用密码等）分列，安全软件属于安全产业分支。", "d": 0}, {"k": "pd", "s": 12, "t": "判断", "q": "安全体系建设的背景是应对日益严峻的网络安全威胁和自主可控需求。", "o": ["正确", "错误"], "a": "A", "n": "安全体系建设的背景正是应对日益严峻的网络安全威胁与自主可控需求，与信创“自主可控、安全可信”内核一致（知识点：信息系统安全管理）。", "d": 0}, {"k": "pd", "s": 13, "t": "判断", "q": "国产化产品选型中，自主可控要求核心技术自主、供应链可控。", "o": ["正确", "错误"], "a": "A", "n": "自主可控的核心要求就是核心技术自主、供应链可控，与知识点“自主可控目标：供应链安全、技术自主、产品可控、服务可及、安全可审计”一致。", "d": 0}, {"k": "pd", "s": 14, "t": "判断", "q": "数据质量核心维度包括随意性。", "o": ["正确", "错误"], "a": "B", "n": "“随意性”不是数据质量维度，正确维度为完整性、准确性、一致性、及时性、唯一性、有效性（见知识点数据质量条目）。", "d": 0}, {"k": "pd", "s": 15, "t": "判断", "q": "Windows 11 属于国产桌面操作系统。", "o": ["正确", "错误"], "a": "B", "n": "Windows 11 是美国微软公司的闭源桌面操作系统，属境外产品；国产桌面操作系统为统信 UOS、麒麟等（知识点：桌面/服务器 OS：麒麟、统信等）。", "d": 0}, {"k": "pd", "s": 16, "t": "判断", "q": "Oracle 属于国产数据库主流厂商。", "o": ["正确", "错误"], "a": "B", "n": "Oracle 是美国数据库厂商，属境外产品；国产数据库主流厂商为达梦、人大金仓、OceanBase、GaussDB 等（知识点 1.1.1、3.1.2）。", "d": 0}, {"k": "pd", "s": 17, "t": "判断", "q": "国产化项目成果物清单包括项目建议书、可研报告和设计方案等。", "o": ["正确", "错误"], "a": "A", "n": "国产化项目成果物涵盖项目建议书、可研报告、设计方案等，且立项到验收全流程资料须留档备查（知识点 1.1.3：需完整留存全流程资料）。", "d": 0}, {"k": "pd", "s": 18, "t": "判断", "q": "任何个人和组织不得从事非法侵入他人网络、干扰他人网络正常功能、窃取网络数据等危害网络安全的活动。", "o": ["正确", "错误"], "a": "A", "n": "该表述与《网络安全法》第二十七条一致：任何个人和组织不得从事非法侵入他人网络、干扰正常功能、窃取网络数据等危害网络安全的活动。", "d": 0}, {"k": "pd", "s": 19, "t": "判断", "q": "信创涉密计算机终端需要安装专门的安全保密产品，即涉密计算机及移动存储介质保密管理系统，简称“三合一”。", "o": ["正确", "错误"], "a": "A", "n": "涉密信创终端须安装“三合一”（涉密计算机及移动存储介质保密管理系统），符合涉密信息系统保密管理要求。", "d": 0}, {"k": "pd", "s": 20, "t": "判断", "q": "国办发〔2019〕57 号《国家政务信息化项目建设管理办法》的文号是国办发〔2019〕57 号。", "o": ["正确", "错误"], "a": "A", "n": "《国家政务信息化项目建设管理办法》的文号即国办发〔2019〕57 号，文号与文件名对应一致。", "d": 0}, {"k": "pd", "s": 21, "t": "判断", "q": "国资发科创〔2022〕79 号《关于推进中央企业信息技术应用创新工作的通知》的文号是国资发科创〔2022〕79 号。", "o": ["正确", "错误"], "a": "A", "n": "《关于推进中央企业信息技术应用创新工作的通知》的文号即国资发科创〔2022〕79 号，文号与文件名对应一致。", "d": 0}, {"k": "pd", "s": 22, "t": "判断", "q": "选型评估维度中，品牌知名度是核心评估维度。", "o": ["正确", "错误"], "a": "B", "n": "选型的核心评估维度是自主可控程度、兼容适配性、性能可靠性与生态服务能力等，品牌知名度不是核心评估维度。", "d": 0}, {"k": "pd", "s": 23, "t": "判断", "q": "信创访问控制的核心原则是最小权限原则。", "o": ["正确", "错误"], "a": "A", "n": "访问控制的核心原则是最小权限原则，即仅授予完成任务所必需的权限（知识点 1.3.1：系统架构需满足最小权限原则）。", "d": 0}, {"k": "pd", "s": 24, "t": "判断", "q": "项目测试的主要依据包括建设方案、招标文件、深化设计方案、需求规格说明等。", "o": ["正确", "错误"], "a": "A", "n": "项目测试应以建设方案、招标文件、深化设计方案、需求规格说明等项目文档为依据开展，说法符合课程口径。", "d": 0}, {"k": "pd", "s": 25, "t": "判断", "q": "国产化项目各阶段的工作必须严格按照时间轴来进行，不可以并行。", "o": ["正确", "错误"], "a": "B", "n": "各阶段工作可以并行、迭代推进（知识点 2.4：试点验证、分批推广、滚动优化本就交替衔接），“必须严格串行”不成立。", "d": 0}, {"k": "pd", "s": 26, "t": "判断", "q": "测试相关资源主要包括测试环境、测试组织、测试工具等方面。", "o": ["正确", "错误"], "a": "A", "n": "测试相关资源主要包括测试环境、测试组织（人员）与测试工具等方面，说法完整。", "d": 0}, {"k": "pd", "s": 27, "t": "判断", "q": "典型的政务云架构采用\"三横两纵\"，\"三横\"自下而上分别为基础设施层即 IaaS、业务应用层即 SaaS、平台支撑层即 PaaS。", "o": ["正确", "错误"], "a": "B", "n": "政务云“三横”自下而上应为基础设施层（IaaS）→平台支撑层（PaaS）→业务应用层（SaaS），题干把 SaaS 与 PaaS 的位置写反了。", "d": 0}, {"k": "pd", "s": 28, "t": "判断", "q": "在信息安全管理中，确保信息在需要时能够正常访问和使用，属于可控性属性。", "o": ["正确", "错误"], "a": "B", "n": "“确保信息在需要时能够正常访问和使用”对应的是可用性属性，而非可控性。", "d": 0}, {"k": "pd", "s": 29, "t": "判断", "q": "在信创产业链中游环节中，数据库产品是连接硬件与最终用户应用的桥梁。", "o": ["正确", "错误"], "a": "B", "n": "产业链中游承上启下、连接硬件平台与最终用户应用的是中间件（如东方通、金蝶天燕、宝兰德，见知识点），数据库主要负责数据的存储与管理。", "d": 0}, {"k": "pd", "s": 30, "t": "判断", "q": "任何项目的可交付成果都需要企业高层和项目给付方进行评审与验收。", "o": ["正确", "错误"], "a": "B", "n": "评审与验收的范围和层级由项目契约及管理规定确定，可由相应干系人按阶段完成，并非“任何”交付成果都必须经企业高层和出资方评审验收。", "d": 0}, {"k": "pd", "s": 31, "t": "判断", "q": "信息安全的基本属性包括完整性、可用性、保密性、可控性、可靠性 5 个方面。", "o": ["正确", "错误"], "a": "A", "n": "按课程口径，信息安全的基本属性为完整性、可用性、保密性、可控性、可靠性五个方面，题干列举一致。", "d": 0}, {"k": "pd", "s": 32, "t": "判断", "q": "在一个总体设计范围内，经济上独立核算的各个工程项目，编制统一的项目建议书。", "o": ["正确", "错误"], "a": "B", "n": "同一总体设计范围内、经济上独立核算的各工程项目应分别编制各自的项目建议书，“编制统一的”不正确，统一编报仅适用于同一核算单位的项目。", "d": 0}, {"k": "pd", "s": 33, "t": "判断", "q": "直接工程费=直接费+其他工程费+其他直接费+现场经费。", "o": ["正确", "错误"], "a": "A", "n": "【存疑】不同行业造价定额体系对“直接工程费”构成的口径不一致（常见口径含直接费、其他直接费、现场经费等），该四项公式疑为课程专用口径，保留原答案。\n按题给答案及课程采用的工程费用口径，直接工程费由直接费、其他工程费、其他直接费和现场经费四部分构成。", "d": 1}, {"k": "pd", "s": 34, "t": "判断", "q": "操作系统是信创应用生态中最核心、技术复杂度最高的领域。", "o": ["正确", "错误"], "a": "B", "n": "【存疑】题干“错”的判据无法唯一确定——“技术复杂度最高”的正确主体可能是芯片/CPU，也可能错在“应用生态”应为“基础软件生态”，保留原答案。\n按原答案判“错”，说明课程口径并不认定操作系统是“信创应用生态”中技术复杂度最高的领域；业内更常见口径为芯片/CPU 技术复杂度最高，或操作系统是“基础软件”中最核心的环节，题干主体与限定词至少有一处错位。", "d": 1}, {"k": "pd", "s": 35, "t": "判断", "q": "任何组织和个人都可以使用商用密码产品。", "o": ["正确", "错误"], "a": "B", "n": "商用密码用于保护不属于国家秘密的信息，组织和个人应依法使用；保护国家秘密必须使用核心密码、普通密码（知识点 1.3.3），故“任何组织和个人都可以随意使用”的表述错误。", "d": 0}, {"k": "pd", "s": 36, "t": "判断", "q": "可行性研究报告一般由一个总论和几个专题构成。", "o": ["正确", "错误"], "a": "A", "n": "可行性研究报告通常由一个总论（概述）加市场、技术、财务等数个专题章节构成，说法成立。", "d": 0}, {"k": "pd", "s": 37, "t": "判断", "q": "国家大力发展信创产业的目标是实现自主可控和信息安全。", "o": ["正确", "错误"], "a": "A", "n": "国家大力发展信创产业的目标正是实现核心技术自主可控和信息安全（知识点：信创核心是自主可控、安全可信、国产化替代）。", "d": 0}, {"k": "pd", "s": 38, "t": "判断", "q": "可行性研究报告可以作为建设招标的依据。", "o": ["正确", "错误"], "a": "B", "n": "【存疑】部分教材口径认为经批复的可研报告可作为编制招标文件的依据，与原答案“错”存在口径冲突，课程出处无法核实，保留原答案。\n按题给答案，可行性研究报告属于立项决策与投资估算的依据，不能直接作为建设招标的依据，招标应以批复文件和相应设计文件等为依据。", "d": 1}, {"k": "pd", "s": 39, "t": "判断", "q": "国产化工程必须选用国产芯片的交换机路由器产品。", "o": ["正确", "错误"], "a": "B", "n": "国产化工程按场景与适配要求选型，网络设备优先国产化替代，但“必须全部选用国产芯片产品”过于绝对（知识点：信创采购关注国产化比例、安全资质与适配能力，非一刀切）。", "d": 0}, {"k": "pd", "s": 40, "t": "判断", "q": "企业在进行信息化规划过程中，应首先分析企业信息化现状。", "o": ["正确", "错误"], "a": "A", "n": "信息化规划第一步是分析企业信息化现状，再确定目标与方案，与知识点 2.1“全维度现状调研与评估先行”一致。", "d": 0}, {"k": "pd", "s": 41, "t": "判断", "q": "适配验证是项目规划和实施过程中必不可少的环节。", "o": ["正确", "错误"], "a": "A", "n": "适配验证是信创项目必不可少的环节，规划与实施各阶段均须开展，适配测试报告还是必备留档资料（知识点 1.1.3、2.1）。", "d": 0}, {"k": "pd", "s": 42, "t": "判断", "q": "根据信息安全技术网络安全管理办法的要求，第三级信息系统应当每两年一次进行一次等级测评。", "o": ["正确", "错误"], "a": "B", "n": "依据等级保护管理规定，第三级信息系统应当每年至少进行一次等级测评，而非每两年一次。", "d": 0}, {"k": "pd", "s": 43, "t": "判断", "q": "整机产品需要提供第三方机构平均无故障运行时间测试报告，MTBF 时间应≥15000 小时。", "o": ["正确", "错误"], "a": "B", "n": "信创整机 MTBF（平均无故障时间）常见要求远高于 15000 小时，通常要求不低于 10 万小时，题中指标明显偏低、不符合信创整机的通用要求。", "d": 0}, {"k": "pd", "s": 44, "t": "判断", "q": "第三方测试单位通常由测评机构承担，测试对象为应用系统。", "o": ["正确", "错误"], "a": "A", "n": "第三方测试通常由具备相应资质的测评机构承担，测试对象为（信息系统的）应用系统，说法符合课程口径。", "d": 0}, {"k": "pd", "s": 45, "t": "判断", "q": "文件要求进行为期 3 个月的试运行来验证系统的功能和性能，但进行了 1 个月后没有出现任何问题，试运行可以提前结束。", "o": ["正确", "错误"], "a": "B", "n": "试运行期限是规定的验证时限，即使期间未出现问题也必须满 3 个月并完成验证后方可结束，不能提前结束。", "d": 0}, {"k": "pd", "s": 46, "t": "判断", "q": "信创计算机终端必须安装三合一、主机审计、打印刻录、身份鉴别和防病毒软件。", "o": ["正确", "错误"], "a": "B", "n": "“三合一”是涉密终端的保密专用配置（见第 19 题），题目未限定“涉密”，对一般信创计算机终端而言并非都必须安装三合一等保密专用产品。", "d": 0}, {"k": "pd", "s": 47, "t": "判断", "q": "信息系统运营单位初步确定定级对象的安全保护等级，并起草《网络安全等级保护定级报告》，公安部制定，定级结论必须进行专家评审。", "o": ["正确", "错误"], "a": "B", "n": "定级流程应为运营使用单位自主定级并起草定级报告，经专家评审、主管部门审核后报公安机关备案审查，定级结论并非“公安部制定”，题干流程表述错误。", "d": 0}, {"k": "pd", "s": 48, "t": "判断", "q": "核心密码、普通密码属于国家秘密。密码管理部门依照 2020 年 1 月 1 日施行《中华人民共和国密码法》和有关法律、行政法规、国家有关规定对核心密码、普通密码实行严格统一管理。", "o": ["正确", "错误"], "a": "A", "n": "依据《密码法》（2020 年 1 月 1 日施行），核心密码、普通密码用于保护国家秘密、属于国家秘密，由密码管理部门实行严格统一管理，题干一致。", "d": 0}, {"k": "pd", "s": 49, "t": "判断", "q": "国产企业信息化在实施过程中，通过引入先进的供应链管理系统可以提高企业的市场竞争力。", "o": ["正确", "错误"], "a": "A", "n": "引入先进的供应链管理系统可优化采购、库存与协同，从而提升企业市场竞争力，说法成立。", "d": 0}, {"k": "pd", "s": 50, "t": "判断", "q": "国产化项目涉及基础硬件、基础软件、应用软件等多个方面，包括智能交通信息化项目中的路由器、核心交换机、服务器、防火墙等。", "o": ["正确", "错误"], "a": "A", "n": "国产化覆盖基础硬件、基础软件、应用软件全栈（知识点：芯片—服务器—OS—数据库—中间件—应用—安全全栈），智能交通项目中的路由器、核心交换机、服务器、防火墙等均在国产化范围内。", "d": 0}, {"k": "pd", "s": 51, "t": "判断", "q": "过程要素部署实施的工作内容包括：过程与制度发布、过程电子化管理和数据初始化、体系试运行。", "o": ["正确", "错误"], "a": "A", "n": "与 ITSS 对过程要素部署实施的要求一致：过程与制度发布、过程电子化管理和数据初始化、体系试运行。", "d": 0}, {"k": "pd", "s": 52, "t": "判断", "q": "本质上讲，国产化项目和其他信息化项目一样都是为了创造独特的产品服务或者是成果进行的一项临时性的工作。", "o": ["正确", "错误"], "a": "A", "n": "符合项目定义：为创造独特的产品、服务或成果而进行的临时性工作，国产化项目同样具有一次性、临时性等特征。", "d": 0}, {"k": "pd", "s": 53, "t": "判断", "q": "在后台服务器架构的设计中，一个典型的架构设计应该分为接入层、逻辑层、存储层和应用层。", "o": ["正确", "错误"], "a": "B", "n": "典型的后台服务器架构一般为接入层、逻辑层（应用层）、存储层的层次划分，将“逻辑层”与“应用层”并列为两个独立层的说法不符合典型分层。", "d": 0}, {"k": "pd", "s": 54, "t": "判断", "q": "对于国标 GB8567—88GB/T 8567-2006《计算机软件产品开发文件编制指南》所建议的条款并不是都可以扩展，以进一步细分适应需要。", "o": ["正确", "错误"], "a": "B", "n": "《计算机软件产品开发文件编制指南》（GB 8567-88、GB/T 8567-2006）所建议的文档条款均可根据项目需要扩展细分以适应需要，题干“并不是都可以扩展”与原意相反。", "d": 0}, {"k": "pd", "s": 55, "t": "判断", "q": "依据风险级别与影响度范围进行决策，以决定工具部署上线是否采用阶段式部署。", "o": ["正确", "错误"], "a": "A", "n": "依据 ITSS 要求，按风险级别与影响范围进行决策，以决定工具部署上线是否采用阶段式（分步试点）部署，说法一致。", "d": 0}, {"k": "pd", "s": 56, "t": "判断", "q": "信息系统受到破坏后，会对社会秩序和公共利益造成严重损害，或者对国家安全造成损害，属于信息系统安全等级保护的二级要求。", "o": ["正确", "错误"], "a": "B", "n": "“对社会秩序和公共利益造成严重损害，或对国家安全造成损害”是第三级的定级条件；二级的损害程度为“对社会秩序和公共利益造成损害，但不损害国家安全”，题干说成二级错误。", "d": 0}, {"k": "pd", "s": 57, "t": "判断", "q": "TCP/IP 协议族中定义的 TCP 和 UDP 协议，实现了 OSI 七层模型中网络层的主要功能。", "o": ["正确", "错误"], "a": "B", "n": "TCP 和 UDP 是传输层协议，实现的是 OSI 模型传输层的主要功能，不是网络层（网络层对应 IP 协议）。", "d": 0}, {"k": "pd", "s": 58, "t": "判断", "q": "公司信息化存在的最大问题是公司分散的、独立运行的业务系统较多，系统间缺乏数据交换和数据共享，即所谓的信息孤岛。", "o": ["正确", "错误"], "a": "A", "n": "业务系统分散独立运行、缺乏数据交换与共享即形成“信息孤岛”，这正是企业信息化面临的典型最大问题，说法成立。", "d": 0}, {"k": "pd", "s": 59, "t": "判断", "q": "虽然不同的操作系统可能支持不同的浏览器产品，但这些浏览器都支持 HTTP 协议。", "o": ["正确", "错误"], "a": "A", "n": "HTTP 是 Web 访问的标准协议（知识点：核心协议含 HTTP/HTTPS），各操作系统上的浏览器产品均须支持 HTTP 才能访问网页，说法成立。", "d": 0}, {"k": "pd", "s": 60, "t": "判断", "q": "IT 服务质量评价模型定义了服务质量的安全性、可靠性、有形性、响应性、友好性。", "o": ["正确", "错误"], "a": "A", "n": "ITSS 的 IT 服务质量评价模型以安全性、可靠性、有形性、响应性、友好性五个特性衡量服务质量，题干列举一致。", "d": 0}, {"k": "pd", "s": 61, "t": "判断", "q": "判断一个产品是否属于国产化产品的核心标准，是看它是否在国内开发和生产的。", "o": ["正确", "错误"], "a": "B", "n": "判断国产化的核心标准是核心技术自主可控、知识产权自主，而非仅看是否在国内开发和生产（贴牌代工不等于国产化）。", "d": 0}, {"k": "pd", "s": 62, "t": "判断", "q": "在国产化项目差距分析中，仅需对比技术层面差距，无需考虑合规差距和能力差距。", "o": ["正确", "错误"], "a": "B", "n": "差距分析是全维度的，除技术层面外还须对比合规差距和能力差距（对应知识点 2.1 六维度调研、2.2 差距识别与迁移难度评估）。", "d": 0}, {"k": "pd", "s": 63, "t": "判断", "q": "按优先级或等级排列的风险清单属于风险定量分析的输出。", "o": ["正确", "错误"], "a": "B", "n": "按优先级或等级排列的风险清单是定性风险分析的输出；定量风险分析的输出是量化结果（如 EMV、敏感性分析、决策树等）。", "d": 0}, {"k": "pd", "s": 64, "t": "判断", "q": "在开展信创类工程规划时，网络设备、安全设备、存储设备设备应全部利旧。", "o": ["正确", "错误"], "a": "B", "n": "信创工程规划须先评估设备兼容性与性能，区分可利旧改造设备、需替换的境外设备与需新增的国产设备（知识点 2.1.3 基础设施现状评估），并非“应全部利旧”。", "d": 0}, {"k": "pd", "s": 65, "t": "判断", "q": "商用密码应用安全性评估简称密评，是指在采用商用密码技术、产品和服务集成建设的网络和信息系统中，对其密码应用的合规性、正确性和有效性进行评估。", "o": ["正确", "错误"], "a": "A", "n": "该定义与 GB/T 39786 及《商用密码应用安全性评估管理办法》口径一致：对密码应用的合规性、正确性、有效性进行评估，简称密评（知识点 1.3.3、5.1.4）。", "d": 0}, {"k": "pd", "s": 66, "t": "判断", "q": "已运营或新建的第二级以上信息系统，应当在安全保护等级确定后 60 日内，由其运营、使用单位到所在地设区的市级以上公安机关办理备案手续。", "o": ["正确", "错误"], "a": "B", "n": "依据《信息安全等级保护管理办法》（公通字〔2007〕43 号），第二级以上信息系统应在安全保护等级确定后 30 日内（而非 60 日）由运营、使用单位到所在地设区的市级以上公安机关办理备案手续。", "d": 0}, {"k": "pd", "s": 67, "t": "判断", "q": "已运行信息系统的运营、使用单位自公通字〔2007〕43 号《信息安全等级保护管理办法》施行之日起 90 日内确定信息系统的安全保护等级。", "o": ["正确", "错误"], "a": "B", "n": "【存疑】无法核实 43 号文对“已运行信息系统”确定安全保护等级时限的原文表述，错误点可能在“90 日”数字或适用范围（是否仅限第二级以上系统），保留原答案。\n按题给答案，该时限与 43 号文的规定不符，43 号文对第二级以上信息系统实行定级后限期备案管理。", "d": 1}, {"k": "pd", "s": 68, "t": "判断", "q": "信创云平台仅支持私有云部署模式。", "o": ["正确", "错误"], "a": "B", "n": "信创云支持公有云、私有云、混合云等多种部署模式，按涉密要求、合规约束与业务场景选择，并非仅支持私有云。", "d": 0}, {"k": "pd", "s": 69, "t": "判断", "q": "加强政府数据共享统筹，是提供政府部门治理能力、推动经济发展转型的重要路径和关键手段。政府数据共享是数字政府建设的基础性工作。", "o": ["正确", "错误"], "a": "A", "n": "加强政府数据共享统筹是提升政府部门治理能力、推动经济转型的重要路径，政府数据共享是数字政府建设的基础性工作，说法成立（知识点：数字政务、数据开放共享）。", "d": 0}, {"k": "pd", "s": 70, "t": "判断", "q": "金山 wps 软件安装包：wps-office_11.8_arm64.deb 可以安装在中标龙芯终端上。", "o": ["正确", "错误"], "a": "B", "n": "该 deb 包为 arm64（ARM 架构）格式，而中标麒麟+龙芯终端采用 MIPS/LoongArch 自主指令集（知识点：芯片路线含 LoongArch），架构不匹配无法安装。", "d": 0}, {"k": "pd", "s": 71, "t": "判断", "q": "国产化环境下，我国国内主流的桌面和服务器计算机操作系统均源于开源 Linux 操作系统。", "o": ["正确", "错误"], "a": "A", "n": "统信 UOS、麒麟等国内主流桌面与服务器操作系统均基于开源 Linux 内核构建（知识点：桌面/服务器 OS：麒麟、统信等），说法成立。", "d": 0}, {"k": "pd", "s": 72, "t": "判断", "q": "密评的基本工作流程可归纳为确定评估对象、开展测评工作、输出密码测评报告、密评结果上报四个阶段。", "o": ["正确", "错误"], "a": "A", "n": "按课程口径，密评基本流程即确定评估对象、开展测评、输出密码测评报告、密评结果上报四个阶段（对应 GB/T 39786 语境下的测评准备、方案编制、现场测评、分析与报告编制活动）。", "d": 0}, {"k": "pd", "s": 73, "t": "判断", "q": "在有线、无线通信中传递的国家秘密信息，以及存储、处理国家秘密信息的信息系统，应当依照法律、行政法规和国家有关规定使用核心密码、普通密码进行加密保护、安全认证。", "o": ["正确", "错误"], "a": "A", "n": "依据《密码法》，有线/无线通信中传递的国家秘密信息及存储、处理国家秘密信息的信息系统，应依法使用核心密码、普通密码进行加密保护和安全认证，题干一致。", "d": 0}, {"k": "pd", "s": 74, "t": "判断", "q": "实施标准化对于提高产品和服务的质量、促进技术创新和进步、增强市场竞争力以及保障安全和健康等方面具有重要意义。降低生产成本是实施标准化的意义。", "o": ["正确", "错误"], "a": "B", "n": "实施标准化的意义包括提高产品和服务质量、促进技术创新与进步、增强市场竞争力、保障安全健康等，课程口径中不含“降低生产成本”一项。", "d": 0}, {"k": "pd", "s": 75, "t": "判断", "q": "国际标准是指“国际标准化组织即 ISO、国际电工委员会即 IEC 和国际电信联盟即 ITU，以及 ISO 确认并公布的其他组织”制定的标准。", "o": ["正确", "错误"], "a": "A", "n": "与公知的国际标准定义一致：由 ISO、IEC、ITU 以及 ISO 确认并公布的其他组织制定的标准。", "d": 0}, {"k": "pd", "s": 76, "t": "判断", "q": "信创设计总体架构分为“五层三翼”，其中的“三翼”包括：标准规范体系、安全保密体系、应用支撑体系。", "o": ["正确", "错误"], "a": "B", "n": "【存疑】“五层三翼”为课程专用架构口径且知识点总结未收录，“三翼”的准确组成无法从公知常识核实，保留原答案。\n按原答案判“错”：“应用支撑体系”更可能属于总体架构的支撑层级而非“三翼”，“三翼”应为标准规范体系、安全保密体系等配套保障类体系。", "d": 1}, {"k": "pd", "s": 77, "t": "判断", "q": "分析与调研，网络的或传统的方式，都是把相关的数据汇总、排列并转化成信息。如果你的调研目标只是简单的为数据库收集数据，你就不用对数据进行分析。", "o": ["正确", "错误"], "a": "A", "n": "分析与调研的目的是把数据汇总、排列并转化为信息；若调研目标仅为数据库收集数据，自然无须再对数据进行分析，判断成立。", "d": 0}, {"k": "pd", "s": 78, "t": "判断", "q": "2015 年，我国以修改采用的方式发布了 ISO/IEC 20000 的国家推荐标准即 GB/T 24405.1《信息技术 服务管理 第 1 部分：规范》《GB/T 24405.1 信息技术服务管理第一部分：规范》。", "o": ["正确", "错误"], "a": "B", "n": "GB/T 24405.1《信息技术 服务管理 第 1 部分：规范》是我国 2009 年发布、等同采用（idt）ISO/IEC 20000-1:2005 的国家标准，并非“2015 年以修改采用方式发布”。", "d": 0}, {"k": "pd", "s": 79, "t": "判断", "q": "微服务是当前流行的一种技术框架，通过服务的小型化、原子化以及分布式架构的弹性伸缩和高可用性，可以实现业务之间的松耦合、业务的灵活调整组合以及系统的高可用性，为业务创新和业务持续提供了一个良好的基础平台。", "o": ["正确", "错误"], "a": "A", "n": "题干与微服务架构的公认特征一致：服务小型化、原子化、弹性伸缩，实现松耦合、灵活调整与高可用（知识点：容器、微服务、分布式架构）。", "d": 0}, {"k": "pd", "s": 80, "t": "判断", "q": "数据库设计即 Database Design 是指对于一个给定的应用环境，构造最优的数据库模式，建立数据库及其应用系统，使之能够有效地存储数据，满足各种用户的应用需求。按照规范设计，我们将数据库的设计过程分为六个阶段：系统需求分析阶段、概念结构设计阶段、逻辑结构设计阶段、物理结构设计阶段、数据库实施阶段、数据库运行与维护阶段。", "o": ["正确", "错误"], "a": "A", "n": "数据库设计六阶段（需求分析、概念结构、逻辑结构、物理结构、实施、运行与维护）是数据库设计的通行规范划分，题干表述完整一致。", "d": 0}, {"k": "pd", "s": 81, "t": "判断", "q": "信息安全管理体系 ISMS 是组织整体管理体系的一个部分，是基于风险评估建立、实施、运行、监视、评审、保持和持续改进信息安全等一系列的管理活动，是组织在整体或特定范围内建立信息安全方针和目标，以及完成这些目标所用的方法的体系。", "o": ["正确", "错误"], "a": "A", "n": "与 GB/T 22080/ISO/IEC 27001 对 ISMS 的定义一致：基于风险评估建立、实施、运行、监视、评审、保持和持续改进的信息安全管理活动体系。", "d": 0}, {"k": "pd", "s": 82, "t": "判断", "q": "根据《商用密码管理条例》（国务院，2023 年 5 月修订施行），国产化项目中使用商用密码产品应当选择经国家密码管理部门审批通过的国产密码产品。", "o": ["正确", "错误"], "a": "A", "n": "依据修订后的《商用密码管理条例》与信创密评要求（知识点 1.3.3：全程使用国产商用密码算法并通过密评），国产化项目应选用经国家密码管理部门审批通过的国产商用密码产品。", "d": 0}, {"k": "pd", "s": 83, "t": "判断", "q": "根据 GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》与国家密码管理局令第 3 号《商用密码应用安全性评估管理办法》的要求，国产化项目中等级保护测评和商用密码应用安全性评估即密评可以分别独立实施，无需统筹规划同步推进。", "o": ["正确", "错误"], "a": "B", "n": "等保测评与密评必须统筹规划、同步推进并纳入项目整体验收计划（知识点 5.4：等保测评、密评纳入整体验收计划，提前统筹），不能各自独立实施、互不衔接。", "d": 0}, {"k": "pd", "s": 84, "t": "判断", "q": "在国产化系统总体架构设计中，业务架构设计是应用架构和数据架构设计的基础和输入。", "o": ["正确", "错误"], "a": "A", "n": "业务架构是总体架构设计的基础，应用架构与数据架构以业务架构为输入展开设计，说法成立。", "d": 0}, {"k": "pd", "s": 85, "t": "判断", "q": "应用架构设计中，各层之间应采用紧耦合方式以提高系统整体性能。", "o": ["正确", "错误"], "a": "B", "n": "应用架构各层之间应采用松（低）耦合方式，以保证系统的灵活性、可扩展性与可维护性；紧耦合会降低系统弹性与可适应性，并非应有的设计方式。", "d": 0}, {"k": "pd", "s": 86, "t": "判断", "q": "根据《中华人民共和国数据安全法》（2021 年 9 月 1 日施行，全国人民代表大会常务委员会颁布）的要求，国产化项目中的数据分类分级仅需按照数据容量大小进行划分即可。", "o": ["正确", "错误"], "a": "B", "n": "《数据安全法》要求依据数据的重要程度及遭篡改、破坏、泄露或非法获取、非法利用后的危害程度实行分类分级（知识点：数据分级分类、加密脱敏），并非按数据容量大小划分。", "d": 0}, {"k": "pd", "s": 87, "t": "判断", "q": "国产化技术栈组合选型时，自主可控程度是首要考量因素，同时需兼顾兼容适配性和性能可靠性。", "o": ["正确", "错误"], "a": "A", "n": "技术栈组合选型以自主可控程度为首要考量，同时兼顾兼容适配性与性能可靠性（知识点：技术路线选择依据为兼容性、性能、生态、安全、成本、政策）。", "d": 0}, {"k": "pd", "s": 88, "t": "判断", "q": "业务架构设计中，业务域划分应遵循高内聚低耦合原则，确保同一业务域内功能高度内聚。", "o": ["正确", "错误"], "a": "A", "n": "业务域划分应遵循高内聚低耦合原则，保证域内功能高度内聚、域间保持低耦合，说法成立。", "d": 0}, {"k": "pd", "s": 89, "t": "判断", "q": "业务能力组件化拆解的目的是将业务功能封装为可复用组件，支持按组件粒度进行国产化替换。", "o": ["正确", "错误"], "a": "A", "n": "组件化拆解将业务功能封装为可复用组件，从而支持按组件粒度实施国产化替换与验证，说法一致。", "d": 0}, {"k": "pd", "s": 90, "t": "判断", "q": "对于高敏感度业务场景，国产化改造应优先采用分阶段渐进式改造策略以降低风险。", "o": ["正确", "错误"], "a": "B", "n": "参照知识点“先非核心、后核心，先简单、后复杂”的分批推进原则（2.4.2/3.2.1），分阶段渐进式主要面向非核心、低风险系统；高敏感（核心）业务应并行双轨运行、充分验证后择机割接并配套应急回退（3.2.2/3.2.3/3.4），不宜“优先”渐进改造。", "d": 0}, {"k": "pd", "s": 91, "t": "判断", "q": "信创运维与业务保障体系应建立覆盖国产化环境的全链路监控、分级告警和故障处置机制。", "o": ["正确", "错误"], "a": "A", "n": "与知识点信创运维体系一致：建立涵盖监控、巡检、故障处理、变更、备份恢复、安全运维的运维体系，全链路监控、分级告警、故障处置是其应有内容。", "d": 0}, {"k": "pd", "s": 92, "t": "判断", "q": "应用架构设计中，组件集成应遵循紧耦合原则以确保系统性能最优。", "o": ["正确", "错误"], "a": "B", "n": "组件集成应遵循松耦合原则；紧耦合会牺牲系统的灵活性、可维护性与容错能力，不能确保“性能最优”。", "d": 0}, {"k": "pd", "s": 93, "t": "判断", "q": "应用建设模式中，存量系统的国产化改造应采用分阶段渐进式策略，先非核心后核心，逐步替换并验证。", "o": ["正确", "错误"], "a": "A", "n": "存量系统国产化改造应采用分阶段渐进式策略，先非核心后核心、逐步替换并验证，与知识点 2.4.2 分批推广、3.2.1 迁移批次规划一致。", "d": 0}, {"k": "pd", "s": 94, "t": "判断", "q": "应用适配改造的首要工作是直接开始代码修改，无需进行技术栈调研。", "o": ["正确", "错误"], "a": "B", "n": "适配改造的首要工作是开展技术栈与依赖项的现状调研评估，形成兼容性评估报告后再实施代码修改（知识点 2.1 现状评估、2.2 适配差距分析先行），题干说法错误。", "d": 0}, {"k": "pd", "s": 95, "t": "判断", "q": "国产化项目数据分类分级的第一步是梳理数据资产目录，明确数据的来源、类型和存储位置。", "o": ["正确", "错误"], "a": "A", "n": "数据分类分级应先梳理数据资产目录，明确数据来源、类型与存储位置，再进行分级和安全管控，说法成立。", "d": 0}, {"k": "pd", "s": 96, "t": "判断", "q": "国产化项目中跨系统数据共享无需考虑安全防护，直接开放数据接口即可。", "o": ["正确", "错误"], "a": "B", "n": "跨系统数据共享必须同步落实分类分级、加密脱敏、权限管控与访问审计（知识点 2.3.3 数据安全专项、数据应用要求），“直接开放接口”错误。", "d": 0}, {"k": "pd", "s": 97, "t": "判断", "q": "国产化技术栈组合选型仅需考虑采购成本，无需评估自主可控程度和兼容适配性。", "o": ["正确", "错误"], "a": "B", "n": "技术栈选型的核心是自主可控程度、兼容适配性（知识点：技术路线选择依据兼容性、性能、生态、安全、成本、政策），采购成本不是唯一考量，题干以偏概全。", "d": 0}, {"k": "pd", "s": 98, "t": "判断", "q": "部署架构与网络拓扑规划应遵循安全分区、等级防护原则，将不同安全等级的系统部署在相应安全区域。", "o": ["正确", "错误"], "a": "A", "n": "部署架构与网络拓扑应遵循安全分区、边界防护与等级保护要求（知识点：网络安全规划设计安全区域划分、等保合规），将不同安全等级系统部署于相应安全区域，说法一致。", "d": 0}, {"k": "pd", "s": 99, "t": "判断", "q": "信创中间件集成中，国产中间件与现有应用系统的兼容性问题仅包括 API 接口差异。", "o": ["正确", "错误"], "a": "B", "n": "兼容性问题除 API 接口差异外，还包括 Oracle/Windows 等境外产品专属语法与组件、x86 专有驱动、中间件专属配置等（知识点 2.2.2 常见兼容性问题），“仅包括”错误。", "d": 0}, {"k": "pd", "s": 100, "t": "判断", "q": "安全架构中，纵深防御体系的最内层防线是数据安全防护，包括数据加密、脱敏和访问审计。", "o": ["正确", "错误"], "a": "A", "n": "纵深防御由外到内分层设防，最内层防线即最终被保护对象——数据的安全防护（加密、脱敏、访问审计等），说法成立。", "d": 0}, {"k": "pd", "s": 101, "t": "判断", "q": "信创可信身份认证与访问控制应基于零信任架构理念，对每次访问进行身份验证和权限校验。", "o": ["正确", "错误"], "a": "A", "n": "零信任的核心理念是“从不信任、始终验证”，对每次访问都进行身份验证与权限校验，说法一致。", "d": 0}, {"k": "pd", "s": 102, "t": "判断", "q": "安全架构设计中，等保合规是安全管控的基线要求，安全管控应在满足等保合规基础上进一步提升防护能力。", "o": ["正确", "错误"], "a": "A", "n": "等保合规是安全管控的基线（知识点 1.3.1：国产化+等保+密评三重合规为底线要求），应在此基础上叠加增强防护能力，说法一致。", "d": 0}, {"k": "pd", "s": 103, "t": "判断", "q": "根据国办发〔2019〕57 号《国家政务信息化项目建设管理办法》，该文件是指导政务云建设的重要政策文件之一。", "o": ["正确", "错误"], "a": "A", "n": "国办发〔2019〕57 号文是我国政务信息化项目管理的核心政策文件，也是指导政务云建设的重要政策依据之一，说法成立。", "d": 0}, {"k": "pd", "s": 104, "t": "判断", "q": "信创云建设应一次性完成 IaaS、PaaS、SaaS 三层全部建设，以确保系统完整性。", "o": ["正确", "错误"], "a": "B", "n": "信创云建设应遵循分阶段实施策略（知识点 2.4：试点验证、分批推广、滚动优化），按需分层演进，一次性完成三层全部建设不符合实施原则。", "d": 0}, {"k": "pd", "s": 105, "t": "判断", "q": "信创云选型时，自主可控程度是核心评估维度之一，要求底层技术栈实现国产化。", "o": ["正确", "错误"], "a": "A", "n": "自主可控程度是信创云选型的核心评估维度之一，要求底层技术栈国产化（知识点 2.3.4：云平台采用国产虚拟化/容器云，全栈国产化），说法一致。", "d": 0}, {"k": "pd", "s": 106, "t": "判断", "q": "涉及国家秘密的政务系统可以选择公有云部署模式以降低成本。", "o": ["正确", "错误"], "a": "B", "n": "涉及国家秘密的政务系统必须部署在符合保密要求的专用涉密环境，严禁使用公有云，题干说法错误。", "d": 0}, {"k": "pd", "s": 107, "t": "判断", "q": "信创云 IaaS 层资源通常采用按资源规格和使用时长的计费方式，包括包年包月和按量计费两种方式。", "o": ["正确", "错误"], "a": "A", "n": "IaaS 层按资源规格和使用时长计费，常见包年包月（适合长期稳定使用）与按量计费（适合弹性伸缩场景）两种方式，与云计费考点一致。", "d": 0}, {"k": "pd", "s": 108, "t": "判断", "q": "信创云安全合规评估仅需依据企业自行制定的安全标准即可，无需参考国家标准。", "o": ["正确", "错误"], "a": "B", "n": "信创云安全合规评估必须以《网络安全法》、等保 2.0、密码法规等国家标准和行业规范为依据，企业自定标准不能替代国家标准（知识点 1.2 国产化核心技术标准规范）。", "d": 0}, {"k": "pd", "s": 109, "t": "判断", "q": "信创云安全合规评估发现的问题，应按照风险等级排序进行整改，高危风险优先处理。", "o": ["正确", "错误"], "a": "A", "n": "评估发现的问题应按风险等级排序整改、高危优先处理，符合风险管理与知识点 5.4“评估报告完成闭环整改”的要求。", "d": 0}, {"k": "pd", "s": 110, "t": "判断", "q": "国产化项目建议书的核心内容包括项目建设的必要性和依据、初步方案和投资估算。", "o": ["正确", "错误"], "a": "A", "n": "项目建议书核心内容包括建设必要性、依据、初步方案与投资估算等（知识点：项目建议书：背景、目标、范围、建设内容、投资估算、工期、效益、风险），题干涵盖其核心。", "d": 0}, {"k": "pd", "s": 111, "t": "判断", "q": "国产化项目建议书中，国产化建设核心内容仅需描述采购的国产产品清单即可，无需说明技术路线选型方案。", "o": ["正确", "错误"], "a": "B", "n": "项目建议书必须明确国产化替代范围与软硬件选型、技术路线方案（知识点 1.1.3：立项阶段明确国产化替代范围、软硬件选型清单、合规建设目标），仅列采购清单不完整。", "d": 0}, {"k": "pd", "s": 112, "t": "判断", "q": "国产化项目初期投资测算框架以建设方案初步设计和国产化软硬件市场价格为基础进行编制。", "o": ["正确", "错误"], "a": "A", "n": "初期投资测算以建设方案初步设计和国产化软硬件市场价格为基础编制，符合课程对投资测算口径的要求。", "d": 0}, {"k": "pd", "s": 113, "t": "判断", "q": "信创专项取费中，国产软硬件溢价测算仅需计算国产产品的绝对采购价格即可。", "o": ["正确", "错误"], "a": "B", "n": "“溢价”测算应对比国产产品与原有（境外）同类产品的价格差及全生命周期成本，仅计算国产产品的绝对采购价格无法体现“溢价”，题干错误。", "d": 0}, {"k": "pd", "s": 114, "t": "判断", "q": "国产化项目可行性研究中，合规性分析的核心是论证项目符合国家国产化政策法规要求。", "o": ["正确", "错误"], "a": "A", "n": "可行性研究中合规性分析的核心正是论证项目符合国家国产化政策法规（国产化+等保+密评等要求，知识点 1.3、1.4.2 合规可行性），说法成立。", "d": 0}, {"k": "pd", "s": 115, "t": "判断", "q": "可研报告中，技术可行性分析无需包含回退策略，仅需论证正向迁移方案即可。", "o": ["正确", "错误"], "a": "B", "n": "技术可行性分析必须包含回退策略与应急回退方案（知识点 3.4 业务连续性与应急回退方案），保证迁移失败时可快速回退，“无需包含”错误。", "d": 0}, {"k": "pd", "s": 116, "t": "判断", "q": "国产化项目建设实施与进度计划应遵循分阶段推进、先易后难的原则，每阶段预留充足测试验证时间。", "o": ["正确", "错误"], "a": "A", "n": "实施与进度计划应分阶段推进、先易后难，每阶段预留充足测试验证时间，与知识点 2.4 分批推广、4.1 里程碑管控、5.3 阶段性检查要求一致。", "d": 0}, {"k": "pd", "s": 117, "t": "判断", "q": "国产化项目效益评价仅需计算经济效益即投资回报率，无需考虑社会效益和战略效益。", "o": ["正确", "错误"], "a": "B", "n": "效益评价应同时考虑经济效益、社会效益和战略效益（自主可控、安全、产业带动等，对应知识点立项申报的效益与风险要素），“无需考虑”错误。", "d": 0}, {"k": "pd", "s": 118, "t": "判断", "q": "国产化项目风险评估应重点识别技术风险、进度风险、成本风险和安全风险等类型。", "o": ["正确", "错误"], "a": "A", "n": "风险评估应重点识别技术适配、进度、成本、安全合规等风险类型（知识点 4.3：技术适配风险、工期与资金风险、安全合规与数据风险等），题干列举一致。", "d": 0}, {"k": "pd", "s": 119, "t": "判断", "q": "国产化项目申报文档的基本质量要求是内容真实准确、格式规范统一、数据翔实可查。", "o": ["正确", "错误"], "a": "A", "n": "内容真实准确、格式规范统一、数据翔实可查正是申报文档的基本质量要求，说法成立。", "d": 0}, {"k": "pd", "s": 120, "t": "判断", "q": "国产化项目申报文档审查中，文档排版不够美观是常见的退件原因之一。", "o": ["正确", "错误"], "a": "B", "n": "申报审查退件主要因内容不真实不完整、数据不可靠、依据不足等实质性问题；排版不够美观属可整改的形式瑕疵，通常不构成退件事由。", "d": 0}, {"k": "card", "s": 1, "t": "背诵卡", "q": "【案例分析一 · 商业银行核心交易系统国产化】问题 1（10 分）：请结合本案例的实际情况，分析数据库选型需重点考量的若干关键方面，逐一说明各关键方面的具体评估要点及在本项目中的特殊性考量，并在此基础上给出推荐选型方案及理由。", "o": [], "a": "", "n": "⚡ 答题框架：选型类题目先列评估维度（政策合规、兼容、性能、生态、运维、自主可控、成本）再逐项回扣案例数字，推荐“主库+备选”双方案加处置路径；POC 题按“场景—指标—标准”表格化作答并勿漏招标评分转化机制（权重≥30%）；风险题必须有类有策，回退机制记住“偏差率＞0.01%/通过率＜99%/低于基线 80% 触发、15 分钟启动、30 分钟验证、2 次演练”。\n\n参考答案要点：\n· 选型关键考量共 7 个方面：政策合规性、技术兼容性、性能可靠性、生态成熟度、运维保障能力、自主可控程度、成本控制，须结合本项目约束逐项分析。\n· 政策合规性：候选数据库须在国家信创目录范围内、通过安全可靠测评，且具备金融行业合规经验（等保四级/密评三级通过案例）；本行为城商行，须满足监管考核 2027 年底前完成替代的硬性要求。\n· 技术兼容性：重点关注对 Oracle 语法、PL/SQL 存储过程、数据类型的兼容度；本案 8 套系统含 2 万行 PL/SQL 深度绑定，兼容度直接影响迁移成本与工期。\n· 性能可靠性：TPS 峰值须≥8000，全年停机≤53 分钟（99.99% 可用性），对性能和可靠性要求极为严苛。\n· 生态成熟度：金融行业落地案例数量与规模是关键，案例丰富的产品可降低实施风险。\n· 运维保障能力：行内 3 名 DBA 仅具 Oracle 经验，国产数据库运维转型的可行性与周期是关键考量。\n· 自主可控程度：评估核心代码自主率、供应链安全风险评估，金融核心系统须确保长期自主可控。\n· 成本控制：总预算 8000 万元、分两期拨付，须在预算约束内完成全栈替代。\n· 推荐选型方案：达梦 DM8 作为主数据库，GaussDB 作为分析型/分布式扩展备选，形成“交易用达梦、分析用 GaussDB”的混合架构。\n· 推荐理由：①达梦 DM8 对 Oracle 语法、PL/SQL 存储过程兼容度最高，本案 8 套 Oracle 存储过程深度绑定的系统迁移改造成本最低；②已有城商行、农商行核心系统落地案例，具备等保四级、密评三级合规通过经验；③行内 Oracle DBA 可在 1-2 个月内完成达梦运维培训；④达梦已通过鲲鹏、飞腾平台完整适配认证；⑤高并发分布式分析场景可采用 GaussDB 分布式扩展。\n· 闭源无源码系统处置方案：短期通过数据库通用代理网关实现 Oracle 到达梦的协议转换，使闭源系统无需修改代码即可连接国产数据库；中期启动业务需求梳理，通过新建信创系统替代闭源系统功能；长期在替代系统稳定运行 6 个月后制定闭源系统退休计划。", "d": 0}, {"k": "card", "s": 2, "t": "背诵卡", "q": "【案例分析一 · 商业银行核心交易系统国产化】问题 2（10 分）：请针对本案例设计 POC（概念验证）验证方案，明确验证场景、核心测试指标、通过标准，并说明验证结论向采购决策转化的机制。", "o": [], "a": "", "n": "⚡ 答题框架：选型类题目先列评估维度（政策合规、兼容、性能、生态、运维、自主可控、成本）再逐项回扣案例数字，推荐“主库+备选”双方案加处置路径；POC 题按“场景—指标—标准”表格化作答并勿漏招标评分转化机制（权重≥30%）；风险题必须有类有策，回退机制记住“偏差率＞0.01%/通过率＜99%/低于基线 80% 触发、15 分钟启动、30 分钟验证、2 次演练”。\n\n参考答案要点：\n· POC 验证方案设计应覆盖 5 个核心场景，每个场景给出“核心测试指标—通过标准”。\n· 功能兼容性验证：指标为 SQL 兼容率、存储过程兼容率；通过标准为 SQL 兼容率≥95%，存储过程改造率≤5%。\n· 性能压力验证：指标为 TPS 峰值、响应时间 P99；通过标准为 TPS≥8000（不低于原系统 120%），P99≤50ms。\n· 高可用验证：指标为故障切换时间、数据零丢失；通过标准为主备切换≤30 秒，数据零丢失。\n· 迁移工具链验证：指标为迁移成功率、迁移耗时；通过标准为全量迁移成功率≥99.99%，迁移时长可接受。\n· 安全合规验证：指标为等保/密评基线符合度；通过标准为网络安全等级保护第四级技术项全部通过，商用密码应用安全性评估三级密码项全部合规。\n· POC 实施流程三阶段：准备阶段（第 1-2 周）搭建鲲鹏服务器+麒麟 OS+达梦 DM8 的 POC 测试环境，准备脱敏生产数据与测试脚本；执行阶段（第 3-6 周）按 5 个模块依次执行验证，每个模块结束后输出阶段性验证报告；评估阶段（第 7-8 周）汇总验证数据，组织行内技术委员会与外部专家联合评审，形成 POC 验证结论报告。\n· 验证结论向采购决策转化：POC 验证结论报告作为技术评分核心依据纳入招标文件技术评分项（权重不低于 30%），POC 验证排名最高的产品在技术评分中获得满分。\n· 未通过处理：任一模块未通过须分析原因并决定是否补充验证或调整选型方案；若候选产品均存在不可接受风险，应启动备选方案并在 2 周内完成补充 POC 验证。", "d": 0}, {"k": "card", "s": 3, "t": "背诵卡", "q": "【案例分析一 · 商业银行核心交易系统国产化】问题 3（10 分）：请识别本项目数据库迁移替代过程中的核心风险（至少 6 类），针对每类风险给出应对措施，并设计风险发生时的回退保障机制。", "o": [], "a": "", "n": "⚡ 答题框架：选型类题目先列评估维度（政策合规、兼容、性能、生态、运维、自主可控、成本）再逐项回扣案例数字，推荐“主库+备选”双方案加处置路径；POC 题按“场景—指标—标准”表格化作答并勿漏招标评分转化机制（权重≥30%）；风险题必须有类有策，回退机制记住“偏差率＞0.01%/通过率＜99%/低于基线 80% 触发、15 分钟启动、30 分钟验证、2 次演练”。\n\n参考答案要点：\n· 审题要求：识别至少 6 类核心风险（如技术兼容、性能、数据一致性、高可用、安全合规、运维人员、供应链等）并逐类给出应对措施；本资料参考答案“核心风险识别与应对措施”部分未展开风险清单，实际照录内容为回退保障机制三要素。\n· 回退触发条件：数据一致性偏差率＞0.01%、核心功能测试通过率＜99%、性能指标低于基线的 80%。\n· 回退流程：触发后 15 分钟内启动，由项目经理和行领导联合审批，运维团队按预演流程执行，完成后 30 分钟内完成验证。\n· 回退演练：正式割接前至少完成 2 次全流程回退演练。", "d": 0}, {"k": "card", "s": 4, "t": "背诵卡", "q": "【案例分析二 · 政务部门信创项目建设】问题 1：结合项目背景，作为项目规划师，在编制项目建议书时，应重点明确哪些核心内容以满足信创政策要求和业务需求？", "o": [], "a": "", "n": "⚡ 答题框架：项目建议书题按“政策依据—现状必要性—实现路径—云平台对接—安全合规—投资估算—交付物清单”逐条罗列；迁移题按“准备—数据迁移—应用适配—上线验证”四步走，务必写出 ETL“增量+全量”、灰度发布与 1 个月过渡期；安全题等保与密评分开各答一条线。\n\n参考答案要点：\n· 项目建设的政策依据及信创适配目标。\n· 现有系统现状分析及替换必要性。\n· 核心业务功能（政务审批、数据共享）的信创实现路径。\n· 与省级政务云平台的对接方案。\n· 安全合规（等级保护、密码测评）的实现思路。\n· 项目投资估算及分阶段实施计划。\n· 成果交付物清单（含设计文档、测试报告）。", "d": 0}, {"k": "card", "s": 5, "t": "背诵卡", "q": "【案例分析二 · 政务部门信创项目建设】问题 2：针对现有系统开发语言多样、历史数据量大的问题，实操中应如何设计迁移适配流程，确保业务不中断、数据不丢失？", "o": [], "a": "", "n": "⚡ 答题框架：项目建议书题按“政策依据—现状必要性—实现路径—云平台对接—安全合规—投资估算—交付物清单”逐条罗列；迁移题按“准备—数据迁移—应用适配—上线验证”四步走，务必写出 ETL“增量+全量”、灰度发布与 1 个月过渡期；安全题等保与密评分开各答一条线。\n\n参考答案要点：\n· 前期准备：梳理各系统开发语言特性，搭建多语言兼容的信创测试环境，制定分模块迁移优先级（核心审批业务优先）。\n· 数据迁移：采用“抽取-转换-加载（ETL）”工具，按“增量+全量”结合的方式迁移数据；迁移前进行数据清洗，迁移中实时校验，迁移后开展全量数据一致性比对。\n· 应用适配：对 Java、.NET 系统采用重构适配，Python 脚本进行信创环境兼容性改造；对第三方非信创支付组件，替换为合规信创支付产品并完成接口联调。\n· 上线验证：先进行灰度发布，在测试环境验证业务流程完整性，再逐步切换生产环境，设置 1 个月过渡期保障业务连续性。", "d": 0}, {"k": "card", "s": 6, "t": "背诵卡", "q": "【案例分析二 · 政务部门信创项目建设】问题 3：该项目需与省级政务云平台对接，在安全体系建设实操中，需完成哪些具体工作以通过等级保护和密码测评？", "o": [], "a": "", "n": "⚡ 答题框架：项目建议书题按“政策依据—现状必要性—实现路径—云平台对接—安全合规—投资估算—交付物清单”逐条罗列；迁移题按“准备—数据迁移—应用适配—上线验证”四步走，务必写出 ETL“增量+全量”、灰度发布与 1 个月过渡期；安全题等保与密评分开各答一条线。\n\n参考答案要点：\n· 等级保护方面：按二级及以上等级保护要求，划分网络安全区域（办公区、业务区、数据区）。\n· 部署信创防火墙、入侵检测系统；配置账号权限分级管理，启用操作日志审计功能。\n· 密码测评方面：选用合规信创密码产品（含加密机、签名服务器），对核心业务数据（如审批记录、用户信息）进行加密存储。\n· 实现登录密码、传输数据的加密验证；完成密码应用合规性测试。\n· 编制密码测评报告及安全管理制度。", "d": 0}, {"k": "card", "s": 7, "t": "背诵卡", "q": "【方案编制 · 电力公司核心信息系统全栈信创升级】第 1 方面：结合能源行业信创监管要求，简述本项目政策合规适配方案。", "o": [], "a": "", "n": "⚡ 答题框架：方案编制题严格按题目给定的 7 个方面逐项成段作答，每方面“先机制、后指标”；把 18 个月里程碑、≤50ms、年停机≤5 分钟（99.999%）、8000 万元、2025 年底 100% 国产化、2027 年央企全面替代等硬指标嵌进对应方案，贯穿“合规+自主可控”主线。\n\n参考答案要点：\n· 政策背景研判：电力行业属于《关键信息基础设施安全保护条例》明确的重点行业；根据国资委相关要求，央企国企须在 2027 年前完成信创全面替代；国家能源集团明确要求 2025 年底网络基础设施信创替代不低于 50%，综合办公类替代 100%，生产运营类替代不低于 30%；部分核心系统要求 2025 年底完成 100% 全栈国产化。\n· 2025 年 12 月，国家能源局正式印发《能源行业数据安全管理办法（试行）》，对电力调度控制系统在等保 2.0 基础上进一步提出行业性通信传输安全要求。\n· 全栈国产化认证：openGauss 数据库须通过国家能源行业信创适配认证；东方通中间件须完成与 openGauss 及国产工控平台的深度适配；国产工控平台须持有国家级工控安全测评认证。\n· 等保与密码合规：电网调度监控系统须满足等保 2.0 三级及以上要求；涉及用户隐私和电网运行敏感数据的全链路加密存储与传输，密码由电力公司自主管理，通过商用密码应用安全性评估。\n· 数据安全合规：严格遵循《能源行业数据安全管理办法（试行）》要求，对电网运行数据、用户用电数据实施分类分级保护，建立全链路审计机制。\n· 监管报送与验收：每季度向省级能源主管部门报送《项目合规进展简报》；重大变更提前报备；投产前须通过能源行业信创适配验证测试。\n· 合规治理机制：设立合规专班（公司法务、安全、技术部门联合组成），对接国家能源局及省级能源主管部门最新政策动态，实行“政策解读—差距分析—合规整改—验收归档”闭环管理。", "d": 0}, {"k": "card", "s": 8, "t": "背诵卡", "q": "【方案编制 · 电力公司核心信息系统全栈信创升级】第 2 方面：针对国产软硬件替代场景（openGauss+东方通+国产工控平台），制定本项目全栈技术适配优化方案。", "o": [], "a": "", "n": "⚡ 答题框架：方案编制题严格按题目给定的 7 个方面逐项成段作答，每方面“先机制、后指标”；把 18 个月里程碑、≤50ms、年停机≤5 分钟（99.999%）、8000 万元、2025 年底 100% 国产化、2027 年央企全面替代等硬指标嵌进对应方案，贯穿“合规+自主可控”主线。\n\n参考答案要点：\n· 数据库层 SQL 兼容性改造：使用 openGauss 配套迁移评估工具全面扫描存量 Oracle PL/SQL 代码；针对不兼容项分类处置——自动转换约 70%、手工重写约 20%、通过定制函数模拟约 10%，行业实践中 SQL 语法兼容率可达 95% 以上。\n· 数据库层性能调优：针对电网调度毫秒级响应优化执行计划、关闭全表扫描；针对百万级智能电表高并发写入充分发挥 openGauss 分布式架构优势；shared_buffers 建议设为物理内存 25%，定期执行 ANALYZE 更新统计信息；同等算力配置下，openGauss 性能较传统部署提升 2-3 倍。\n· 数据库层高可用架构：构建多节点读写分离集群，确保单点故障不影响整体服务，RTO\u003c30 秒、RPO\u003c10 秒。\n· 中间件层适配（东方通）：完成与 openGauss 数据库的 JDBC 驱动深度适配与连接池优化；针对电网调度高频交易场景优化线程池配置与会话管理策略；实现与原有 IBM WebLogic 应用的无缝迁移对接。\n· 工控平台层适配：针对国产工控平台硬件驱动适配覆盖率仅 60% 的问题，组织原厂与集成商联合攻关，逐类完成剩余 40% 硬件的驱动开发与适配验证；优化实时任务调度机制，确保中断响应延迟满足电力调度标准；构建双机热备与故障秒级切换机制。\n· 全链路压测调优：搭建与生产 1:1 配置的压测环境，模拟百万级智能电表并发数据上报场景与电网调度峰值负载；持续调优直至智能电表数据处理延迟稳定在 50ms 以内，电网调度指令响应满足毫秒级标准。", "d": 0}, {"k": "card", "s": 9, "t": "背诵卡", "q": "【方案编制 · 电力公司核心信息系统全栈信创升级】第 3 方面：围绕三大核心模块迁移，说明项目应用改造方法、部署调试及全流程验证内容。", "o": [], "a": "", "n": "⚡ 答题框架：方案编制题严格按题目给定的 7 个方面逐项成段作答，每方面“先机制、后指标”；把 18 个月里程碑、≤50ms、年停机≤5 分钟（99.999%）、8000 万元、2025 年底 100% 国产化、2027 年央企全面替代等硬指标嵌进对应方案，贯穿“合规+自主可控”主线。\n\n参考答案要点：\n· 精准评估：使用数据库迁移评估工具对三大模块（电网调度监控、设备资产管理、用户服务）全面扫描，自动分析 SQL 语法、存储过程及对象依赖关系，生成兼容性评估报告与改造清单。\n· 代码改造：针对不兼容项分类处置——自动转换、手工改写、临时绕过，重点处理 Oracle 特有语法；保留原 Oracle 环境作为回退保障。\n· 数据迁移：创新实施“冷热数据独立迁移+高并发分片迁移”组合方案，全量数据迁移采用并行分片导出导入，增量数据同步采用数据复制服务（DRS）、延迟控制在秒级以内；针对百万级智能电表历史数据采用冷热分离策略——热数据优先迁移、冷数据后台渐进迁移。\n· 数据校验：逐表比对主键、索引、行数，并对关键业务表进行字段级校验。\n· 部署调试：搭建四级环境——开发环境（功能联调）→SIT 环境（集成测试）→UAT 环境（用户验收）→预生产环境（全量演练）；调试策略为 SIT 阶段每日构建，UAT 阶段按场景（调度监控、设备管理、用户服务）逐项通过验证。\n· 全流程验证：功能验证覆盖全部业务场景、确保业务逻辑与原系统一致；性能验证模拟真实生产压力，验证智能电表数据处理延迟≤50ms、电网调度响应毫秒级达标；高可用验证主动模拟服务器宕机、网络分区，验证系统年停机时间≤5 分钟（可用性≥99.999%）、故障秒级告警；安全验证通过等保 2.0 三级测评与商用密码应用安全性评估。\n· 灰度割接与回退机制：分阶段割接——先选取用户服务系统试点切换→设备资产管理平台→电网调度监控系统（核心）；新旧系统双轨并行，新系统先承载非核心流量，待持续稳定运行达标后逐步扩大；回退保障——若故障率连续超阈值或核心指标不达标，5 分钟内将流量全量切回原系统。", "d": 0}, {"k": "card", "s": 10, "t": "背诵卡", "q": "【方案编制 · 电力公司核心信息系统全栈信创升级】第 4 方面：针对项目现行技术、供应链、合规、人员四大风险，制定包含规避、减轻、转移策略的全方位风险应对方案。", "o": [], "a": "", "n": "⚡ 答题框架：方案编制题严格按题目给定的 7 个方面逐项成段作答，每方面“先机制、后指标”；把 18 个月里程碑、≤50ms、年停机≤5 分钟（99.999%）、8000 万元、2025 年底 100% 国产化、2027 年央企全面替代等硬指标嵌进对应方案，贯穿“合规+自主可控”主线。\n\n参考答案要点：\n· 技术风险（openGauss 与原有业务逻辑兼容性不足）：规避——上线前完成全量 SQL 兼容性扫描与语法转换验证；减轻——建立代码改造清单与应急修复机制、建立实时性能看板；转移/应急——与华为签订 SLA，要求原厂专家驻场保障至稳定运行 3 个月。\n· 技术风险（国产工控平台硬件驱动适配率仅 60%）：规避——提前完成全部硬件驱动适配测试与验证；减轻——建立硬件兼容性清单与分级适配方案；转移/应急——要求工控平台原厂提供驻场技术支持与驱动开发保障。\n· 技术风险（百万级电表数据实时处理延迟超标）：规避——提前进行全链路压测与性能调优；减轻——建立性能基线（≤50ms）与分级告警；转移/应急——引入 openGauss 原厂性能优化专家团队。\n· 供应链风险（国产硬件及工控设备供货延期）：规避——提前锁定 6 个月安全库存；减轻——建立备选供应商名录与快速切换预案；转移/应急——合同中约定延期交付罚款条款（每天 0.5% 合同额）。\n· 合规风险（数据安全不满足能源行业监管要求）：规避——邀请测评机构前置参与架构评审；减轻——部署统一密码服务平台、加密操作全流程留痕；转移/应急——委托国家能源行业信创测评机构独立评估。\n· 人员风险（运维人员对国产技术栈操作不熟悉）：规避——关键岗位 AB 角、知识文档 100% 沉淀；减轻——实施“信创专项激励基金”，稳定核心团队；转移/应急——与集成商约定人员锁定，核心成员更换须电力公司书面批准。\n· 应急总体原则：建立“风险识别—预警—处置—复盘”闭环机制，重大风险 30 分钟内上报公司管理层。", "d": 0}, {"k": "card", "s": 11, "t": "背诵卡", "q": "【方案编制 · 电力公司核心信息系统全栈信创升级】第 5 方面：明确本项目建设单位、集成商、测评机构、财政审计四方主体的协同分工机制。", "o": [], "a": "", "n": "⚡ 答题框架：方案编制题严格按题目给定的 7 个方面逐项成段作答，每方面“先机制、后指标”；把 18 个月里程碑、≤50ms、年停机≤5 分钟（99.999%）、8000 万元、2025 年底 100% 国产化、2027 年央企全面替代等硬指标嵌进对应方案，贯穿“合规+自主可控”主线。\n\n参考答案要点：\n· 建设单位（电力公司）：核心职责为需求确认、资源拨付、合规决策、验收决策；关键产出物为《业务需求规格书》《验收确认书》；协同接口为每周项目评审会。\n· 集成商：核心职责为软硬件部署、应用改造、数据迁移实施、性能调优、工控平台适配；关键产出物为《实施方案》《迁移脚本》《调优报告》《驱动适配报告》；协同接口为每日晨会通报进度。\n· 测评机构：核心职责为信创适配验证、等保测评、密码测评、第三方验收测试；关键产出物为《适配测试报告》等测评报告；协同接口为按里程碑节点独立介入。\n· 财政审计方：核心职责为预算执行审计、采购合规审查、资金使用效率评估；关键产出物为《阶段性审计报告》《竣工验收审计报告》；协同接口为按月审查支出明细。\n· 协同流程：集成商向电力公司报送方案→电力公司组织测评机构预审→财政审计旁听关键招标与技术评审→重大变更须四方联席会议签字方生效。\n· 建立“信创-安全联合评估工作组”，由 IT、信息安全、合规、采购及内控审计人员共同参与。", "d": 0}, {"k": "card", "s": 12, "t": "背诵卡", "q": "【方案编制 · 电力公司核心信息系统全栈信创升级】第 6 方面：结合项目推进中可能出现的进度滞后与质量风险，制定项目进度与质量管控优化方案。", "o": [], "a": "", "n": "⚡ 答题框架：方案编制题严格按题目给定的 7 个方面逐项成段作答，每方面“先机制、后指标”；把 18 个月里程碑、≤50ms、年停机≤5 分钟（99.999%）、8000 万元、2025 年底 100% 国产化、2027 年央企全面替代等硬指标嵌进对应方案，贯穿“合规+自主可控”主线。\n\n参考答案要点：\n· 里程碑切分（18 个月）：第 1-3 月（规划期）——需求分析、方案设计、软硬件选型与采购、合规前置审查；第 4-9 月（攻坚期）——集中原厂与集成商核心力量，优先攻克电网调度监控模块适配，完成全部硬件驱动适配开发，关键路径任务并行推进；第 10-12 月（集成期）——完成三大模块 SIT 测试与 UAT 验收。\n· 里程碑切分（续）：第 13-15 月（验证期）——全链路压测、混沌演练、合规测评并行推进；第 16-17 月（割接期）——分三批次灰度切换（用户服务→设备管理→调度监控）；第 18 月（收官期）——全量切换后稳定运营、项目验收及审计。\n· 进度监控：实施“日站会+周报+月评审”机制，实时跟踪任务完成率；偏差超过 5% 即启动纠偏；关键路径任务实行红黄绿灯预警。\n· 测试体系强化：建立“单元测试—集成测试—系统测试—验收测试”四级测试体系；引入自动化测试工具，提升测试覆盖率与效率。\n· 性能基线管理：建立核心业务性能基线（电表数据处理≤50ms、调度响应毫秒级、年停机≤5 分钟），持续监控与预警。\n· 质量门禁：每个阶段设置质量门禁，不达标不得进入下一阶段——门禁指标包括测试通过率≥95%、性能达标率 100%、缺陷修复率≥90%。\n· 变更管控：所有代码与配置变更须经变更控制委员会（CCB）审批，重大变更须安排在业务低峰期并提前公告。", "d": 0}, {"k": "card", "s": 13, "t": "背诵卡", "q": "【方案编制 · 电力公司核心信息系统全栈信创升级】第 7 方面：针对行内人员对国产技术栈能力不足、外部资源不稳定问题，制定人才保障与资源稳定保障方案。", "o": [], "a": "", "n": "⚡ 答题框架：方案编制题严格按题目给定的 7 个方面逐项成段作答，每方面“先机制、后指标”；把 18 个月里程碑、≤50ms、年停机≤5 分钟（99.999%）、8000 万元、2025 年底 100% 国产化、2027 年央企全面替代等硬指标嵌进对应方案，贯穿“合规+自主可控”主线。\n\n参考答案要点：\n· 现状分析：运维团队长期依赖 Oracle、WebLogic 等国外技术栈，对 openGauss、东方通、国产工控平台等国产技术栈能力不足。\n· 分级认证培训：L1（全员）通识培训——了解信创政策与 openGauss 基础 SQL、东方通基础操作（2 周内完成）；L2（骨干）——openGauss HCIP 认证掌握性能调优与运维（30 人取证）、东方通中间件专项认证（15 人）；L3（专家）——选拔 8 人参加 openGauss HCIE 高端培训及国产工控平台深度培训，掌握内核源码级排错能力。\n· 实战练兵：在 SIT 环境中设立“故障演练日”，每月模拟一次数据库宕机、中间件故障或工控平台异常场景，由运维团队独立完成恢复并计时考核。\n· 激励机制：设置“信创技术津贴”，持证人员每月额外补贴；项目验收后评选“信创标兵”，给予晋升优先权。\n· 核心供应商锁定：与华为签署《战略资源保障协议》明确 openGauss 数据库技术支持与备件保障；与东方通签署《中间件专项服务协议》要求原厂专家驻场至系统稳定运行 3 个月；与国产工控平台厂商签署《驱动适配与长期运维保障协议》。\n· 人员锁定：要求集成商项目经理及核心架构师（不少于 6 人）签署《人员锁定函》，未经电力公司书面同意不得更换。\n· 备选资源池：建立“二供”名单，若主供应商业绩考核连续两个月不达标，触发切换程序。\n· 统一运维平台：建设“信创资源统一运维管理平台”，将 openGauss、东方通、国产工控平台统一纳管、监控与调度，降低运维复杂度。", "d": 0}, {"k": "card", "s": 14, "t": "背诵卡", "q": "【结构化论述一 · 信创云平台安全合规评估】1. 信创云平台安全合规评估框架设计（5 分）", "o": [], "a": "", "n": "⚡ 答题框架：背熟“一基三柱”：四部法律打底，等保 2.0（GB/T 22239-2019）、密评（GB/T 39786-2021）、数据安全与个保合规三柱，并点出“同步原则”；八个评估维度逐条列检查项，方法四件套加“准备—差距—整改—测评—确认”流程；改进机制记“年复测、季演练、半年渗透、7×24 监控、闭环归档”。\n\n参考答案要点：\n· 总体框架：构建“法律基座与合规支柱”评估框架，即“一基三柱”。\n· 一基（基础底座）：以国家法律法规为基——依据《中华人民共和国网络安全法》《中华人民共和国数据安全法》《中华人民共和国密码法》《中华人民共和国个人信息保护法》四部基础性法律构建合规底线。\n· 三柱（三大合规支柱）第一柱：网络安全等级保护合规（网络安全等级保护 2.0，依据 GB/T 22239-2019《信息安全技术 网络安全等级保护基本要求》）——确保云平台满足相应等级安全要求。\n· 三柱第二柱：商用密码应用安全性评估（密评，依据 GB/T 39786-2021《信息安全技术 信息系统密码应用基本要求》）——确保密码应用合规有效。\n· 三柱第三柱：数据安全与个人信息保护合规（依据《中华人民共和国数据安全法》《中华人民共和国个人信息保护法》）——确保数据分类分级保护到位。\n· 评估框架须实现“同步原则”：安全方案与云平台架构同步设计，等保与密评同步开展测评，发现差距同步整改落实。", "d": 0}, {"k": "card", "s": 15, "t": "背诵卡", "q": "【结构化论述一 · 信创云平台安全合规评估】2. 核心评估维度及其关键检查项（8 分）", "o": [], "a": "", "n": "⚡ 答题框架：背熟“一基三柱”：四部法律打底，等保 2.0（GB/T 22239-2019）、密评（GB/T 39786-2021）、数据安全与个保合规三柱，并点出“同步原则”；八个评估维度逐条列检查项，方法四件套加“准备—差距—整改—测评—确认”流程；改进机制记“年复测、季演练、半年渗透、7×24 监控、闭环归档”。\n\n参考答案要点：\n· 物理安全：机房选址与访问控制、温湿度/电力/消防保障、设备防盗防破坏措施、介质管理。\n· 网络安全：网络架构安全（分区/隔离/VLAN）、边界防护（NGFW/IDS/IPS）、通信加密（国密 SSL VPN/IPSEC）、DDoS 防护。\n· 主机安全：操作系统安全加固（基线配置/最小安装/补丁管理）、恶意代码防护、主机入侵检测（HIDS）、可信验证。\n· 应用安全：身份鉴别（多因素认证）、访问控制（RBAC 细粒度授权）、安全审计（全操作日志）、Web 安全（WAF/防 SQL 注入/XSS）。\n· 数据安全：数据分类分级保护、数据加密传输（TLS 1.2+/国密 TLCP）、数据加密存储（SM4）、数据脱敏、数据备份恢复、数据销毁。\n· 密码应用：身份认证密码合规（SM2 数字签名/证书）、数据传输加密（SM2/SM4）、数据存储加密（SM4）、完整性校验（SM3）、密钥管理（KMS）。\n· 安全管理：安全管理制度体系、安全管理机构与岗位、安全人员管理、安全建设管理、安全运维管理。\n· 供应链安全：信创产品安全可靠测评证书核验、供应链风险评估、供应商安全承诺、开源组件漏洞管理。", "d": 0}, {"k": "card", "s": 16, "t": "背诵卡", "q": "【结构化论述一 · 信创云平台安全合规评估】3. 评估方法与实施流程（4 分）", "o": [], "a": "", "n": "⚡ 答题框架：背熟“一基三柱”：四部法律打底，等保 2.0（GB/T 22239-2019）、密评（GB/T 39786-2021）、数据安全与个保合规三柱，并点出“同步原则”；八个评估维度逐条列检查项，方法四件套加“准备—差距—整改—测评—确认”流程；改进机制记“年复测、季演练、半年渗透、7×24 监控、闭环归档”。\n\n参考答案要点：\n· 评估方法四种：文档审查——审查云平台安全设计方案、安全配置基线、管理制度文档；技术测试——漏洞扫描、渗透测试、配置核查、密码应用验证；现场核查——实地核查机房物理安全、设备部署、网络隔离情况；人员访谈——访谈云平台运维人员、安全管理人员，验证制度执行情况。\n· 实施流程主线：评估准备→差距分析→整改落实→正式测评→结论确认。\n· 评估准备：确定评估范围、组建评估组、制定评估方案。\n· 差距分析：对照合规标准识别差距，出具差距分析报告。\n· 整改落实：云服务商根据差距报告限期整改，建设方跟踪验证。\n· 正式测评：第三方测评机构执行网络安全等级保护测评与商用密码应用安全性评估，出具测评报告。\n· 结论确认：评估结论作为云平台上线运行的前置条件，不通过不得正式投入使用。", "d": 0}, {"k": "card", "s": 17, "t": "背诵卡", "q": "【结构化论述一 · 信创云平台安全合规评估】4. 持续改进与动态监控机制（3 分）", "o": [], "a": "", "n": "⚡ 答题框架：背熟“一基三柱”：四部法律打底，等保 2.0（GB/T 22239-2019）、密评（GB/T 39786-2021）、数据安全与个保合规三柱，并点出“同步原则”；八个评估维度逐条列检查项，方法四件套加“准备—差距—整改—测评—确认”流程；改进机制记“年复测、季演练、半年渗透、7×24 监控、闭环归档”。\n\n参考答案要点：\n· 定期复测：网络安全等级保护第三级每年复测一次，密评每年评估一次，确保安全态势持续合规。\n· 持续监控：部署安全运营中心（SOC），7×24 小时监控安全事件，实时告警异常行为。\n· 渗透测试：每半年组织一次第三方渗透测试，发现并修复安全漏洞。\n· 应急演练：每季度组织安全应急演练，验证应急预案有效性并持续优化。\n· 合规跟踪：持续跟踪法律法规与标准更新（如 GB/T 22239 修订），及时调整安全策略。\n· 改进闭环：建立“发现→整改→验证→归档”的安全改进闭环机制，确保每个安全问题有始有终。", "d": 0}, {"k": "card", "s": 18, "t": "背诵卡", "q": "【结构化论述二 · 信创项目全流程规范化管控】1. 简述信创项目全生命周期三阶段（规划设计、采购实施、验收运维）的核心管控要点（5 分）", "o": [], "a": "", "n": "⚡ 答题框架：严格按“三阶段管控（5 分）—设计转化与变更（4 分）—招投标要点与风险防控（3 分）—实施验收与需求变更/版本基线（8 分）”结构展开，每段先亮观点再落实操动作，总篇幅不少于 800 字。\n\n参考答案要点：\n· 信创项目规范化管控需依托全流程统筹体系，覆盖设计、招投标、实施验收、变更管理全环节，贴合国产化、适配性、安全性核心要求，保障项目合规落地、稳定运维。\n· 项目全生命周期三大阶段统筹管控是基础。\n· 规划设计阶段：锚定信创国产化标准，结合业务需求确定技术架构、软硬件适配方案。\n· 采购实施阶段：聚焦合规性与适配性，严格把控采购物资的信创资质与兼容性。\n· 验收运维阶段：以国产化适配达标、系统安全稳定运行为核心，完成全维度验收并建立常态化运维机制。", "d": 0}, {"k": "card", "s": 19, "t": "背诵卡", "q": "【结构化论述二 · 信创项目全流程规范化管控】2. 说明信创项目从可研到详细设计的转化逻辑及设计变更管控措施（4 分）", "o": [], "a": "", "n": "⚡ 答题框架：严格按“三阶段管控（5 分）—设计转化与变更（4 分）—招投标要点与风险防控（3 分）—实施验收与需求变更/版本基线（8 分）”结构展开，每段先亮观点再落实操动作，总篇幅不少于 800 字。\n\n参考答案要点：\n· 深化设计是信创项目落地的关键。\n· 可研向初步设计转化：承接可研核心目标，明确信创软硬件选型、系统架构、安全合规等核心指标，形成初步设计方案。\n· 初设向详细设计转化：细化技术参数、适配流程、部署方案，匹配实际业务场景。\n· 设计变更管控：建立设计变更评审机制，所有变更必须开展技术适配、安全、成本影响评估，经层级审批后方可执行，杜绝随意变更导致的信创适配偏差。", "d": 0}, {"k": "card", "s": 20, "t": "背诵卡", "q": "【结构化论述二 · 信创项目全流程规范化管控】3. 阐述信创项目招投标实操核心要点及风险防控方式（3 分）", "o": [], "a": "", "n": "⚡ 答题框架：严格按“三阶段管控（5 分）—设计转化与变更（4 分）—招投标要点与风险防控（3 分）—实施验收与需求变更/版本基线（8 分）”结构展开，每段先亮观点再落实操动作，总篇幅不少于 800 字。\n\n参考答案要点：\n· 招投标实操管控保障项目合规与国产化落地。\n· 技术规格书：明确信创适配、国产化替代、安全合规等硬性指标，细化软硬件参数、性能标准。\n· 评标方法：侧重国产化适配能力、技术落地实力、运维服务水平，增设国产化权重条款。\n· 风险防控：重点防控资质造假、参数不符、招标流程不规范等风险，通过前置资质审核、参数校核、全流程留痕实现风险闭环。", "d": 0}, {"k": "card", "s": 21, "t": "背诵卡", "q": "【结构化论述二 · 信创项目全流程规范化管控】4. 说明信创项目实施验收管控及需求变更、版本基线管理的实操方法（8 分）", "o": [], "a": "", "n": "⚡ 答题框架：严格按“三阶段管控（5 分）—设计转化与变更（4 分）—招投标要点与风险防控（3 分）—实施验收与需求变更/版本基线（8 分）”结构展开，每段先亮观点再落实操动作，总篇幅不少于 800 字。\n\n参考答案要点：\n· 实施验收与需求变更管控是项目提质增效的核心。\n· 实施验收管控：建立进度、质量双向管控机制，依据国产化落地目标制定阶 const LS = CERT_KEY ? ('xqcert_' + CERT_KEY.toLowerCase() + '_v1') : 'certquiz_local_v1';
try{
  const LEGACY_LS = {gh: 'ghq_v1'};
  const legacy = CERT_KEY && LEGACY_LS[CERT_KEY.toLowerCase()];
  if(legacy && !localStorage.getItem(LS) && localStorage.getItem(legacy)){
    localStorage.setItem(LS, localStorage.getItem(legacy));
    localStorage.removeItem(legacy);
  }
}catch(e){}
const LT = 'ABCDEF';
/* 统一线条图标集（Feather 风格内联 SVG） */

  book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
